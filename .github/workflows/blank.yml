name: Generate Catalog

on:
  push:
    paths:
      - 'apps/**.html'
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate catalog.json
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          const appsDir = "./apps";
          if (!fs.existsSync(appsDir)) {
            console.log("No apps directory found.");
            process.exit(0);
          }

          const files = fs.readdirSync(appsDir).filter(f => f.endsWith(".html"));
          const catalog = files.map(file => {
            const content = fs.readFileSync(path.join(appsDir, file), "utf8");
            const id = path.basename(file, ".html");
            
            // HTML内の <meta> タグから情報を抽出（無ければデフォルト値）
            const getMeta = (name, fallback) => {
              const match = content.match(new RegExp(`<meta\\s+name="${name}"\\s+content="([^"]+)"`, "i"));
              return match ? match[1] : fallback;
            };

            return {
              id: id,
              name: getMeta("app-name", id),
              version: getMeta("app-version", "1.0.0"),
              icon: getMeta("app-icon", "📦"),
              color: getMeta("app-color", "#4a5568"),
              description: getMeta("app-description", "説明はありません"),
              author: getMeta("app-author", "不明"),
              url: `https://raw.githubusercontent.com/${process.env.GITHUB_REPOSITORY}/main/apps/${file}`
            };
          });

          fs.writeFileSync("catalog.json", JSON.stringify(catalog, null, 2));
          '

      - name: Commit and Push catalog.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update catalog.json" && git push)
