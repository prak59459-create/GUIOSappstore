<!--GUIOS-APP {"id":"age-calculator","name":"年齢計算機","icon":"🎂","color":"#b5548a","version":"1.0.0","author":"Claude","description":"生年月日から現在の年齢や次の誕生日までの日数を計算するアプリ。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>年齢計算機</title>
<style>
  :root{
    --accent:#b5548a;
    --bg:#1a0f16;
    --card:#241621;
    --text:#f6ecf1;
    --sub:#c9aebd;
    --line:#3a2733;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--text);
    padding:16px; padding-bottom:40px;
  }
  h1{font-size:20px; margin:4px 0 16px; display:flex; align-items:center; gap:8px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:16px; margin-bottom:16px;
  }
  label{display:block; font-size:13px; color:var(--sub); margin-bottom:6px;}
  .field{margin-bottom:14px;}
  input[type=date]{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background:#140b11; color:var(--text); font-size:16px; outline:none;
    color-scheme: dark;
  }
  input[type=date]:focus{border-color:var(--accent);}
  button{
    padding:12px 22px; border-radius:10px; border:none; background:var(--accent);
    color:#210014; font-weight:700; font-size:15px; cursor:pointer; min-height:44px; width:100%;
  }
  .result{display:none; flex-direction:column; gap:10px; margin-top:6px;}
  .result.show{display:flex;}
  .result-row{
    background:#140b11; border:1px solid var(--line); border-radius:10px; padding:14px;
  }
  .result-row .rlabel{font-size:13px; color:var(--sub); margin-bottom:4px;}
  .result-row .rval{font-size:20px; font-weight:800; color:var(--accent);}
  .result-row.main .rval{font-size:26px;}
  #toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:#2a1a24; color:var(--text); padding:10px 18px; border-radius:10px;
    font-size:13px; opacity:0; pointer-events:none; transition:all .25s; border:1px solid var(--line);
    max-width:90%; text-align:center; z-index:999;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
  <h1>🎂 年齢計算機</h1>

  <div class="card">
    <div class="field">
      <label for="birth">生年月日</label>
      <input type="date" id="birth">
    </div>
    <button id="calcBtn">計算する</button>

    <div class="result" id="result">
      <div class="result-row main">
        <div class="rlabel">満年齢</div>
        <div class="rval" id="ageMain">-</div>
      </div>
      <div class="result-row">
        <div class="rlabel">生まれてからの総日数</div>
        <div class="rval" id="totalDays">-</div>
      </div>
      <div class="result-row">
        <div class="rlabel">次の誕生日まで</div>
        <div class="rval" id="nextBirthday">-</div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

<script>
  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }
  function notify(msg, type){
    if(window.GUIOS && window.GUIOS.notify){
      GUIOS.notify(msg, {type: type || 'info'});
    } else {
      showToast(msg);
    }
  }

  // Build a Date at local midnight from y,m(0-based),d
  function localDate(y,m,d){
    return new Date(y, m, d, 0, 0, 0, 0);
  }

  function daysInMonth(year, monthIndex0){
    // monthIndex0: 0-11
    return new Date(year, monthIndex0+1, 0).getDate();
  }

  function calcAge(birth, today){
    var years = today.getFullYear() - birth.getFullYear();
    var months = today.getMonth() - birth.getMonth();
    var days = today.getDate() - birth.getDate();

    if(days < 0){
      months -= 1;
      // days in the month before "today"'s month
      var prevMonthIndex = today.getMonth() - 1;
      var prevYear = today.getFullYear();
      if(prevMonthIndex < 0){ prevMonthIndex = 11; prevYear -= 1; }
      days += daysInMonth(prevYear, prevMonthIndex);
    }
    if(months < 0){
      years -= 1;
      months += 12;
    }
    return {years:years, months:months, days:days};
  }

  function calcTotalDays(birth, today){
    var msPerDay = 24*60*60*1000;
    return Math.floor((today.getTime() - birth.getTime()) / msPerDay);
  }

  function calcNextBirthday(birth, today){
    var bMonth = birth.getMonth();
    var bDay = birth.getDate();
    var y = today.getFullYear();

    function birthdayOccurrenceInYear(year){
      // handle Feb 29 birthdays on non-leap years -> use Feb 28
      var dim = daysInMonth(year, bMonth);
      var day = bDay > dim ? dim : bDay;
      return localDate(year, bMonth, day);
    }

    var thisYearBday = birthdayOccurrenceInYear(y);
    var target = thisYearBday;
    if(target.getTime() < today.getTime()){
      target = birthdayOccurrenceInYear(y+1);
    }
    var msPerDay = 24*60*60*1000;
    var diffDays = Math.round((target.getTime() - today.getTime()) / msPerDay);
    return diffDays;
  }

  document.getElementById('calcBtn').addEventListener('click', function(){
    var val = document.getElementById('birth').value;
    if(!val){
      notify('生年月日を入力してください', 'error');
      return;
    }
    var parts = val.split('-');
    var birth = localDate(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));

    var now = new Date();
    var today = localDate(now.getFullYear(), now.getMonth(), now.getDate());

    if(birth.getTime() > today.getTime()){
      notify('未来の日付は選べません', 'error');
      return;
    }

    var age = calcAge(birth, today);
    var totalDays = calcTotalDays(birth, today);
    var nextDays = calcNextBirthday(birth, today);

    document.getElementById('ageMain').textContent =
      age.years + '歳 ' + age.months + 'ヶ月 ' + age.days + '日';
    document.getElementById('totalDays').textContent =
      totalDays.toLocaleString('ja-JP') + '日';
    document.getElementById('nextBirthday').textContent =
      nextDays === 0 ? '今日が誕生日です！🎉' : ('あと ' + nextDays.toLocaleString('ja-JP') + '日');

    document.getElementById('result').classList.add('show');
    if(window.GUIOS && window.GUIOS.haptic) GUIOS.haptic();
  });
</script>
</body>
</html>
