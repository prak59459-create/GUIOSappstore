<!--GUIOS-APP {"id":"base64-tool","name":"Base64変換","icon":"🔡","color":"#6b7a8f","version":"1.0.0","author":"Claude","description":"テキストをBase64にエンコード・デコードできるツール。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Base64変換</title>
<style>
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:#12151a; color:#e8ecf2; min-height:100vh; padding:16px;
  }
  h1{ font-size:18px; margin:0 0 14px; color:#a9b6c8; }
  label{ display:block; font-size:13px; color:#8d99ac; margin-bottom:6px; }
  textarea{
    width:100%; min-height:22vh; padding:14px; border-radius:14px; border:1px solid #2a3140;
    background:#0c0f14; color:#e8ecf2; font-size:15px; line-height:1.5; resize:vertical;
    font-family:ui-monospace,Menlo,Consolas,monospace; margin-bottom:14px;
  }
  .mode-row{ display:flex; gap:10px; margin-bottom:14px; }
  .mode-btn{
    flex:1; padding:14px; border-radius:12px; border:2px solid #2a3140; background:#181d26;
    color:#c3ccd9; font-weight:700; font-size:15px; cursor:pointer; min-height:48px;
    -webkit-tap-highlight-color:transparent;
  }
  .mode-btn.active{ background:#6b7a8f; color:#0e1116; border-color:#6b7a8f; }
  .error{
    background:#3a1f1f; color:#ffb0b0; padding:12px 14px; border-radius:10px; font-size:13px;
    margin-bottom:14px; word-break:break-all; display:none;
  }
  .copy-btn{
    width:100%; padding:14px; border-radius:12px; border:none; background:#6b7a8f;
    color:#0e1116; font-weight:700; font-size:15px; cursor:pointer; min-height:48px;
    -webkit-tap-highlight-color:transparent;
  }
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:#232a36; color:#e8ecf2; padding:10px 18px; border-radius:10px;
    font-size:13px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;
    max-width:90%; text-align:center; box-shadow:0 6px 18px rgba(0,0,0,.35); z-index:100;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <h1>🔡 Base64変換</h1>

  <label for="input">入力テキスト</label>
  <textarea id="input" placeholder="ここに文章を入力してください…"></textarea>

  <div class="mode-row">
    <button class="mode-btn active" id="encodeBtn">エンコード</button>
    <button class="mode-btn" id="decodeBtn">デコード</button>
  </div>

  <div class="error" id="errorBox"></div>

  <label for="output">出力結果</label>
  <textarea id="output" placeholder="結果がここに表示されます"></textarea>

  <button class="copy-btn" id="copyBtn">📋 コピー</button>
  <div class="toast" id="toast"></div>

<script>
  var input = document.getElementById('input');
  var output = document.getElementById('output');
  var encodeBtn = document.getElementById('encodeBtn');
  var decodeBtn = document.getElementById('decodeBtn');
  var errorBox = document.getElementById('errorBox');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }
  function notify(msg, type){
    if (window.GUIOS && window.GUIOS.notify) {
      try { window.GUIOS.notify(msg, { type: type || 'info' }); return; } catch(e){}
    }
    showToast(msg);
  }
  function copyText(text){
    if (window.GUIOS && window.GUIOS.clipboard && window.GUIOS.clipboard.writeText) {
      try { window.GUIOS.clipboard.writeText(text); return; } catch(e){}
    }
    try { navigator.clipboard.writeText(text); } catch(e){}
  }

  function utf8ToBase64(str){
    var bytes = new TextEncoder().encode(str);
    var binary = '';
    for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary);
  }
  function base64ToUtf8(b64){
    var binary = atob(b64); // throws if invalid base64
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
  }

  var mode = 'encode';

  function setMode(m){
    mode = m;
    encodeBtn.classList.toggle('active', m === 'encode');
    decodeBtn.classList.toggle('active', m === 'decode');
    input.placeholder = m === 'encode' ? 'ここに文章を入力してください…' : 'ここにBase64文字列を入力してください…';
    hideError();
    process();
  }

  function showError(msg){
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
  }
  function hideError(){
    errorBox.style.display = 'none';
    errorBox.textContent = '';
  }

  function process(){
    var text = input.value;
    if (!text) {
      output.value = '';
      hideError();
      return;
    }
    if (mode === 'encode') {
      try {
        output.value = utf8ToBase64(text);
        hideError();
      } catch(e) {
        output.value = '';
        showError('エンコードに失敗しました: ' + e.message);
      }
    } else {
      try {
        var cleaned = text.replace(/\s+/g, '');
        if (!/^[A-Za-z0-9+/]*={0,2}$/.test(cleaned) || cleaned.length % 4 !== 0 || cleaned.length === 0) {
          throw new Error('無効なBase64形式です');
        }
        output.value = base64ToUtf8(cleaned);
        hideError();
      } catch(e) {
        output.value = '';
        showError('デコードに失敗しました。正しいBase64文字列か確認してください。(' + e.message + ')');
      }
    }
  }

  encodeBtn.addEventListener('click', function(){ setMode('encode'); });
  decodeBtn.addEventListener('click', function(){ setMode('decode'); });
  input.addEventListener('input', process);

  document.getElementById('copyBtn').addEventListener('click', function(){
    if (!output.value) {
      notify('コピーする内容がありません', 'error');
      return;
    }
    copyText(output.value);
    notify('コピーしました', 'success');
  });
</script>
</body>
</html>
