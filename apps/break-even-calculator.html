<!--GUIOS-APP {"id":"break-even-calculator","name":"損益分岐点計算機","icon":"📉","color":"#4527a0","version":"1.0.0","author":"Claude","description":"固定費・変動費・販売価格から損益分岐点の販売数を計算するツール。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>損益分岐点計算機</title>
<style>
  :root{
    --accent:#8b7ae8;
    --bg:#100c1e;
    --card:#181329;
    --card2:#140f22;
    --text:#f0edfb;
    --sub:#b0a6d6;
    --line:#2c2450;
    --danger:#e05a5a;
    --good:#4dd68c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--text);
    padding:16px; padding-bottom:48px;
  }
  h1{font-size:20px; margin:4px 0 16px; display:flex; align-items:center; gap:8px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:16px; margin-bottom:16px;
  }
  h2{font-size:14px; margin:0 0 12px; color:var(--sub); font-weight:700;}
  label{display:block; font-size:13px; color:var(--sub); margin-bottom:6px;}
  .field{margin-bottom:14px;}
  input[type=number]{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background:#0b0817; color:var(--text); font-size:16px; outline:none;
  }
  input:focus{border-color:var(--accent);}
  .result-grid{display:flex; flex-direction:column; gap:10px; margin-top:4px;}
  .result-line{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--card2); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; font-size:14px;
  }
  .result-line .lbl{color:var(--sub);}
  .result-line .val{font-weight:700;}
  .result-line.total{ background:#231a4a; border-color:#40317f; }
  .result-line.total .val{ color:var(--accent); font-size:22px; }
  .errbox{
    background:#3a1a1a; border:1px solid #6b2b2b; color:#ffb3b3;
    border-radius:10px; padding:14px; font-size:14px; text-align:center; line-height:1.6;
  }
  table{width:100%; border-collapse:collapse; font-size:13px; margin-top:4px;}
  th, td{padding:8px 6px; text-align:right; border-bottom:1px solid var(--line);}
  th:first-child, td:first-child{text-align:left;}
  th{color:var(--sub); font-weight:600;}
  td.profit-pos{color:var(--good); font-weight:700;}
  td.profit-neg{color:var(--danger); font-weight:700;}
  tr.be-row{background:#231a4a;}
  .tablewrap{overflow-x:auto;}
  .hint{font-size:12px; color:var(--sub); margin-top:2px;}
</style>
</head>
<body>
  <h1>📉 損益分岐点計算機</h1>

  <div class="card">
    <h2>入力</h2>
    <div class="field">
      <label for="fixedCost">固定費（円）</label>
      <input type="number" id="fixedCost" inputmode="decimal" placeholder="例: 500000" min="0" step="1">
    </div>
    <div class="field">
      <label for="price">商品単価（円）</label>
      <input type="number" id="price" inputmode="decimal" placeholder="例: 2000" min="0" step="1">
    </div>
    <div class="field">
      <label for="varCost">変動費（単位あたり・円）</label>
      <input type="number" id="varCost" inputmode="decimal" placeholder="例: 1200" min="0" step="1">
    </div>
  </div>

  <div class="card" id="resultCard">
    <h2>結果</h2>
    <div id="resultArea"></div>
  </div>

  <div class="card" id="tableCard" style="display:none;">
    <h2>販売数ごとの損益シミュレーション</h2>
    <div class="tablewrap">
      <table id="simTable">
        <thead><tr><th>販売数</th><th>売上高</th><th>総費用</th><th>損益</th></tr></thead>
        <tbody id="simTbody"></tbody>
      </table>
    </div>
    <div class="hint">損益分岐点の販売数を中心に、前後の販売数での損益を表示しています。</div>
  </div>

<script>
  function yen(n){
    if(!isFinite(n)) return '¥0';
    return '¥' + Math.round(n).toLocaleString('ja-JP');
  }

  function num(n, digits){
    if(!isFinite(n)) return '0';
    return n.toLocaleString('ja-JP', {maximumFractionDigits: digits || 0});
  }

  function compute(){
    var fixed = parseFloat(document.getElementById('fixedCost').value);
    var price = parseFloat(document.getElementById('price').value);
    var varCost = parseFloat(document.getElementById('varCost').value);

    var resultArea = document.getElementById('resultArea');
    var tableCard = document.getElementById('tableCard');

    if(isNaN(fixed) || isNaN(price) || isNaN(varCost) || fixed < 0 || price < 0 || varCost < 0){
      resultArea.innerHTML = '<div class="hint">固定費・販売価格・変動費をすべて入力してください。</div>';
      tableCard.style.display = 'none';
      return;
    }

    var contribution = price - varCost;

    if(contribution <= 0){
      resultArea.innerHTML =
        '<div class="errbox">この条件では損益分岐点に到達できません<br>' +
        '（販売単価が変動費以下のため、販売するほど赤字が拡大します）</div>';
      tableCard.style.display = 'none';
      return;
    }

    var breakEvenUnits = fixed / contribution;
    var breakEvenUnitsRounded = Math.ceil(breakEvenUnits);
    var breakEvenSales = breakEvenUnits * price;

    resultArea.innerHTML =
      '<div class="result-grid">' +
        '<div class="result-line"><span class="lbl">限界利益（単価-変動費）</span><span class="val">' + yen(contribution) + ' / 個</span></div>' +
        '<div class="result-line total"><span class="lbl">損益分岐点販売数</span><span class="val">' + num(breakEvenUnitsRounded) + ' 個</span></div>' +
        '<div class="result-line total"><span class="lbl">損益分岐点売上高</span><span class="val">' + yen(breakEvenSales) + '</span></div>' +
      '</div>';

    // simulation table around break-even point
    tableCard.style.display = 'block';
    var tbody = document.getElementById('simTbody');
    tbody.innerHTML = '';
    var step = Math.max(1, Math.round(breakEvenUnitsRounded * 0.2)) || 1;
    var points = [];
    for(var i = -2; i <= 2; i++){
      var qty = breakEvenUnitsRounded + i * step;
      if(qty < 0) continue;
      points.push(qty);
    }
    // dedupe & sort
    points = points.filter(function(v, idx){ return points.indexOf(v) === idx; }).sort(function(a,b){ return a-b; });

    points.forEach(function(qty){
      var sales = qty * price;
      var totalCost = fixed + qty * varCost;
      var profit = sales - totalCost;
      var tr = document.createElement('tr');
      if(qty === breakEvenUnitsRounded) tr.className = 'be-row';
      var profitCls = profit > 0 ? 'profit-pos' : (profit < 0 ? 'profit-neg' : '');
      tr.innerHTML =
        '<td>' + num(qty) + (qty === breakEvenUnitsRounded ? '（分岐点）' : '') + '</td>' +
        '<td>' + yen(sales) + '</td>' +
        '<td>' + yen(totalCost) + '</td>' +
        '<td class="' + profitCls + '">' + (profit > 0 ? '+' : '') + yen(profit) + '</td>';
      tbody.appendChild(tr);
    });
  }

  ['fixedCost','price','varCost'].forEach(function(id){
    document.getElementById(id).addEventListener('input', compute);
  });

  compute();
</script>
</body>
</html>
