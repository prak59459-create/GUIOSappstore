<!--GUIOS-APP {"id":"calculator","name":"電卓","icon":"🧮","color":"#2e7d6b","version":"1.0.0","author":"Claude","description":"四則演算ができるシンプルな電卓アプリ。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>電卓</title>
<style>
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:#101915; color:#eaf3ef; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:12px;
  }
  .calc{
    width:100%; max-width:380px;
    background:#152420; border-radius:20px; padding:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  .display{
    background:#0b1512; border-radius:14px; padding:18px 16px;
    margin-bottom:14px; text-align:right; min-height:88px;
    display:flex; flex-direction:column; justify-content:flex-end; gap:4px;
    overflow:hidden;
  }
  .expr{ font-size:14px; color:#7fa89a; min-height:18px; word-break:break-all; }
  .result{ font-size:34px; font-weight:700; word-break:break-all; line-height:1.1; }
  .grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  button{
    padding:16px 0; border-radius:12px; border:none; font-size:18px; font-weight:600;
    cursor:pointer; min-height:52px; color:#eaf3ef; background:#1d3630;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  }
  button:active{ filter:brightness(1.25); }
  .op{ background:#2e7d6b; color:#06120e; }
  .fn{ background:#264a41; color:#cfe9df; }
  .eq{ background:#e2a03f; color:#1a1206; grid-column:span 2; }
  .zero{ grid-column:span 2; }
  .toolbar{ display:flex; justify-content:flex-end; margin-bottom:8px; }
  .copy-btn{
    background:none; border:1px solid #2e7d6b; color:#8fd6c1; font-size:13px;
    padding:8px 14px; border-radius:10px; min-height:36px;
  }
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:#1d3630; color:#eaf3ef; padding:10px 18px; border-radius:10px;
    font-size:13px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;
    max-width:90%; text-align:center; box-shadow:0 6px 18px rgba(0,0,0,.35);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="calc">
    <div class="toolbar">
      <button class="copy-btn" id="copyBtn" type="button">📋 コピー</button>
    </div>
    <div class="display">
      <div class="expr" id="expr">&nbsp;</div>
      <div class="result" id="result">0</div>
    </div>
    <div class="grid" id="pad">
      <button class="fn" data-act="ac">AC</button>
      <button class="fn" data-act="back">⌫</button>
      <button class="fn" data-act="percent">%</button>
      <button class="op" data-act="div">÷</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="op" data-act="mul">×</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="op" data-act="sub">−</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="op" data-act="add">＋</button>

      <button class="zero" data-digit="0">0</button>
      <button data-digit=".">.</button>
      <button class="eq" data-act="eq">=</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

<script>
  var hasSDK = !!(window.GUIOS && window.GUIOS.storage);

  var exprEl = document.getElementById('expr');
  var resultEl = document.getElementById('result');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }

  function notify(msg, type){
    if (window.GUIOS && window.GUIOS.notify) {
      try { window.GUIOS.notify(msg, { type: type || 'info' }); return; } catch(e){}
    }
    showToast(msg);
  }

  function copyText(text){
    if (window.GUIOS && window.GUIOS.clipboard && window.GUIOS.clipboard.writeText) {
      try { window.GUIOS.clipboard.writeText(text); return; } catch(e){}
    }
    try { navigator.clipboard.writeText(text); } catch(e){}
  }

  // Calculator state
  var current = '0';      // currently displayed number (string)
  var previous = null;    // stored previous number (number)
  var operator = null;    // '+', '-', '*', '/'
  var justEvaluated = false;
  var overwrite = false;  // next digit should overwrite current

  var OP_SYMBOLS = { '+':'＋', '-':'−', '*':'×', '/':'÷' };

  function formatNumber(n){
    if (!isFinite(n)) return 'エラー';
    if (Number.isInteger(n)) return String(n);
    // limit precision to avoid float noise, trim trailing zeros
    var s = n.toPrecision(12);
    if (s.indexOf('e') === -1) {
      s = s.replace(/0+$/,'').replace(/\.$/,'');
    }
    return s;
  }

  function updateDisplay(){
    resultEl.textContent = current;
    if (operator && previous !== null) {
      exprEl.textContent = formatNumber(previous) + ' ' + OP_SYMBOLS[operator] + (overwrite ? '' : ' ' + current);
    } else {
      exprEl.textContent = ' ';
    }
  }

  function inputDigit(d){
    if (current === 'エラー') { current = '0'; }
    if (justEvaluated) {
      current = '0';
      previous = null;
      operator = null;
      justEvaluated = false;
    }
    if (d === '.') {
      if (overwrite) { current = '0.'; overwrite = false; return updateDisplay(); }
      if (current.indexOf('.') === -1) current += '.';
      updateDisplay();
      return;
    }
    if (overwrite || current === '0') {
      current = d;
      overwrite = false;
    } else {
      if (current.length < 18) current += d;
    }
    updateDisplay();
  }

  function backspace(){
    if (justEvaluated || overwrite) return;
    if (current === 'エラー') { current = '0'; updateDisplay(); return; }
    if (current.length <= 1 || (current.length === 2 && current[0] === '-')) {
      current = '0';
    } else {
      current = current.slice(0, -1);
    }
    updateDisplay();
  }

  function clearAll(){
    current = '0';
    previous = null;
    operator = null;
    justEvaluated = false;
    overwrite = false;
    updateDisplay();
  }

  function applyPercent(){
    if (current === 'エラー') return;
    var v = parseFloat(current);
    if (isNaN(v)) return;
    v = (previous !== null) ? (previous * v / 100) : (v / 100);
    current = formatNumber(v);
    updateDisplay();
  }

  function compute(a, b, op){
    switch(op){
      case '+': return a + b;
      case '-': return a - b;
      case '*': return a * b;
      case '/':
        if (b === 0) return NaN;
        return a / b;
    }
    return b;
  }

  function chooseOperator(op){
    if (current === 'エラー') return;
    var val = parseFloat(current);
    if (operator && !overwrite) {
      var r = compute(previous, val, operator);
      if (isNaN(r) || !isFinite(r)) {
        current = 'エラー';
        previous = null;
        operator = null;
        overwrite = true;
        justEvaluated = true;
        updateDisplay();
        return;
      }
      previous = r;
      current = formatNumber(r);
    } else {
      previous = val;
    }
    operator = op;
    overwrite = true;
    justEvaluated = false;
    updateDisplay();
  }

  function equals(){
    if (current === 'エラー') return;
    if (operator === null || previous === null) return;
    var val = parseFloat(current);
    var r = compute(previous, val, operator);
    if (isNaN(r) || !isFinite(r)) {
      current = 'エラー';
      previous = null;
      operator = null;
      justEvaluated = true;
      overwrite = true;
      updateDisplay();
      return;
    }
    current = formatNumber(r);
    previous = null;
    operator = null;
    justEvaluated = true;
    overwrite = true;
    updateDisplay();
  }

  document.getElementById('pad').addEventListener('click', function(e){
    var btn = e.target.closest('button');
    if (!btn) return;
    if (btn.dataset.digit !== undefined) {
      inputDigit(btn.dataset.digit);
      return;
    }
    var act = btn.dataset.act;
    switch(act){
      case 'ac': clearAll(); break;
      case 'back': backspace(); break;
      case 'percent': applyPercent(); break;
      case 'add': chooseOperator('+'); break;
      case 'sub': chooseOperator('-'); break;
      case 'mul': chooseOperator('*'); break;
      case 'div': chooseOperator('/'); break;
      case 'eq': equals(); break;
    }
  });

  document.getElementById('copyBtn').addEventListener('click', function(){
    copyText(current);
    notify('コピーしました', 'success');
  });

  document.addEventListener('keydown', function(e){
    if (e.key >= '0' && e.key <= '9') { inputDigit(e.key); return; }
    if (e.key === '.') { inputDigit('.'); return; }
    if (e.key === '+') { chooseOperator('+'); return; }
    if (e.key === '-') { chooseOperator('-'); return; }
    if (e.key === '*') { chooseOperator('*'); return; }
    if (e.key === '/') { e.preventDefault(); chooseOperator('/'); return; }
    if (e.key === 'Enter' || e.key === '=') { equals(); return; }
    if (e.key === 'Backspace') { backspace(); return; }
    if (e.key === 'Escape') { clearAll(); return; }
    if (e.key === '%') { applyPercent(); return; }
  });

  updateDisplay();
</script>
</body>
</html>
