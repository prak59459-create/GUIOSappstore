<!--GUIOS-APP {"id":"calendar-view","name":"カレンダー","icon":"📅","color":"#3b8686","version":"1.0.0","author":"Claude","description":"月表示のカレンダーで日付ごとに短いメモを記録できるアプリ。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>カレンダー</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:#0e1c1c; color:#e6f5f2; min-height:100vh; padding:14px; padding-bottom:40px;
  }
  h1{ font-size:18px; margin:0 0 14px; text-align:center; }
  .card{
    background:#152927; border-radius:16px; padding:14px; margin-bottom:14px;
    box-shadow:0 6px 18px rgba(0,0,0,.3);
  }
  .month-nav{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
  .month-nav .month-label{ font-size:17px; font-weight:700; }
  .icon-btn{
    background:#1f3d3a; color:#e6f5f2; border:none; border-radius:12px;
    min-width:44px; min-height:44px; font-size:18px; cursor:pointer;
  }
  .icon-btn:active{ filter:brightness(1.3); }
  .today-btn{
    background:none; border:1px solid #3b8686; color:#7fd6c9; font-size:12px;
    padding:6px 10px; border-radius:8px; min-height:32px;
  }
  .weekdays, .grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .weekdays{ margin-bottom:6px; }
  .weekdays span{ text-align:center; font-size:11px; color:#7fa9a3; padding:4px 0; }
  .day{
    position:relative; aspect-ratio:1/1; border-radius:10px; background:#1f3d3a;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:14px; cursor:pointer; min-height:38px;
  }
  .day.other{ opacity:.25; cursor:default; }
  .day.today{ outline:2px solid #3b8686; font-weight:700; }
  .day.selected{ background:#3b8686; color:#06120e; }
  .day .dot{
    position:absolute; bottom:5px; width:5px; height:5px; border-radius:50%; background:#f4c96b;
  }
  .day.selected .dot{ background:#06120e; }
  .editor{ margin-top:14px; }
  .editor .date-title{ font-size:14px; font-weight:700; margin-bottom:8px; }
  textarea{
    width:100%; min-height:90px; background:#0e1c1c; border:1px solid #1f3d3a; color:#e6f5f2;
    border-radius:10px; padding:10px; font-size:15px; font-family:inherit; resize:vertical;
  }
  textarea:focus{ outline:1px solid #3b8686; }
  .editor-actions{ display:flex; gap:10px; margin-top:10px; }
  .btn{
    flex:1; background:#3b8686; color:#06201d; border:none; border-radius:12px; font-weight:700;
    font-size:14px; padding:12px; min-height:46px; cursor:pointer;
  }
  .btn:active{ filter:brightness(1.15); }
  .btn.danger{ background:none; border:1px solid #6b3535; color:#e08a8a; }
  .btn.ghost{ background:none; border:1px solid #3b8686; color:#7fd6c9; }
  .hidden{ display:none !important; }
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:#1f3d3a; color:#e6f5f2; padding:10px 18px; border-radius:10px;
    font-size:13px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;
    max-width:90%; text-align:center; box-shadow:0 6px 18px rgba(0,0,0,.35); z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <h1>📅 カレンダー</h1>

  <div class="card">
    <div class="month-nav">
      <button class="icon-btn" id="prevMonth">◀</button>
      <div style="text-align:center;">
        <div class="month-label" id="monthLabel">2026年8月</div>
        <button class="today-btn" id="todayBtn">今日</button>
      </div>
      <button class="icon-btn" id="nextMonth">▶</button>
    </div>
    <div class="weekdays">
      <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
    </div>
    <div class="grid" id="grid"></div>

    <div class="editor hidden" id="editor">
      <div class="date-title" id="editorDate">2026年8月1日</div>
      <textarea id="noteText" maxlength="300" placeholder="この日のメモを入力..."></textarea>
      <div class="editor-actions">
        <button class="btn ghost" id="cancelBtn">閉じる</button>
        <button class="btn danger" id="deleteBtn">削除</button>
        <button class="btn" id="saveBtn">保存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  var APP_ID = 'calendar-view';
  var FALLBACK_KEY = 'guios-fallback-' + APP_ID + '-data';
  var hasSDK = !!(window.GUIOS && window.GUIOS.storage);

  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }
  function notify(msg, type){
    if (window.GUIOS && window.GUIOS.notify) {
      try { window.GUIOS.notify(msg, { type: type || 'info' }); return; } catch(e){}
    }
    showToast(msg);
  }
  function haptic(){
    if (window.GUIOS && window.GUIOS.haptic) {
      try { window.GUIOS.haptic(); } catch(e){}
    }
  }

  async function loadNotes(){
    if (hasSDK) {
      try {
        var v = await window.GUIOS.storage.get('notes');
        return (v && typeof v === 'object') ? v : {};
      } catch(e){ return {}; }
    } else {
      try {
        var raw = localStorage.getItem(FALLBACK_KEY);
        var obj = raw ? JSON.parse(raw) : {};
        return (obj && typeof obj === 'object') ? obj : {};
      } catch(e){ return {}; }
    }
  }
  async function saveNotes(obj){
    if (hasSDK) {
      try { await window.GUIOS.storage.set('notes', obj); } catch(e){}
    } else {
      try { localStorage.setItem(FALLBACK_KEY, JSON.stringify(obj)); } catch(e){}
    }
  }

  var notes = {};
  var viewYear, viewMonth; // 0-11
  var selectedDate = null;

  function pad2(n){ return n < 10 ? '0'+n : ''+n; }
  function dateKey(y,m,d){ return y + '-' + pad2(m+1) + '-' + pad2(d); }
  function todayKey(){
    var d = new Date();
    return dateKey(d.getFullYear(), d.getMonth(), d.getDate());
  }

  function renderMonthLabel(){
    document.getElementById('monthLabel').textContent = viewYear + '年' + (viewMonth+1) + '月';
  }

  function renderGrid(){
    renderMonthLabel();
    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    var firstDay = new Date(viewYear, viewMonth, 1);
    var startWeekday = firstDay.getDay(); // 0=Sun
    var daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
    var daysInPrevMonth = new Date(viewYear, viewMonth, 0).getDate();
    var tKey = todayKey();
    var cells = [];

    for (var i = 0; i < startWeekday; i++) {
      var dnum = daysInPrevMonth - startWeekday + 1 + i;
      cells.push({ day: dnum, other: true, key: null });
    }
    for (var d = 1; d <= daysInMonth; d++) {
      cells.push({ day: d, other: false, key: dateKey(viewYear, viewMonth, d) });
    }
    var remainder = cells.length % 7;
    if (remainder !== 0) {
      var need = 7 - remainder;
      for (var j = 1; j <= need; j++) {
        cells.push({ day: j, other: true, key: null });
      }
    }

    cells.forEach(function(c){
      var el = document.createElement('div');
      el.className = 'day' + (c.other ? ' other' : '');
      if (!c.other) {
        if (c.key === tKey) el.classList.add('today');
        if (c.key === selectedDate) el.classList.add('selected');
      }
      el.innerHTML = '<span>' + c.day + '</span>';
      if (!c.other && notes[c.key]) {
        el.innerHTML += '<span class="dot"></span>';
      }
      if (!c.other) {
        el.dataset.key = c.key;
      }
      grid.appendChild(el);
    });
  }

  function formatDateJp(key){
    var parts = key.split('-');
    return parts[0] + '年' + parseInt(parts[1],10) + '月' + parseInt(parts[2],10) + '日';
  }

  function openEditor(key){
    selectedDate = key;
    document.getElementById('editorDate').textContent = formatDateJp(key);
    document.getElementById('noteText').value = notes[key] || '';
    document.getElementById('editor').classList.remove('hidden');
    renderGrid();
    document.getElementById('noteText').focus();
  }

  function closeEditor(){
    selectedDate = null;
    document.getElementById('editor').classList.add('hidden');
    renderGrid();
  }

  document.getElementById('grid').addEventListener('click', function(e){
    var cell = e.target.closest('.day');
    if (!cell || cell.classList.contains('other')) return;
    var key = cell.dataset.key;
    openEditor(key);
  });

  document.getElementById('cancelBtn').addEventListener('click', closeEditor);

  document.getElementById('saveBtn').addEventListener('click', async function(){
    if (!selectedDate) return;
    var text = document.getElementById('noteText').value.trim();
    if (text) {
      notes[selectedDate] = text;
    } else {
      delete notes[selectedDate];
    }
    await saveNotes(notes);
    notify('保存しました', 'success');
    haptic();
    closeEditor();
  });

  document.getElementById('deleteBtn').addEventListener('click', async function(){
    if (!selectedDate) return;
    delete notes[selectedDate];
    await saveNotes(notes);
    notify('削除しました', 'success');
    closeEditor();
  });

  document.getElementById('prevMonth').addEventListener('click', function(){
    viewMonth--;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    closeEditor();
  });
  document.getElementById('nextMonth').addEventListener('click', function(){
    viewMonth++;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    closeEditor();
  });
  document.getElementById('todayBtn').addEventListener('click', function(){
    var d = new Date();
    viewYear = d.getFullYear();
    viewMonth = d.getMonth();
    closeEditor();
  });

  (async function init(){
    var d = new Date();
    viewYear = d.getFullYear();
    viewMonth = d.getMonth();
    notes = await loadNotes();
    renderGrid();
    if (window.GUIOS && window.GUIOS.setTitle) {
      try { window.GUIOS.setTitle('カレンダー'); } catch(e){}
    }
  })();
</script>
</body>
</html>
