<!--GUIOS-APP {"id":"char-counter","name":"文字数カウント","icon":"🔤","color":"#3d8bbd","version":"1.0.0","author":"Claude","description":"文章の文字数・単語数・行数をリアルタイムでカウントするツール。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>文字数カウント</title>
<style>
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:#0d1a24; color:#e6f2fa; min-height:100vh; padding:16px;
    display:flex; flex-direction:column;
  }
  h1{ font-size:18px; margin:0 0 14px; color:#8fc6ea; }
  textarea{
    width:100%; min-height:38vh; padding:14px; border-radius:14px; border:1px solid #1f3a4d;
    background:#0a141c; color:#e6f2fa; font-size:16px; line-height:1.6; resize:vertical;
    font-family:inherit; margin-bottom:14px;
  }
  .stats{
    display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:14px;
  }
  .stat{
    background:#122431; border-radius:12px; padding:14px; text-align:center;
  }
  .stat .num{ font-size:24px; font-weight:700; color:#3d8bbd; }
  .stat .lbl{ font-size:12px; color:#8fadc2; margin-top:4px; }
  .copy-btn{
    width:100%; padding:14px; border-radius:12px; border:none; background:#3d8bbd;
    color:#04141d; font-weight:700; font-size:15px; cursor:pointer; min-height:48px;
    -webkit-tap-highlight-color:transparent;
  }
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:#122431; color:#e6f2fa; padding:10px 18px; border-radius:10px;
    font-size:13px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;
    max-width:90%; text-align:center; box-shadow:0 6px 18px rgba(0,0,0,.35); z-index:100;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <h1>🔤 文字数カウント</h1>
  <textarea id="text" placeholder="ここに文章を入力してください…"></textarea>

  <div class="stats">
    <div class="stat"><div class="num" id="charCount">0</div><div class="lbl">文字数(全体)</div></div>
    <div class="stat"><div class="num" id="charNoSpace">0</div><div class="lbl">文字数(空白除く)</div></div>
    <div class="stat"><div class="num" id="wordCount">0</div><div class="lbl">単語数</div></div>
    <div class="stat"><div class="num" id="lineCount">1</div><div class="lbl">行数</div></div>
    <div class="stat" style="grid-column:span 2;"><div class="num" id="byteCount">0</div><div class="lbl">バイト数(UTF-8)</div></div>
  </div>

  <button class="copy-btn" id="copyBtn">📋 統計をコピー</button>
  <div class="toast" id="toast"></div>

<script>
  var textarea = document.getElementById('text');
  var charCountEl = document.getElementById('charCount');
  var charNoSpaceEl = document.getElementById('charNoSpace');
  var wordCountEl = document.getElementById('wordCount');
  var lineCountEl = document.getElementById('lineCount');
  var byteCountEl = document.getElementById('byteCount');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }
  function notify(msg, type){
    if (window.GUIOS && window.GUIOS.notify) {
      try { window.GUIOS.notify(msg, { type: type || 'info' }); return; } catch(e){}
    }
    showToast(msg);
  }
  function copyText(text){
    if (window.GUIOS && window.GUIOS.clipboard && window.GUIOS.clipboard.writeText) {
      try { window.GUIOS.clipboard.writeText(text); return; } catch(e){}
    }
    try { navigator.clipboard.writeText(text); } catch(e){}
  }

  function countWords(text){
    var trimmed = text.trim();
    if (!trimmed) return 0;
    var parts = trimmed.split(/\s+/).filter(function(p){ return p.length > 0; });
    return parts.length;
  }

  function update(){
    var text = textarea.value;
    var totalChars = Array.from(text).length; // count by code point
    var noSpace = Array.from(text.replace(/\s/g, '')).length;
    var words = countWords(text);
    var lines = text.length === 0 ? 1 : text.split('\n').length;
    var bytes = new TextEncoder().encode(text).length;

    charCountEl.textContent = totalChars;
    charNoSpaceEl.textContent = noSpace;
    wordCountEl.textContent = words;
    lineCountEl.textContent = lines;
    byteCountEl.textContent = bytes;
  }

  textarea.addEventListener('input', update);

  document.getElementById('copyBtn').addEventListener('click', function(){
    var summary = '文字数(全体): ' + charCountEl.textContent + '\n' +
      '文字数(空白除く): ' + charNoSpaceEl.textContent + '\n' +
      '単語数: ' + wordCountEl.textContent + '\n' +
      '行数: ' + lineCountEl.textContent + '\n' +
      'バイト数(UTF-8): ' + byteCountEl.textContent;
    copyText(summary);
    notify('統計をコピーしました', 'success');
  });

  update();
</script>
</body>
</html>
