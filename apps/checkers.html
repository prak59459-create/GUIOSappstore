<!--GUIOS-APP {"id":"checkers","name":"チェッカー","icon":"⚫","color":"#4e342e","version":"1.0.0","author":"Claude","description":"対角線に駒を進めて相手の駒を取り合うチェッカー(西洋碁)ゲーム。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>チェッカー</title>
<style>
  :root{
    --accent:#c9a06a;
    --bg:#150e0a;
    --card:#241a12;
    --card2:#1c140d;
    --text:#f3e9dd;
    --sub:#c2ac93;
    --line:rgba(255,255,255,0.08);
    --ok:#4caf7d;
    --bad:#e5484d;
    --sq-dark:#3b2a1e;
    --sq-light:#d8c39d;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ overflow-x:hidden; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; padding:14px; padding-bottom:44px;
  }
  h1{ font-size:19px; margin:2px 0 10px; display:flex; align-items:center; gap:8px; }
  .wrap{ max-width:480px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
  .status-bar{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 14px;
    font-size:14px;
  }
  .status-bar .rec{ font-size:12px; color:var(--sub); }
  .turn-pill{
    display:inline-flex; align-items:center; gap:6px; font-weight:700; font-size:13px;
    padding:4px 10px; border-radius:999px; background:var(--card2);
  }
  .turn-pill.player{ color:var(--accent); }
  .turn-pill.cpu{ color:#9fb6ff; }
  .board-wrap{
    background:#0d0805; border:2px solid var(--line); border-radius:12px; padding:6px;
  }
  .board{
    display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(8,1fr);
    width:100%; aspect-ratio:1/1; border-radius:6px; overflow:hidden;
  }
  .sq{
    position:relative; display:flex; align-items:center; justify-content:center;
    user-select:none;
  }
  .sq.dark{ background:var(--sq-dark); }
  .sq.light{ background:var(--sq-light); }
  .sq.selected{ box-shadow:inset 0 0 0 3px #ffd54f; }
  .sq.dest::after{
    content:''; position:absolute; width:28%; height:28%; border-radius:50%;
    background:rgba(255,213,79,0.85);
  }
  .sq.dest-cap::after{
    background:rgba(229,72,77,0.85);
  }
  .piece{
    width:78%; height:78%; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:min(3.6vw,18px); font-weight:800;
    box-shadow:0 2px 3px rgba(0,0,0,0.5), inset 0 -3px 4px rgba(0,0,0,0.25), inset 0 2px 3px rgba(255,255,255,0.25);
  }
  .piece.player{ background:linear-gradient(160deg,#f3e2bd,#c9a06a); color:#4e342e; border:1px solid #8a6a3d; }
  .piece.cpu{ background:linear-gradient(160deg,#4a3a52,#221726); color:#cbb8ff; border:1px solid #10090c; }
  .legend{
    display:flex; gap:16px; justify-content:center; font-size:12px; color:var(--sub); flex-wrap:wrap;
  }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .dot{ width:12px; height:12px; border-radius:50%; display:inline-block; }
  .dot.player{ background:linear-gradient(160deg,#f3e2bd,#c9a06a); }
  .dot.cpu{ background:linear-gradient(160deg,#4a3a52,#221726); }
  .msg{
    text-align:center; font-size:13px; color:var(--sub); min-height:18px;
  }
  .btn-row{ display:flex; gap:10px; }
  button{
    flex:1; padding:12px 10px; border-radius:12px; border:none; background:var(--card2);
    color:var(--text); font-weight:700; font-size:14px; cursor:pointer; min-height:46px;
    border:1px solid var(--line);
  }
  button.primary{ background:var(--accent); color:#2a1a08; }
  button:active{ filter:brightness(1.1); }
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none;
    align-items:center; justify-content:center; padding:20px; z-index:10;
  }
  .overlay.show{ display:flex; }
  .overlay .box{
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px 20px;
    text-align:center; max-width:320px; width:100%;
  }
  .overlay .box h2{ margin:0 0 8px; font-size:20px; }
  .overlay .box p{ margin:0 0 18px; color:var(--sub); font-size:14px; }
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:#222; color:#fff; padding:10px 18px; border-radius:10px; font-size:13px;
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:20; max-width:88vw; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <h1>⚫ チェッカー</h1>
  <div class="status-bar">
    <span class="turn-pill player" id="turnPill">あなたの番</span>
    <span class="rec" id="recText">勝ち0 / 負け0</span>
  </div>
  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>
  <div class="legend">
    <span><span class="dot player"></span>あなた(下から上へ)</span>
    <span><span class="dot cpu"></span>CPU(上から下へ)</span>
  </div>
  <div class="msg" id="msgText">駒をタップして移動先を選んでください。</div>
  <div class="btn-row">
    <button id="newGameBtn" type="button" class="primary">新しいゲーム</button>
    <button id="resetRecBtn" type="button">記録リセット</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="box">
    <h2 id="overTitle">ゲーム終了</h2>
    <p id="overDesc"></p>
    <button class="primary" id="overBtn" type="button">もう一度</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var APP_ID = "checkers";
  var hasSDK = !!(window.GUIOS && window.GUIOS.storage);
  var LS_KEY = APP_ID + ":record";
  var record = { wins:0, losses:0 };

  var boardEl = document.getElementById('board');
  var turnPill = document.getElementById('turnPill');
  var recText = document.getElementById('recText');
  var msgText = document.getElementById('msgText');
  var newGameBtn = document.getElementById('newGameBtn');
  var resetRecBtn = document.getElementById('resetRecBtn');
  var overlay = document.getElementById('overlay');
  var overTitle = document.getElementById('overTitle');
  var overDesc = document.getElementById('overDesc');
  var overBtn = document.getElementById('overBtn');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function showToast(msg){
    if (window.GUIOS && window.GUIOS.notify){
      window.GUIOS.notify(msg, { type: 'info' });
      return;
    }
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1600);
  }
  function haptic(){
    if (window.GUIOS && window.GUIOS.haptic){
      try { window.GUIOS.haptic(); } catch(e){}
    }
  }

  async function loadRecord(){
    try {
      if (hasSDK){
        var v = await window.GUIOS.storage.get('record');
        if (v && typeof v === 'object') record = Object.assign(record, v);
      } else {
        var raw = localStorage.getItem(LS_KEY);
        if (raw) record = Object.assign(record, JSON.parse(raw));
      }
    } catch(e){}
    renderRecord();
  }
  async function saveRecord(){
    try {
      if (hasSDK){
        await window.GUIOS.storage.set('record', record);
      } else {
        localStorage.setItem(LS_KEY, JSON.stringify(record));
      }
    } catch(e){}
  }
  function renderRecord(){
    recText.textContent = '勝ち' + record.wins + ' / 負け' + record.losses;
  }

  // ---- game state ----
  var board = [];
  var turn = 'p';
  var selected = null;
  var forcedChain = null;
  var legalDests = [];
  var busy = false;
  var timers = [];

  var DIRS_ALL = [[-1,-1],[-1,1],[1,-1],[1,1]];
  var DIRS_P = [[-1,-1],[-1,1]];
  var DIRS_C = [[1,-1],[1,1]];

  function inBounds(r,c){ return r>=0 && r<8 && c>=0 && c<8; }
  function isDark(r,c){ return (r+c)%2===1; }

  function newBoard(){
    var b = [];
    for (var r=0;r<8;r++){
      var row = [];
      for (var c=0;c<8;c++){ row.push(null); }
      b.push(row);
    }
    for (var r=0;r<3;r++){
      for (var c=0;c<8;c++){
        if (isDark(r,c)) b[r][c] = { owner:'c', king:false };
      }
    }
    for (var r=5;r<8;r++){
      for (var c=0;c<8;c++){
        if (isDark(r,c)) b[r][c] = { owner:'p', king:false };
      }
    }
    return b;
  }

  function cloneBoard(b){
    return b.map(function(row){
      return row.map(function(cell){
        return cell ? { owner:cell.owner, king:cell.king } : null;
      });
    });
  }

  function getPieceMovesRaw(b, r, c){
    var p = b[r][c];
    if (!p) return { simple:[], captures:[] };
    var dirs = p.king ? DIRS_ALL : (p.owner==='p' ? DIRS_P : DIRS_C);
    var simple = [], captures = [];
    dirs.forEach(function(d){
      var nr = r+d[0], nc = c+d[1];
      if (!inBounds(nr,nc)) return;
      if (b[nr][nc] === null){
        simple.push({ r:nr, c:nc });
      } else if (b[nr][nc].owner !== p.owner){
        var jr = r+d[0]*2, jc = c+d[1]*2;
        if (inBounds(jr,jc) && b[jr][jc] === null){
          captures.push({ r:jr, c:jc, capR:nr, capC:nc });
        }
      }
    });
    return { simple:simple, captures:captures };
  }

  function getAllMoves(b, side){
    var captures = [], simples = [];
    for (var r=0;r<8;r++){
      for (var c=0;c<8;c++){
        var p = b[r][c];
        if (!p || p.owner !== side) continue;
        var raw = getPieceMovesRaw(b,r,c);
        if (raw.captures.length) captures.push({ r:r, c:c, moves:raw.captures });
        if (raw.simple.length) simples.push({ r:r, c:c, moves:raw.simple });
      }
    }
    return { captures:captures, simples:simples };
  }

  function countPieces(b, side){
    var n = 0;
    for (var r=0;r<8;r++) for (var c=0;c<8;c++) if (b[r][c] && b[r][c].owner===side) n++;
    return n;
  }

  function maybePromote(piece, r){
    if (piece.king) return false;
    if (piece.owner === 'p' && r === 0){ piece.king = true; return true; }
    if (piece.owner === 'c' && r === 7){ piece.king = true; return true; }
    return false;
  }

  function clearTimers(){
    timers.forEach(function(t){ clearTimeout(t); });
    timers = [];
  }

  // ---- rendering ----
  function render(){
    boardEl.innerHTML = '';
    var allMoves = (!busy) ? getAllMoves(board, turn) : null;
    for (var r=0;r<8;r++){
      for (var c=0;c<8;c++){
        var sq = document.createElement('div');
        sq.className = 'sq ' + (isDark(r,c) ? 'dark' : 'light');
        sq.dataset.r = r; sq.dataset.c = c;
        var p = board[r][c];
        if (p){
          var pd = document.createElement('div');
          pd.className = 'piece ' + (p.owner==='p' ? 'player' : 'cpu');
          pd.textContent = p.king ? '王' : '';
          sq.appendChild(pd);
        }
        if (selected && selected.r===r && selected.c===c){
          sq.classList.add('selected');
        }
        var dest = legalDests.find(function(d){ return d.r===r && d.c===c; });
        if (dest){
          sq.classList.add('dest');
          if (dest.capR !== undefined) sq.classList.add('dest-cap');
        }
        boardEl.appendChild(sq);
      }
    }
    turnPill.textContent = busy ? 'CPUの番' : (turn==='p' ? 'あなたの番' : 'CPUの番');
    turnPill.className = 'turn-pill ' + (turn==='p' && !busy ? 'player' : 'cpu');
  }

  function selectableSideMoves(side){
    var all = getAllMoves(board, side);
    if (all.captures.length > 0) return { forced:true, list:all.captures };
    return { forced:false, list:all.simples };
  }

  function onSquareClick(r,c){
    if (busy) return;
    if (turn !== 'p') return;
    var p = board[r][c];

    if (forcedChain){
      // must continue with the forced piece only
      if (selected && selected.r===forcedChain.r && selected.c===forcedChain.c){
        var dest = legalDests.find(function(d){ return d.r===r && d.c===c; });
        if (dest) { performPlayerMove(selected, dest); return; }
      }
      return; // ignore other taps mid-chain
    }

    // if a piece already selected and this tap is a legal destination -> move
    if (selected){
      var dest2 = legalDests.find(function(d){ return d.r===r && d.c===c; });
      if (dest2){ performPlayerMove(selected, dest2); return; }
    }

    // otherwise try to select a piece
    if (p && p.owner === 'p'){
      var sm = selectableSideMoves('p');
      var entry = sm.list.find(function(e){ return e.r===r && e.c===c; });
      if (!entry){
        if (sm.forced) showToast('駒を取れるのでそちらを選んでください');
        selected = null; legalDests = [];
        render();
        return;
      }
      selected = { r:r, c:c };
      legalDests = entry.moves;
      render();
      return;
    }

    // clicked empty/non-legal square with nothing selected relevant -> deselect
    selected = null; legalDests = [];
    render();
  }

  function performPlayerMove(from, dest){
    haptic();
    var piece = board[from.r][from.c];
    board[from.r][from.c] = null;
    var isCap = dest.capR !== undefined;
    if (isCap) board[dest.capR][dest.capC] = null;
    board[dest.r][dest.c] = piece;
    maybePromote(piece, dest.r);

    if (isCap){
      var again = getPieceMovesRaw(board, dest.r, dest.c).captures;
      if (again.length > 0){
        forcedChain = { r:dest.r, c:dest.c };
        selected = forcedChain;
        legalDests = again;
        render();
        msgText.textContent = '連続ジャンプできます。続けてタップしてください。';
        return;
      }
    }
    forcedChain = null;
    selected = null; legalDests = [];
    endPlayerTurn();
  }

  function endPlayerTurn(){
    turn = 'c';
    render();
    var end = checkGameEnd();
    if (end) { finishGame(end); return; }
    msgText.textContent = 'CPUが考えています…';
    busy = true;
    render();
    timers.push(setTimeout(performCpuTurn, 550));
  }

  function checkGameEnd(){
    // returns 'p' or 'c' as winner, or null
    var pCount = countPieces(board,'p');
    var cCount = countPieces(board,'c');
    if (pCount === 0) return 'c';
    if (cCount === 0) return 'p';
    var toMove = turn;
    var moves = selectableSideMoves(toMove);
    if (moves.list.length === 0){
      return toMove === 'p' ? 'c' : 'p';
    }
    return null;
  }

  function finishGame(winner){
    busy = false;
    clearTimers();
    if (winner === 'p'){
      record.wins++;
      overTitle.textContent = 'あなたの勝ちです!';
      overDesc.textContent = 'CPUの駒をすべて取るか、動けなくしました。';
    } else {
      record.losses++;
      overTitle.textContent = 'あなたの負けです…';
      overDesc.textContent = 'もう一度挑戦しましょう。';
    }
    saveRecord();
    renderRecord();
    overlay.classList.add('show');
    render();
  }

  // ---- CPU AI ----
  function findBestChain(b, r, c){
    var caps = getPieceMovesRaw(b, r, c).captures;
    if (caps.length === 0) return [];
    var best = [];
    caps.forEach(function(mv){
      var nb = cloneBoard(b);
      var piece = nb[r][c];
      nb[r][c] = null;
      nb[mv.capR][mv.capC] = null;
      nb[mv.r][mv.c] = piece;
      maybePromote(piece, mv.r);
      var rest = findBestChain(nb, mv.r, mv.c);
      var chain = [mv].concat(rest);
      if (chain.length > best.length) best = chain;
    });
    return best;
  }

  function opponentHasCaptureAfter(b, mover){
    var opp = mover === 'p' ? 'c' : 'p';
    return getAllMoves(b, opp).captures.length > 0;
  }

  function performCpuTurn(){
    var all = getAllMoves(board, 'c');
    if (all.captures.length > 0){
      var bestChain = [];
      var bestStart = null;
      all.captures.forEach(function(entry){
        var chain = findBestChain(board, entry.r, entry.c);
        if (chain.length > bestChain.length){
          bestChain = chain;
          bestStart = { r:entry.r, c:entry.c };
        }
      });
      runCpuChain(bestStart, bestChain, 0);
      return;
    }
    // no captures: heuristic simple move
    var candidates = [];
    all.simples.forEach(function(entry){
      entry.moves.forEach(function(mv){
        candidates.push({ from:{r:entry.r,c:entry.c}, to:mv });
      });
    });
    if (candidates.length === 0){
      // shouldn't happen (checked before scheduling), but guard anyway
      busy = false;
      turn = 'p';
      var end = checkGameEnd();
      render();
      if (end) finishGame(end);
      return;
    }
    var scored = candidates.map(function(cand){
      var nb = cloneBoard(board);
      var piece = nb[cand.from.r][cand.from.c];
      nb[cand.from.r][cand.from.c] = null;
      nb[cand.to.r][cand.to.c] = piece;
      var promoted = maybePromote(piece, cand.to.r);
      var score = 0;
      score += (cand.to.r - cand.from.r); // cpu wants increasing row
      if (promoted) score += 6;
      if (opponentHasCaptureAfter(nb, 'c')) score -= 5;
      score += Math.random() * 0.6;
      return { cand:cand, score:score };
    });
    scored.sort(function(a,b){ return b.score - a.score; });
    var choice = scored[0].cand;
    var piece = board[choice.from.r][choice.from.c];
    board[choice.from.r][choice.from.c] = null;
    board[choice.to.r][choice.to.c] = piece;
    maybePromote(piece, choice.to.r);
    render();
    finishCpuTurn();
  }

  function runCpuChain(start, chain, idx){
    if (idx >= chain.length){
      finishCpuTurn();
      return;
    }
    var mv = chain[idx];
    var from = idx === 0 ? start : { r: chain[idx-1].r, c: chain[idx-1].c };
    var piece = board[from.r][from.c];
    board[from.r][from.c] = null;
    board[mv.capR][mv.capC] = null;
    board[mv.r][mv.c] = piece;
    maybePromote(piece, mv.r);
    render();
    timers.push(setTimeout(function(){ runCpuChain(start, chain, idx+1); }, 420));
  }

  function finishCpuTurn(){
    busy = false;
    turn = 'p';
    var end = checkGameEnd();
    render();
    if (end){ finishGame(end); return; }
    msgText.textContent = '駒をタップして移動先を選んでください。';
  }

  // ---- init / controls ----
  function startNewGame(){
    clearTimers();
    board = newBoard();
    turn = 'p';
    selected = null; forcedChain = null; legalDests = [];
    busy = false;
    overlay.classList.remove('show');
    msgText.textContent = '駒をタップして移動先を選んでください。';
    render();
  }

  boardEl.addEventListener('click', function(ev){
    var sq = ev.target.closest('.sq');
    if (!sq) return;
    var r = parseInt(sq.dataset.r,10), c = parseInt(sq.dataset.c,10);
    if (!isDark(r,c)) return;
    onSquareClick(r,c);
  });

  newGameBtn.addEventListener('click', startNewGame);
  overBtn.addEventListener('click', startNewGame);
  resetRecBtn.addEventListener('click', function(){
    record = { wins:0, losses:0 };
    saveRecord();
    renderRecord();
    showToast('記録をリセットしました');
  });

  loadRecord();
  startNewGame();
})();
</script>
</body>
</html>
