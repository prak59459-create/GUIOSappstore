<!--GUIOS-APP {"id":"color-picker","name":"カラーピッカー","icon":"🎨","color":"#d46a9f","version":"1.0.0","author":"Claude","description":"色を選んでHEX・RGB・HSLに変換し、お気に入り登録できるアプリ。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>カラーピッカー</title>
<style>
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:#1c1018; color:#f7e9f0; min-height:100vh; padding:16px;
  }
  h1{ font-size:18px; margin:0 0 14px; color:#f0aecb; }
  .card{ background:#2a1522; border-radius:16px; padding:16px; margin-bottom:14px; }
  .swatch-preview{
    width:100%; height:90px; border-radius:14px; margin-bottom:14px;
    border:2px solid rgba(255,255,255,.15);
  }
  .picker-row{ display:flex; gap:10px; margin-bottom:14px; align-items:stretch; }
  input[type="color"]{
    width:64px; height:52px; border:none; border-radius:12px; padding:0; background:none; cursor:pointer;
    flex-shrink:0;
  }
  input[type="text"]{
    flex:1; padding:0 14px; border-radius:12px; border:1px solid #4a2b3d;
    background:#1c1018; color:#f7e9f0; font-size:18px; min-width:0;
    font-family:ui-monospace,Menlo,Consolas,monospace;
  }
  .fmt-row{
    display:flex; align-items:center; justify-content:space-between;
    background:#1c1018; border-radius:10px; padding:12px 14px; margin-bottom:10px; gap:10px;
  }
  .fmt-label{ font-size:12px; color:#c78aa4; min-width:36px; }
  .fmt-val{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:14px; flex:1; word-break:break-all; }
  .copy-btn{
    background:#d46a9f; color:#22101a; border:none; border-radius:8px; padding:8px 14px;
    font-size:12px; font-weight:700; cursor:pointer; min-height:36px; flex-shrink:0;
    -webkit-tap-highlight-color:transparent;
  }
  .fav-btn{
    width:100%; padding:14px; border-radius:12px; border:none; background:#d46a9f;
    color:#22101a; font-weight:700; font-size:15px; cursor:pointer; min-height:48px;
    -webkit-tap-highlight-color:transparent;
  }
  .fav-title{ font-size:14px; color:#e5a9c4; margin-bottom:10px; }
  .fav-grid{ display:flex; flex-wrap:wrap; gap:10px; }
  .fav-item{
    position:relative; width:52px; height:52px; border-radius:12px; cursor:pointer;
    border:2px solid rgba(255,255,255,.2);
  }
  .fav-item .del{
    position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%;
    background:#1c1018; color:#f7e9f0; border:1px solid #4a2b3d; font-size:12px; line-height:18px;
    text-align:center; cursor:pointer; padding:0;
  }
  .empty{ color:#8a6272; font-size:13px; }
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:#3a1e2c; color:#f7e9f0; padding:10px 18px; border-radius:10px;
    font-size:13px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;
    max-width:90%; text-align:center; box-shadow:0 6px 18px rgba(0,0,0,.35); z-index:100;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <h1>🎨 カラーピッカー</h1>

  <div class="card">
    <div class="swatch-preview" id="preview"></div>
    <div class="picker-row">
      <input type="color" id="colorInput" value="#d46a9f">
      <input type="text" id="hexInput" value="#D46A9F" maxlength="7" spellcheck="false">
    </div>

    <div class="fmt-row">
      <span class="fmt-label">HEX</span>
      <span class="fmt-val" id="hexVal">#D46A9F</span>
      <button class="copy-btn" data-copy="hex">コピー</button>
    </div>
    <div class="fmt-row">
      <span class="fmt-label">RGB</span>
      <span class="fmt-val" id="rgbVal">rgb(212, 106, 159)</span>
      <button class="copy-btn" data-copy="rgb">コピー</button>
    </div>
    <div class="fmt-row">
      <span class="fmt-label">HSL</span>
      <span class="fmt-val" id="hslVal">hsl(328, 55%, 62%)</span>
      <button class="copy-btn" data-copy="hsl">コピー</button>
    </div>

    <button class="fav-btn" id="addFav">★ お気に入りに追加</button>
  </div>

  <div class="card">
    <div class="fav-title">お気に入り</div>
    <div class="fav-grid" id="favGrid"><span class="empty">まだありません</span></div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  var APP_ID = 'color-picker';
  var hasSDK = !!(window.GUIOS && window.GUIOS.storage);
  var FALLBACK_KEY = 'guios-fallback-' + APP_ID + '-favorites';

  var colorInput = document.getElementById('colorInput');
  var hexInput = document.getElementById('hexInput');
  var preview = document.getElementById('preview');
  var hexVal = document.getElementById('hexVal');
  var rgbVal = document.getElementById('rgbVal');
  var hslVal = document.getElementById('hslVal');
  var favGrid = document.getElementById('favGrid');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }
  function notify(msg, type){
    if (window.GUIOS && window.GUIOS.notify) {
      try { window.GUIOS.notify(msg, { type: type || 'info' }); return; } catch(e){}
    }
    showToast(msg);
  }
  function copyText(text){
    if (window.GUIOS && window.GUIOS.clipboard && window.GUIOS.clipboard.writeText) {
      try { window.GUIOS.clipboard.writeText(text); return; } catch(e){}
    }
    try { navigator.clipboard.writeText(text); } catch(e){}
  }

  function isValidHex(h){
    return /^#([0-9a-f]{6}|[0-9a-f]{3})$/i.test(h);
  }
  function normalizeHex(h){
    h = h.trim();
    if (h[0] !== '#') h = '#' + h;
    if (/^#([0-9a-f]{3})$/i.test(h)) {
      h = '#' + h.slice(1).split('').map(function(c){ return c + c; }).join('');
    }
    return h.toUpperCase();
  }
  function hexToRgb(h){
    var r = parseInt(h.slice(1,3),16);
    var g = parseInt(h.slice(3,5),16);
    var b = parseInt(h.slice(5,7),16);
    return { r:r, g:g, b:b };
  }
  function rgbToHsl(r,g,b){
    r/=255; g/=255; b/=255;
    var max=Math.max(r,g,b), min=Math.min(r,g,b);
    var h,s,l=(max+min)/2;
    if (max===min){ h=s=0; }
    else {
      var d=max-min;
      s = l>0.5 ? d/(2-max-min) : d/(max+min);
      switch(max){
        case r: h=(g-b)/d+(g<b?6:0); break;
        case g: h=(b-r)/d+2; break;
        case b: h=(r-g)/d+4; break;
      }
      h/=6;
    }
    return { h:Math.round(h*360), s:Math.round(s*100), l:Math.round(l*100) };
  }

  function updateFromHex(hex){
    if (!isValidHex(hex)) return;
    var norm = normalizeHex(hex);
    colorInput.value = norm;
    hexInput.value = norm;
    preview.style.background = norm;
    var rgb = hexToRgb(norm);
    var hsl = rgbToHsl(rgb.r, rgb.g, rgb.b);
    hexVal.textContent = norm;
    rgbVal.textContent = 'rgb(' + rgb.r + ', ' + rgb.g + ', ' + rgb.b + ')';
    hslVal.textContent = 'hsl(' + hsl.h + ', ' + hsl.s + '%, ' + hsl.l + '%)';
  }

  colorInput.addEventListener('input', function(){
    updateFromHex(colorInput.value);
  });
  hexInput.addEventListener('input', function(){
    var v = hexInput.value.trim();
    if (isValidHex(v)) updateFromHex(v);
  });
  hexInput.addEventListener('blur', function(){
    if (!isValidHex(hexInput.value.trim())) {
      updateFromHex(colorInput.value);
    }
  });

  document.querySelectorAll('.copy-btn[data-copy]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var kind = btn.dataset.copy;
      var text = kind === 'hex' ? hexVal.textContent : kind === 'rgb' ? rgbVal.textContent : hslVal.textContent;
      copyText(text);
      notify(kind.toUpperCase() + 'をコピーしました', 'success');
    });
  });

  // Favorites persistence
  function loadFavorites(){
    if (hasSDK) {
      return window.GUIOS.storage.get('favorites').then(function(v){
        return Array.isArray(v) ? v : [];
      }).catch(function(){ return []; });
    } else {
      try {
        var raw = localStorage.getItem(FALLBACK_KEY);
        var arr = raw ? JSON.parse(raw) : [];
        return Promise.resolve(Array.isArray(arr) ? arr : []);
      } catch(e) { return Promise.resolve([]); }
    }
  }
  function saveFavorites(arr){
    if (hasSDK) {
      return window.GUIOS.storage.set('favorites', arr).catch(function(){});
    } else {
      try { localStorage.setItem(FALLBACK_KEY, JSON.stringify(arr)); } catch(e){}
      return Promise.resolve(true);
    }
  }

  var favorites = [];

  function renderFavorites(){
    if (!favorites.length) {
      favGrid.innerHTML = '<span class="empty">まだありません</span>';
      return;
    }
    favGrid.innerHTML = favorites.map(function(hex, i){
      return '<div class="fav-item" style="background:' + hex + '" data-idx="' + i + '" data-hex="' + hex + '">' +
        '<button class="del" data-idx="' + i + '" title="削除">×</button></div>';
    }).join('');
  }

  favGrid.addEventListener('click', function(e){
    var delBtn = e.target.closest('.del');
    if (delBtn) {
      var idx = parseInt(delBtn.dataset.idx, 10);
      favorites.splice(idx, 1);
      saveFavorites(favorites);
      renderFavorites();
      return;
    }
    var item = e.target.closest('.fav-item');
    if (item) {
      updateFromHex(item.dataset.hex);
    }
  });

  document.getElementById('addFav').addEventListener('click', function(){
    var hex = hexVal.textContent;
    if (favorites.indexOf(hex) !== -1) {
      notify('すでに登録済みです', 'info');
      return;
    }
    favorites.unshift(hex);
    if (favorites.length > 30) favorites = favorites.slice(0, 30);
    saveFavorites(favorites);
    renderFavorites();
    notify('お気に入りに追加しました', 'success');
  });

  loadFavorites().then(function(arr){
    favorites = arr;
    renderFavorites();
  });

  updateFromHex('#D46A9F');
</script>
</body>
</html>
