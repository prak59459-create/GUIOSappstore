<!--GUIOS-APP {"id":"countdown-timer","name":"カウントダウンタイマー","icon":"⏳","color":"#8a4b6b","version":"1.0.0","author":"Claude","description":"指定した時間からカウントダウンし、終了を知らせてくれるタイマー。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>カウントダウンタイマー</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:#1c1220; color:#f5e9f3; min-height:100vh; padding:14px; padding-bottom:40px;
    display:flex; flex-direction:column; align-items:center;
  }
  h1{ font-size:18px; margin:8px 0 18px; text-align:center; }
  .display-wrap{
    background:#291a2c; border-radius:20px; padding:30px 14px; width:100%; max-width:360px;
    text-align:center; margin-bottom:18px; box-shadow:0 6px 18px rgba(0,0,0,.3);
    transition:background .15s;
  }
  .display-wrap.flash{ animation:flashBg .5s ease-in-out 4; }
  @keyframes flashBg{
    0%,100%{ background:#291a2c; }
    50%{ background:#8a4b6b; }
  }
  .time{
    font-size:clamp(42px, 14vw, 60px); font-weight:700; font-variant-numeric:tabular-nums;
    font-family:'SF Mono','Menlo','Consolas',monospace; color:#e0a6c8;
  }
  .presets{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; width:100%; max-width:360px; margin-bottom:14px; }
  .preset-btn{
    background:#3a2540; color:#e0c6da; border:none; border-radius:10px; font-size:13px;
    padding:9px 14px; min-height:40px; cursor:pointer;
  }
  .preset-btn:active{ filter:brightness(1.3); }
  .inputs-card{
    background:#291a2c; border-radius:16px; padding:14px; width:100%; max-width:360px;
    margin-bottom:18px; box-shadow:0 6px 18px rgba(0,0,0,.3);
  }
  .inputs-row{ display:flex; gap:10px; align-items:flex-end; }
  .inputs-row label{ flex:1; display:flex; flex-direction:column; gap:4px; font-size:12px; color:#c9a8bf; }
  input[type=number]{
    background:#1c1220; border:1px solid #3a2540; color:#f5e9f3; border-radius:10px;
    padding:10px; font-size:18px; min-height:44px; width:100%; font-family:inherit; text-align:center;
  }
  input[type=number]:focus{ outline:1px solid #8a4b6b; }
  .controls{ display:flex; gap:10px; width:100%; max-width:360px; }
  .btn{
    flex:1; background:#8a4b6b; color:#2b0f1e; border:none; border-radius:14px; font-weight:700;
    font-size:15px; padding:14px 0; min-height:48px; cursor:pointer;
  }
  .btn:active{ filter:brightness(1.2); }
  .btn.secondary{ background:#3a2540; color:#f5e9f3; }
  .btn:disabled{ opacity:.35; cursor:default; }
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:#3a2540; color:#f5e9f3; padding:10px 18px; border-radius:10px;
    font-size:13px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;
    max-width:90%; text-align:center; box-shadow:0 6px 18px rgba(0,0,0,.35); z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <h1>⏳ カウントダウンタイマー</h1>

  <div class="display-wrap" id="displayWrap">
    <div class="time" id="timeDisplay">03:00</div>
  </div>

  <div class="presets">
    <button class="preset-btn" data-sec="60">1分</button>
    <button class="preset-btn" data-sec="180">3分</button>
    <button class="preset-btn" data-sec="300">5分</button>
    <button class="preset-btn" data-sec="600">10分</button>
  </div>

  <div class="inputs-card">
    <div class="inputs-row">
      <label>分
        <input type="number" id="minInput" min="0" max="180" value="3">
      </label>
      <label>秒
        <input type="number" id="secInput" min="0" max="59" value="0">
      </label>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="startPauseBtn">開始</button>
    <button class="btn secondary" id="resetBtn">リセット</button>
  </div>

  <div class="toast" id="toast"></div>

<script>
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2400);
  }
  function notify(msg, type){
    if (window.GUIOS && window.GUIOS.notify) {
      try { window.GUIOS.notify(msg, { type: type || 'info' }); return; } catch(e){}
    }
    showToast(msg);
  }
  function haptic(){
    if (window.GUIOS && window.GUIOS.haptic) {
      try { window.GUIOS.haptic(); } catch(e){}
    }
  }

  var minInput = document.getElementById('minInput');
  var secInput = document.getElementById('secInput');
  var timeDisplay = document.getElementById('timeDisplay');
  var displayWrap = document.getElementById('displayWrap');
  var startPauseBtn = document.getElementById('startPauseBtn');
  var resetBtn = document.getElementById('resetBtn');

  var totalSeconds = 180;   // configured duration
  var remaining = 180;      // seconds left
  var running = false;
  var tickTimer = null;
  var endTime = 0;          // Date.now() target when running

  function inputsToSeconds(){
    var m = parseInt(minInput.value, 10); if (isNaN(m) || m < 0) m = 0;
    var s = parseInt(secInput.value, 10); if (isNaN(s) || s < 0) s = 0;
    if (s > 59) s = 59;
    return m * 60 + s;
  }

  function render(){
    var m = Math.floor(remaining / 60);
    var s = remaining % 60;
    timeDisplay.textContent = (m<10?'0':'')+m + ':' + (s<10?'0':'')+s;
    startPauseBtn.textContent = running ? '一時停止' : '開始';
  }

  function setFromInputs(){
    if (running) return;
    totalSeconds = inputsToSeconds();
    remaining = totalSeconds;
    render();
  }
  minInput.addEventListener('change', setFromInputs);
  secInput.addEventListener('change', setFromInputs);

  document.querySelectorAll('.preset-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      if (running) return;
      var sec = parseInt(btn.dataset.sec, 10);
      minInput.value = Math.floor(sec/60);
      secInput.value = sec % 60;
      totalSeconds = sec;
      remaining = sec;
      render();
    });
  });

  function onFinish(){
    running = false;
    clearInterval(tickTimer);
    tickTimer = null;
    remaining = 0;
    render();
    displayWrap.classList.add('flash');
    setTimeout(function(){ displayWrap.classList.remove('flash'); }, 2100);
    notify('時間になりました！⏳', 'success');
    haptic();
    minInput.disabled = false;
    secInput.disabled = false;
  }

  function start(){
    if (running) return;
    if (remaining <= 0) {
      totalSeconds = inputsToSeconds();
      remaining = totalSeconds;
      if (remaining <= 0) { notify('時間を設定してください', 'error'); return; }
    }
    running = true;
    minInput.disabled = true;
    secInput.disabled = true;
    endTime = Date.now() + remaining * 1000;
    tickTimer = setInterval(function(){
      var left = Math.round((endTime - Date.now()) / 1000);
      if (left <= 0) {
        onFinish();
        return;
      }
      remaining = left;
      render();
    }, 200);
    render();
  }

  function pause(){
    if (!running) return;
    running = false;
    if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
    remaining = Math.max(0, Math.round((endTime - Date.now()) / 1000));
    render();
  }

  function reset(){
    running = false;
    if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
    minInput.disabled = false;
    secInput.disabled = false;
    displayWrap.classList.remove('flash');
    totalSeconds = inputsToSeconds();
    remaining = totalSeconds;
    render();
  }

  startPauseBtn.addEventListener('click', function(){
    if (running) pause(); else start();
  });
  resetBtn.addEventListener('click', reset);

  totalSeconds = inputsToSeconds();
  remaining = totalSeconds;
  render();

  window.addEventListener('beforeunload', function(){
    if (tickTimer) clearInterval(tickTimer);
  });

  if (window.GUIOS && window.GUIOS.setTitle) {
    try { window.GUIOS.setTitle('カウントダウンタイマー'); } catch(e){}
  }
</script>
</body>
</html>
