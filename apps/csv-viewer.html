<!--GUIOS-APP {"id":"csv-viewer","name":"CSV表示・編集","icon":"📊","color":"#2e7d32","version":"1.0.0","author":"Claude","description":"CSVファイルを表として表示・編集し、書き出しできるツール。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CSV表示・編集</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:#10140f; color:#e7ede6; min-height:100vh; padding:16px 12px 90px;
  }
  h1{ font-size:18px; margin:0 0 14px; color:#8fd39a; }
  .card{
    background:#161d15; border:1px solid #263123; border-radius:14px; padding:14px; margin-bottom:14px;
  }
  label{ display:block; font-size:12.5px; color:#9db69f; margin-bottom:6px; }
  input[type="file"]{
    width:100%; color:#e7ede6; font-size:13px; padding:8px 0;
  }
  textarea{
    width:100%; min-height:16vh; padding:12px; border-radius:12px; border:1px solid #2a3628;
    background:#0c100b; color:#e7ede6; font-size:14px; line-height:1.5; resize:vertical;
    font-family:ui-monospace,Menlo,Consolas,monospace;
  }
  .row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
  .btn{
    flex:1; min-width:120px; padding:12px 10px; border-radius:10px; border:2px solid #2e7d32;
    background:#1a2318; color:#dff0df; font-weight:700; font-size:13.5px; cursor:pointer; min-height:44px;
  }
  .btn.primary{ background:#2e7d32; border-color:#2e7d32; color:#eafcea; }
  .btn.danger{ border-color:#7d3a2e; color:#f0c9c0; }
  .btn.small{ flex:none; min-width:auto; padding:8px 12px; font-size:12px; min-height:38px; }
  .table-wrap{
    overflow-x:auto; border:1px solid #263123; border-radius:12px; background:#0c100b;
    -webkit-overflow-scrolling:touch;
  }
  table{ border-collapse:collapse; width:100%; min-width:max-content; }
  th, td{
    border:1px solid #263123; padding:0; min-width:96px;
  }
  th{
    background:#1c2519; position:relative;
  }
  th .th-inner{ display:flex; align-items:center; gap:4px; padding:6px 6px; }
  th input{
    flex:1; background:transparent; border:none; color:#bfe6c2; font-weight:700; font-size:12.5px;
    padding:6px 2px; min-width:40px;
  }
  td .cell{
    display:block; width:100%; min-height:40px; padding:9px 8px; font-size:13.5px; color:#e7ede6;
    outline:none; white-space:pre-wrap; word-break:break-word;
  }
  td .cell:focus{ background:#1a2318; }
  .rowhandle{ background:#161d15; text-align:center; padding:4px !important; min-width:34px; }
  .rowhandle button{
    background:none; border:none; color:#e08a76; font-size:16px; cursor:pointer; padding:6px; min-height:30px;
  }
  .colhandle button{
    background:none; border:none; color:#e08a76; font-size:13px; cursor:pointer; padding:2px 6px;
  }
  .hint{ font-size:12px; color:#7c9880; margin-top:8px; line-height:1.5; }
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:#232f21; color:#e7ede6; padding:10px 18px; border-radius:10px;
    font-size:13px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;
    max-width:90%; text-align:center; box-shadow:0 6px 18px rgba(0,0,0,.35); z-index:100;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <h1>📊 CSV表示・編集</h1>

  <div class="card">
    <label for="fileInput">CSVファイルを選択</label>
    <input type="file" id="fileInput" accept=".csv,text/csv">
    <label for="pasteArea" style="margin-top:12px;">またはCSVテキストを貼り付け</label>
    <textarea id="pasteArea" placeholder="name,age&#10;Taro,20&#10;Hanako,25"></textarea>
    <div class="row">
      <button class="btn primary" id="parseBtn">表として読み込む</button>
    </div>
  </div>

  <div class="card">
    <div class="row" style="margin-top:0;">
      <button class="btn" id="addRowBtn">＋ 行を追加</button>
      <button class="btn" id="addColBtn">＋ 列を追加</button>
      <button class="btn primary" id="downloadBtn">⬇ CSVとしてダウンロード</button>
    </div>
    <div class="hint">セルをタップして直接編集できます。列見出しの入力欄で列名を変更、各行左端の🗑で行削除、列見出しの🗑で列削除ができます。</div>
  </div>

  <div class="table-wrap" id="tableWrap"></div>

  <div class="toast" id="toast"></div>

<script>
  var APP_ID = 'csv-viewer';
  var hasSDK = !!(window.GUIOS && window.GUIOS.storage);
  var fileInput = document.getElementById('fileInput');
  var pasteArea = document.getElementById('pasteArea');
  var parseBtn = document.getElementById('parseBtn');
  var addRowBtn = document.getElementById('addRowBtn');
  var addColBtn = document.getElementById('addColBtn');
  var downloadBtn = document.getElementById('downloadBtn');
  var tableWrap = document.getElementById('tableWrap');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  var headers = ['列1', '列2'];
  var rows = [['', '']];

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }
  function notify(msg, type){
    if (window.GUIOS && window.GUIOS.notify) {
      try { window.GUIOS.notify(msg, { type: type || 'info' }); return; } catch(e){}
    }
    showToast(msg);
  }
  function copyText(text){
    if (window.GUIOS && window.GUIOS.clipboard && window.GUIOS.clipboard.writeText) {
      try { window.GUIOS.clipboard.writeText(text); return; } catch(e){}
    }
    try { navigator.clipboard.writeText(text); } catch(e){}
  }

  // --- CSV parsing (state machine, handles quoted fields with commas/newlines/escaped "") ---
  function parseCSV(text){
    var result = [];
    var row = [];
    var field = '';
    var inQuotes = false;
    var i = 0;
    var len = text.length;
    // normalize CRLF -> LF for simpler handling, but keep inside-quote newlines intact
    while (i < len) {
      var ch = text[i];
      if (inQuotes) {
        if (ch === '"') {
          if (text[i+1] === '"') { field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        } else {
          field += ch; i++; continue;
        }
      } else {
        if (ch === '"') { inQuotes = true; i++; continue; }
        if (ch === ',') { row.push(field); field = ''; i++; continue; }
        if (ch === '\r') { i++; continue; }
        if (ch === '\n') { row.push(field); field = ''; result.push(row); row = []; i++; continue; }
        field += ch; i++; continue;
      }
    }
    row.push(field);
    result.push(row);
    // drop a single trailing empty row (from trailing newline)
    if (result.length > 1) {
      var last = result[result.length - 1];
      if (last.length === 1 && last[0] === '') result.pop();
    }
    return result;
  }

  function loadFromText(text){
    if (!text || !text.trim()) {
      notify('CSVテキストが空です', 'error');
      return;
    }
    var parsed = parseCSV(text);
    if (parsed.length === 0) {
      notify('読み込めるデータがありません', 'error');
      return;
    }
    headers = parsed[0].slice();
    rows = parsed.slice(1).map(function(r){
      var copy = r.slice();
      while (copy.length < headers.length) copy.push('');
      if (copy.length > headers.length) copy = copy.slice(0, headers.length);
      return copy;
    });
    if (headers.length === 0) headers = ['列1'];
    render();
    save();
    notify('読み込みました', 'success');
  }

  function csvEscape(val){
    val = val == null ? '' : String(val);
    if (/[",\n\r]/.test(val)) {
      return '"' + val.replace(/"/g, '""') + '"';
    }
    return val;
  }

  function toCSV(){
    var lines = [];
    lines.push(headers.map(csvEscape).join(','));
    rows.forEach(function(r){
      lines.push(r.map(csvEscape).join(','));
    });
    return lines.join('\r\n');
  }

  function render(){
    var table = document.createElement('table');
    var thead = document.createElement('thead');
    var htr = document.createElement('tr');

    var handleTh = document.createElement('th');
    handleTh.className = 'rowhandle';
    handleTh.textContent = '#';
    htr.appendChild(handleTh);

    headers.forEach(function(h, ci){
      var th = document.createElement('th');
      var inner = document.createElement('div');
      inner.className = 'th-inner colhandle';
      var inp = document.createElement('input');
      inp.value = h;
      inp.addEventListener('input', function(){
        headers[ci] = inp.value;
        save();
      });
      var del = document.createElement('button');
      del.textContent = '🗑';
      del.title = '列を削除';
      del.addEventListener('click', function(){
        if (headers.length <= 1) { notify('これ以上列を削除できません', 'error'); return; }
        headers.splice(ci, 1);
        rows.forEach(function(r){ r.splice(ci, 1); });
        render(); save();
      });
      inner.appendChild(inp);
      inner.appendChild(del);
      th.appendChild(inner);
      htr.appendChild(th);
    });
    thead.appendChild(htr);
    table.appendChild(thead);

    var tbody = document.createElement('tbody');
    rows.forEach(function(r, ri){
      var tr = document.createElement('tr');
      var handleTd = document.createElement('td');
      handleTd.className = 'rowhandle';
      var delRow = document.createElement('button');
      delRow.textContent = '🗑';
      delRow.title = '行を削除';
      delRow.addEventListener('click', function(){
        rows.splice(ri, 1);
        render(); save();
      });
      handleTd.appendChild(delRow);
      tr.appendChild(handleTd);

      headers.forEach(function(h, ci){
        var td = document.createElement('td');
        var cell = document.createElement('div');
        cell.className = 'cell';
        cell.contentEditable = 'true';
        cell.textContent = r[ci] != null ? r[ci] : '';
        cell.addEventListener('input', function(){
          rows[ri][ci] = cell.textContent;
        });
        cell.addEventListener('blur', function(){ save(); });
        td.appendChild(cell);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    tableWrap.innerHTML = '';
    tableWrap.appendChild(table);
  }

  function addRow(){
    rows.push(headers.map(function(){ return ''; }));
    render(); save();
  }
  function addCol(){
    headers.push('列' + (headers.length + 1));
    rows.forEach(function(r){ r.push(''); });
    render(); save();
  }

  function downloadCSV(){
    var csv = toCSV();
    var blob = new Blob(["﻿" + csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'data.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
    notify('ダウンロードしました', 'success');
  }

  function save(){
    var data = { headers: headers, rows: rows };
    if (hasSDK) {
      try { GUIOS.storage.set('table', data); } catch(e){}
    } else {
      try { localStorage.setItem(APP_ID + ':table', JSON.stringify(data)); } catch(e){}
    }
  }

  function loadSaved(){
    if (hasSDK) {
      GUIOS.storage.get('table').then(function(data){
        if (data && data.headers && data.rows) {
          headers = data.headers; rows = data.rows;
        }
        render();
      }).catch(function(){ render(); });
    } else {
      try {
        var raw = localStorage.getItem(APP_ID + ':table');
        if (raw) {
          var data = JSON.parse(raw);
          if (data && data.headers && data.rows) { headers = data.headers; rows = data.rows; }
        }
      } catch(e){}
      render();
    }
  }

  fileInput.addEventListener('change', function(){
    var file = fileInput.files && fileInput.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      pasteArea.value = String(reader.result);
      loadFromText(String(reader.result));
    };
    reader.onerror = function(){ notify('ファイルの読み込みに失敗しました', 'error'); };
    reader.readAsText(file);
  });

  parseBtn.addEventListener('click', function(){ loadFromText(pasteArea.value); });
  addRowBtn.addEventListener('click', addRow);
  addColBtn.addEventListener('click', addCol);
  downloadBtn.addEventListener('click', downloadCSV);

  loadSaved();
</script>
</body>
</html>
