<!--GUIOS-APP {"id":"five-line-journal","name":"5行日記","icon":"✏️","color":"#795548","version":"1.0.0","author":"Claude","description":"1日の出来事を5行だけで簡潔に振り返る日記アプリ。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>5行日記</title>
<style>
  :root{
    --accent:#a1887f;
    --accent-text:#2b1a14;
    --bg:#1a1512;
    --card:#241d19;
    --card2:#2b2320;
    --text:#f2e9e3;
    --sub:#c2ac9f;
    --line:#3d322c;
    --input:#150f0c;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--text);
    padding:16px; padding-bottom:56px;
  }
  h1{font-size:20px; margin:4px 0 4px; display:flex; align-items:center; gap:8px;}
  .sub-tag{font-size:12px; color:var(--sub); margin:0 0 14px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:16px; margin-bottom:16px;
  }
  .date-row{display:flex; align-items:center; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .date-row input[type=date]{
    flex:1; min-width:140px; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--input); color:var(--text); font-size:15px; outline:none;
  }
  .today-btn{
    flex:none; padding:11px 14px; border-radius:10px; border:1px solid var(--line);
    background:transparent; color:var(--sub); font-weight:600; font-size:13px; cursor:pointer; min-height:44px;
  }
  .field{margin-bottom:12px;}
  label{display:block; font-size:12px; color:var(--sub); margin-bottom:6px; font-weight:600;}
  textarea{
    width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--input); color:var(--text); font-size:15px; outline:none; font-family:inherit;
    resize:vertical; min-height:44px; line-height:1.5;
  }
  textarea:focus{border-color:var(--accent);}
  button{
    padding:12px 22px; border-radius:10px; border:none; background:var(--accent);
    color:var(--accent-text); font-weight:700; font-size:15px; cursor:pointer; min-height:44px;
  }
  button.block{width:100%;}
  .section-title{
    font-size:14px; color:var(--sub); margin:18px 0 10px; font-weight:700;
  }
  .entry-card{
    background:var(--card2); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; margin-bottom:10px; cursor:pointer;
  }
  .entry-card:active{border-color:var(--accent);}
  .entry-date{font-size:13px; font-weight:700; color:var(--text); margin-bottom:8px;}
  .entry-line{font-size:13px; color:var(--sub); margin-bottom:3px; line-height:1.5;}
  .entry-line b{color:var(--text); font-weight:600;}
  .empty{color:var(--sub); text-align:center; padding:40px 20px; font-size:14px;}
  .saved-flag{font-size:12px; color:#8fbf8f; margin-top:10px; min-height:16px;}
</style>
</head>
<body>
  <h1>✏️ 5行日記</h1>
  <p class="sub-tag">今日を5行だけで振り返りましょう</p>

  <div class="card">
    <div class="date-row">
      <input type="date" id="dateInput">
      <button type="button" class="today-btn" id="todayBtn">今日</button>
    </div>

    <div class="field">
      <label>1. 今日の出来事</label>
      <textarea id="line1" placeholder="今日あったことを一言で"></textarea>
    </div>
    <div class="field">
      <label>2. 良かったこと</label>
      <textarea id="line2" placeholder="小さなことでもOK"></textarea>
    </div>
    <div class="field">
      <label>3. 学んだこと</label>
      <textarea id="line3" placeholder="気づき・発見など"></textarea>
    </div>
    <div class="field">
      <label>4. 明日やること</label>
      <textarea id="line4" placeholder="明日の予定・目標"></textarea>
    </div>
    <div class="field">
      <label>5. 一言</label>
      <textarea id="line5" placeholder="今の気持ちをひとこと"></textarea>
    </div>

    <button type="button" class="block" id="saveBtn">保存する</button>
    <div class="saved-flag" id="savedFlag"></div>
  </div>

  <div class="section-title">これまでの日記</div>
  <div id="listWrap">
    <div class="empty">まだ日記がありません</div>
  </div>

  <div id="toast" style="position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:var(--card2); color:var(--text); padding:10px 18px; border-radius:10px;
    font-size:13px; opacity:0; pointer-events:none; transition:all .25s; border:1px solid var(--line);
    max-width:90%; text-align:center; z-index:999;"></div>

<script>
  var hasSDK = !!(window.GUIOS && window.GUIOS.storage);
  var STORAGE_KEY = 'entries';
  var FALLBACK_KEY = 'guios-fallback-five-line-journal-entries';

  var entries = {}; // date string -> {l1..l5, updatedAt}
  var LABELS = ['今日の出来事','良かったこと','学んだこと','明日やること','一言'];

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.style.opacity = '1';
    t.style.transform = 'translateX(-50%) translateY(0)';
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){
      t.style.opacity = '0';
      t.style.transform = 'translateX(-50%) translateY(20px)';
    }, 1800);
  }
  function notify(msg, type){
    if(window.GUIOS && window.GUIOS.notify){
      GUIOS.notify(msg, {type: type || 'info'});
    } else {
      showToast(msg);
    }
  }

  function pad2(n){ return ('0'+n).slice(-2); }
  function localDateStr(d){
    return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
  }
  function todayStr(){ return localDateStr(new Date()); }
  function formatDisplayDate(key){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(key || '');
    if(!m) return key || '';
    var d = new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
    var wd = ['日','月','火','水','木','金','土'][d.getDay()];
    return m[1]+'/'+m[2]+'/'+m[3]+' ('+wd+')';
  }

  async function loadEntries(){
    if(hasSDK){
      var v = await GUIOS.storage.get(STORAGE_KEY);
      return (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
    } else {
      try{
        var raw = localStorage.getItem(FALLBACK_KEY);
        return raw ? JSON.parse(raw) : {};
      }catch(e){ return {}; }
    }
  }
  async function saveEntriesData(obj){
    if(hasSDK){
      await GUIOS.storage.set(STORAGE_KEY, obj);
    } else {
      try{ localStorage.setItem(FALLBACK_KEY, JSON.stringify(obj)); }catch(e){}
    }
  }

  function loadFormFor(key){
    var e = entries[key] || {l1:'',l2:'',l3:'',l4:'',l5:''};
    document.getElementById('line1').value = e.l1 || '';
    document.getElementById('line2').value = e.l2 || '';
    document.getElementById('line3').value = e.l3 || '';
    document.getElementById('line4').value = e.l4 || '';
    document.getElementById('line5').value = e.l5 || '';
    document.getElementById('savedFlag').textContent = '';
  }

  function currentDateKey(){
    return document.getElementById('dateInput').value || todayStr();
  }

  async function saveCurrent(){
    var key = currentDateKey();
    var l1 = document.getElementById('line1').value.trim();
    var l2 = document.getElementById('line2').value.trim();
    var l3 = document.getElementById('line3').value.trim();
    var l4 = document.getElementById('line4').value.trim();
    var l5 = document.getElementById('line5').value.trim();

    if(!l1 && !l2 && !l3 && !l4 && !l5){
      notify('少なくとも1行は入力してください', 'error');
      return;
    }

    entries[key] = {l1:l1, l2:l2, l3:l3, l4:l4, l5:l5, updatedAt: Date.now()};
    await saveEntriesData(entries);
    renderList();
    notify('保存しました', 'success');
    var flag = document.getElementById('savedFlag');
    flag.textContent = '✓ ' + formatDisplayDate(key) + ' の日記を保存しました';
  }

  function sortedKeys(){
    return Object.keys(entries).sort(function(a,b){ return b.localeCompare(a); });
  }

  function renderList(){
    var wrap = document.getElementById('listWrap');
    var keys = sortedKeys();
    if(keys.length === 0){
      wrap.innerHTML = '<div class="empty">まだ日記がありません</div>';
      return;
    }
    wrap.innerHTML = '';
    keys.forEach(function(key){
      var e = entries[key];
      var card = document.createElement('div');
      card.className = 'entry-card';
      card.addEventListener('click', function(){
        document.getElementById('dateInput').value = key;
        loadFormFor(key);
        window.scrollTo(0,0);
      });

      var dateEl = document.createElement('div');
      dateEl.className = 'entry-date';
      dateEl.textContent = formatDisplayDate(key);
      card.appendChild(dateEl);

      var vals = [e.l1, e.l2, e.l3, e.l4, e.l5];
      vals.forEach(function(v, i){
        if(!v) return;
        var lineEl = document.createElement('div');
        lineEl.className = 'entry-line';
        var b = document.createElement('b');
        b.textContent = LABELS[i] + ': ';
        lineEl.appendChild(b);
        lineEl.appendChild(document.createTextNode(v));
        card.appendChild(lineEl);
      });

      wrap.appendChild(card);
    });
  }

  document.getElementById('saveBtn').addEventListener('click', saveCurrent);
  document.getElementById('todayBtn').addEventListener('click', function(){
    document.getElementById('dateInput').value = todayStr();
    loadFormFor(todayStr());
  });
  document.getElementById('dateInput').addEventListener('change', function(){
    loadFormFor(currentDateKey());
  });

  async function init(){
    document.getElementById('dateInput').value = todayStr();
    entries = await loadEntries();
    loadFormFor(todayStr());
    renderList();
  }
  init();
</script>
</body>
</html>
