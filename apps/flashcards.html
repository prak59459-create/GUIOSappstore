<!--GUIOS-APP {"id":"flashcards","name":"暗記カード","icon":"🗂","color":"#7a5cc0","version":"1.0.0","author":"Claude","description":"表と裏のあるカードを作って暗記学習できるフラッシュカードアプリ。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>暗記カード</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:#180f26; color:#f0eaf9; min-height:100vh; padding:14px; padding-bottom:40px;
  }
  h1{ font-size:18px; margin:0 0 14px; text-align:center; }
  .card{
    background:#241a38; border-radius:16px; padding:16px; margin-bottom:14px;
    box-shadow:0 6px 18px rgba(0,0,0,.3);
  }
  .row{ display:flex; gap:8px; }
  .row > input{ flex:1; }
  input, textarea{
    background:#150c22; border:1px solid #3a2b56; color:#f0eaf9; border-radius:10px;
    padding:10px; font-size:15px; min-height:44px; width:100%; font-family:inherit;
  }
  textarea{ min-height:70px; resize:vertical; }
  input:focus, textarea:focus{ outline:1px solid #7a5cc0; }
  .btn{
    background:#7a5cc0; color:#faf7ff; border:none; border-radius:12px; font-weight:700;
    font-size:15px; padding:12px 16px; min-height:46px; cursor:pointer;
  }
  .btn:active{ filter:brightness(1.15); }
  .btn.secondary{ background:#3a2b56; color:#e2d9f5; }
  .btn.ghost{ background:none; border:1px solid #7a5cc0; color:#c8b6ea; }
  .btn.danger{ background:none; color:#e08a8a; border:1px solid #5c3535; }
  .btn:disabled{ opacity:.4; cursor:default; }
  .set-list{ display:flex; flex-direction:column; gap:10px; }
  .set-item{
    display:flex; align-items:center; gap:10px; background:#150c22; border-radius:12px;
    padding:12px;
  }
  .set-item .info{ flex:1; min-width:0; }
  .set-item .name{ font-size:16px; font-weight:700; }
  .set-item .count{ font-size:12px; color:#a892d6; }
  .set-item .actions{ display:flex; gap:6px; flex-wrap:wrap; }
  .icon-btn{
    background:#3a2b56; color:#f0eaf9; border:none; border-radius:10px;
    min-width:40px; min-height:40px; font-size:16px; cursor:pointer;
  }
  .icon-btn:active{ filter:brightness(1.3); }
  .empty{ text-align:center; color:#8a78b0; font-size:13px; padding:20px 0; }
  .hidden{ display:none !important; }
  .topbar{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .topbar .back-btn{
    background:none; border:none; color:#c8b6ea; font-size:20px; min-width:40px; min-height:40px; cursor:pointer;
  }
  .topbar .title{ font-size:16px; font-weight:700; flex:1; }
  .card-list{ display:flex; flex-direction:column; gap:8px; }
  .card-row{
    display:flex; align-items:flex-start; gap:8px; background:#150c22; border-radius:10px; padding:10px;
  }
  .card-row .cf{ flex:1; min-width:0; font-size:13px; }
  .card-row .cf .lbl{ color:#8a78b0; font-size:11px; }
  .card-row .cf .txt{ word-break:break-word; }
  .study-area{ display:flex; flex-direction:column; align-items:center; gap:18px; padding:10px 0; }
  .progress-label{ font-size:13px; color:#a892d6; }
  .flip-card{
    width:100%; max-width:340px; height:220px; perspective:1200px; cursor:pointer;
  }
  .flip-inner{
    position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d;
  }
  .flip-card.flipped .flip-inner{ transform:rotateY(180deg); }
  .face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:18px;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:20px;
    font-size:22px; font-weight:600; line-height:1.4; box-shadow:0 8px 24px rgba(0,0,0,.35);
    overflow-y:auto;
  }
  .face.front{ background:#7a5cc0; color:#fbf9ff; }
  .face.back{ background:#3a2b56; color:#f0eaf9; transform:rotateY(180deg); }
  .hint{ font-size:12px; color:#8a78b0; }
  .study-actions{ display:flex; gap:10px; width:100%; max-width:340px; }
  .study-actions .btn{ flex:1; }
  .study-top{ display:flex; justify-content:space-between; align-items:center; width:100%; max-width:340px; }
  .complete{ text-align:center; padding:30px 0; }
  .complete .emoji{ font-size:48px; margin-bottom:12px; }
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:#3a2b56; color:#f0eaf9; padding:10px 18px; border-radius:10px;
    font-size:13px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;
    max-width:90%; text-align:center; box-shadow:0 6px 18px rgba(0,0,0,.35); z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  label.chk{ display:flex; align-items:center; gap:8px; font-size:14px; color:#e2d9f5; }
  label.chk input{ width:20px; height:20px; min-height:20px; }
</style>
</head>
<body>
  <h1>🗂 暗記カード</h1>

  <!-- SETS SCREEN -->
  <div id="screenSets">
    <div class="card">
      <div class="row">
        <input type="text" id="newSetName" placeholder="新しいカードセット名" maxlength="40">
        <button class="btn" id="addSetBtn">＋作成</button>
      </div>
    </div>
    <div class="card">
      <div class="set-list" id="setList"></div>
    </div>
  </div>

  <!-- EDIT SCREEN -->
  <div id="screenEdit" class="hidden">
    <div class="topbar">
      <button class="back-btn" id="editBackBtn">←</button>
      <div class="title" id="editSetName">セット名</div>
    </div>
    <div class="card">
      <div class="row" style="flex-direction:column;">
        <textarea id="newFront" placeholder="表面（問題）" maxlength="200"></textarea>
        <textarea id="newBack" placeholder="裏面（答え）" maxlength="200" style="margin-top:8px;"></textarea>
        <button class="btn" id="addCardBtn" style="margin-top:8px;">＋カードを追加</button>
      </div>
    </div>
    <div class="card">
      <button class="btn" id="startStudyBtn" style="width:100%;">▶ 学習を開始する</button>
      <label class="chk" style="margin-top:10px;"><input type="checkbox" id="shuffleChk"> シャッフルする</label>
    </div>
    <div class="card">
      <div class="card-list" id="cardList"></div>
    </div>
  </div>

  <!-- STUDY SCREEN -->
  <div id="screenStudy" class="hidden">
    <div class="topbar">
      <button class="back-btn" id="studyBackBtn">←</button>
      <div class="title" id="studySetName">学習中</div>
    </div>
    <div class="study-area" id="studyBody"></div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  var APP_ID = 'flashcards';
  var FALLBACK_KEY = 'guios-fallback-' + APP_ID + '-data';
  var hasSDK = !!(window.GUIOS && window.GUIOS.storage);

  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }
  function notify(msg, type){
    if (window.GUIOS && window.GUIOS.notify) {
      try { window.GUIOS.notify(msg, { type: type || 'info' }); return; } catch(e){}
    }
    showToast(msg);
  }
  function haptic(){
    if (window.GUIOS && window.GUIOS.haptic) {
      try { window.GUIOS.haptic(); } catch(e){}
    }
  }

  async function loadSets(){
    if (hasSDK) {
      try {
        var v = await window.GUIOS.storage.get('sets');
        return Array.isArray(v) ? v : [];
      } catch(e){ return []; }
    } else {
      try {
        var raw = localStorage.getItem(FALLBACK_KEY);
        var arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
      } catch(e){ return []; }
    }
  }
  async function saveSets(arr){
    if (hasSDK) {
      try { await window.GUIOS.storage.set('sets', arr); } catch(e){}
    } else {
      try { localStorage.setItem(FALLBACK_KEY, JSON.stringify(arr)); } catch(e){}
    }
  }

  function uid(){ return Date.now() + '-' + Math.random().toString(36).slice(2,8); }

  var sets = [];
  var currentSetId = null;

  // study state
  var studyQueue = [];
  var studyTotal = 0;
  var studyKnown = 0;
  var studyFlipped = false;
  var studyFinished = false;

  function showScreen(name){
    document.getElementById('screenSets').classList.toggle('hidden', name !== 'sets');
    document.getElementById('screenEdit').classList.toggle('hidden', name !== 'edit');
    document.getElementById('screenStudy').classList.toggle('hidden', name !== 'study');
  }

  function findSet(id){
    for (var i=0;i<sets.length;i++) if (sets[i].id === id) return sets[i];
    return null;
  }

  function renderSetList(){
    var el = document.getElementById('setList');
    el.innerHTML = '';
    if (sets.length === 0) {
      el.innerHTML = '<div class="empty">カードセットがありません。上のフォームから作成してください</div>';
      return;
    }
    sets.forEach(function(s){
      var row = document.createElement('div');
      row.className = 'set-item';
      row.innerHTML =
        '<div class="info"><div class="name">' + escapeHtml(s.name) + '</div>' +
        '<div class="count">' + s.cards.length + '枚のカード</div></div>' +
        '<div class="actions">' +
        '<button class="icon-btn" data-act="open" data-id="' + s.id + '">📝</button>' +
        '<button class="icon-btn" data-act="del" data-id="' + s.id + '">🗑</button>' +
        '</div>';
      el.appendChild(row);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  document.getElementById('setList').addEventListener('click', async function(e){
    var btn = e.target.closest('button');
    if (!btn) return;
    var id = btn.dataset.id;
    if (btn.dataset.act === 'open') {
      currentSetId = id;
      openEditScreen();
    } else if (btn.dataset.act === 'del') {
      sets = sets.filter(function(s){ return s.id !== id; });
      await saveSets(sets);
      renderSetList();
      notify('セットを削除しました', 'success');
    }
  });

  document.getElementById('addSetBtn').addEventListener('click', async function(){
    var input = document.getElementById('newSetName');
    var name = input.value.trim();
    if (!name) { notify('セット名を入力してください', 'error'); return; }
    var s = { id: uid(), name: name, cards: [] };
    sets.push(s);
    await saveSets(sets);
    input.value = '';
    renderSetList();
    notify('セットを作成しました', 'success');
  });

  function openEditScreen(){
    var s = findSet(currentSetId);
    if (!s) { showScreen('sets'); return; }
    document.getElementById('editSetName').textContent = s.name;
    renderCardList();
    showScreen('edit');
  }

  function renderCardList(){
    var s = findSet(currentSetId);
    var el = document.getElementById('cardList');
    el.innerHTML = '';
    if (!s || s.cards.length === 0) {
      el.innerHTML = '<div class="empty">カードがまだありません</div>';
      return;
    }
    s.cards.forEach(function(c){
      var row = document.createElement('div');
      row.className = 'card-row';
      row.innerHTML =
        '<div class="cf"><div class="lbl">表</div><div class="txt">' + escapeHtml(c.front) + '</div>' +
        '<div class="lbl" style="margin-top:6px;">裏</div><div class="txt">' + escapeHtml(c.back) + '</div></div>' +
        '<button class="icon-btn" data-id="' + c.id + '">🗑</button>';
      el.appendChild(row);
    });
  }

  document.getElementById('cardList').addEventListener('click', async function(e){
    var btn = e.target.closest('button');
    if (!btn) return;
    var s = findSet(currentSetId);
    if (!s) return;
    s.cards = s.cards.filter(function(c){ return c.id !== btn.dataset.id; });
    await saveSets(sets);
    renderCardList();
  });

  document.getElementById('addCardBtn').addEventListener('click', async function(){
    var s = findSet(currentSetId);
    if (!s) return;
    var front = document.getElementById('newFront').value.trim();
    var back = document.getElementById('newBack').value.trim();
    if (!front || !back) { notify('表と裏の両方を入力してください', 'error'); return; }
    s.cards.push({ id: uid(), front: front, back: back });
    await saveSets(sets);
    document.getElementById('newFront').value = '';
    document.getElementById('newBack').value = '';
    renderCardList();
    notify('カードを追加しました', 'success');
  });

  document.getElementById('editBackBtn').addEventListener('click', function(){
    showScreen('sets');
    renderSetList();
  });

  function shuffleArr(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i+1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  document.getElementById('startStudyBtn').addEventListener('click', function(){
    var s = findSet(currentSetId);
    if (!s || s.cards.length === 0) { notify('カードを追加してから学習を始めてください', 'error'); return; }
    var shuffle = document.getElementById('shuffleChk').checked;
    studyQueue = shuffle ? shuffleArr(s.cards) : s.cards.slice();
    studyTotal = studyQueue.length;
    studyKnown = 0;
    studyFlipped = false;
    studyFinished = false;
    document.getElementById('studySetName').textContent = s.name;
    showScreen('study');
    renderStudy();
  });

  document.getElementById('studyBackBtn').addEventListener('click', function(){
    showScreen('edit');
  });

  function renderStudy(){
    var body = document.getElementById('studyBody');
    if (studyFinished || studyQueue.length === 0) {
      body.innerHTML =
        '<div class="complete"><div class="emoji">🎉</div>' +
        '<div style="font-size:18px; font-weight:700; margin-bottom:16px;">完了しました！</div>' +
        '<button class="btn" id="restartBtn">🔁 もう一度</button></div>';
      document.getElementById('restartBtn').addEventListener('click', function(){
        document.getElementById('startStudyBtn').click();
      });
      return;
    }
    var card = studyQueue[0];
    body.innerHTML =
      '<div class="study-top"><span class="progress-label">' + studyKnown + '/' + studyTotal + '</span>' +
      '<span class="progress-label">残り ' + studyQueue.length + '枚</span></div>' +
      '<div class="flip-card' + (studyFlipped ? ' flipped' : '') + '" id="flipCard">' +
      '<div class="flip-inner">' +
      '<div class="face front">' + escapeHtml(card.front) + '</div>' +
      '<div class="face back">' + escapeHtml(card.back) + '</div>' +
      '</div></div>' +
      '<div class="hint">' + (studyFlipped ? 'カードをタップして表に戻す' : 'タップして裏面を見る') + '</div>' +
      '<div class="study-actions">' +
      '<button class="btn secondary" id="dontKnowBtn" ' + (studyFlipped ? '' : 'disabled') + '>もう一度</button>' +
      '<button class="btn" id="knowBtn" ' + (studyFlipped ? '' : 'disabled') + '>わかった</button>' +
      '</div>';

    document.getElementById('flipCard').addEventListener('click', function(){
      studyFlipped = !studyFlipped;
      renderStudy();
    });
    document.getElementById('knowBtn').addEventListener('click', function(){
      if (!studyFlipped) return;
      studyQueue.shift();
      studyKnown++;
      studyFlipped = false;
      if (studyQueue.length === 0) studyFinished = true;
      renderStudy();
    });
    document.getElementById('dontKnowBtn').addEventListener('click', function(){
      if (!studyFlipped) return;
      var c = studyQueue.shift();
      studyQueue.push(c);
      studyFlipped = false;
      renderStudy();
    });
  }

  (async function init(){
    sets = await loadSets();
    renderSetList();
    showScreen('sets');
    if (window.GUIOS && window.GUIOS.setTitle) {
      try { window.GUIOS.setTitle('暗記カード'); } catch(e){}
    }
  })();
</script>
</body>
</html>
