<!--GUIOS-APP {"id":"game-2048","name":"2048","icon":"🔢","color":"#ff8f00","version":"1.0.0","author":"Claude","description":"同じ数字のタイルを合体させて2048を目指すスライドパズルゲーム。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>2048</title>
<style>
  :root{
    --accent:#ff8f00;
    --bg:#1c1611;
    --card:#28201a;
    --card2:#211a15;
    --text:#faf1e6;
    --sub:#bfa88f;
    --line:rgba(255,255,255,0.08);
    --board-bg:#3a2f26;
    --cell-bg:rgba(255,255,255,0.06);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; padding:14px; padding-bottom:30px;
    overflow-x:hidden;
  }
  .wrap{ max-width:460px; margin:0 auto; display:flex; flex-direction:column; gap:12px; }
  h1{ font-size:19px; margin:2px 0 0; display:flex; align-items:center; gap:8px; }

  .score-row{ display:flex; gap:10px; }
  .score-card{
    flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px;
    text-align:center;
  }
  .score-card .lbl{ font-size:11px; color:var(--sub); }
  .score-card .val{ font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }

  .board-outer{
    width:100%; aspect-ratio:1/1; background:var(--board-bg); border-radius:14px; padding:2vmin;
    position:relative; touch-action:none;
  }
  .board-grid{
    position:absolute; inset:2vmin; display:grid; grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(4,1fr); gap:2vmin;
  }
  .bg-cell{ background:var(--cell-bg); border-radius:8px; }
  .tiles-layer{ position:absolute; inset:2vmin; }
  .tile{
    position:absolute; display:flex; align-items:center; justify-content:center;
    border-radius:8px; font-weight:700; transition:left .1s ease, top .1s ease, transform .1s ease;
    font-size:6vmin;
  }
  .tile.new-tile{ animation:pop .15s ease; }
  .tile.merged{ animation:merge .15s ease; }
  @keyframes pop{ from{ transform:scale(0.3); } to{ transform:scale(1); } }
  @keyframes merge{ 0%{ transform:scale(1); } 50%{ transform:scale(1.15); } 100%{ transform:scale(1); } }

  .btn-row{ display:flex; gap:10px; }
  .btn{
    flex:1; padding:14px; border-radius:12px; border:1px solid var(--line); font-size:14px; font-weight:700;
    cursor:pointer; min-height:48px; background:var(--card2); color:var(--text);
  }
  .btn.primary{ background:var(--accent); color:#2a1500; border-color:var(--accent); }
  .btn:active{ filter:brightness(1.15); }

  .hint{ text-align:center; font-size:12px; color:var(--sub); }

  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.75); display:flex; align-items:center;
    justify-content:center; z-index:40; padding:20px;
  }
  .overlay[hidden]{ display:none; }
  .modal{
    background:var(--card); border-radius:18px; padding:26px 22px; text-align:center; max-width:320px; width:100%;
  }
  .modal h2{ font-size:22px; margin:0 0 10px; }
  .modal p{ font-size:14px; color:var(--sub); margin:4px 0; }
  .modal button{
    width:100%; margin-top:16px; padding:14px; border-radius:12px; border:none; background:var(--accent);
    color:#2a1500; font-size:15px; font-weight:700; cursor:pointer; min-height:48px;
  }

  .toast-2048{
    position:fixed; top:16px; left:50%; transform:translateX(-50%); background:var(--accent); color:#2a1500;
    padding:10px 20px; border-radius:12px; font-size:14px; font-weight:700; z-index:60;
    box-shadow:0 6px 18px rgba(0,0,0,.4);
  }
  .toast-2048[hidden]{ display:none; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>🔢 2048</h1>

    <div class="score-row">
      <div class="score-card"><div class="lbl">スコア</div><div class="val" id="scoreVal">0</div></div>
      <div class="score-card"><div class="lbl">ベスト</div><div class="val" id="bestVal">0</div></div>
    </div>

    <div class="board-outer" id="boardOuter">
      <div class="board-grid" id="bgGrid"></div>
      <div class="tiles-layer" id="tilesLayer"></div>
    </div>

    <div class="hint">矢印キーまたはスワイプで操作します</div>

    <div class="btn-row">
      <button class="btn primary" id="restartBtn">もう一度</button>
    </div>
  </div>

  <div class="toast-2048" id="toast2048" hidden>2048達成！</div>

  <div class="overlay" id="overOverlay" hidden>
    <div class="modal">
      <h2>ゲームオーバー</h2>
      <p id="overScore">スコア: 0</p>
      <p id="overBest">ベスト: 0</p>
      <button id="retryBtn">もう一度</button>
    </div>
  </div>

<script>
  var hasSDK = !!(window.GUIOS && window.GUIOS.storage);
  var APP_ID = 'game-2048';
  var FALLBACK_KEY = 'guios-fallback-' + APP_ID + '-best';

  function notify(msg, type){
    if (window.GUIOS && window.GUIOS.notify) {
      try { window.GUIOS.notify(msg, { type: type || 'info' }); return; } catch(e){}
    }
    var t = document.createElement('div');
    t.textContent = msg;
    t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#28201a;color:#faf1e6;padding:10px 18px;border-radius:10px;font-size:13px;z-index:200;box-shadow:0 6px 18px rgba(0,0,0,.4);';
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 2500);
  }
  function haptic(){
    if (window.GUIOS && window.GUIOS.haptic) {
      try { window.GUIOS.haptic(); } catch(e){}
    }
  }

  async function loadBest(){
    if (hasSDK) {
      try {
        var v = await window.GUIOS.storage.get('best');
        return (typeof v === 'number' && !isNaN(v)) ? v : 0;
      } catch(e){ return 0; }
    } else {
      try {
        var raw = localStorage.getItem(FALLBACK_KEY);
        var n = raw ? parseInt(raw,10) : 0;
        return isNaN(n) ? 0 : n;
      } catch(e){ return 0; }
    }
  }
  async function saveBest(v){
    if (hasSDK) {
      try { await window.GUIOS.storage.set('best', v); } catch(e){}
    } else {
      try { localStorage.setItem(FALLBACK_KEY, String(v)); } catch(e){}
    }
  }

  var SIZE = 4;
  var TILE_COLORS = {
    2:{bg:'#3a3128',fg:'#faf1e6'}, 4:{bg:'#4a3d2e',fg:'#faf1e6'},
    8:{bg:'#c97b3c',fg:'#fff'}, 16:{bg:'#d8672f',fg:'#fff'},
    32:{bg:'#e15328',fg:'#fff'}, 64:{bg:'#ef4522',fg:'#fff'},
    128:{bg:'#e8c34a',fg:'#3a2b00'}, 256:{bg:'#eecb3f',fg:'#3a2b00'},
    512:{bg:'#f3d233',fg:'#3a2b00'}, 1024:{bg:'#f6d926',fg:'#2a1e00'},
    2048:{bg:'#ffd700',fg:'#2a1e00'}
  };
  function tileColor(v){
    return TILE_COLORS[v] || { bg:'#5d3fd3', fg:'#fff' };
  }

  var grid; // grid[r][c] = {value, id} or null
  var score = 0, best = 0;
  var gameOver = false;
  var reached2048 = false;
  var uidCounter = 1;
  var animating = false;

  function newTileId(){ return uidCounter++; }

  function emptyGrid(){
    var g = [];
    for (var r=0;r<SIZE;r++){ var row=[]; for (var c=0;c<SIZE;c++) row.push(null); g.push(row); }
    return g;
  }

  function emptyCells(g){
    var cells = [];
    for (var r=0;r<SIZE;r++) for (var c=0;c<SIZE;c++) if (!g[r][c]) cells.push({r:r,c:c});
    return cells;
  }

  function spawnTile(g){
    var cells = emptyCells(g);
    if (!cells.length) return false;
    var cell = cells[Math.floor(Math.random()*cells.length)];
    var value = Math.random() < 0.9 ? 2 : 4;
    g[cell.r][cell.c] = { value:value, id:newTileId(), isNew:true };
    return true;
  }

  function buildBg(){
    var bg = document.getElementById('bgGrid');
    bg.innerHTML = '';
    for (var i=0;i<SIZE*SIZE;i++){
      var d = document.createElement('div');
      d.className = 'bg-cell';
      bg.appendChild(d);
    }
  }

  function cellMetrics(){
    var outer = document.getElementById('boardOuter');
    var rect = outer.getBoundingClientRect();
    var pad = rect.width * 0.02 * 2; // approx 2vmin inset both sides -- fallback below with actual layer rect
    var layer = document.getElementById('tilesLayer');
    var layerRect = layer.getBoundingClientRect();
    var gap = layerRect.width * 0.02;
    var cell = (layerRect.width - gap*(SIZE-1)) / SIZE;
    return { cell:cell, gap:gap, layerW:layerRect.width };
  }

  function renderGrid(clearAnimFlags){
    var layer = document.getElementById('tilesLayer');
    layer.innerHTML = '';
    var m = cellMetrics();
    for (var r=0;r<SIZE;r++){
      for (var c=0;c<SIZE;c++){
        var t = grid[r][c];
        if (!t) continue;
        var el = document.createElement('div');
        el.className = 'tile' + (t.isNew ? ' new-tile' : '') + (t.merged ? ' merged' : '');
        var col = tileColor(t.value);
        el.style.background = col.bg;
        el.style.color = col.fg;
        el.style.width = m.cell + 'px';
        el.style.height = m.cell + 'px';
        el.style.left = (c * (m.cell + m.gap)) + 'px';
        el.style.top = (r * (m.cell + m.gap)) + 'px';
        el.textContent = t.value;
        if (t.value >= 128) el.style.fontSize = '4.6vmin';
        if (t.value >= 1024) el.style.fontSize = '3.6vmin';
        layer.appendChild(el);
        if (clearAnimFlags) { t.isNew = false; t.merged = false; }
      }
    }
  }

  function cloneGridShallow(g){
    return g.map(function(row){ return row.map(function(t){ return t ? { value:t.value, id:t.id } : null; }); });
  }

  function gridsEqual(a,b){
    for (var r=0;r<SIZE;r++) for (var c=0;c<SIZE;c++){
      var av = a[r][c] ? a[r][c].value : 0;
      var bv = b[r][c] ? b[r][c].value : 0;
      if (av !== bv) return false;
    }
    return true;
  }

  // Slide+merge a single line (array of cells, index0 = "far" end already in move direction order)
  function slideLine(line){
    var vals = line.filter(function(t){ return t !== null; });
    var result = [];
    var gained = 0;
    var i = 0;
    while (i < vals.length) {
      if (i+1 < vals.length && vals[i].value === vals[i+1].value) {
        var mergedVal = vals[i].value * 2;
        result.push({ value:mergedVal, id:newTileId(), merged:true });
        gained += mergedVal;
        i += 2;
      } else {
        result.push({ value:vals[i].value, id:vals[i].id });
        i += 1;
      }
    }
    while (result.length < SIZE) result.push(null);
    return { line:result, gained:gained };
  }

  function getLine(g, dir, index){
    // dir: 'left','right','up','down'; returns array of length SIZE in order from the moving-toward side
    var line = [];
    for (var k=0;k<SIZE;k++){
      if (dir === 'left') line.push(g[index][k]);
      else if (dir === 'right') line.push(g[index][SIZE-1-k]);
      else if (dir === 'up') line.push(g[k][index]);
      else if (dir === 'down') line.push(g[SIZE-1-k][index]);
    }
    return line;
  }

  function setLine(g, dir, index, line){
    for (var k=0;k<SIZE;k++){
      var val = line[k];
      if (dir === 'left') g[index][k] = val;
      else if (dir === 'right') g[index][SIZE-1-k] = val;
      else if (dir === 'up') g[k][index] = val;
      else if (dir === 'down') g[SIZE-1-k][index] = val;
    }
  }

  function move(dir){
    if (gameOver || animating) return;
    var newGrid = emptyGrid();
    var totalGained = 0;
    for (var i=0;i<SIZE;i++){
      var line = getLine(grid, dir, i);
      var res = slideLine(line);
      setLine(newGrid, dir, i, res.line);
      totalGained += res.gained;
    }
    if (gridsEqual(grid, newGrid)) return; // no-op move

    grid = newGrid;
    score += totalGained;
    if (score > best) { best = score; }
    spawnTile(grid);
    updateHud();
    renderGrid(false);
    haptic();
    saveBest(best);

    setTimeout(function(){
      renderGrid(true); // clear anim flags after animation plays once more (idempotent re-render)
    }, 160);

    if (!reached2048) {
      var has2048 = false;
      for (var r=0;r<SIZE;r++) for (var c=0;c<SIZE;c++) if (grid[r][c] && grid[r][c].value >= 2048) has2048 = true;
      if (has2048) {
        reached2048 = true;
        showToast2048();
      }
    }

    if (!hasAnyMoves(grid)) {
      endGame();
    }
  }

  var toastTimer = null;
  function showToast2048(){
    var toast = document.getElementById('toast2048');
    toast.hidden = false;
    if (toastTimer !== null) { clearTimeout(toastTimer); toastTimer = null; }
    toastTimer = setTimeout(function(){ toast.hidden = true; toastTimer = null; }, 2200);
  }

  function hasAnyMoves(g){
    if (emptyCells(g).length) return true;
    for (var r=0;r<SIZE;r++){
      for (var c=0;c<SIZE;c++){
        var v = g[r][c].value;
        if (c+1<SIZE && g[r][c+1] && g[r][c+1].value === v) return true;
        if (r+1<SIZE && g[r+1][c] && g[r+1][c].value === v) return true;
      }
    }
    return false;
  }

  function updateHud(){
    document.getElementById('scoreVal').textContent = score;
    document.getElementById('bestVal').textContent = best;
  }

  async function endGame(){
    gameOver = true;
    if (best > 0) await saveBest(best);
    document.getElementById('overScore').textContent = 'スコア: ' + score;
    document.getElementById('overBest').textContent = 'ベスト: ' + best;
    document.getElementById('overOverlay').hidden = false;
    haptic();
  }

  function startGame(){
    document.getElementById('overOverlay').hidden = true;
    document.getElementById('toast2048').hidden = true;
    if (toastTimer !== null) { clearTimeout(toastTimer); toastTimer = null; }
    grid = emptyGrid();
    score = 0;
    gameOver = false;
    reached2048 = false;
    spawnTile(grid);
    spawnTile(grid);
    updateHud();
    renderGrid(false);
    setTimeout(function(){ renderGrid(true); }, 160);
  }

  document.getElementById('restartBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);

  window.addEventListener('keydown', function(e){
    var dir = null;
    switch(e.key){
      case 'ArrowUp': dir='up'; break;
      case 'ArrowDown': dir='down'; break;
      case 'ArrowLeft': dir='left'; break;
      case 'ArrowRight': dir='right'; break;
    }
    if (dir) { e.preventDefault(); move(dir); }
  }, { passive:false });

  var touchStartX = null, touchStartY = null;
  var boardOuter = document.getElementById('boardOuter');
  boardOuter.addEventListener('touchstart', function(e){
    if (!e.touches || !e.touches.length) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive:true });
  boardOuter.addEventListener('touchend', function(e){
    if (touchStartX === null || touchStartY === null) return;
    var touch = (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0] : null;
    if (!touch) { touchStartX=null; touchStartY=null; return; }
    var dx = touch.clientX - touchStartX;
    var dy = touch.clientY - touchStartY;
    touchStartX = null; touchStartY = null;
    var absX = Math.abs(dx), absY = Math.abs(dy);
    if (Math.max(absX, absY) < 20) return;
    if (absX > absY) {
      move(dx > 0 ? 'right' : 'left');
    } else {
      move(dy > 0 ? 'down' : 'up');
    }
  }, { passive:true });

  window.addEventListener('resize', function(){ renderGrid(false); });

  (async function init(){
    best = await loadBest();
    buildBg();
    startGame();
  })();
</script>
</body>
</html>
