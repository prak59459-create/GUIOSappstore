<!--GUIOS-APP {"id":"habit-tracker","name":"習慣トラッカー","icon":"📊","color":"#4472c4","version":"1.0.0","author":"Claude","description":"毎日の習慣を記録し、継続日数を確認できるトラッカーアプリ。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>習慣トラッカー</title>
<style>
  :root{
    --accent:#4472c4;
    --bg:#0e1420;
    --card:#161f30;
    --text:#e9eefb;
    --sub:#a6b3d1;
    --line:#28324a;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--text);
    display:flex; flex-direction:column;
  }
  .topbar{padding:14px 16px 10px; flex:none;}
  .topbar h1{font-size:18px; margin:0 0 12px; display:flex; align-items:center; gap:8px;}
  .addrow{display:flex; gap:8px;}
  #habitInput{
    flex:1; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background:#0a0f18; color:var(--text); font-size:16px; outline:none;
  }
  #habitInput:focus{border-color:var(--accent);}
  #addBtn{
    padding:0 20px; border-radius:10px; border:none; background:var(--accent);
    color:#050b18; font-weight:700; font-size:15px; cursor:pointer; min-height:44px; flex:none;
  }
  .list-wrap{flex:1; overflow-y:auto; padding:6px 16px 16px;}
  .habit-card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; margin-bottom:10px;
  }
  .habit-head{
    display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px;
  }
  .habit-name{font-size:15px; font-weight:700; word-break:break-word; flex:1;}
  .streak-badge{
    font-size:12px; font-weight:700; color:var(--accent); background:rgba(68,114,196,0.15);
    padding:4px 10px; border-radius:999px; flex:none; white-space:nowrap;
  }
  .habit-del{
    flex:none; width:32px; height:32px; border-radius:8px; border:none; background:transparent;
    color:var(--sub); font-size:16px; cursor:pointer;
  }
  .habit-del:hover{color:#e07a7a;}
  .days-row{display:flex; gap:6px; justify-content:space-between;}
  .day-cell{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  .day-label{font-size:10px; color:var(--sub);}
  .day-dot{
    width:100%; aspect-ratio:1/1; max-width:38px; border-radius:10px; border:1px solid var(--line);
    background:#0a0f18; cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:14px; color:var(--sub);
  }
  .day-dot.today{border-color:var(--accent);}
  .day-dot.done{background:var(--accent); color:#050b18; border-color:var(--accent);}
  .empty{color:var(--sub); text-align:center; padding:50px 20px; font-size:14px;}
</style>
</head>
<body>
  <div class="topbar">
    <h1>📊 習慣トラッカー</h1>
    <div class="addrow">
      <input type="text" id="habitInput" placeholder="習慣の名前を入力...">
      <button id="addBtn">追加</button>
    </div>
  </div>

  <div class="list-wrap" id="listWrap">
    <div class="empty">習慣がまだありません</div>
  </div>

  <div id="toast" style="position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:#1a2436; color:var(--text); padding:10px 18px; border-radius:10px;
    font-size:13px; opacity:0; pointer-events:none; transition:all .25s; border:1px solid var(--line);
    max-width:90%; text-align:center; z-index:999;"></div>

<script>
  var hasSDK = !!(window.GUIOS && window.GUIOS.storage);
  var STORAGE_KEY = 'habits';
  var FALLBACK_KEY = 'guios-fallback-habit-tracker-habits';

  var habits = [];
  var WEEKDAY_LABELS = ['日','月','火','水','木','金','土'];

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.style.opacity = '1';
    t.style.transform = 'translateX(-50%) translateY(0)';
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){
      t.style.opacity = '0';
      t.style.transform = 'translateX(-50%) translateY(20px)';
    }, 1600);
  }
  function notify(msg, type){
    if(window.GUIOS && window.GUIOS.notify){
      GUIOS.notify(msg, {type: type || 'info'});
    } else {
      showToast(msg);
    }
  }

  function todayLocalStr(){
    return dateToLocalStr(new Date());
  }
  function dateToLocalStr(d){
    var y = d.getFullYear();
    var m = ('0'+(d.getMonth()+1)).slice(-2);
    var day = ('0'+d.getDate()).slice(-2);
    return y+'-'+m+'-'+day;
  }
  function addDaysLocal(dateStr, delta){
    var parts = dateStr.split('-').map(Number);
    var d = new Date(parts[0], parts[1]-1, parts[2]);
    d.setDate(d.getDate() + delta);
    return dateToLocalStr(d);
  }

  function last7Dates(){
    var today = todayLocalStr();
    var arr = [];
    for(var i=6; i>=0; i--){
      arr.push(addDaysLocal(today, -i));
    }
    return arr;
  }

  function weekdayLabelFor(dateStr){
    var parts = dateStr.split('-').map(Number);
    var d = new Date(parts[0], parts[1]-1, parts[2]);
    return WEEKDAY_LABELS[d.getDay()];
  }

  function computeStreak(doneDates){
    var set = {};
    (doneDates||[]).forEach(function(d){ set[d] = true; });
    var streak = 0;
    var cursor = todayLocalStr();
    while(set[cursor]){
      streak++;
      cursor = addDaysLocal(cursor, -1);
    }
    return streak;
  }

  async function loadHabits(){
    if(hasSDK){
      var v = await GUIOS.storage.get(STORAGE_KEY);
      return Array.isArray(v) ? v : [];
    } else {
      try{
        var raw = localStorage.getItem(FALLBACK_KEY);
        return raw ? JSON.parse(raw) : [];
      }catch(e){ return []; }
    }
  }
  async function saveHabits(list){
    if(hasSDK){
      await GUIOS.storage.set(STORAGE_KEY, list);
    } else {
      try{ localStorage.setItem(FALLBACK_KEY, JSON.stringify(list)); }catch(e){}
    }
  }

  function render(){
    var wrap = document.getElementById('listWrap');
    if(habits.length === 0){
      wrap.innerHTML = '<div class="empty">習慣がまだありません</div>';
      return;
    }
    var today = todayLocalStr();
    var dates = last7Dates();

    wrap.innerHTML = '';
    habits.forEach(function(habit){
      var card = document.createElement('div');
      card.className = 'habit-card';

      var head = document.createElement('div');
      head.className = 'habit-head';

      var name = document.createElement('div');
      name.className = 'habit-name';
      name.textContent = habit.name;

      var streak = document.createElement('div');
      streak.className = 'streak-badge';
      var streakCount = computeStreak(habit.doneDates);
      streak.textContent = '🔥 ' + streakCount + '日継続';

      var del = document.createElement('button');
      del.className = 'habit-del';
      del.textContent = '✕';
      del.addEventListener('click', function(){ deleteHabit(habit.id); });

      head.appendChild(name);
      head.appendChild(streak);
      head.appendChild(del);

      var daysRow = document.createElement('div');
      daysRow.className = 'days-row';

      dates.forEach(function(dateStr){
        var cell = document.createElement('div');
        cell.className = 'day-cell';

        var label = document.createElement('div');
        label.className = 'day-label';
        label.textContent = weekdayLabelFor(dateStr);

        var dot = document.createElement('button');
        var isDone = (habit.doneDates||[]).indexOf(dateStr) !== -1;
        var isToday = dateStr === today;
        dot.className = 'day-dot' + (isDone ? ' done' : '') + (isToday ? ' today' : '');
        dot.textContent = isDone ? '✓' : '';
        dot.addEventListener('click', function(){ toggleDate(habit.id, dateStr); });

        cell.appendChild(label);
        cell.appendChild(dot);
        daysRow.appendChild(cell);
      });

      card.appendChild(head);
      card.appendChild(daysRow);
      wrap.appendChild(card);
    });
  }

  async function addHabit(){
    var input = document.getElementById('habitInput');
    var name = input.value.trim();
    if(!name){
      notify('習慣の名前を入力してください', 'error');
      return;
    }
    habits.push({
      id: 'habit-' + Date.now() + '-' + Math.floor(Math.random()*10000),
      name: name,
      doneDates: []
    });
    input.value = '';
    await saveHabits(habits);
    render();
    if(window.GUIOS && window.GUIOS.haptic) GUIOS.haptic();
  }

  async function toggleDate(habitId, dateStr){
    var habit = habits.find(function(h){ return h.id === habitId; });
    if(!habit) return;
    if(!habit.doneDates) habit.doneDates = [];
    var idx = habit.doneDates.indexOf(dateStr);
    if(idx === -1){
      habit.doneDates.push(dateStr);
    } else {
      habit.doneDates.splice(idx, 1);
    }
    await saveHabits(habits);
    render();
    if(window.GUIOS && window.GUIOS.haptic) GUIOS.haptic();
  }

  async function deleteHabit(id){
    if(!confirm('この習慣を削除しますか？')) return;
    habits = habits.filter(function(h){ return h.id !== id; });
    await saveHabits(habits);
    render();
  }

  document.getElementById('addBtn').addEventListener('click', addHabit);
  document.getElementById('habitInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter'){
      e.preventDefault();
      addHabit();
    }
  });

  async function init(){
    habits = await loadHabits();
    render();
  }
  init();
</script>
</body>
</html>
