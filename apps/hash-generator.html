<!--GUIOS-APP {"id":"hash-generator","name":"ハッシュ値計算","icon":"#️⃣","color":"#37474f","version":"1.0.0","author":"Claude","description":"テキストからSHA-256などのハッシュ値を計算できるツール。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ハッシュ値計算</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:#12151a; color:#e8ecf2; min-height:100vh; padding:16px 12px 60px;
  }
  h1{ font-size:18px; margin:0 0 14px; color:#9db3c7; }
  .card{
    background:#191e26; border:1px solid #2a3140; border-radius:14px; padding:14px; margin-bottom:14px;
  }
  label{ display:block; font-size:12.5px; color:#8d99ac; margin-bottom:6px; }
  textarea{
    width:100%; min-height:16vh; padding:12px; border-radius:12px; border:1px solid #2a3140;
    background:#0c0f14; color:#e8ecf2; font-size:14px; line-height:1.5; resize:vertical;
    font-family:ui-monospace,Menlo,Consolas,monospace;
  }
  .algos{ display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
  .algo-chip{
    display:flex; align-items:center; gap:6px; background:#1f2733; border:2px solid #2a3140;
    border-radius:10px; padding:9px 12px; font-size:13px; cursor:pointer; min-height:40px; color:#c3ccd9;
  }
  .algo-chip.active{ border-color:#37474f; background:#263140; color:#cfe3ee; }
  .algo-chip input{ width:16px; height:16px; }
  .btn{
    width:100%; margin-top:12px; padding:13px; border-radius:12px; border:none; background:#37474f;
    color:#eef4f7; font-weight:700; font-size:15px; cursor:pointer; min-height:46px;
  }
  .result{
    background:#0c0f14; border:1px solid #2a3140; border-radius:12px; padding:12px; margin-top:12px;
  }
  .result-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .result-head span{ font-size:12.5px; font-weight:700; color:#9db3c7; letter-spacing:.3px; }
  .copy-mini{
    border:none; background:#263140; color:#cfe3ee; font-size:11.5px; padding:6px 10px; border-radius:8px;
    cursor:pointer; min-height:30px;
  }
  .hashval{
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12.5px; word-break:break-all; color:#e8ecf2;
    line-height:1.6;
  }
  .empty-hint{ font-size:13px; color:#5f6b7d; padding:8px 2px; }
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:#232a36; color:#e8ecf2; padding:10px 18px; border-radius:10px;
    font-size:13px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;
    max-width:90%; text-align:center; box-shadow:0 6px 18px rgba(0,0,0,.35); z-index:100;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <h1>#️⃣ ハッシュ値計算</h1>

  <div class="card">
    <label for="input">入力テキスト</label>
    <textarea id="input" placeholder="ハッシュ値を計算したい文章を入力してください…"></textarea>

    <label style="margin-top:12px;">計算するアルゴリズム</label>
    <div class="algos" id="algoList">
      <label class="algo-chip active"><input type="checkbox" value="SHA-1"> SHA-1</label>
      <label class="algo-chip active"><input type="checkbox" value="SHA-256" checked> SHA-256</label>
      <label class="algo-chip"><input type="checkbox" value="SHA-384"> SHA-384</label>
      <label class="algo-chip"><input type="checkbox" value="SHA-512"> SHA-512</label>
    </div>

    <button class="btn" id="calcBtn">計算する</button>
  </div>

  <div id="results"></div>

  <div class="toast" id="toast"></div>

<script>
  var input = document.getElementById('input');
  var algoList = document.getElementById('algoList');
  var calcBtn = document.getElementById('calcBtn');
  var results = document.getElementById('results');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }
  function notify(msg, type){
    if (window.GUIOS && window.GUIOS.notify) {
      try { window.GUIOS.notify(msg, { type: type || 'info' }); return; } catch(e){}
    }
    showToast(msg);
  }
  function copyText(text){
    if (window.GUIOS && window.GUIOS.clipboard && window.GUIOS.clipboard.writeText) {
      try { window.GUIOS.clipboard.writeText(text); return; } catch(e){}
    }
    try { navigator.clipboard.writeText(text); } catch(e){}
  }

  // sync chip active state with checkbox
  algoList.querySelectorAll('.algo-chip').forEach(function(chip){
    var cb = chip.querySelector('input');
    cb.addEventListener('change', function(){
      chip.classList.toggle('active', cb.checked);
    });
  });

  function bufToHex(buffer){
    var bytes = new Uint8Array(buffer);
    var hex = '';
    for (var i = 0; i < bytes.length; i++) {
      var h = bytes[i].toString(16);
      hex += h.length === 1 ? '0' + h : h;
    }
    return hex;
  }

  function getSelectedAlgos(){
    var boxes = algoList.querySelectorAll('input[type="checkbox"]:checked');
    var list = [];
    boxes.forEach(function(b){ list.push(b.value); });
    return list;
  }

  async function calc(){
    var text = input.value;
    var algos = getSelectedAlgos();
    if (!algos.length) {
      notify('アルゴリズムを1つ以上選んでください', 'error');
      return;
    }
    if (!text) {
      results.innerHTML = '<div class="empty-hint">入力テキストがありません</div>';
      return;
    }
    if (!(window.crypto && window.crypto.subtle && window.crypto.subtle.digest)) {
      notify('このブラウザではハッシュ計算がサポートされていません', 'error');
      return;
    }
    calcBtn.disabled = true;
    calcBtn.textContent = '計算中…';
    try {
      var bytes = new TextEncoder().encode(text);
      var html = '';
      for (var i = 0; i < algos.length; i++) {
        var algo = algos[i];
        var digest = await window.crypto.subtle.digest(algo, bytes);
        var hex = bufToHex(digest);
        html += '<div class="result" data-hash="' + escapeAttr(hex) + '">' +
          '<div class="result-head"><span>' + algo + '</span>' +
          '<button class="copy-mini" data-copy="' + escapeAttr(hex) + '">📋 コピー</button></div>' +
          '<div class="hashval">' + escapeHtml(hex) + '</div></div>';
      }
      results.innerHTML = html;
      results.querySelectorAll('.copy-mini').forEach(function(btn){
        btn.addEventListener('click', function(){
          copyText(btn.getAttribute('data-copy'));
          notify('コピーしました', 'success');
        });
      });
    } catch(e) {
      notify('計算に失敗しました: ' + e.message, 'error');
    } finally {
      calcBtn.disabled = false;
      calcBtn.textContent = '計算する';
    }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c];
    });
  }
  function escapeAttr(s){ return escapeHtml(s); }

  calcBtn.addEventListener('click', calc);
  input.addEventListener('keydown', function(e){
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') calc();
  });
</script>
</body>
</html>
