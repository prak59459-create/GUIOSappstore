<!--GUIOS-APP {"id":"json-formatter","name":"JSON整形ツール","icon":"🧾","color":"#4d7c4d","version":"1.0.0","author":"Claude","description":"JSONデータを見やすく整形・圧縮できるツール。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>JSON整形ツール</title>
<style>
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:#0f1810; color:#e6f2e6; min-height:100vh; padding:16px;
  }
  h1{ font-size:18px; margin:0 0 14px; color:#8fca8f; }
  label{ display:block; font-size:13px; color:#8fac8f; margin-bottom:6px; }
  textarea{
    width:100%; min-height:20vh; padding:14px; border-radius:14px; border:1px solid #26402a;
    background:#0a120c; color:#e6f2e6; font-size:14px; line-height:1.5; resize:vertical;
    font-family:ui-monospace,Menlo,Consolas,monospace; margin-bottom:14px;
  }
  .btn-row{ display:flex; gap:10px; margin-bottom:14px; }
  .btn{
    flex:1; padding:14px; border-radius:12px; border:none; background:#28402a;
    color:#d4ecd4; font-weight:700; font-size:15px; cursor:pointer; min-height:48px;
    -webkit-tap-highlight-color:transparent;
  }
  .btn.primary{ background:#4d7c4d; color:#0a1509; }
  .error{
    background:#3a1f1f; color:#ffb0b0; padding:12px 14px; border-radius:10px; font-size:13px;
    margin-bottom:14px; word-break:break-all; display:none; white-space:pre-wrap;
  }
  .copy-btn{
    width:100%; padding:14px; border-radius:12px; border:none; background:#4d7c4d;
    color:#0a1509; font-weight:700; font-size:15px; cursor:pointer; min-height:48px;
    -webkit-tap-highlight-color:transparent;
  }
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:#1c2c1e; color:#e6f2e6; padding:10px 18px; border-radius:10px;
    font-size:13px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;
    max-width:90%; text-align:center; box-shadow:0 6px 18px rgba(0,0,0,.35); z-index:100;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <h1>🧾 JSON整形ツール</h1>

  <label for="input">入力JSON</label>
  <textarea id="input" placeholder='例: {"name":"太郎","age":20}'></textarea>

  <div class="btn-row">
    <button class="btn primary" id="formatBtn">整形</button>
    <button class="btn" id="minifyBtn">圧縮</button>
  </div>

  <div class="error" id="errorBox"></div>

  <label for="output">出力結果</label>
  <textarea id="output" placeholder="結果がここに表示されます" readonly></textarea>

  <button class="copy-btn" id="copyBtn">📋 コピー</button>
  <div class="toast" id="toast"></div>

<script>
  var input = document.getElementById('input');
  var output = document.getElementById('output');
  var errorBox = document.getElementById('errorBox');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }
  function notify(msg, type){
    if (window.GUIOS && window.GUIOS.notify) {
      try { window.GUIOS.notify(msg, { type: type || 'info' }); return; } catch(e){}
    }
    showToast(msg);
  }
  function copyText(text){
    if (window.GUIOS && window.GUIOS.clipboard && window.GUIOS.clipboard.writeText) {
      try { window.GUIOS.clipboard.writeText(text); return; } catch(e){}
    }
    try { navigator.clipboard.writeText(text); } catch(e){}
  }

  function showError(msg){
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
  }
  function hideError(){
    errorBox.style.display = 'none';
    errorBox.textContent = '';
  }

  function doFormat(){
    var text = input.value.trim();
    if (!text) {
      showError('JSONを入力してください。');
      output.value = '';
      return;
    }
    try {
      var obj = JSON.parse(text);
      output.value = JSON.stringify(obj, null, 2);
      hideError();
    } catch(e) {
      output.value = '';
      showError('JSONの解析に失敗しました:\n' + e.message);
    }
  }

  function doMinify(){
    var text = input.value.trim();
    if (!text) {
      showError('JSONを入力してください。');
      output.value = '';
      return;
    }
    try {
      var obj = JSON.parse(text);
      output.value = JSON.stringify(obj);
      hideError();
    } catch(e) {
      output.value = '';
      showError('JSONの解析に失敗しました:\n' + e.message);
    }
  }

  document.getElementById('formatBtn').addEventListener('click', doFormat);
  document.getElementById('minifyBtn').addEventListener('click', doMinify);

  document.getElementById('copyBtn').addEventListener('click', function(){
    if (!output.value) {
      notify('コピーする内容がありません', 'error');
      return;
    }
    copyText(output.value);
    notify('コピーしました', 'success');
  });
</script>
</body>
</html>
