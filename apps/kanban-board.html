<!--GUIOS-APP {"id":"kanban-board","name":"カンバンボード","icon":"🗂️","color":"#1565c0","version":"1.0.0","author":"Claude","description":"タスクを未着手・進行中・完了の3列で管理できるカンバンボードアプリ。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>カンバンボード</title>
<style>
  :root{
    --accent:#4f9dee;
    --bg:#0a1220;
    --card:#101c30;
    --card2:#0c1626;
    --text:#eaf2fc;
    --sub:#a7bede;
    --line:#1e3252;
    --danger:#e05a5a;
    --colA:#3d6fb0;
    --colB:#b08c3d;
    --colC:#3daa6b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--text);
    padding:14px; padding-bottom:48px;
  }
  h1{font-size:19px; margin:4px 0 14px; display:flex; align-items:center; gap:8px;}
  .board{
    display:flex; flex-direction:column; gap:14px;
  }
  @media(min-width:760px){
    .board{ display:grid; grid-template-columns:1fr 1fr 1fr; align-items:start; }
  }
  .column{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:12px; min-height:80px;
  }
  .column.dragover{ outline:2px dashed var(--accent); outline-offset:-4px; background:#122544; }
  .col-head{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;
  }
  .col-title{
    display:flex; align-items:center; gap:8px; font-size:14px; font-weight:700;
  }
  .dot{width:10px; height:10px; border-radius:50%;}
  .dot.a{background:var(--colA);} .dot.b{background:var(--colB);} .dot.c{background:var(--colC);}
  .count{color:var(--sub); font-weight:600; font-size:12px;}
  .addbtn{
    background:var(--card2); border:1px solid var(--line); color:var(--accent);
    font-size:20px; font-weight:700; border-radius:10px; width:36px; height:36px;
    line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .cardlist{ display:flex; flex-direction:column; gap:10px; min-height:40px; }
  .cardlist:empty::after{
    content:'カードはありません'; display:block; text-align:center; color:var(--sub);
    font-size:12.5px; padding:14px 0;
  }
  .taskcard{
    background:var(--card2); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; cursor:grab;
  }
  .taskcard.dragging{ opacity:0.4; }
  .taskcard .t-title{ font-size:14px; font-weight:700; margin-bottom:4px; word-break:break-word; }
  .taskcard .t-desc{ font-size:12.5px; color:var(--sub); margin-bottom:8px; white-space:pre-wrap; word-break:break-word; }
  .t-actions{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .t-actions button{
    border:1px solid var(--line); background:#0a1220; color:var(--text);
    border-radius:8px; font-size:14px; font-weight:700; cursor:pointer;
    min-width:40px; min-height:36px; padding:0 8px;
  }
  .t-actions button:disabled{ opacity:0.25; cursor:default; }
  .t-actions .spacer{ flex:1; }
  .t-actions .edit-btn, .t-actions .del-btn{
    min-width:36px; font-size:13px; color:var(--sub);
  }
  .t-actions .del-btn{ color:var(--danger); }

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6);
    display:none; align-items:flex-end; justify-content:center; z-index:1000;
  }
  .overlay.show{ display:flex; }
  @media(min-width:600px){
    .overlay{ align-items:center; }
  }
  .modal{
    background:var(--card); border:1px solid var(--line); border-radius:16px 16px 0 0;
    padding:18px; width:100%; max-width:460px; max-height:86vh; overflow-y:auto;
  }
  @media(min-width:600px){
    .modal{ border-radius:16px; }
  }
  .modal h2{ font-size:16px; margin:0 0 14px; }
  .modal label{ display:block; font-size:13px; color:var(--sub); margin-bottom:6px; }
  .modal .field{ margin-bottom:14px; }
  .modal input[type=text], .modal textarea{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background:#070d17; color:var(--text); font-size:16px; outline:none; font-family:inherit;
    resize:vertical;
  }
  .modal input:focus, .modal textarea:focus{ border-color:var(--accent); }
  .modal-actions{ display:flex; gap:10px; margin-top:6px; }
  .modal-actions button{
    flex:1; padding:12px; border-radius:10px; border:none; font-weight:700; font-size:15px;
    cursor:pointer; min-height:44px;
  }
  .btn-save{ background:var(--accent); color:#04162e; }
  .btn-cancel{ background:transparent; color:var(--sub); border:1px solid var(--line) !important; }

  #toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:#122544; color:var(--text); padding:10px 18px; border-radius:10px;
    font-size:13px; opacity:0; pointer-events:none; transition:all .25s; border:1px solid var(--line);
    max-width:90%; text-align:center; z-index:1100;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
  <h1>🗂️ カンバンボード</h1>

  <div class="board">
    <div class="column" data-col="todo">
      <div class="col-head">
        <div class="col-title"><span class="dot a"></span>未着手 <span class="count" id="count-todo">0</span></div>
        <button class="addbtn" data-col="todo" title="タスクを追加">＋</button>
      </div>
      <div class="cardlist" id="list-todo" data-col="todo"></div>
    </div>

    <div class="column" data-col="doing">
      <div class="col-head">
        <div class="col-title"><span class="dot b"></span>進行中 <span class="count" id="count-doing">0</span></div>
        <button class="addbtn" data-col="doing" title="タスクを追加">＋</button>
      </div>
      <div class="cardlist" id="list-doing" data-col="doing"></div>
    </div>

    <div class="column" data-col="done">
      <div class="col-head">
        <div class="col-title"><span class="dot c"></span>完了 <span class="count" id="count-done">0</span></div>
        <button class="addbtn" data-col="done" title="タスクを追加">＋</button>
      </div>
      <div class="cardlist" id="list-done" data-col="done"></div>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 id="modalTitle">タスクを追加</h2>
      <div class="field">
        <label for="taskTitle">タイトル</label>
        <input type="text" id="taskTitle" maxlength="80" placeholder="例: 資料を作成する">
      </div>
      <div class="field">
        <label for="taskDesc">説明（任意）</label>
        <textarea id="taskDesc" rows="3" maxlength="300" placeholder="詳細メモなど"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="modalCancel">キャンセル</button>
        <button class="btn-save" id="modalSave">保存</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

<script>
  var hasSDK = !!(window.GUIOS && window.GUIOS.storage);
  var STORAGE_KEY = 'board';
  var FALLBACK_KEY = 'guios-fallback-kanban-board-board';
  var COLS = ['todo', 'doing', 'done'];

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 1600);
  }
  function notify(msg, type){
    if(window.GUIOS && window.GUIOS.notify){
      GUIOS.notify(msg, {type: type || 'info'});
    } else {
      showToast(msg);
    }
  }

  function defaultBoard(){
    return { todo: [], doing: [], done: [] };
  }

  function normalizeBoard(v){
    var b = defaultBoard();
    if(v && typeof v === 'object'){
      COLS.forEach(function(c){
        if(Array.isArray(v[c])) b[c] = v[c].filter(function(card){ return card && typeof card.id === 'string'; });
      });
    }
    return b;
  }

  async function loadBoard(){
    if(hasSDK){
      var v = await GUIOS.storage.get(STORAGE_KEY);
      return normalizeBoard(v);
    } else {
      try{
        var raw = localStorage.getItem(FALLBACK_KEY);
        return normalizeBoard(raw ? JSON.parse(raw) : null);
      }catch(e){ return defaultBoard(); }
    }
  }
  async function saveBoard(board){
    if(hasSDK){
      await GUIOS.storage.set(STORAGE_KEY, board);
    } else {
      try{ localStorage.setItem(FALLBACK_KEY, JSON.stringify(board)); }catch(e){}
    }
  }

  var board = defaultBoard();

  function uid(){
    return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function escapeHtml(s){
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function colLabel(c){
    return c === 'todo' ? '未着手' : (c === 'doing' ? '進行中' : '完了');
  }

  var draggedInfo = null; // { id, fromCol }

  function render(){
    COLS.forEach(function(col){
      var listEl = document.getElementById('list-' + col);
      var countEl = document.getElementById('count-' + col);
      var cards = board[col];
      countEl.textContent = cards.length;
      listEl.innerHTML = '';
      cards.forEach(function(card){
        var idx = COLS.indexOf(col);
        var div = document.createElement('div');
        div.className = 'taskcard';
        div.draggable = true;
        div.setAttribute('data-id', card.id);

        var descHtml = card.desc ? '<div class="t-desc">' + escapeHtml(card.desc) + '</div>' : '';

        div.innerHTML =
          '<div class="t-title">' + escapeHtml(card.title) + '</div>' +
          descHtml +
          '<div class="t-actions">' +
            '<button class="mv-left" title="左の列へ移動"' + (idx === 0 ? ' disabled' : '') + '>◀</button>' +
            '<button class="mv-right" title="右の列へ移動"' + (idx === COLS.length - 1 ? ' disabled' : '') + '>▶</button>' +
            '<span class="spacer"></span>' +
            '<button class="edit-btn" title="編集">✎</button>' +
            '<button class="del-btn" title="削除">✕</button>' +
          '</div>';

        // Move buttons (touch-friendly fallback, always available)
        div.querySelector('.mv-left').addEventListener('click', function(){
          moveCard(card.id, col, COLS[idx - 1]);
        });
        div.querySelector('.mv-right').addEventListener('click', function(){
          moveCard(card.id, col, COLS[idx + 1]);
        });
        div.querySelector('.edit-btn').addEventListener('click', function(){
          openModal('edit', col, card);
        });
        div.querySelector('.del-btn').addEventListener('click', function(){
          deleteCard(col, card.id);
        });

        // Drag and drop (desktop/mouse)
        div.addEventListener('dragstart', function(e){
          draggedInfo = { id: card.id, fromCol: col };
          div.classList.add('dragging');
          try{
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', card.id);
          }catch(err){}
        });
        div.addEventListener('dragend', function(){
          div.classList.remove('dragging');
          draggedInfo = null;
        });

        listEl.appendChild(div);
      });
    });
  }

  // Drop targets = column lists
  COLS.forEach(function(col){
    var listEl = document.getElementById('list-' + col);
    var columnEl = listEl.closest('.column');

    listEl.addEventListener('dragover', function(e){
      if(!draggedInfo) return;
      e.preventDefault();
      try{ e.dataTransfer.dropEffect = 'move'; }catch(err){}
      columnEl.classList.add('dragover');
    });
    listEl.addEventListener('dragleave', function(){
      columnEl.classList.remove('dragover');
    });
    listEl.addEventListener('drop', function(e){
      e.preventDefault();
      columnEl.classList.remove('dragover');
      if(!draggedInfo) return;
      moveCard(draggedInfo.id, draggedInfo.fromCol, col);
      draggedInfo = null;
    });
  });

  async function moveCard(id, fromCol, toCol){
    if(fromCol === toCol || !toCol) return;
    var arr = board[fromCol];
    var i = arr.findIndex(function(c){ return c.id === id; });
    if(i === -1) return;
    var card = arr.splice(i, 1)[0];
    board[toCol].push(card);
    await saveBoard(board);
    render();
    notify(colLabel(toCol) + 'に移動しました', 'success');
  }

  async function deleteCard(col, id){
    if(!confirm('このタスクを削除しますか？')) return;
    board[col] = board[col].filter(function(c){ return c.id !== id; });
    await saveBoard(board);
    render();
    notify('タスクを削除しました', 'success');
  }

  // Modal handling
  var modalState = { mode: 'add', col: null, cardId: null };

  function openModal(mode, col, card){
    modalState = { mode: mode, col: col, cardId: card ? card.id : null };
    document.getElementById('modalTitle').textContent = mode === 'edit' ? 'タスクを編集' : 'タスクを追加（' + colLabel(col) + '）';
    document.getElementById('taskTitle').value = card ? card.title : '';
    document.getElementById('taskDesc').value = card ? (card.desc || '') : '';
    document.getElementById('overlay').classList.add('show');
    setTimeout(function(){ document.getElementById('taskTitle').focus(); }, 50);
  }
  function closeModal(){
    document.getElementById('overlay').classList.remove('show');
  }

  document.querySelectorAll('.addbtn').forEach(function(btn){
    btn.addEventListener('click', function(){
      openModal('add', btn.getAttribute('data-col'), null);
    });
  });
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('overlay').addEventListener('click', function(e){
    if(e.target === document.getElementById('overlay')) closeModal();
  });

  document.getElementById('modalSave').addEventListener('click', async function(){
    var title = document.getElementById('taskTitle').value.trim();
    var desc = document.getElementById('taskDesc').value.trim();
    if(!title){
      notify('タイトルを入力してください', 'error');
      return;
    }
    if(modalState.mode === 'add'){
      board[modalState.col].push({ id: uid(), title: title, desc: desc });
      notify('タスクを追加しました', 'success');
    } else {
      var arr = board[modalState.col];
      var card = arr.find(function(c){ return c.id === modalState.cardId; });
      if(card){
        card.title = title;
        card.desc = desc;
        notify('タスクを更新しました', 'success');
      }
    }
    await saveBoard(board);
    render();
    closeModal();
  });

  async function init(){
    board = await loadBoard();
    render();
  }
  init();
</script>
</body>
</html>
