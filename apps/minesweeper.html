<!--GUIOS-APP {"id":"minesweeper","name":"マインスイーパー","icon":"💣","color":"#757575","version":"1.0.0","author":"Claude","description":"地雷を避けながら安全なマスを開いていくマインスイーパーゲーム。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>マインスイーパー</title>
<style>
  :root{
    --accent:#757575;
    --bg:#161616;
    --card:#212121;
    --cell:#3a3a3a;
    --cell-hover:#454545;
    --revealed:#1c1c1c;
    --text:#f2f2f2;
    --sub:#b7b7b7;
    --mine:#e05555;
    --flag:#e0b04d;
    --win:#3a9d6f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:14px;
    padding-bottom:40px;
    display:flex;
    flex-direction:column;
    align-items:center;
    -webkit-tap-highlight-color:transparent;
  }
  h1{
    font-size:19px;
    margin:2px 0 10px;
  }
  .diff-row{
    display:flex;
    gap:8px;
    margin-bottom:10px;
  }
  .diff-btn{
    padding:8px 14px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,0.12);
    background:var(--card);
    color:var(--sub);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }
  .diff-btn.active{
    background:var(--accent);
    color:#fff;
    border-color:var(--accent);
  }
  .info-row{
    display:flex;
    gap:10px;
    margin-bottom:8px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .info-chip{
    background:var(--card);
    border-radius:10px;
    padding:8px 14px;
    font-size:13px;
    color:var(--sub);
    border:1px solid rgba(255,255,255,0.06);
    min-width:74px;
    text-align:center;
  }
  .info-chip b{
    color:var(--text);
    font-size:16px;
    display:block;
  }
  .best-row{
    font-size:12px;
    color:var(--sub);
    margin-bottom:10px;
    text-align:center;
  }
  .status-banner{
    display:none;
    background:var(--card);
    border:1px solid var(--win);
    border-radius:14px;
    padding:14px 20px;
    text-align:center;
    margin-bottom:12px;
    max-width:360px;
    font-weight:800;
    font-size:16px;
  }
  .status-banner.show{ display:block; }
  .status-banner.lose{ border-color:var(--mine); color:var(--mine); }
  .status-banner.win{ color:var(--win); }
  .board-wrap{
    width:100%;
    max-width:420px;
    overflow-x:auto;
    display:flex;
    justify-content:center;
    margin-bottom:14px;
  }
  .board{
    display:grid;
    gap:3px;
    background:var(--bg);
    touch-action:manipulation;
  }
  .cell{
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--cell);
    border-radius:5px;
    font-weight:800;
    font-size:min(4.2vw, 17px);
    cursor:pointer;
    user-select:none;
    aspect-ratio:1/1;
    min-width:0;
  }
  .cell.revealed{
    background:var(--revealed);
    cursor:default;
  }
  .cell.mine{
    background:var(--mine);
    color:#fff;
  }
  .cell.flag{
    color:var(--flag);
  }
  .n1{ color:#64b5f6; }
  .n2{ color:#81c784; }
  .n3{ color:#e57373; }
  .n4{ color:#ba68c8; }
  .n5{ color:#ffb74d; }
  .n6{ color:#4dd0e1; }
  .n7{ color:#f0f0f0; }
  .n8{ color:#9e9e9e; }
  .btn-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .btn{
    padding:12px 22px;
    border-radius:12px;
    border:none;
    background:var(--accent);
    color:#fff;
    font-weight:800;
    font-size:14px;
    cursor:pointer;
  }
  .btn.mode{
    background:var(--card);
    border:1px solid rgba(255,255,255,0.12);
    color:var(--sub);
  }
  .btn.mode.active{
    background:var(--flag);
    color:#1c1400;
    border-color:var(--flag);
  }
  .btn.secondary{
    background:var(--card);
    color:var(--sub);
    border:1px solid rgba(255,255,255,0.1);
    font-size:12px;
    padding:10px 16px;
  }
</style>
</head>
<body>
  <h1>💣 マインスイーパー</h1>

  <div class="diff-row" id="diffRow">
    <button class="diff-btn active" data-diff="easy" type="button">初級</button>
    <button class="diff-btn" data-diff="medium" type="button">中級</button>
  </div>

  <div class="info-row">
    <div class="info-chip">残り地雷<b id="minesVal">10</b></div>
    <div class="info-chip">時間<b id="timeVal">0</b></div>
  </div>
  <div class="best-row" id="bestRow">ベスト記録なし</div>

  <div class="status-banner" id="statusBanner">
    <div id="statusText"></div>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <div class="btn-row">
    <button class="btn mode" id="flagModeBtn" type="button">🚩フラグモード</button>
    <button class="btn" id="newBtn" type="button">新しいゲーム</button>
    <button class="btn secondary" id="resetBestBtn" type="button">ベストをリセット</button>
  </div>

<script>
  var hasSDK = !!(window.GUIOS && window.GUIOS.storage);
  var STORE_KEY = "bestTimes";
  var LS_KEY = "minesweeper:" + STORE_KEY;

  var DIFFS = {
    easy:   { rows: 9, cols: 9, mines: 10, label: "初級" },
    medium: { rows: 12, cols: 10, mines: 20, label: "中級" }
  };

  var diffRow = document.getElementById("diffRow");
  var boardEl = document.getElementById("board");
  var minesVal = document.getElementById("minesVal");
  var timeVal = document.getElementById("timeVal");
  var bestRow = document.getElementById("bestRow");
  var statusBanner = document.getElementById("statusBanner");
  var statusText = document.getElementById("statusText");
  var flagModeBtn = document.getElementById("flagModeBtn");
  var newBtn = document.getElementById("newBtn");
  var resetBestBtn = document.getElementById("resetBestBtn");

  var curDiff = "easy";
  var rows, cols, mineCount;
  var grid = [];          // { mine, revealed, flagged, adjacent }
  var flagMode = false;
  var firstClickDone = false;
  var gameOver = false;
  var flagsUsed = 0;
  var revealedCount = 0;
  var elapsed = 0;
  var timerId = null;
  var bestTimes = {};     // { easy: seconds, medium: seconds }

  function notify(msg, type){
    if (window.GUIOS && window.GUIOS.notify){
      window.GUIOS.notify(msg, { type: type || "info" });
    }
  }
  function haptic(){
    if (window.GUIOS && window.GUIOS.haptic){
      try { window.GUIOS.haptic(); } catch(e){}
    }
  }

  async function loadBest(){
    try {
      if (hasSDK){
        var v = await window.GUIOS.storage.get(STORE_KEY);
        if (v && typeof v === "object") bestTimes = v;
      } else {
        var raw = localStorage.getItem(LS_KEY);
        if (raw) bestTimes = JSON.parse(raw);
      }
    } catch(e){}
    renderBest();
  }
  async function saveBest(){
    try {
      if (hasSDK){
        await window.GUIOS.storage.set(STORE_KEY, bestTimes);
      } else {
        localStorage.setItem(LS_KEY, JSON.stringify(bestTimes));
      }
    } catch(e){}
  }
  function renderBest(){
    var b = bestTimes[curDiff];
    bestRow.textContent = b ? ("ベスト（" + DIFFS[curDiff].label + "）: " + b + "秒") : "ベスト記録なし";
  }

  function stopTimer(){
    if (timerId !== null){
      clearInterval(timerId);
      timerId = null;
    }
  }
  function startTimer(){
    stopTimer();
    var start = Date.now();
    timerId = setInterval(function(){
      elapsed = Math.floor((Date.now() - start) / 1000);
      timeVal.textContent = elapsed;
    }, 250);
  }

  function idx(r, c){ return r * cols + c; }

  function neighborsOf(r, c){
    var res = [];
    for (var dr = -1; dr <= 1; dr++){
      for (var dc = -1; dc <= 1; dc++){
        if (dr === 0 && dc === 0) continue;
        var nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) res.push([nr, nc]);
      }
    }
    return res;
  }

  function buildEmptyGrid(){
    grid = [];
    for (var i = 0; i < rows * cols; i++){
      grid.push({ mine: false, revealed: false, flagged: false, adjacent: 0 });
    }
  }

  function placeMinesAvoiding(safeR, safeC){
    var forbidden = {};
    forbidden[idx(safeR, safeC)] = true;
    neighborsOf(safeR, safeC).forEach(function(p){ forbidden[idx(p[0], p[1])] = true; });

    var candidates = [];
    for (var i = 0; i < grid.length; i++){
      if (!forbidden[i]) candidates.push(i);
    }
    // shuffle candidates
    for (var i2 = candidates.length - 1; i2 > 0; i2--){
      var j = Math.floor(Math.random() * (i2 + 1));
      var tmp = candidates[i2]; candidates[i2] = candidates[j]; candidates[j] = tmp;
    }
    var placeCount = Math.min(mineCount, candidates.length);
    for (var k = 0; k < placeCount; k++){
      grid[candidates[k]].mine = true;
    }
    // compute adjacency counts
    for (var r = 0; r < rows; r++){
      for (var c = 0; c < cols; c++){
        if (grid[idx(r, c)].mine) continue;
        var cnt = 0;
        neighborsOf(r, c).forEach(function(p){
          if (grid[idx(p[0], p[1])].mine) cnt++;
        });
        grid[idx(r, c)].adjacent = cnt;
      }
    }
  }

  function cellEl(r, c){
    return boardEl.children[idx(r, c)];
  }

  function renderCell(r, c){
    var cell = grid[idx(r, c)];
    var el = cellEl(r, c);
    el.className = "cell";
    el.textContent = "";
    if (cell.revealed){
      el.classList.add("revealed");
      if (cell.mine){
        el.classList.add("mine");
        el.textContent = "💣";
      } else if (cell.adjacent > 0){
        el.classList.add("n" + cell.adjacent);
        el.textContent = cell.adjacent;
      }
    } else if (cell.flagged){
      el.classList.add("flag");
      el.textContent = "🚩";
    }
  }

  function renderAll(){
    for (var r = 0; r < rows; r++){
      for (var c = 0; c < cols; c++) renderCell(r, c);
    }
  }

  function buildBoardDom(){
    boardEl.innerHTML = "";
    boardEl.style.gridTemplateColumns = "repeat(" + cols + ", minmax(0,1fr))";
    var cellSize = Math.min(36, Math.floor(360 / cols));
    boardEl.style.width = (cellSize * cols + (cols - 1) * 3) + "px";
    for (var r = 0; r < rows; r++){
      for (var c = 0; c < cols; c++){
        var el = document.createElement("div");
        el.className = "cell";
        el.setAttribute("data-r", r);
        el.setAttribute("data-c", c);
        boardEl.appendChild(el);
      }
    }
  }

  function floodReveal(r, c){
    var stack = [[r, c]];
    var seen = {};
    while (stack.length){
      var p = stack.pop();
      var pr = p[0], pc = p[1];
      var key = idx(pr, pc);
      if (seen[key]) continue;
      seen[key] = true;
      var cell = grid[key];
      if (cell.revealed || cell.flagged) continue;
      cell.revealed = true;
      revealedCount++;
      if (cell.adjacent === 0 && !cell.mine){
        neighborsOf(pr, pc).forEach(function(np){
          var nk = idx(np[0], np[1]);
          if (!grid[nk].revealed && !grid[nk].flagged) stack.push(np);
        });
      }
    }
  }

  function revealAllMines(){
    for (var i = 0; i < grid.length; i++){
      if (grid[i].mine) grid[i].revealed = true;
    }
  }

  function checkWin(){
    var totalSafe = rows * cols - mineCount;
    return revealedCount >= totalSafe;
  }

  function endGame(win){
    gameOver = true;
    stopTimer();
    renderAll();
    statusBanner.className = "status-banner show " + (win ? "win" : "lose");
    if (win){
      statusText.textContent = "クリア！ " + elapsed + "秒";
      notify("クリア！ " + elapsed + "秒", "success");
      if (!bestTimes[curDiff] || elapsed < bestTimes[curDiff]){
        bestTimes[curDiff] = elapsed;
        saveBest();
        renderBest();
      }
    } else {
      statusText.textContent = "ゲームオーバー 💥";
      notify("ゲームオーバー", "error");
    }
  }

  function handleReveal(r, c){
    if (gameOver) return;
    var cell = grid[idx(r, c)];
    if (cell.revealed || cell.flagged) return;

    if (!firstClickDone){
      firstClickDone = true;
      placeMinesAvoiding(r, c);
      startTimer();
    }

    if (cell.mine){
      cell.revealed = true;
      revealAllMines();
      haptic();
      endGame(false);
      return;
    }

    floodReveal(r, c);
    renderAll();
    haptic();

    if (checkWin()){
      endGame(true);
    }
  }

  function handleFlag(r, c){
    if (gameOver) return;
    var cell = grid[idx(r, c)];
    if (cell.revealed) return;
    if (!firstClickDone){
      // Flagging before first reveal is allowed but does not start the timer/mine placement.
    }
    cell.flagged = !cell.flagged;
    flagsUsed += cell.flagged ? 1 : -1;
    minesVal.textContent = Math.max(0, mineCount - flagsUsed);
    renderCell(r, c);
    haptic();
  }

  function newGame(){
    var d = DIFFS[curDiff];
    rows = d.rows; cols = d.cols; mineCount = d.mines;
    stopTimer();
    firstClickDone = false;
    gameOver = false;
    flagsUsed = 0;
    revealedCount = 0;
    elapsed = 0;
    timeVal.textContent = "0";
    minesVal.textContent = mineCount;
    statusBanner.className = "status-banner";
    buildEmptyGrid();
    buildBoardDom();
    renderAll();
    renderBest();
  }

  boardEl.addEventListener("click", function(e){
    var t = e.target.closest(".cell");
    if (!t) return;
    var r = parseInt(t.getAttribute("data-r"), 10);
    var c = parseInt(t.getAttribute("data-c"), 10);
    if (flagMode){
      handleFlag(r, c);
    } else {
      handleReveal(r, c);
    }
  });

  diffRow.addEventListener("click", function(e){
    var b = e.target.closest(".diff-btn");
    if (!b) return;
    var d = b.getAttribute("data-diff");
    if (d === curDiff) return;
    curDiff = d;
    Array.prototype.forEach.call(diffRow.children, function(btn){
      btn.classList.toggle("active", btn.getAttribute("data-diff") === curDiff);
    });
    newGame();
  });

  flagModeBtn.addEventListener("click", function(){
    flagMode = !flagMode;
    flagModeBtn.classList.toggle("active", flagMode);
  });

  newBtn.addEventListener("click", function(){
    newGame();
  });

  resetBestBtn.addEventListener("click", function(){
    bestTimes = {};
    saveBest();
    renderBest();
    notify("ベスト記録をリセットしました", "info");
  });

  window.addEventListener("pagehide", stopTimer);
  window.addEventListener("beforeunload", stopTimer);

  loadBest();
  newGame();
</script>
</body>
</html>
