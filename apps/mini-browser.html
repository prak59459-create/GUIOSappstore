<!--GUIOS-APP {"id":"mini-browser","name":"簡易ブラウザ","icon":"🌐","color":"#2f6690","version":"1.0.0","author":"Claude","description":"貼り付けたHTML/CSS/JSをその場でプレビューできる簡易ブラウザ風ツール。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>簡易ブラウザ</title>
<style>
  *{ box-sizing:border-box; }
  html,body{ overflow-x:hidden; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:#0e1e29; color:#e7f0f6; min-height:100vh;
    display:flex; flex-direction:column;
  }
  header{ padding:12px 14px 8px; }
  h1{ font-size:17px; margin:0 0 8px; color:#7fc4ee; display:flex; align-items:center; gap:8px; }
  .hint{ font-size:12px; color:#8fa9b8; margin:0 0 10px; line-height:1.5; }
  .addressbar{
    display:flex; align-items:center; gap:8px; background:#132938; border:1px solid #23445a;
    border-radius:999px; padding:8px 14px; margin-bottom:10px;
  }
  .addressbar .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .dot.r{ background:#ef6b5b; } .dot.y{ background:#f0b74a; } .dot.g{ background:#4fbf6b; }
  .addressbar .url{
    flex:1; font-size:13px; color:#a9c7d8; font-family:ui-monospace,Menlo,Consolas,monospace;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-left:6px;
  }
  .tabs{ display:flex; gap:6px; padding:0 14px; }
  .tab{
    flex:1; text-align:center; padding:10px 6px; border-radius:10px 10px 0 0; background:#132938;
    color:#8fa9b8; font-size:13px; font-weight:700; cursor:pointer; min-height:44px;
    display:flex; align-items:center; justify-content:center; border:1px solid #23445a; border-bottom:none;
    -webkit-tap-highlight-color:transparent;
  }
  .tab.active{ background:#1c3b4f; color:#7fc4ee; }
  .editor-wrap{ padding:0 14px; }
  textarea{
    width:100%; height:22vh; min-height:120px; background:#0c1a24; color:#e7f0f6;
    border:1px solid #23445a; border-radius:0 0 12px 12px; padding:12px; font-size:13px;
    font-family:ui-monospace,Menlo,Consolas,monospace; resize:vertical; line-height:1.5; display:none;
  }
  textarea.active{ display:block; }
  .btnrow{ display:flex; gap:10px; padding:12px 14px; flex-wrap:wrap; }
  button{
    border:none; border-radius:12px; font-weight:700; cursor:pointer; -webkit-tap-highlight-color:transparent;
    min-height:48px; font-size:14px;
  }
  .btn-primary{ flex:2; min-width:120px; background:#2f6690; color:#eaf6ff; }
  .btn-secondary{ flex:1; min-width:100px; background:#1c3b4f; color:#bcdcf0; }
  .preview-wrap{
    flex:1; margin:0 14px 14px; border-radius:14px; overflow:hidden; border:1px solid #23445a;
    display:flex; flex-direction:column; min-height:220px; background:#fff;
  }
  .preview-bar{
    background:#132938; color:#8fa9b8; font-size:11px; padding:6px 12px; font-family:ui-monospace,Menlo,Consolas,monospace;
    border-bottom:1px solid #23445a; flex-shrink:0;
  }
  iframe{ flex:1; width:100%; border:none; background:#fff; }
  .toast{
    position:fixed; left:50%; bottom:20px; transform:translateX(-50%) translateY(20px);
    background:#1c3b4f; color:#e7f0f6; padding:10px 18px; border-radius:10px;
    font-size:13px; opacity:0; transition:all .25s; pointer-events:none; max-width:90%; text-align:center;
    z-index:999; border:1px solid #23445a;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <header>
    <h1>🌐 簡易ブラウザ</h1>
    <p class="hint">これは実際にインターネットへ接続するブラウザではありません。自分で書いたHTML/CSS/JSをその場でプレビューするローカル専用ツールです。外部サイトへは接続できません。</p>
    <div class="addressbar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="url" id="addr">about:preview</span>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" data-tab="html">HTML</div>
    <div class="tab" data-tab="css">CSS</div>
    <div class="tab" data-tab="js">JS</div>
  </div>
  <div class="editor-wrap">
    <textarea id="editHtml" class="active" spellcheck="false"></textarea>
    <textarea id="editCss" spellcheck="false"></textarea>
    <textarea id="editJs" spellcheck="false"></textarea>
  </div>

  <div class="btnrow">
    <button class="btn-primary" id="runBtn">▶ プレビュー</button>
    <button class="btn-secondary" id="refreshBtn">更新</button>
  </div>

  <div class="preview-wrap">
    <div class="preview-bar">about:preview</div>
    <iframe id="previewFrame" sandbox="allow-scripts"></iframe>
  </div>

  <div class="toast" id="toast"></div>

<script>
  var hasSDK = !!(window.GUIOS && window.GUIOS.storage);
  var STORAGE_KEY = 'source';
  var FALLBACK_KEY = 'guios-fallback-mini-browser-source';

  var DEFAULT_HTML = '<h1>こんにちは!</h1>\n<p>ここに書いたHTML/CSS/JSがそのままプレビューされます。</p>\n<button id="btn">クリック</button>';
  var DEFAULT_CSS = 'body{ font-family:sans-serif; padding:16px; color:#222; }\nh1{ color:#2f6690; }\nbutton{ padding:8px 16px; border-radius:8px; border:none; background:#2f6690; color:#fff; font-weight:bold; }';
  var DEFAULT_JS = 'document.getElementById("btn").addEventListener("click", function(){\n  alert("ボタンが押されました!");\n});';

  var editHtml = document.getElementById('editHtml');
  var editCss = document.getElementById('editCss');
  var editJs = document.getElementById('editJs');
  var addr = document.getElementById('addr');
  var frame = document.getElementById('previewFrame');
  var toastEl = document.getElementById('toast');

  var tabs = document.querySelectorAll('.tab');
  var editors = { html: editHtml, css: editCss, js: editJs };

  tabs.forEach(function(tab){
    tab.addEventListener('click', function(){
      tabs.forEach(function(t){ t.classList.remove('active'); });
      tab.classList.add('active');
      Object.keys(editors).forEach(function(k){ editors[k].classList.remove('active'); });
      editors[tab.getAttribute('data-tab')].classList.add('active');
    });
  });

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toastEl.classList.remove('show'); }, 1600);
  }
  function notify(msg, type){
    if (window.GUIOS && window.GUIOS.notify) {
      try { window.GUIOS.notify(msg, { type: type || 'info' }); return; } catch(e){}
    }
    showToast(msg);
  }

  async function loadSource(){
    if (hasSDK) {
      try {
        var v = await GUIOS.storage.get(STORAGE_KEY);
        if (v && typeof v === 'object') return v;
      } catch(e){}
      return null;
    } else {
      try {
        var raw = localStorage.getItem(FALLBACK_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch(e){ return null; }
    }
  }
  async function saveSource(){
    var data = { html: editHtml.value, css: editCss.value, js: editJs.value };
    if (hasSDK) {
      try { await GUIOS.storage.set(STORAGE_KEY, data); } catch(e){}
    } else {
      try { localStorage.setItem(FALLBACK_KEY, JSON.stringify(data)); } catch(e){}
    }
  }

  function buildDoc(){
    var html = editHtml.value;
    var css = editCss.value;
    var js = editJs.value;
    return '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
      '<style>' + css + '</style></head><body>' + html +
      '<script>' + js + '<\/script></body></html>';
  }

  function render(){
    frame.srcdoc = buildDoc();
    addr.textContent = 'about:preview';
    saveSource();
  }

  document.getElementById('runBtn').addEventListener('click', function(){
    render();
    notify('プレビューを更新しました', 'success');
  });
  document.getElementById('refreshBtn').addEventListener('click', function(){
    render();
    notify('再読み込みしました', 'info');
  });

  (async function init(){
    var data = await loadSource();
    if (data) {
      editHtml.value = typeof data.html === 'string' ? data.html : DEFAULT_HTML;
      editCss.value = typeof data.css === 'string' ? data.css : DEFAULT_CSS;
      editJs.value = typeof data.js === 'string' ? data.js : DEFAULT_JS;
    } else {
      editHtml.value = DEFAULT_HTML;
      editCss.value = DEFAULT_CSS;
      editJs.value = DEFAULT_JS;
    }
    render();
  })();
</script>
</body>
</html>
