<!--GUIOS-APP {"id":"mood-tracker","name":"気分トラッカー","icon":"😊","color":"#f9a825","version":"1.0.0","author":"Claude","description":"毎日の気分を絵文字で記録し、推移を確認できるトラッカーアプリ。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>気分トラッカー</title>
<style>
  :root{
    --accent:#f9a825;
    --accent-text:#2a1f00;
    --bg:#191510;
    --card:#221c14;
    --card2:#2a231a;
    --text:#f5ecdd;
    --sub:#c9b998;
    --line:#40372a;
    --input:#150f0a;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--text);
    padding:16px; padding-bottom:56px;
  }
  h1{font-size:20px; margin:4px 0 4px; display:flex; align-items:center; gap:8px;}
  .sub-tag{font-size:12px; color:var(--sub); margin:0 0 14px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:16px; margin-bottom:16px;
  }
  .date-row{display:flex; align-items:center; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
  .date-row input[type=date]{
    flex:1; min-width:140px; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--input); color:var(--text); font-size:15px; outline:none;
  }
  .today-btn{
    flex:none; padding:11px 14px; border-radius:10px; border:1px solid var(--line);
    background:transparent; color:var(--sub); font-weight:600; font-size:13px; cursor:pointer; min-height:44px;
  }
  .mood-grid{
    display:grid; grid-template-columns:repeat(6, 1fr); gap:8px; margin-bottom:14px;
  }
  .mood-btn{
    aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:var(--card2); border:2px solid var(--line); border-radius:12px; cursor:pointer;
    font-size:26px; padding:4px; min-height:56px; gap:2px;
  }
  .mood-btn .mood-name{font-size:10px; color:var(--sub); font-weight:600;}
  .mood-btn.selected{border-color:var(--accent); background:rgba(249,168,37,0.18);}
  .field{margin-bottom:6px;}
  label{display:block; font-size:12px; color:var(--sub); margin-bottom:6px; font-weight:600;}
  input[type=text]{
    width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--input); color:var(--text); font-size:15px; outline:none; font-family:inherit;
  }
  input[type=text]:focus{border-color:var(--accent);}
  button{
    padding:12px 22px; border-radius:10px; border:none; background:var(--accent);
    color:var(--accent-text); font-weight:700; font-size:15px; cursor:pointer; min-height:44px;
  }
  button.block{width:100%; margin-top:12px;}
  .section-title{font-size:14px; color:var(--sub); margin:18px 0 10px; font-weight:700;}
  .history-grid{
    display:grid; grid-template-columns:repeat(7, 1fr); gap:6px;
  }
  .day-cell{
    aspect-ratio:1; background:var(--card2); border:1px solid var(--line); border-radius:8px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer;
    position:relative; min-height:38px;
  }
  .day-cell.is-today{border-color:var(--accent);}
  .day-cell.is-selected{box-shadow:0 0 0 2px var(--accent) inset;}
  .day-cell .num{font-size:9px; color:var(--sub); position:absolute; top:2px; left:4px;}
  .day-cell .emoji{font-size:16px;}
  .day-cell.empty-day{opacity:0.35;}
  .legend{display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; font-size:11px; color:var(--sub);}
  .saved-flag{font-size:12px; color:#8fbf8f; margin-top:10px; min-height:16px;}
  .empty{color:var(--sub); text-align:center; padding:24px 20px; font-size:14px;}
</style>
</head>
<body>
  <h1>😊 気分トラッカー</h1>
  <p class="sub-tag">今日の気分を記録して、変化を確認しましょう</p>

  <div class="card">
    <div class="date-row">
      <input type="date" id="dateInput">
      <button type="button" class="today-btn" id="todayBtn">今日</button>
    </div>

    <div class="mood-grid" id="moodGrid"></div>

    <div class="field">
      <label>メモ (任意)</label>
      <input type="text" id="noteInput" placeholder="今日の気分についてひとこと">
    </div>

    <button type="button" class="block" id="saveBtn">この日の気分を保存</button>
    <div class="saved-flag" id="savedFlag"></div>
  </div>

  <div class="section-title">直近30日の推移</div>
  <div class="card">
    <div class="history-grid" id="historyGrid"></div>
  </div>

  <div id="toast" style="position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:var(--card2); color:var(--text); padding:10px 18px; border-radius:10px;
    font-size:13px; opacity:0; pointer-events:none; transition:all .25s; border:1px solid var(--line);
    max-width:90%; text-align:center; z-index:999;"></div>

<script>
  var hasSDK = !!(window.GUIOS && window.GUIOS.storage);
  var STORAGE_KEY = 'entries';
  var FALLBACK_KEY = 'guios-fallback-mood-tracker-entries';

  var MOODS = [
    {code:'great', emoji:'😄', name:'最高'},
    {code:'good',  emoji:'😊', name:'良い'},
    {code:'ok',    emoji:'😐', name:'普通'},
    {code:'meh',   emoji:'😔', name:'いまいち'},
    {code:'sad',   emoji:'😢', name:'悲しい'},
    {code:'angry', emoji:'😡', name:'イライラ'}
  ];
  var MOOD_BY_CODE = {};
  MOODS.forEach(function(m){ MOOD_BY_CODE[m.code] = m; });

  var entries = {}; // date string -> {mood: code, note: string, updatedAt}
  var selectedMood = null;

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.style.opacity = '1';
    t.style.transform = 'translateX(-50%) translateY(0)';
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){
      t.style.opacity = '0';
      t.style.transform = 'translateX(-50%) translateY(20px)';
    }, 1800);
  }
  function notify(msg, type){
    if(window.GUIOS && window.GUIOS.notify){
      GUIOS.notify(msg, {type: type || 'info'});
    } else {
      showToast(msg);
    }
  }

  function pad2(n){ return ('0'+n).slice(-2); }
  function localDateStr(d){
    return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
  }
  function todayStr(){ return localDateStr(new Date()); }

  async function loadEntries(){
    if(hasSDK){
      var v = await GUIOS.storage.get(STORAGE_KEY);
      return (v && typeof v === 'object' && !Array.isArray(v)) ? v : {};
    } else {
      try{
        var raw = localStorage.getItem(FALLBACK_KEY);
        return raw ? JSON.parse(raw) : {};
      }catch(e){ return {}; }
    }
  }
  async function saveEntriesData(obj){
    if(hasSDK){
      await GUIOS.storage.set(STORAGE_KEY, obj);
    } else {
      try{ localStorage.setItem(FALLBACK_KEY, JSON.stringify(obj)); }catch(e){}
    }
  }

  function renderMoodGrid(){
    var grid = document.getElementById('moodGrid');
    grid.innerHTML = '';
    MOODS.forEach(function(m){
      var btn = document.createElement('div');
      btn.className = 'mood-btn' + (selectedMood === m.code ? ' selected' : '');
      var em = document.createElement('div');
      em.textContent = m.emoji;
      var nm = document.createElement('div');
      nm.className = 'mood-name';
      nm.textContent = m.name;
      btn.appendChild(em);
      btn.appendChild(nm);
      btn.addEventListener('click', function(){
        selectedMood = m.code;
        renderMoodGrid();
      });
      grid.appendChild(btn);
    });
  }

  function currentDateKey(){
    return document.getElementById('dateInput').value || todayStr();
  }

  function loadFormFor(key){
    var e = entries[key];
    selectedMood = e ? e.mood : null;
    document.getElementById('noteInput').value = e ? (e.note || '') : '';
    document.getElementById('savedFlag').textContent = '';
    renderMoodGrid();
  }

  async function saveCurrent(){
    if(!selectedMood){
      notify('気分を選んでください', 'error');
      return;
    }
    var key = currentDateKey();
    var note = document.getElementById('noteInput').value.trim();
    entries[key] = {mood: selectedMood, note: note, updatedAt: Date.now()};
    await saveEntriesData(entries);
    renderHistory();
    notify('保存しました', 'success');
    var flag = document.getElementById('savedFlag');
    var m = MOOD_BY_CODE[selectedMood];
    flag.textContent = '✓ ' + key + ' の気分を ' + (m ? m.emoji + ' ' + m.name : '') + ' で記録しました';
  }

  function renderHistory(){
    var grid = document.getElementById('historyGrid');
    grid.innerHTML = '';
    var today = new Date();
    var days = [];
    for(var i = 29; i >= 0; i--){
      var d = new Date(today.getFullYear(), today.getMonth(), today.getDate() - i);
      days.push(d);
    }
    var todayKey = todayStr();
    var selKey = currentDateKey();
    days.forEach(function(d){
      var key = localDateStr(d);
      var e = entries[key];
      var cell = document.createElement('div');
      cell.className = 'day-cell';
      if(key === todayKey) cell.classList.add('is-today');
      if(key === selKey) cell.classList.add('is-selected');
      if(!e) cell.classList.add('empty-day');

      var num = document.createElement('div');
      num.className = 'num';
      num.textContent = String(d.getDate());
      cell.appendChild(num);

      var emoji = document.createElement('div');
      emoji.className = 'emoji';
      emoji.textContent = e ? (MOOD_BY_CODE[e.mood] ? MOOD_BY_CODE[e.mood].emoji : '') : '';
      cell.appendChild(emoji);

      cell.addEventListener('click', function(){
        document.getElementById('dateInput').value = key;
        loadFormFor(key);
        renderHistory();
        window.scrollTo(0,0);
      });

      grid.appendChild(cell);
    });
  }

  document.getElementById('saveBtn').addEventListener('click', saveCurrent);
  document.getElementById('todayBtn').addEventListener('click', function(){
    document.getElementById('dateInput').value = todayStr();
    loadFormFor(todayStr());
    renderHistory();
  });
  document.getElementById('dateInput').addEventListener('change', function(){
    loadFormFor(currentDateKey());
    renderHistory();
  });

  async function init(){
    document.getElementById('dateInput').value = todayStr();
    entries = await loadEntries();
    loadFormFor(todayStr());
    renderHistory();
  }
  init();
</script>
</body>
</html>
