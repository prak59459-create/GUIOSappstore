<!--GUIOS-APP {"id":"multi-timer","name":"マルチタイマー","icon":"⏰","color":"#4b6b8a","version":"1.0.0","author":"Claude","description":"複数のタイマーを同時に設定して管理できるマルチタイマーアプリ。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>マルチタイマー</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:#101823; color:#e8eef7; min-height:100vh; padding:14px; padding-bottom:40px;
  }
  h1{ font-size:18px; margin:0 0 14px; text-align:center; }
  .add-card{
    background:#182436; border-radius:16px; padding:14px; margin-bottom:16px;
    box-shadow:0 6px 18px rgba(0,0,0,.3);
  }
  .add-row{ display:flex; gap:8px; margin-bottom:8px; }
  .add-row input[type=text]{ flex:2; }
  .add-row input[type=number]{ flex:1; min-width:0; text-align:center; }
  input{
    background:#0e1622; border:1px solid #26374d; color:#e8eef7; border-radius:10px;
    padding:10px; font-size:15px; min-height:44px; width:100%; font-family:inherit;
  }
  input:focus{ outline:1px solid #4b6b8a; }
  .add-btn{
    width:100%; background:#4b6b8a; color:#eaf2fb; border:none; border-radius:12px; font-weight:700;
    font-size:15px; padding:12px; min-height:46px; cursor:pointer;
  }
  .add-btn:active{ filter:brightness(1.15); }
  .timers-list{ display:flex; flex-direction:column; gap:12px; }
  .timer-card{
    background:#182436; border-radius:16px; padding:14px; box-shadow:0 6px 18px rgba(0,0,0,.3);
    border:2px solid transparent;
  }
  .timer-card.finished{
    border-color:#e0a63f; animation:pulseCard 1s ease-in-out infinite;
  }
  @keyframes pulseCard{
    0%,100%{ box-shadow:0 6px 18px rgba(0,0,0,.3); }
    50%{ box-shadow:0 0 0 6px rgba(224,166,63,.25); }
  }
  .timer-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px; }
  .timer-head .label{ font-size:15px; font-weight:700; word-break:break-word; }
  .timer-head .status{ font-size:12px; color:#f2c879; }
  .timer-time{
    font-size:clamp(30px, 9vw, 40px); font-weight:700; font-variant-numeric:tabular-nums;
    font-family:'SF Mono','Menlo','Consolas',monospace; text-align:center; margin:8px 0; color:#8fb3d9;
  }
  .timer-card.finished .timer-time{ color:#f2c879; }
  .timer-actions{ display:flex; gap:8px; }
  .timer-actions .btn{
    flex:1; background:#26374d; color:#e8eef7; border:none; border-radius:10px; font-weight:600;
    font-size:13px; padding:11px 0; min-height:42px; cursor:pointer;
  }
  .timer-actions .btn.start{ background:#2f8f5b; }
  .timer-actions .btn.pause{ background:#c48a2f; }
  .timer-actions .btn.del{ background:none; border:1px solid #6b3535; color:#e08a8a; }
  .timer-actions .btn:active{ filter:brightness(1.2); }
  .empty{ text-align:center; color:#6f8bab; font-size:13px; padding:20px 0; }
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:#26374d; color:#e8eef7; padding:10px 18px; border-radius:10px;
    font-size:13px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;
    max-width:90%; text-align:center; box-shadow:0 6px 18px rgba(0,0,0,.35); z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <h1>⏰ マルチタイマー</h1>

  <div class="add-card">
    <div class="add-row">
      <input type="text" id="labelInput" placeholder="タイマー名（例: パスタ）" maxlength="30">
    </div>
    <div class="add-row">
      <input type="number" id="minInput" min="0" max="180" placeholder="分" value="5">
      <input type="number" id="secInput" min="0" max="59" placeholder="秒" value="0">
    </div>
    <button class="add-btn" id="addBtn">＋ タイマーを追加</button>
  </div>

  <div class="timers-list" id="timersList">
    <div class="empty">タイマーがありません。上のフォームから追加してください</div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2400);
  }
  function notify(msg, type){
    if (window.GUIOS && window.GUIOS.notify) {
      try { window.GUIOS.notify(msg, { type: type || 'info' }); return; } catch(e){}
    }
    showToast(msg);
  }
  function haptic(){
    if (window.GUIOS && window.GUIOS.haptic) {
      try { window.GUIOS.haptic(); } catch(e){}
    }
  }

  function uid(){ return Date.now() + '-' + Math.random().toString(36).slice(2,8); }

  // timers: array of state objects. intervals kept in a side map keyed by id (not persisted).
  var timers = [];
  var intervalMap = {};

  function fmt(sec){
    if (sec < 0) sec = 0;
    var m = Math.floor(sec/60), s = sec % 60;
    return (m<10?'0':'')+m + ':' + (s<10?'0':'')+s;
  }

  function renderList(){
    var el = document.getElementById('timersList');
    if (timers.length === 0) {
      el.innerHTML = '<div class="empty">タイマーがありません。上のフォームから追加してください</div>';
      return;
    }
    el.innerHTML = '';
    timers.forEach(function(t){
      var card = document.createElement('div');
      card.className = 'timer-card' + (t.finished ? ' finished' : '');
      card.dataset.id = t.id;
      var statusText = t.finished ? '終了しました' : (t.running ? '実行中' : '一時停止中');
      card.innerHTML =
        '<div class="timer-head"><span class="label">' + escapeHtml(t.label) + '</span>' +
        '<span class="status">' + statusText + '</span></div>' +
        '<div class="timer-time">' + fmt(t.remaining) + '</div>' +
        '<div class="timer-actions">' +
        (t.finished
          ? '<button class="btn del" data-act="dismiss">確認しました</button>'
          : '<button class="btn ' + (t.running ? 'pause' : 'start') + '" data-act="toggle">' + (t.running ? '一時停止' : '開始') + '</button>' +
            '<button class="btn del" data-act="del">削除</button>') +
        '</div>';
      el.appendChild(card);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  function updateCardTime(t){
    var card = document.querySelector('.timer-card[data-id="' + t.id + '"]');
    if (!card) return;
    var timeEl = card.querySelector('.timer-time');
    if (timeEl) timeEl.textContent = fmt(t.remaining);
  }

  function clearTimerInterval(id){
    if (intervalMap[id]) {
      clearInterval(intervalMap[id]);
      delete intervalMap[id];
    }
  }

  function startTimer(t){
    if (t.running || t.finished) return;
    t.running = true;
    t.endTime = Date.now() + t.remaining * 1000;
    clearTimerInterval(t.id);
    intervalMap[t.id] = setInterval(function(){
      var left = Math.round((t.endTime - Date.now()) / 1000);
      if (left <= 0) {
        t.remaining = 0;
        t.running = false;
        t.finished = true;
        clearTimerInterval(t.id);
        renderList();
        notify(t.label + ' のタイマーが終了しました⏰', 'success');
        haptic();
        return;
      }
      t.remaining = left;
      updateCardTime(t);
    }, 250);
    renderList();
  }

  function pauseTimer(t){
    if (!t.running) return;
    t.running = false;
    t.remaining = Math.max(0, Math.round((t.endTime - Date.now()) / 1000));
    clearTimerInterval(t.id);
    renderList();
  }

  function deleteTimer(id){
    clearTimerInterval(id);
    timers = timers.filter(function(t){ return t.id !== id; });
    renderList();
  }

  document.getElementById('timersList').addEventListener('click', function(e){
    var btn = e.target.closest('button');
    if (!btn) return;
    var card = e.target.closest('.timer-card');
    if (!card) return;
    var id = card.dataset.id;
    var t = timers.find(function(x){ return x.id === id; });
    if (!t) return;
    var act = btn.dataset.act;
    if (act === 'toggle') {
      if (t.running) pauseTimer(t); else startTimer(t);
    } else if (act === 'del') {
      deleteTimer(id);
    } else if (act === 'dismiss') {
      deleteTimer(id);
    }
  });

  document.getElementById('addBtn').addEventListener('click', function(){
    var labelInput = document.getElementById('labelInput');
    var minInput = document.getElementById('minInput');
    var secInput = document.getElementById('secInput');
    var label = labelInput.value.trim() || ('タイマー' + (timers.length+1));
    var m = parseInt(minInput.value, 10); if (isNaN(m) || m < 0) m = 0;
    var s = parseInt(secInput.value, 10); if (isNaN(s) || s < 0) s = 0;
    if (s > 59) s = 59;
    var total = m*60 + s;
    if (total <= 0) { notify('時間を設定してください', 'error'); return; }
    var t = {
      id: uid(),
      label: label,
      total: total,
      remaining: total,
      running: false,
      finished: false,
      endTime: 0
    };
    timers.push(t);
    labelInput.value = '';
    renderList();
    startTimer(t);
  });

  window.addEventListener('beforeunload', function(){
    Object.keys(intervalMap).forEach(function(id){ clearInterval(intervalMap[id]); });
  });

  renderList();
  if (window.GUIOS && window.GUIOS.setTitle) {
    try { window.GUIOS.setTitle('マルチタイマー'); } catch(e){}
  }
</script>
</body>
</html>
