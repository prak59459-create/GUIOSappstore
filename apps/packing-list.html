<!--GUIOS-APP {"id":"packing-list","name":"持ち物リスト","icon":"🎒","color":"#795548","version":"1.0.0","author":"Claude","description":"旅行や外出前に持ち物をチェックリストで確認できるアプリ。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>持ち物リスト</title>
<style>
  :root{
    --accent:#b08968;
    --accent-dark:#795548;
    --bg:#191310;
    --card:#241b16;
    --card2:#2c211a;
    --text:#f3ece5;
    --sub:#c9b6a5;
    --line:#403126;
    --input:#140e0b;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; padding:16px; padding-bottom:48px;
  }
  h1{ font-size:19px; margin:4px 0 4px; display:flex; align-items:center; gap:8px; }
  .wrap{ max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  .sub-tag{ font-size:12px; color:var(--sub); margin:0 0 2px; }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px;
  }
  .section-title{ font-size:13px; color:var(--sub); margin:0 0 10px; font-weight:600; }
  .list-tabs{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch;
  }
  .list-tabs::-webkit-scrollbar{ display:none; }
  .list-tab{
    flex:none; padding:10px 16px; border-radius:999px; background:var(--input);
    border:1px solid var(--line); color:var(--sub); font-size:13px; font-weight:600;
    cursor:pointer; white-space:nowrap; min-height:40px;
  }
  .list-tab.active{ background:var(--accent); color:#1f140c; border-color:var(--accent); }
  .add-list-btn{
    flex:none; width:40px; height:40px; border-radius:999px; border:1px dashed var(--line);
    background:transparent; color:var(--sub); font-size:18px; cursor:pointer;
  }
  .progress-wrap{ margin-top:14px; }
  .progress-label{ display:flex; justify-content:space-between; font-size:12px; color:var(--sub); margin-bottom:6px; }
  .progress-track{ background:var(--input); border-radius:8px; height:12px; overflow:hidden; }
  .progress-fill{ height:100%; background:var(--accent); border-radius:8px; transition:width .3s; }
  .add-row{ display:flex; gap:8px; }
  .add-row input{
    flex:1; min-width:0; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--input); color:var(--text); font-size:15px; outline:none;
  }
  .add-row input:focus{ border-color:var(--accent); }
  button{
    padding:12px 18px; border-radius:10px; border:none; background:var(--accent);
    color:#1f140c; font-weight:700; font-size:15px; cursor:pointer; min-height:44px;
  }
  button.icon-add{ flex:none; width:52px; padding:0; font-size:20px; }
  button.secondary{
    background:transparent; color:var(--sub); border:1px solid var(--line); font-weight:600;
  }
  .suggest-wrap{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .suggest-chip{
    padding:8px 14px; border-radius:999px; background:var(--input); border:1px solid var(--line);
    color:var(--sub); font-size:12px; cursor:pointer; min-height:36px;
  }
  .suggest-chip:active{ background:var(--card2); }
  .item-list{ display:flex; flex-direction:column; gap:8px; }
  .item{
    display:flex; align-items:center; gap:12px; background:var(--input); border:1px solid var(--line);
    border-radius:12px; padding:12px 14px;
  }
  .item.checked{ opacity:0.55; }
  .item .chk{
    flex:none; width:26px; height:26px; border-radius:8px; border:2px solid var(--accent);
    display:flex; align-items:center; justify-content:center; font-size:15px; color:transparent;
    cursor:pointer; background:transparent;
  }
  .item.checked .chk{ background:var(--accent); color:#1f140c; }
  .item .name{ flex:1; min-width:0; font-size:15px; }
  .item.checked .name{ text-decoration:line-through; color:var(--sub); }
  .item .del{
    flex:none; width:36px; height:36px; min-height:36px; padding:0; border-radius:8px;
    background:transparent; border:1px solid var(--line); color:var(--sub); font-size:15px;
  }
  .empty{ color:var(--sub); text-align:center; padding:30px 10px; font-size:13px; }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none;
    align-items:flex-end; justify-content:center; z-index:100;
  }
  .modal-overlay.show{ display:flex; }
  .modal{
    background:var(--card); border-radius:20px 20px 0 0; padding:20px; width:100%; max-width:560px;
    border:1px solid var(--line); border-bottom:none;
  }
  .modal h2{ font-size:16px; margin:0 0 14px; }
  .modal input{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--input); color:var(--text); font-size:15px; outline:none; margin-bottom:14px;
  }
  .modal .modal-actions{ display:flex; gap:10px; }
  .modal .modal-actions button{ flex:1; }
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:var(--card2); color:var(--text); padding:10px 18px; border-radius:10px;
    font-size:13px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;
    max-width:90%; text-align:center; box-shadow:0 6px 18px rgba(0,0,0,.35); z-index:200;
    border:1px solid var(--line);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>🎒 持ち物リスト</h1>
    <p class="sub-tag">旅行や外出前の持ち物をチェックリストで確認できます</p>

    <div class="card">
      <div class="section-title">リスト</div>
      <div class="list-tabs" id="listTabs"></div>
      <div class="progress-wrap" id="progressWrap" style="display:none;">
        <div class="progress-label">
          <span id="progressText">0/0 完了</span>
          <span id="progressPct">0%</span>
        </div>
        <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%;"></div></div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">持ち物を追加</div>
      <div class="add-row">
        <input type="text" id="itemNameInput" placeholder="持ち物名（例: 財布）" maxlength="60">
        <button class="icon-add" id="addItemBtn">＋</button>
      </div>
      <div class="suggest-wrap" id="suggestWrap"></div>
    </div>

    <div class="card">
      <div class="section-title" id="itemCountLabel">持ち物</div>
      <div id="itemListWrap">
        <div class="empty">まだ持ち物がありません</div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2>新しいリストを作成</h2>
      <input type="text" id="newListNameInput" placeholder="リスト名（例: 沖縄旅行）" maxlength="30">
      <div class="modal-actions">
        <button class="secondary" id="modalCancelBtn">キャンセル</button>
        <button id="modalCreateBtn">作成</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  var APP_ID = 'packing-list';
  var FALLBACK_KEY = 'guios-fallback-' + APP_ID + '-data';
  var hasSDK = !!(window.GUIOS && window.GUIOS.storage);

  var STARTER_SUGGESTIONS = ['財布', '携帯電話の充電器', '着替え', '歯ブラシ', 'パスポート', '常備薬'];

  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }
  function notify(msg, type){
    if (window.GUIOS && window.GUIOS.notify) {
      try { window.GUIOS.notify(msg, { type: type || 'info' }); return; } catch(e){}
    }
    showToast(msg);
  }
  function haptic(){
    if (window.GUIOS && window.GUIOS.haptic) {
      try { window.GUIOS.haptic(); } catch(e){}
    }
  }
  function uid(){ return Date.now() + '-' + Math.random().toString(36).slice(2,8); }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function makeDefaultData(){
    return {
      lists: [ { id: uid(), name: '日帰り旅行', items: [] } ],
      activeListId: null
    };
  }

  async function loadData(){
    if (hasSDK) {
      try {
        var v = await window.GUIOS.storage.get('data');
        if (v && Array.isArray(v.lists) && v.lists.length > 0) return v;
        return makeDefaultData();
      } catch(e){ return makeDefaultData(); }
    } else {
      try {
        var raw = localStorage.getItem(FALLBACK_KEY);
        var obj = raw ? JSON.parse(raw) : null;
        if (obj && Array.isArray(obj.lists) && obj.lists.length > 0) return obj;
        return makeDefaultData();
      } catch(e){ return makeDefaultData(); }
    }
  }
  async function saveData(){
    if (hasSDK) {
      try { await window.GUIOS.storage.set('data', data); } catch(e){}
    } else {
      try { localStorage.setItem(FALLBACK_KEY, JSON.stringify(data)); } catch(e){}
    }
  }

  var data = makeDefaultData();

  function getActiveList(){
    var list = data.lists.find(function(l){ return l.id === data.activeListId; });
    if (!list) {
      list = data.lists[0];
      data.activeListId = list ? list.id : null;
    }
    return list;
  }

  function renderTabs(){
    var wrap = document.getElementById('listTabs');
    wrap.innerHTML = '';
    data.lists.forEach(function(l){
      var tab = document.createElement('button');
      tab.className = 'list-tab' + (l.id === data.activeListId ? ' active' : '');
      tab.textContent = l.name;
      tab.addEventListener('click', function(){
        data.activeListId = l.id;
        saveData();
        renderAll();
      });
      tab.addEventListener('dblclick', function(){ renameList(l.id); });
      wrap.appendChild(tab);
    });
    var addBtn = document.createElement('button');
    addBtn.className = 'add-list-btn';
    addBtn.textContent = '+';
    addBtn.title = '新しいリスト';
    addBtn.addEventListener('click', openNewListModal);
    wrap.appendChild(addBtn);
  }

  function openNewListModal(){
    document.getElementById('newListNameInput').value = '';
    document.getElementById('modalOverlay').classList.add('show');
    setTimeout(function(){ document.getElementById('newListNameInput').focus(); }, 50);
  }
  function closeNewListModal(){
    document.getElementById('modalOverlay').classList.remove('show');
  }
  document.getElementById('modalCancelBtn').addEventListener('click', closeNewListModal);
  document.getElementById('modalOverlay').addEventListener('click', function(e){
    if (e.target === document.getElementById('modalOverlay')) closeNewListModal();
  });
  document.getElementById('modalCreateBtn').addEventListener('click', async function(){
    var input = document.getElementById('newListNameInput');
    var name = input.value.trim();
    if (!name) { notify('リスト名を入力してください', 'error'); return; }
    var list = { id: uid(), name: name.slice(0,30), items: [] };
    data.lists.push(list);
    data.activeListId = list.id;
    await saveData();
    closeNewListModal();
    renderAll();
    notify('リストを作成しました', 'success');
  });
  document.getElementById('newListNameInput').addEventListener('keydown', function(e){
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('modalCreateBtn').click(); }
  });

  function renameList(id){
    var list = data.lists.find(function(l){ return l.id === id; });
    if (!list) return;
    var name = prompt('リスト名を変更', list.name);
    if (name === null) return;
    name = name.trim();
    if (!name) return;
    list.name = name.slice(0,30);
    saveData();
    renderAll();
  }

  function renderProgress(){
    var list = getActiveList();
    var progressWrap = document.getElementById('progressWrap');
    if (!list || list.items.length === 0) {
      progressWrap.style.display = 'none';
      return;
    }
    progressWrap.style.display = 'block';
    var total = list.items.length;
    var done = list.items.filter(function(i){ return i.checked; }).length;
    var pct = total > 0 ? Math.round((done/total)*100) : 0;
    document.getElementById('progressText').textContent = done + '/' + total + ' 完了';
    document.getElementById('progressPct').textContent = pct + '%';
    document.getElementById('progressFill').style.width = pct + '%';
  }

  function renderSuggestions(){
    var list = getActiveList();
    var wrap = document.getElementById('suggestWrap');
    wrap.innerHTML = '';
    if (!list) return;
    var existingNames = list.items.map(function(i){ return i.name; });
    var toShow = STARTER_SUGGESTIONS.filter(function(s){ return existingNames.indexOf(s) === -1; });
    if (toShow.length === 0) return;
    toShow.forEach(function(s){
      var chip = document.createElement('button');
      chip.className = 'suggest-chip';
      chip.textContent = '＋ ' + s;
      chip.addEventListener('click', function(){ quickAddItem(s); });
      wrap.appendChild(chip);
    });
  }

  function renderItems(){
    var list = getActiveList();
    var wrap = document.getElementById('itemListWrap');
    var countLabel = document.getElementById('itemCountLabel');
    if (!list) {
      wrap.innerHTML = '<div class="empty">リストがありません</div>';
      countLabel.textContent = '持ち物';
      return;
    }
    countLabel.textContent = list.name + 'の持ち物';
    var items = list.items || [];
    if (items.length === 0) {
      wrap.innerHTML = '<div class="empty">まだ持ち物がありません</div>';
      return;
    }
    var unchecked = items.filter(function(i){ return !i.checked; });
    var checked = items.filter(function(i){ return i.checked; });

    wrap.innerHTML = '';
    var container = document.createElement('div');
    container.className = 'item-list';

    function buildRow(item){
      var row = document.createElement('div');
      row.className = 'item' + (item.checked ? ' checked' : '');
      row.innerHTML =
        '<button class="chk" data-id="' + item.id + '">✓</button>' +
        '<div class="name">' + escapeHtml(item.name) + '</div>' +
        '<button class="del" data-id="' + item.id + '">✕</button>';
      return row;
    }
    unchecked.concat(checked).forEach(function(item){ container.appendChild(buildRow(item)); });
    wrap.appendChild(container);
  }

  function renderAll(){
    renderTabs();
    renderProgress();
    renderSuggestions();
    renderItems();
  }

  document.getElementById('itemListWrap').addEventListener('click', async function(e){
    var list = getActiveList();
    if (!list) return;
    var chk = e.target.closest('.chk');
    var del = e.target.closest('.del');
    if (chk) {
      var id = chk.dataset.id;
      var item = list.items.find(function(i){ return i.id === id; });
      if (item) {
        item.checked = !item.checked;
        await saveData();
        renderProgress();
        renderItems();
        haptic();
      }
      return;
    }
    if (del) {
      var did = del.dataset.id;
      list.items = list.items.filter(function(i){ return i.id !== did; });
      await saveData();
      renderProgress();
      renderSuggestions();
      renderItems();
      return;
    }
  });

  async function quickAddItem(name){
    var list = getActiveList();
    if (!list) return;
    list.items.push({ id: uid(), name: name, checked: false });
    await saveData();
    renderProgress();
    renderSuggestions();
    renderItems();
    haptic();
  }

  async function addItem(){
    var list = getActiveList();
    if (!list) return;
    var input = document.getElementById('itemNameInput');
    var name = input.value.trim();
    if (!name) {
      notify('持ち物名を入力してください', 'error');
      return;
    }
    list.items.push({ id: uid(), name: name, checked: false });
    await saveData();
    input.value = '';
    input.focus();
    renderProgress();
    renderSuggestions();
    renderItems();
    notify('追加しました', 'success');
    haptic();
  }

  document.getElementById('addItemBtn').addEventListener('click', addItem);
  document.getElementById('itemNameInput').addEventListener('keydown', function(e){
    if (e.key === 'Enter') { e.preventDefault(); addItem(); }
  });

  (async function init(){
    data = await loadData();
    if (!data.activeListId && data.lists.length > 0) {
      data.activeListId = data.lists[0].id;
    }
    renderAll();
  })();
</script>
</body>
</html>
