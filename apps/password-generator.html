<!--GUIOS-APP {"id":"password-generator","name":"パスワード生成","icon":"🔐","color":"#5b4b8a","version":"1.0.0","author":"Claude","description":"条件を指定して安全なランダムパスワードを生成できるツール。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>パスワード生成</title>
<style>
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:#130f1e; color:#ece8f7; min-height:100vh; padding:16px;
  }
  h1{ font-size:18px; margin:0 0 14px; color:#b6a4e8; }
  .card{ background:#1e1832; border-radius:16px; padding:16px; margin-bottom:14px; }
  .output-row{ display:flex; gap:10px; margin-bottom:6px; }
  .output{
    flex:1; padding:16px 14px; border-radius:12px; border:1px solid #372a5c;
    background:#130f1e; color:#ece8f7; font-size:17px; font-family:ui-monospace,Menlo,Consolas,monospace;
    min-height:52px; word-break:break-all; display:flex; align-items:center;
  }
  .copy-btn{
    background:#5b4b8a; color:#f2eefc; border:none; border-radius:12px; padding:0 18px;
    font-size:14px; font-weight:700; cursor:pointer; min-height:52px; flex-shrink:0;
    -webkit-tap-highlight-color:transparent;
  }
  .strength{ font-size:13px; margin-bottom:16px; min-height:18px; }
  .strength .label{ font-weight:700; padding:3px 10px; border-radius:8px; display:inline-block; }
  .s-weak{ background:#5c2a2a; color:#ffb0b0; }
  .s-normal{ background:#5c4a2a; color:#ffe0a0; }
  .s-strong{ background:#2a5c3a; color:#a8f0c0; }
  .s-vstrong{ background:#2a4a5c; color:#a0d8ff; }
  .slider-row{ margin-bottom:16px; }
  .slider-label{ display:flex; justify-content:space-between; font-size:14px; margin-bottom:8px; color:#c9bdf0; }
  .slider-label b{ color:#ece8f7; font-size:16px; }
  input[type="range"]{
    width:100%; height:36px; accent-color:#5b4b8a; cursor:pointer;
  }
  .checks{ display:flex; flex-direction:column; gap:2px; margin-bottom:16px; }
  .check-item{
    display:flex; align-items:center; gap:12px; padding:12px 6px; min-height:44px;
    border-bottom:1px solid #2a2244; cursor:pointer;
  }
  .check-item:last-child{ border-bottom:none; }
  .check-item input{ width:20px; height:20px; accent-color:#5b4b8a; flex-shrink:0; }
  .check-item span{ font-size:15px; }
  .check-item .sample{ margin-left:auto; color:#8677b3; font-size:12px; font-family:ui-monospace,Menlo,Consolas,monospace; }
  .gen-btn{
    width:100%; padding:16px; border-radius:12px; border:none; background:#5b4b8a;
    color:#f2eefc; font-weight:700; font-size:16px; cursor:pointer; min-height:52px;
    -webkit-tap-highlight-color:transparent;
  }
  .warn{ color:#ffb0b0; font-size:13px; margin-top:10px; text-align:center; }
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:#2a2244; color:#ece8f7; padding:10px 18px; border-radius:10px;
    font-size:13px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;
    max-width:90%; text-align:center; box-shadow:0 6px 18px rgba(0,0,0,.35); z-index:100;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <h1>🔐 パスワード生成</h1>

  <div class="card">
    <div class="output-row">
      <input class="output" id="output" readonly value="">
      <button class="copy-btn" id="copyBtn">コピー</button>
    </div>
    <div class="strength" id="strength"></div>

    <div class="slider-row">
      <div class="slider-label"><span>文字数</span><b id="lenVal">16</b></div>
      <input type="range" id="lenSlider" min="4" max="64" value="16">
    </div>

    <div class="checks">
      <label class="check-item">
        <input type="checkbox" id="chkUpper" checked>
        <span>大文字 (A-Z)</span>
        <span class="sample">ABC</span>
      </label>
      <label class="check-item">
        <input type="checkbox" id="chkLower" checked>
        <span>小文字 (a-z)</span>
        <span class="sample">abc</span>
      </label>
      <label class="check-item">
        <input type="checkbox" id="chkNumber" checked>
        <span>数字 (0-9)</span>
        <span class="sample">123</span>
      </label>
      <label class="check-item">
        <input type="checkbox" id="chkSymbol">
        <span>記号</span>
        <span class="sample">!@#$</span>
      </label>
    </div>

    <button class="gen-btn" id="genBtn">生成</button>
    <div class="warn" id="warn" style="display:none;">少なくとも1つの文字種を選んでください</div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  var CHARSETS = {
    upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
    lower: 'abcdefghijklmnopqrstuvwxyz',
    number: '0123456789',
    symbol: '!@#$%^&*()_-+=<>?'
  };

  var output = document.getElementById('output');
  var copyBtn = document.getElementById('copyBtn');
  var lenSlider = document.getElementById('lenSlider');
  var lenVal = document.getElementById('lenVal');
  var strengthEl = document.getElementById('strength');
  var warnEl = document.getElementById('warn');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  var chkUpper = document.getElementById('chkUpper');
  var chkLower = document.getElementById('chkLower');
  var chkNumber = document.getElementById('chkNumber');
  var chkSymbol = document.getElementById('chkSymbol');

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }
  function notify(msg, type){
    if (window.GUIOS && window.GUIOS.notify) {
      try { window.GUIOS.notify(msg, { type: type || 'info' }); return; } catch(e){}
    }
    showToast(msg);
  }
  function copyText(text){
    if (window.GUIOS && window.GUIOS.clipboard && window.GUIOS.clipboard.writeText) {
      try { window.GUIOS.clipboard.writeText(text); return; } catch(e){}
    }
    try { navigator.clipboard.writeText(text); } catch(e){}
  }

  function randomInt(max){
    if (window.crypto && window.crypto.getRandomValues) {
      var buf = new Uint32Array(1);
      window.crypto.getRandomValues(buf);
      return buf[0] % max;
    }
    return Math.floor(Math.random() * max);
  }

  lenSlider.addEventListener('input', function(){
    lenVal.textContent = lenSlider.value;
  });

  function activeSets(){
    var sets = [];
    if (chkUpper.checked) sets.push(CHARSETS.upper);
    if (chkLower.checked) sets.push(CHARSETS.lower);
    if (chkNumber.checked) sets.push(CHARSETS.number);
    if (chkSymbol.checked) sets.push(CHARSETS.symbol);
    return sets;
  }

  function generatePassword(){
    var sets = activeSets();
    if (!sets.length) {
      warnEl.style.display = 'block';
      output.value = '';
      strengthEl.innerHTML = '';
      return null;
    }
    warnEl.style.display = 'none';
    var length = parseInt(lenSlider.value, 10);
    var all = sets.join('');
    var chars = [];

    // Ensure at least one char from each selected set
    sets.forEach(function(set){
      chars.push(set[randomInt(set.length)]);
    });
    while (chars.length < length) {
      chars.push(all[randomInt(all.length)]);
    }
    // Fisher-Yates shuffle
    for (var i = chars.length - 1; i > 0; i--) {
      var j = randomInt(i + 1);
      var tmp = chars[i]; chars[i] = chars[j]; chars[j] = tmp;
    }
    chars = chars.slice(0, length);
    var pw = chars.join('');
    output.value = pw;
    updateStrength(pw, sets.length, length);
    return pw;
  }

  function updateStrength(pw, varietyCount, length){
    var score = 0;
    if (length >= 8) score++;
    if (length >= 12) score++;
    if (length >= 16) score++;
    score += (varietyCount - 1);

    var label, cls;
    if (score <= 1) { label = '弱い'; cls = 's-weak'; }
    else if (score <= 2) { label = '普通'; cls = 's-normal'; }
    else if (score <= 4) { label = '強い'; cls = 's-strong'; }
    else { label = '非常に強い'; cls = 's-vstrong'; }

    strengthEl.innerHTML = '強度: <span class="label ' + cls + '">' + label + '</span>';
  }

  document.getElementById('genBtn').addEventListener('click', function(){
    generatePassword();
  });

  copyBtn.addEventListener('click', function(){
    if (!output.value) {
      notify('先にパスワードを生成してください', 'error');
      return;
    }
    copyText(output.value);
    notify('コピーしました', 'success');
  });

  [chkUpper, chkLower, chkNumber, chkSymbol].forEach(function(chk){
    chk.addEventListener('change', function(){
      var sets = activeSets();
      if (!sets.length) {
        warnEl.style.display = 'block';
      } else {
        warnEl.style.display = 'none';
      }
    });
  });

  // initial generation
  generatePassword();
</script>
</body>
</html>
