<!--GUIOS-APP {"id":"password-strength-checker","name":"パスワード強度チェック","icon":"🔍","color":"#4a4a6a","version":"1.0.0","author":"Claude","description":"入力したパスワードの強度を判定し、改善点を教えてくれるツール。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>パスワード強度チェック</title>
<style>
  :root{
    --accent:#8686c9;
    --bg:#121220;
    --card:#1a1a2c;
    --text:#eceaf7;
    --sub:#a9a7c4;
    --line:#2c2c46;
    --danger:#e05c5c;
    --warn:#e0a95c;
    --ok:#6fbf73;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--text);
    display:flex; flex-direction:column;
  }
  .topbar{padding:16px 16px 8px; flex:none;}
  .topbar h1{font-size:18px; margin:0 0 4px; display:flex; align-items:center; gap:8px;}
  .note{font-size:12px; color:var(--sub); margin:0 0 14px;}
  .content{flex:1; overflow-y:auto; padding:0 16px 24px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:16px; margin-bottom:14px;
  }
  .pw-row{position:relative; display:flex; gap:8px;}
  #pwInput{
    flex:1; min-width:0; padding:13px 44px 13px 14px; border-radius:10px; border:1px solid var(--line);
    background:#0b0b16; color:var(--text); font-size:16px; outline:none; letter-spacing:1px;
  }
  #pwInput:focus{border-color:var(--accent);}
  #toggleBtn{
    position:absolute; right:4px; top:4px; bottom:4px; width:40px; border:none; background:transparent;
    color:var(--sub); font-size:18px; cursor:pointer; border-radius:8px;
  }
  #toggleBtn:hover{color:var(--text);}
  .bar-wrap{margin-top:14px;}
  .bar-track{
    height:10px; border-radius:6px; background:#0b0b16; border:1px solid var(--line); overflow:hidden;
  }
  .bar-fill{height:100%; width:0%; border-radius:6px; transition:width 0.2s ease, background-color 0.2s ease; background:var(--danger);}
  .rating-row{
    display:flex; align-items:center; justify-content:space-between; margin-top:10px;
  }
  .rating-label{font-size:16px; font-weight:800;}
  .score-label{font-size:12px; color:var(--sub);}
  .section-title{font-size:13px; font-weight:700; color:var(--sub); margin:0 0 10px; text-transform:uppercase; letter-spacing:0.5px;}
  .breakdown{display:flex; flex-direction:column; gap:8px;}
  .bd-item{
    display:flex; align-items:center; justify-content:space-between; font-size:13px;
    padding:8px 10px; border-radius:8px; background:#0b0b16; border:1px solid var(--line);
  }
  .bd-item .mark{font-weight:800;}
  .bd-item.pass .mark{color:var(--ok);}
  .bd-item.fail .mark{color:var(--sub);}
  .entropy-line{font-size:12px; color:var(--sub); margin-top:10px;}
  .suggest-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .suggest-list li{
    font-size:13px; padding:10px 12px; border-radius:8px; background:rgba(224,169,92,0.1);
    border:1px solid rgba(224,169,92,0.35); color:var(--text); display:flex; gap:8px; align-items:flex-start;
  }
  .suggest-list li::before{content:"⚠️"; flex:none;}
  .warn-common{
    margin-top:10px; padding:10px 12px; border-radius:8px; background:rgba(224,92,92,0.12);
    border:1px solid rgba(224,92,92,0.4); font-size:13px; color:var(--text);
  }
  .empty-hint{color:var(--sub); font-size:13px; text-align:center; padding:6px 0 2px;}
</style>
</head>
<body>
  <div class="topbar">
    <h1>🔍 パスワード強度チェック</h1>
    <p class="note">入力内容は保存・送信されません。この端末内でのみ判定します。</p>
  </div>

  <div class="content">
    <div class="card">
      <div class="pw-row">
        <input type="password" id="pwInput" placeholder="パスワードを入力..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button id="toggleBtn" type="button" aria-label="表示切替">👁️</button>
      </div>

      <div class="bar-wrap">
        <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
        <div class="rating-row">
          <span class="rating-label" id="ratingLabel">未入力</span>
          <span class="score-label" id="scoreLabel"></span>
        </div>
        <div class="entropy-line" id="entropyLine"></div>
      </div>
    </div>

    <div class="card" id="breakdownCard">
      <div class="section-title">スコア内訳</div>
      <div class="breakdown" id="breakdownList">
        <div class="empty-hint">パスワードを入力すると詳細が表示されます</div>
      </div>
    </div>

    <div class="card" id="suggestCard" hidden>
      <div class="section-title">改善のヒント</div>
      <ul class="suggest-list" id="suggestList"></ul>
    </div>
  </div>

  <div id="toastHost" style="position:fixed; left:0; right:0; bottom:18px; display:flex; justify-content:center; pointer-events:none; z-index:9999;"></div>

<script>
(function(){
  'use strict';
  // NOTE: This app never stores or transmits the entered password.
  // No GUIOS.storage.set / localStorage.setItem call in this file ever
  // receives the password value or any derivative of it.

  var pwInput = document.getElementById('pwInput');
  var toggleBtn = document.getElementById('toggleBtn');
  var barFill = document.getElementById('barFill');
  var ratingLabel = document.getElementById('ratingLabel');
  var scoreLabel = document.getElementById('scoreLabel');
  var entropyLine = document.getElementById('entropyLine');
  var breakdownList = document.getElementById('breakdownList');
  var suggestCard = document.getElementById('suggestCard');
  var suggestList = document.getElementById('suggestList');

  var COMMON_PATTERNS = [
    '123456','12345678','123456789','1234567890','password','qwerty',
    'abc123','111111','123123','letmein','iloveyou','admin','welcome',
    '000000','qwertyuiop','1q2w3e4r','password1','passw0rd','sunshine',
    'monkey','football','dragon','master','login','princess'
  ];

  function isCommonPattern(pw){
    var lower = pw.toLowerCase();
    for(var i = 0; i < COMMON_PATTERNS.length; i++){
      if(lower === COMMON_PATTERNS[i] || lower.indexOf(COMMON_PATTERNS[i]) !== -1){
        return true;
      }
    }
    // sequential digits like 12345, 23456...
    if(/^(0123|1234|2345|3456|4567|5678|6789|9876|8765|7654|6543|5432|4321|3210)/.test(lower)){
      return true;
    }
    // all same character
    if(/^(.)\1+$/.test(pw)){
      return true;
    }
    return false;
  }

  function analyze(pw){
    var len = pw.length;
    var hasLower = /[a-z]/.test(pw);
    var hasUpper = /[A-Z]/.test(pw);
    var hasDigit = /[0-9]/.test(pw);
    var hasSymbol = /[^a-zA-Z0-9]/.test(pw);
    var classCount = [hasLower, hasUpper, hasDigit, hasSymbol].filter(Boolean).length;
    var common = isCommonPattern(pw);

    var poolSize = 0;
    if(hasLower) poolSize += 26;
    if(hasUpper) poolSize += 26;
    if(hasDigit) poolSize += 10;
    if(hasSymbol) poolSize += 32;
    if(poolSize === 0) poolSize = 1;

    var entropy = len > 0 ? len * (Math.log(poolSize) / Math.log(2)) : 0;

    // Simple 0-100 score
    var score = 0;
    score += Math.min(len, 20) * 3; // up to 60
    score += classCount * 10;       // up to 40
    if(common) score = Math.min(score, 25);
    if(len < 8) score = Math.min(score, 40);
    score = Math.max(0, Math.min(100, Math.round(score)));

    var rating, color;
    if(len === 0){
      rating = '未入力'; color = '#555';
    } else if(score < 25){
      rating = '非常に弱い'; color = 'var(--danger)';
    } else if(score < 45){
      rating = '弱い'; color = 'var(--danger)';
    } else if(score < 65){
      rating = '普通'; color = 'var(--warn)';
    } else if(score < 85){
      rating = '強い'; color = 'var(--ok)';
    } else {
      rating = '非常に強い'; color = 'var(--ok)';
    }

    var suggestions = [];
    if(len > 0){
      if(len < 8) suggestions.push('8文字以上にしましょう');
      else if(len < 12) suggestions.push('できれば12文字以上にするとより安全です');
      if(!hasLower) suggestions.push('小文字を含めましょう');
      if(!hasUpper) suggestions.push('大文字を含めましょう');
      if(!hasDigit) suggestions.push('数字を含めましょう');
      if(!hasSymbol) suggestions.push('記号を含めましょう');
      if(common) suggestions.push('よくあるパターン(123456, password等)は避けましょう');
    }

    return {
      len: len, hasLower: hasLower, hasUpper: hasUpper, hasDigit: hasDigit,
      hasSymbol: hasSymbol, classCount: classCount, common: common,
      entropy: entropy, score: score, rating: rating, color: color,
      suggestions: suggestions
    };
  }

  function bdRow(label, ok){
    var div = document.createElement('div');
    div.className = 'bd-item ' + (ok ? 'pass' : 'fail');
    var span = document.createElement('span');
    span.textContent = label;
    var mark = document.createElement('span');
    mark.className = 'mark';
    mark.textContent = ok ? '✓' : '—';
    div.appendChild(span);
    div.appendChild(mark);
    return div;
  }

  function render(){
    var pw = pwInput.value;
    var r = analyze(pw);

    barFill.style.width = r.len === 0 ? '0%' : Math.max(6, r.score) + '%';
    barFill.style.background = r.color;
    ratingLabel.textContent = r.rating;
    ratingLabel.style.color = r.len === 0 ? 'var(--sub)' : r.color;
    scoreLabel.textContent = r.len > 0 ? 'スコア ' + r.score + '/100' : '';
    entropyLine.textContent = r.len > 0 ? '推定エントロピー: 約 ' + Math.round(r.entropy) + ' ビット / 長さ: ' + r.len + '文字' : '';

    breakdownList.innerHTML = '';
    if(r.len === 0){
      var hint = document.createElement('div');
      hint.className = 'empty-hint';
      hint.textContent = 'パスワードを入力すると詳細が表示されます';
      breakdownList.appendChild(hint);
    } else {
      breakdownList.appendChild(bdRow('8文字以上', r.len >= 8));
      breakdownList.appendChild(bdRow('小文字を含む', r.hasLower));
      breakdownList.appendChild(bdRow('大文字を含む', r.hasUpper));
      breakdownList.appendChild(bdRow('数字を含む', r.hasDigit));
      breakdownList.appendChild(bdRow('記号を含む', r.hasSymbol));
      breakdownList.appendChild(bdRow('よくあるパターンではない', !r.common));

      if(r.common){
        var warnEl = document.createElement('div');
        warnEl.className = 'warn-common';
        warnEl.textContent = '⚠️ このパスワードはよくあるパターンに含まれるため非常に危険です。';
        breakdownList.appendChild(warnEl);
      }
    }

    if(r.suggestions.length > 0){
      suggestCard.hidden = false;
      suggestList.innerHTML = '';
      r.suggestions.forEach(function(s){
        var li = document.createElement('li');
        li.textContent = s;
        suggestList.appendChild(li);
      });
    } else {
      suggestCard.hidden = true;
      suggestList.innerHTML = '';
    }
  }

  pwInput.addEventListener('input', render);

  var visible = false;
  toggleBtn.addEventListener('click', function(){
    visible = !visible;
    pwInput.type = visible ? 'text' : 'password';
    toggleBtn.textContent = visible ? '🙈' : '👁️';
  });

  render();
})();
</script>
</body>
</html>
