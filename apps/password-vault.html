<!--GUIOS-APP {"id":"password-vault","name":"パスワード保管庫","icon":"🔒","color":"#4a4a6a","version":"1.0.0","author":"Claude","description":"マスターパスワードで暗号化して複数サイトのログイン情報を保管する金庫アプリ。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>パスワード保管庫</title>
<style>
  *{ box-sizing:border-box; }
  html,body{ overflow-x:hidden; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:#15152a; color:#e8e8f5; min-height:100vh; padding-bottom:24px;
  }
  header{ padding:14px 14px 6px; position:sticky; top:0; background:#15152a; z-index:5; }
  h1{ font-size:17px; margin:0 0 6px; color:#a6a6e0; display:flex; align-items:center; gap:8px; }
  .disclaimer{ font-size:11.5px; color:#8a8ab0; line-height:1.5; margin:0 0 10px; }
  main{ padding:0 14px; }

  .lock-wrap{ display:flex; flex-direction:column; align-items:center; padding:40px 10px; }
  .lock-icon{ font-size:56px; margin-bottom:14px; }
  .lock-card{ background:#1e1e3a; border-radius:16px; padding:20px; width:100%; max-width:380px; }
  .lock-card h2{ font-size:15px; margin:0 0 12px; color:#c0c0ee; text-align:center; }
  .field{ margin-bottom:12px; }
  .field label{ display:block; font-size:12.5px; color:#a0a0d0; margin-bottom:5px; font-weight:700; }
  .field input, .field textarea{
    width:100%; background:#0f0f22; color:#e8e8f5; border:1px solid #33335a; border-radius:10px;
    padding:11px 12px; font-size:15px; font-family:inherit;
  }
  .field textarea{ min-height:64px; resize:vertical; }
  .primary-btn{
    width:100%; min-height:48px; border:none; border-radius:12px; background:#5a5adc; color:#fff;
    font-weight:800; font-size:15px; cursor:pointer; -webkit-tap-highlight-color:transparent; margin-top:4px;
  }
  .link-btn{
    width:100%; background:none; border:none; color:#8a8ad8; font-size:13px; margin-top:10px; cursor:pointer;
    min-height:40px; -webkit-tap-highlight-color:transparent;
  }
  .err-msg{ color:#ff9a9a; font-size:13px; text-align:center; margin-top:8px; min-height:18px; }

  .toolbar{ display:flex; gap:8px; margin-bottom:10px; }
  .toolbar input{
    flex:1; background:#1e1e3a; color:#e8e8f5; border:1px solid #33335a; border-radius:10px;
    padding:0 12px; min-height:42px; font-size:14px;
  }
  .toolbar button{
    border:none; border-radius:10px; padding:0 14px; min-height:42px; font-weight:700; cursor:pointer;
    -webkit-tap-highlight-color:transparent; font-size:13.5px;
  }
  .btn-lock{ background:#3a3a5a; color:#c0c0ee; }
  .btn-add{ background:#5a5adc; color:#fff; }
  .empty{ text-align:center; color:#7a7aa0; padding:40px 10px; font-size:14px; }

  .card{ background:#1e1e3a; border-radius:14px; padding:14px; margin-bottom:10px; }
  .card-site{ font-size:16px; font-weight:800; margin-bottom:4px; word-break:break-word; }
  .row{ display:flex; align-items:center; gap:8px; font-size:13.5px; margin-bottom:6px; color:#c8c8ee; }
  .row .val{ flex:1; font-family:ui-monospace,Menlo,Consolas,monospace; word-break:break-all; }
  .row button{
    border:none; border-radius:8px; background:#33335a; color:#c8c8ee; font-size:12px; font-weight:700;
    padding:6px 10px; cursor:pointer; min-height:32px; flex-shrink:0; -webkit-tap-highlight-color:transparent;
  }
  .memo{ font-size:13px; color:#9a9ac0; margin-top:6px; white-space:pre-wrap; word-break:break-word; }
  .card-actions{ display:flex; gap:8px; margin-top:10px; }
  .card-actions button{
    flex:1; min-height:42px; border:none; border-radius:10px; font-weight:700; font-size:13px;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .btn-edit{ background:#33335a; color:#c8c8ee; }
  .btn-del{ background:#5c2a2a; color:#ffc4c4; }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:flex-end;
    justify-content:center; z-index:100;
  }
  .modal{
    background:#1e1e3a; width:100%; max-width:480px; border-radius:18px 18px 0 0; padding:18px;
    max-height:88vh; overflow-y:auto;
  }
  .modal h2{ font-size:16px; margin:0 0 12px; color:#a6a6e0; }
  .modal-actions{ display:flex; gap:10px; margin-top:6px; }
  .modal-actions button{
    flex:1; min-height:48px; border:none; border-radius:12px; font-weight:800; font-size:15px;
    cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .btn-save{ background:#5a5adc; color:#fff; }
  .btn-cancel{ background:#33335a; color:#c8c8ee; }
  .toast{
    position:fixed; left:50%; bottom:20px; transform:translateX(-50%) translateY(20px);
    background:#2a2a4a; color:#e8e8f5; padding:10px 18px; border-radius:10px;
    font-size:13px; opacity:0; transition:all .25s; pointer-events:none; max-width:90%; text-align:center;
    z-index:999; border:1px solid #3a3a5a;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <header>
    <h1>🔒 パスワード保管庫</h1>
    <p class="disclaimer">簡易なクライアント側暗号化であり、企業レベルのセキュリティではありません。マスターパスワードを忘れると保管庫は復元できません。</p>
  </header>

  <main id="main"></main>
  <div class="toast" id="toast"></div>

<script>
  var hasSDK = !!(window.GUIOS && window.GUIOS.storage);
  var STORAGE_KEY = 'vault';
  var FALLBACK_KEY = 'guios-fallback-password-vault-vault';

  var mainEl = document.getElementById('main');
  var toastEl = document.getElementById('toast');

  var entries = [];        // in-memory plaintext, only while unlocked
  var masterKey = null;    // CryptoKey, only while unlocked
  var storedBlob = null;   // { salt, iv, ct } base64 strings, or null if none saved yet
  var unlocked = false;

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toastEl.classList.remove('show'); }, 1600);
  }
  function notify(msg, type){
    if (window.GUIOS && window.GUIOS.notify) {
      try { window.GUIOS.notify(msg, { type: type || 'info' }); return; } catch(e){}
    }
    showToast(msg);
  }
  function copyText(text){
    if (window.GUIOS && window.GUIOS.clipboard && window.GUIOS.clipboard.writeText) {
      try { window.GUIOS.clipboard.writeText(text); return; } catch(e){}
    }
    try { navigator.clipboard.writeText(text); } catch(e){}
  }
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function uid(){ return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  async function loadBlob(){
    if (hasSDK) {
      try {
        var v = await GUIOS.storage.get(STORAGE_KEY);
        if (v && typeof v === 'object' && v.ct) return v;
      } catch(e){}
      return null;
    } else {
      try {
        var raw = localStorage.getItem(FALLBACK_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch(e){ return null; }
    }
  }
  async function saveBlob(blob){
    if (hasSDK) {
      try { await GUIOS.storage.set(STORAGE_KEY, blob); } catch(e){}
    } else {
      try { localStorage.setItem(FALLBACK_KEY, JSON.stringify(blob)); } catch(e){}
    }
  }

  function bufToB64(buf){
    var bytes = new Uint8Array(buf);
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function b64ToBuf(b64){
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }

  async function deriveKey(password, saltBytes){
    var enc = new TextEncoder();
    var keyMaterial = await crypto.subtle.importKey(
      'raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']
    );
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: saltBytes, iterations: 100000, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['encrypt', 'decrypt']
    );
  }

  async function encryptVault(password, data){
    var salt = crypto.getRandomValues(new Uint8Array(16));
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var key = await deriveKey(password, salt);
    var enc = new TextEncoder();
    var plaintext = enc.encode(JSON.stringify(data));
    var ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, plaintext);
    return {
      key: key,
      blob: { salt: bufToB64(salt), iv: bufToB64(iv), ct: bufToB64(ct) }
    };
  }

  async function decryptVault(password, blob){
    var salt = new Uint8Array(b64ToBuf(blob.salt));
    var iv = new Uint8Array(b64ToBuf(blob.iv));
    var key = await deriveKey(password, salt);
    var ctBuf = b64ToBuf(blob.ct);
    var plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ctBuf); // throws on wrong password
    var dec = new TextDecoder();
    var json = dec.decode(plainBuf);
    return { key: key, data: JSON.parse(json) };
  }

  async function persistEntries(){
    var enc = new TextEncoder();
    var salt = storedBlob ? new Uint8Array(b64ToBuf(storedBlob.salt)) : crypto.getRandomValues(new Uint8Array(16));
    var iv = crypto.getRandomValues(new Uint8Array(12));
    var plaintext = enc.encode(JSON.stringify(entries));
    var ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, masterKey, plaintext);
    storedBlob = { salt: bufToB64(salt), iv: bufToB64(iv), ct: bufToB64(ct) };
    await saveBlob(storedBlob);
  }

  function renderLockScreen(isFirstTime){
    unlocked = false;
    entries = [];
    masterKey = null;
    mainEl.innerHTML =
      '<div class="lock-wrap">' +
        '<div class="lock-icon">🔒</div>' +
        '<div class="lock-card">' +
          '<h2>' + (isFirstTime ? 'マスターパスワードを設定' : 'ロック中 — マスターパスワードを入力') + '</h2>' +
          '<div class="field"><label>マスターパスワード</label><input type="password" id="pwInput" placeholder="パスワードを入力"></div>' +
          (isFirstTime ? '<div class="field"><label>確認のため再入力</label><input type="password" id="pwConfirm" placeholder="もう一度入力"></div>' : '') +
          '<button class="primary-btn" id="unlockBtn">' + (isFirstTime ? '保管庫を作成' : 'ロック解除') + '</button>' +
          '<div class="err-msg" id="errMsg"></div>' +
        '</div>' +
      '</div>';

    document.getElementById('unlockBtn').addEventListener('click', async function(){
      var pw = document.getElementById('pwInput').value;
      var errEl = document.getElementById('errMsg');
      errEl.textContent = '';
      if (!pw) { errEl.textContent = 'パスワードを入力してください'; return; }
      if (isFirstTime) {
        var confirmEl = document.getElementById('pwConfirm');
        if (pw !== confirmEl.value) { errEl.textContent = 'パスワードが一致しません'; return; }
        entries = [];
        var res = await encryptVault(pw, entries);
        masterKey = res.key;
        storedBlob = res.blob;
        await saveBlob(storedBlob);
        unlocked = true;
        renderVault();
        notify('保管庫を作成しました', 'success');
      } else {
        try {
          var result = await decryptVault(pw, storedBlob);
          masterKey = result.key;
          entries = Array.isArray(result.data) ? result.data : [];
          unlocked = true;
          renderVault();
          notify('ロックを解除しました', 'success');
        } catch (e) {
          errEl.textContent = 'マスターパスワードが違います';
        }
      }
    });

    document.getElementById('pwInput').addEventListener('keydown', function(e){
      if (e.key === 'Enter') document.getElementById('unlockBtn').click();
    });
  }

  function maskPassword(pw){
    return '•'.repeat(Math.min(pw.length, 16)) || '•';
  }

  function renderVault(){
    var listHtml;
    if (!entries.length) {
      listHtml = '<div class="empty">まだ登録がありません。「＋ 追加」から登録しましょう。</div>';
    } else {
      listHtml = entries.map(function(e){
        return '<div class="card" data-id="' + e.id + '">' +
          '<div class="card-site">' + escapeHtml(e.site) + '</div>' +
          '<div class="row"><span class="val">👤 ' + escapeHtml(e.username) + '</span><button data-act="copyuser">コピー</button></div>' +
          '<div class="row"><span class="val pw-val" data-pw="' + escapeHtml(e.password) + '" data-shown="0">' + maskPassword(e.password) + '</span>' +
            '<button data-act="toggle">表示</button><button data-act="copypass">コピー</button></div>' +
          (e.note ? '<div class="memo">' + escapeHtml(e.note) + '</div>' : '') +
          '<div class="card-actions">' +
            '<button class="btn-edit" data-act="edit">編集</button>' +
            '<button class="btn-del" data-act="del">削除</button>' +
          '</div>' +
        '</div>';
      }).join('');
    }
    mainEl.innerHTML =
      '<div class="toolbar">' +
        '<button class="btn-add" id="addBtn">＋ 追加</button>' +
        '<button class="btn-lock" id="lockBtn">🔒 ロック</button>' +
      '</div>' +
      listHtml;

    document.getElementById('addBtn').addEventListener('click', function(){ openEntryModal(null); });
    document.getElementById('lockBtn').addEventListener('click', function(){
      renderLockScreen(false);
      notify('ロックしました', 'info');
    });

    mainEl.querySelectorAll('.card').forEach(function(card){
      var id = card.getAttribute('data-id');
      var entry = entries.find(function(x){ return x.id === id; });
      var toggleBtn = card.querySelector('[data-act="toggle"]');
      var pwSpan = card.querySelector('.pw-val');
      if (toggleBtn) {
        toggleBtn.addEventListener('click', function(){
          var shown = pwSpan.getAttribute('data-shown') === '1';
          pwSpan.textContent = shown ? maskPassword(entry.password) : entry.password;
          pwSpan.setAttribute('data-shown', shown ? '0' : '1');
          toggleBtn.textContent = shown ? '表示' : '非表示';
        });
      }
      var copyUserBtn = card.querySelector('[data-act="copyuser"]');
      if (copyUserBtn) copyUserBtn.addEventListener('click', function(){ copyText(entry.username); notify('ユーザー名をコピーしました', 'success'); });
      var copyPassBtn = card.querySelector('[data-act="copypass"]');
      if (copyPassBtn) copyPassBtn.addEventListener('click', function(){ copyText(entry.password); notify('パスワードをコピーしました', 'success'); });
      var editBtn = card.querySelector('[data-act="edit"]');
      if (editBtn) editBtn.addEventListener('click', function(){ openEntryModal(id); });
      var delBtn = card.querySelector('[data-act="del"]');
      if (delBtn) delBtn.addEventListener('click', async function(){
        var ok = window.confirm ? window.confirm('「' + entry.site + '」を削除しますか?') : true;
        if (!ok) return;
        entries = entries.filter(function(x){ return x.id !== id; });
        await persistEntries();
        renderVault();
        notify('削除しました', 'info');
      });
    });
  }

  function openEntryModal(id){
    var entry = id ? entries.find(function(x){ return x.id === id; }) : null;
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML =
      '<div class="modal">' +
        '<h2>' + (entry ? '✎ 編集' : '＋ 新規登録') + '</h2>' +
        '<div class="field"><label>サイト名 / サービス名</label><input id="fSite" value="' + escapeHtml(entry ? entry.site : '') + '" placeholder="例: メールサービス"></div>' +
        '<div class="field"><label>ユーザー名 / メールアドレス</label><input id="fUser" value="' + escapeHtml(entry ? entry.username : '') + '"></div>' +
        '<div class="field"><label>パスワード</label><input id="fPass" value="' + escapeHtml(entry ? entry.password : '') + '"></div>' +
        '<div class="field"><label>メモ(任意)</label><textarea id="fNote" placeholder="メモ">' + escapeHtml(entry ? entry.note : '') + '</textarea></div>' +
        '<div class="modal-actions">' +
          '<button class="btn-cancel" id="fCancel">キャンセル</button>' +
          '<button class="btn-save" id="fSave">保存</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(overlay);
    overlay.addEventListener('click', function(e){ if (e.target === overlay) overlay.remove(); });
    overlay.querySelector('#fCancel').addEventListener('click', function(){ overlay.remove(); });
    overlay.querySelector('#fSave').addEventListener('click', async function(){
      var site = overlay.querySelector('#fSite').value.trim();
      var username = overlay.querySelector('#fUser').value.trim();
      var password = overlay.querySelector('#fPass').value;
      var note = overlay.querySelector('#fNote').value.trim();
      if (!site) { notify('サイト名を入力してください', 'error'); return; }
      if (entry) {
        entry.site = site; entry.username = username; entry.password = password; entry.note = note;
      } else {
        entries.unshift({ id: uid(), site: site, username: username, password: password, note: note });
      }
      await persistEntries();
      renderVault();
      overlay.remove();
      notify('保存しました', 'success');
    });
  }

  (async function init(){
    if (!(window.crypto && window.crypto.subtle)) {
      mainEl.innerHTML = '<div class="empty">このブラウザ環境では暗号化機能(Web Crypto API)が利用できないため、本アプリを使用できません。</div>';
      return;
    }
    storedBlob = await loadBlob();
    renderLockScreen(!storedBlob);
  })();
</script>
</body>
</html>
