<!--GUIOS-APP {"id":"percentage-calculator","name":"割合計算機","icon":"％","color":"#5d4037","version":"1.0.0","author":"Claude","description":"様々なパターンの割合(パーセント)計算ができる多機能計算機。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>割合計算機</title>
<style>
  :root{
    --accent:#c99a7d;
    --bg:#1a1410;
    --card:#241b15;
    --card2:#1e1610;
    --text:#f5ece3;
    --sub:#c2ab98;
    --line:#3c2c20;
    --danger:#e05a5a;
    --good:#4dd68c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--text);
    padding:16px; padding-bottom:48px;
  }
  h1{font-size:20px; margin:4px 0 16px; display:flex; align-items:center; gap:8px;}
  .modes{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px;}
  .mode-btn{
    padding:12px 8px; border-radius:10px; border:1px solid var(--line);
    background:var(--card2); color:var(--sub); font-weight:600; font-size:12.5px;
    cursor:pointer; min-height:52px; line-height:1.4; text-align:center;
    display:flex; align-items:center; justify-content:center;
  }
  .mode-btn.active{ background:var(--accent); color:#241407; border-color:var(--accent); }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:16px; margin-bottom:16px;
  }
  .panel{display:none;}
  .panel.active{display:block;}
  h2{font-size:15px; margin:0 0 14px; color:var(--text); font-weight:700;}
  label{display:block; font-size:13px; color:var(--sub); margin-bottom:6px;}
  .field{margin-bottom:14px;}
  .inline-eq{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .inline-eq .txt{font-size:14px; color:var(--sub); white-space:nowrap;}
  .inline-eq input{flex:1; min-width:80px;}
  input[type=number]{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background:#100b07; color:var(--text); font-size:16px; outline:none;
  }
  input:focus{border-color:var(--accent);}
  .result-line{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--card2); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; margin-top:4px;
  }
  .result-line .lbl{color:var(--sub); font-size:13px;}
  .result-line .val{color:var(--accent); font-weight:800; font-size:24px;}
  .result-line .val.pos{color:var(--good);}
  .result-line .val.neg{color:var(--danger);}
  .hint{font-size:12px; color:var(--sub); margin-top:10px; line-height:1.6;}
</style>
</head>
<body>
  <h1>％ 割合計算機</h1>

  <div class="modes">
    <div class="mode-btn active" data-mode="m1">XはYの何%？</div>
    <div class="mode-btn" data-mode="m2">YのX%はいくつ？</div>
    <div class="mode-btn" data-mode="m3">Xから何%増減してYに？</div>
    <div class="mode-btn" data-mode="m4">XにY%を足すと？</div>
  </div>

  <div class="card panel active" id="panel-m1">
    <h2>XはYの何%？</h2>
    <div class="field">
      <label for="m1x">X（例: 25）</label>
      <input type="number" id="m1x" inputmode="decimal" placeholder="例: 25">
    </div>
    <div class="field">
      <label for="m1y">Y（例: 200）</label>
      <input type="number" id="m1y" inputmode="decimal" placeholder="例: 200">
    </div>
    <div class="result-line"><span class="lbl">結果</span><span class="val" id="m1result">--</span></div>
    <div class="hint">計算式: X ÷ Y × 100</div>
  </div>

  <div class="card panel" id="panel-m2">
    <h2>YのX%はいくつ？</h2>
    <div class="field">
      <label for="m2y">Y（例: 200）</label>
      <input type="number" id="m2y" inputmode="decimal" placeholder="例: 200">
    </div>
    <div class="field">
      <label for="m2x">X%（例: 15）</label>
      <input type="number" id="m2x" inputmode="decimal" placeholder="例: 15">
    </div>
    <div class="result-line"><span class="lbl">結果</span><span class="val" id="m2result">--</span></div>
    <div class="hint">計算式: Y × X ÷ 100</div>
  </div>

  <div class="card panel" id="panel-m3">
    <h2>Xから何%増減してYになった？</h2>
    <div class="field">
      <label for="m3x">X（変化前の値、例: 80）</label>
      <input type="number" id="m3x" inputmode="decimal" placeholder="例: 80">
    </div>
    <div class="field">
      <label for="m3y">Y（変化後の値、例: 100）</label>
      <input type="number" id="m3y" inputmode="decimal" placeholder="例: 100">
    </div>
    <div class="result-line"><span class="lbl">結果</span><span class="val" id="m3result">--</span></div>
    <div class="hint">計算式: (Y − X) ÷ X × 100　※プラスは増加、マイナスは減少</div>
  </div>

  <div class="card panel" id="panel-m4">
    <h2>XにY%を足すといくつ？</h2>
    <div class="field">
      <label for="m4x">X（元の値、例: 1000）</label>
      <input type="number" id="m4x" inputmode="decimal" placeholder="例: 1000">
    </div>
    <div class="field">
      <label for="m4y">Y%（増減率、マイナス可、例: 10 または -10）</label>
      <input type="number" id="m4y" inputmode="decimal" placeholder="例: 10">
    </div>
    <div class="result-line"><span class="lbl">結果</span><span class="val" id="m4result">--</span></div>
    <div class="hint">計算式: X × (1 + Y ÷ 100)　※Yに負の数を入れると減算になります</div>
  </div>

<script>
  function fmt(n, digits){
    if(!isFinite(n)) return '--';
    var d = (typeof digits === 'number') ? digits : 2;
    var r = Math.round(n * Math.pow(10, d)) / Math.pow(10, d);
    return r.toLocaleString('ja-JP', {maximumFractionDigits: d});
  }

  // Mode switching
  var modeBtns = document.querySelectorAll('.mode-btn');
  modeBtns.forEach(function(btn){
    btn.addEventListener('click', function(){
      modeBtns.forEach(function(b){ b.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
      btn.classList.add('active');
      document.getElementById('panel-' + btn.getAttribute('data-mode')).classList.add('active');
    });
  });

  function computeM1(){
    var x = parseFloat(document.getElementById('m1x').value);
    var y = parseFloat(document.getElementById('m1y').value);
    var el = document.getElementById('m1result');
    if(isNaN(x) || isNaN(y)){ el.textContent = '--'; el.className='val'; return; }
    if(y === 0){ el.textContent = '計算不可（Yが0）'; el.className='val neg'; return; }
    var r = (x / y) * 100;
    el.textContent = fmt(r) + '%';
    el.className = 'val';
  }

  function computeM2(){
    var y = parseFloat(document.getElementById('m2y').value);
    var x = parseFloat(document.getElementById('m2x').value);
    var el = document.getElementById('m2result');
    if(isNaN(x) || isNaN(y)){ el.textContent = '--'; el.className='val'; return; }
    var r = (y * x) / 100;
    el.textContent = fmt(r);
    el.className = 'val';
  }

  function computeM3(){
    var x = parseFloat(document.getElementById('m3x').value);
    var y = parseFloat(document.getElementById('m3y').value);
    var el = document.getElementById('m3result');
    if(isNaN(x) || isNaN(y)){ el.textContent = '--'; el.className='val'; return; }
    if(x === 0){ el.textContent = '計算不可（Xが0）'; el.className='val neg'; return; }
    var r = ((y - x) / x) * 100;
    var sign = r > 0 ? '+' : '';
    el.textContent = sign + fmt(r) + '%' + (r > 0 ? '（増加）' : (r < 0 ? '（減少）' : ''));
    el.className = 'val' + (r > 0 ? ' pos' : (r < 0 ? ' neg' : ''));
  }

  function computeM4(){
    var x = parseFloat(document.getElementById('m4x').value);
    var y = parseFloat(document.getElementById('m4y').value);
    var el = document.getElementById('m4result');
    if(isNaN(x) || isNaN(y)){ el.textContent = '--'; el.className='val'; return; }
    var r = x * (1 + y / 100);
    el.textContent = fmt(r);
    el.className = 'val';
  }

  ['m1x','m1y'].forEach(function(id){ document.getElementById(id).addEventListener('input', computeM1); });
  ['m2y','m2x'].forEach(function(id){ document.getElementById(id).addEventListener('input', computeM2); });
  ['m3x','m3y'].forEach(function(id){ document.getElementById(id).addEventListener('input', computeM3); });
  ['m4x','m4y'].forEach(function(id){ document.getElementById(id).addEventListener('input', computeM4); });
</script>
</body>
</html>
