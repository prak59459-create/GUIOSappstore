<!--GUIOS-APP {"id":"pomodoro-timer","name":"ポモドーロタイマー","icon":"🍅","color":"#d64545","version":"1.0.0","author":"Claude","description":"25分集中+5分休憩のサイクルで作業を管理するポモドーロタイマー。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ポモドーロタイマー</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:#1c1210; color:#f7e9e4; min-height:100vh; padding:14px; padding-bottom:40px;
    display:flex; flex-direction:column; align-items:center;
  }
  h1{ font-size:18px; margin:8px 0 18px; text-align:center; }
  .phase-label{
    font-size:15px; font-weight:700; padding:6px 16px; border-radius:20px; margin-bottom:18px;
    background:#3a1f1a; color:#f2b6a6; letter-spacing:.03em;
  }
  .phase-label.break{ background:#1a3a2a; color:#a6e0c0; }
  .ring-wrap{ position:relative; width:min(72vw, 260px); height:min(72vw, 260px); margin-bottom:20px; }
  .ring{
    width:100%; height:100%; border-radius:50%;
    background:conic-gradient(#d64545 var(--pct,0%), #2a1a16 0);
    display:flex; align-items:center; justify-content:center;
    transition:background .3s linear;
  }
  .ring.break{ background:conic-gradient(#3b8686 var(--pct,0%), #16241f 0); }
  .ring-inner{
    width:82%; height:82%; border-radius:50%; background:#1c1210;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .time{
    font-size:clamp(38px, 15vw, 56px);
    font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:.02em;
    font-family:'SF Mono', 'Menlo', 'Consolas', monospace;
  }
  .cycle-info{ font-size:12px; color:#c9a89e; margin-top:4px; }
  .controls{ display:flex; gap:12px; margin-bottom:20px; }
  .btn{
    background:#d64545; color:#2a0a06; border:none; border-radius:14px; font-weight:700;
    font-size:15px; padding:14px 22px; min-height:48px; cursor:pointer; min-width:100px;
  }
  .btn:active{ filter:brightness(1.15); }
  .btn.secondary{ background:#3a2420; color:#f7e9e4; }
  .stats-card{
    background:#241714; border-radius:16px; padding:16px; width:100%; max-width:320px;
    text-align:center; box-shadow:0 6px 18px rgba(0,0,0,.3);
  }
  .stats-card .label{ font-size:12px; color:#c9a89e; }
  .stats-card .value{ font-size:26px; font-weight:700; color:#f2b6a6; margin-top:4px; }
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:#3a2420; color:#f7e9e4; padding:10px 18px; border-radius:10px;
    font-size:13px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;
    max-width:90%; text-align:center; box-shadow:0 6px 18px rgba(0,0,0,.35); z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <h1>🍅 ポモドーロタイマー</h1>
  <div class="phase-label" id="phaseLabel">作業中</div>

  <div class="ring-wrap">
    <div class="ring" id="ring">
      <div class="ring-inner">
        <div class="time" id="timeDisplay">25:00</div>
        <div class="cycle-info" id="cycleInfo">サイクル 1/4</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="startPauseBtn">開始</button>
    <button class="btn secondary" id="resetBtn">リセット</button>
  </div>

  <div class="stats-card">
    <div class="label">今日のポモドーロ回数</div>
    <div class="value" id="todayCount">0</div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  var APP_ID = 'pomodoro-timer';
  var FALLBACK_KEY = 'guios-fallback-' + APP_ID + '-today';
  var hasSDK = !!(window.GUIOS && window.GUIOS.storage);

  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2400);
  }
  function notify(msg, type){
    if (window.GUIOS && window.GUIOS.notify) {
      try { window.GUIOS.notify(msg, { type: type || 'info' }); return; } catch(e){}
    }
    showToast(msg);
  }
  function haptic(){
    if (window.GUIOS && window.GUIOS.haptic) {
      try { window.GUIOS.haptic(); } catch(e){}
    }
  }

  async function loadToday(){
    if (hasSDK) {
      try {
        var v = await window.GUIOS.storage.get('today');
        return (v && typeof v === 'object') ? v : null;
      } catch(e){ return null; }
    } else {
      try {
        var raw = localStorage.getItem(FALLBACK_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch(e){ return null; }
    }
  }
  async function saveToday(obj){
    if (hasSDK) {
      try { await window.GUIOS.storage.set('today', obj); } catch(e){}
    } else {
      try { localStorage.setItem(FALLBACK_KEY, JSON.stringify(obj)); } catch(e){}
    }
  }

  function todayStr(){
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
  }

  var DURATIONS = { work: 25*60, shortBreak: 5*60, longBreak: 15*60 };
  var phase = 'work';           // 'work' | 'shortBreak' | 'longBreak'
  var remaining = DURATIONS.work;
  var running = false;
  var tickTimer = null;
  var cyclesCompleted = 0;      // completed work sessions (for long-break scheduling)
  var todayCount = 0;

  function phaseDuration(p){ return DURATIONS[p]; }

  function updatePhaseUI(){
    var label = document.getElementById('phaseLabel');
    var ring = document.getElementById('ring');
    if (phase === 'work') {
      label.textContent = '作業中';
      label.classList.remove('break');
      ring.classList.remove('break');
    } else if (phase === 'shortBreak') {
      label.textContent = '休憩中';
      label.classList.add('break');
      ring.classList.add('break');
    } else {
      label.textContent = '長い休憩中';
      label.classList.add('break');
      ring.classList.add('break');
    }
  }

  function render(){
    var m = Math.floor(remaining / 60);
    var s = remaining % 60;
    document.getElementById('timeDisplay').textContent =
      (m<10?'0':'')+m + ':' + (s<10?'0':'')+s;
    var total = phaseDuration(phase);
    var pct = total > 0 ? ((total - remaining) / total * 100) : 0;
    document.getElementById('ring').style.setProperty('--pct', pct.toFixed(1) + '%');
    var posInCycle = (cyclesCompleted % 4) + 1;
    document.getElementById('cycleInfo').textContent = 'サイクル ' + posInCycle + '/4';
    document.getElementById('todayCount').textContent = todayCount;
    document.getElementById('startPauseBtn').textContent = running ? '一時停止' : '開始';
  }

  function nextPhaseAfterWork(){
    cyclesCompleted++;
    var isLong = (cyclesCompleted % 4 === 0);
    return isLong ? 'longBreak' : 'shortBreak';
  }

  async function bumpTodayCount(){
    todayCount++;
    await saveToday({ date: todayStr(), count: todayCount });
  }

  function onPhaseEnd(){
    running = false;
    clearInterval(tickTimer);
    tickTimer = null;

    if (phase === 'work') {
      bumpTodayCount();
      phase = nextPhaseAfterWork();
      remaining = phaseDuration(phase);
      var msg = phase === 'longBreak' ? '長い休憩にしましょう🎉' : '休憩しましょう☕';
      notify(msg, 'success');
      haptic();
    } else {
      phase = 'work';
      remaining = phaseDuration(phase);
      notify('作業を始めましょう🍅', 'info');
      haptic();
    }
    updatePhaseUI();
    render();
    startTimer(); // auto-continue into next phase
  }

  function startTimer(){
    if (running) return;
    running = true;
    var last = Date.now();
    tickTimer = setInterval(function(){
      var now = Date.now();
      var elapsedSec = Math.floor((now - last) / 1000);
      if (elapsedSec >= 1) {
        remaining -= elapsedSec;
        last = now;
        if (remaining <= 0) {
          remaining = 0;
          render();
          onPhaseEnd();
          return;
        }
        render();
      }
    }, 250);
    render();
  }

  function pauseTimer(){
    running = false;
    if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
    render();
  }

  function resetTimer(){
    pauseTimer();
    remaining = phaseDuration(phase);
    render();
  }

  document.getElementById('startPauseBtn').addEventListener('click', function(){
    if (running) { pauseTimer(); } else { startTimer(); }
  });
  document.getElementById('resetBtn').addEventListener('click', function(){
    resetTimer();
  });

  (async function init(){
    var stored = await loadToday();
    var t = todayStr();
    if (stored && stored.date === t) {
      todayCount = stored.count || 0;
    } else {
      todayCount = 0;
      await saveToday({ date: t, count: 0 });
    }
    updatePhaseUI();
    render();
    if (window.GUIOS && window.GUIOS.setTitle) {
      try { window.GUIOS.setTitle('ポモドーロタイマー'); } catch(e){}
    }
  })();

  window.addEventListener('beforeunload', function(){
    if (tickTimer) clearInterval(tickTimer);
  });
</script>
</body>
</html>
