<!--GUIOS-APP {"id":"reaction-test","name":"反応速度テスト","icon":"⚡","color":"#f0a500","version":"1.0.0","author":"Claude","description":"画面の色が変わった瞬間にタップして反応速度を計測するテスト。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>反応速度テスト</title>
<style>
  :root{
    --accent:#f0a500;
    --bg:#161208;
    --panel:#221c10;
    --text:#fbf3e3;
    --sub:#bda87e;
  }
  *{ box-sizing:border-box; }
  html, body{ height:100%; }
  body{
    margin:0; min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--text);
    display:flex; flex-direction:column; align-items:center;
    overflow:hidden;
  }
  .stage{
    width:100%; flex:1; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px; user-select:none; cursor:pointer;
    transition:background .05s;
  }
  .stage.idle{ background:var(--bg); }
  .stage.waiting{ background:#4a1f1f; }
  .stage.go{ background:#1f6b3a; }
  .stage.early{ background:#6b1f1f; }
  h1{ font-size:20px; margin:0 0 8px; }
  .msg{ font-size:22px; font-weight:800; margin-bottom:10px; }
  .desc{ font-size:14px; color:var(--sub); max-width:320px; line-height:1.6; margin-bottom:18px; }
  button{
    padding:16px 34px; border-radius:14px; border:none;
    background:var(--accent); color:#221c10; font-weight:800; font-size:16px; cursor:pointer;
    min-height:52px;
  }
  button:active{ transform:scale(.97); }
  .round-info{ font-size:13px; color:var(--sub); margin-bottom:8px; }
  .big-number{ font-size:48px; font-weight:800; }
  .result-list{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:14px 0; }
  .chip{
    padding:6px 12px; border-radius:999px; background:rgba(255,255,255,.08); font-size:13px;
  }
  .best{ font-size:13px; color:var(--sub); margin-top:4px; }
</style>
</head>
<body>
  <div class="stage idle" id="stage">
    <h1>⚡ 反応速度テスト</h1>
    <div id="content">
      <div class="desc">画面が緑色に変わった瞬間にタップ！<br>全5回計測して平均反応速度を測ります。<br>早くタップしすぎると失敗になります。</div>
      <button id="startBtn">スタート</button>
      <div class="best" id="bestLine"></div>
    </div>
  </div>

<script>
(function(){
  var hasSDK = !!(window.GUIOS && window.GUIOS.storage);
  var STORAGE_KEY = 'bestAverage';
  var LS_KEY = 'guios-reaction-test-best';
  var TOTAL_ROUNDS = 5;
  var MIN_DELAY = 1500, MAX_DELAY = 4500;

  var stage = document.getElementById('stage');
  var content = document.getElementById('content');
  var startBtn = document.getElementById('startBtn');
  var bestLine = document.getElementById('bestLine');

  var state = 'idle'; // idle | waiting | go | early | roundResult | finished
  var delayTimer = null;
  var goTime = 0;
  var round = 0;
  var results = [];

  function clearDelayTimer(){
    if(delayTimer){ clearTimeout(delayTimer); delayTimer = null; }
  }

  function haptic(){ if(window.GUIOS && window.GUIOS.haptic){ window.GUIOS.haptic(); } }
  function notify(msg, type){
    if(window.GUIOS && window.GUIOS.notify){ window.GUIOS.notify(msg, {type: type||'info'}); }
  }

  async function loadBest(){
    if(hasSDK){
      try{ var v = await window.GUIOS.storage.get(STORAGE_KEY); return (typeof v === 'number') ? v : null; }
      catch(e){ return null; }
    } else {
      var raw = localStorage.getItem(LS_KEY);
      return raw ? JSON.parse(raw) : null;
    }
  }
  async function saveBest(n){
    if(hasSDK){ try{ await window.GUIOS.storage.set(STORAGE_KEY, n); }catch(e){} }
    else{ localStorage.setItem(LS_KEY, JSON.stringify(n)); }
  }

  function setStage(cls){
    stage.className = 'stage ' + cls;
  }

  function renderIdle(bestVal){
    state = 'idle';
    clearDelayTimer();
    setStage('idle');
    content.innerHTML =
      '<h1 style="display:none;"></h1>' +
      '<div class="desc">画面が緑色に変わった瞬間にタップ！<br>全' + TOTAL_ROUNDS + '回計測して平均反応速度を測ります。<br>早くタップしすぎると失敗になります。</div>' +
      '<button id="startBtn">スタート</button>' +
      '<div class="best" id="bestLine">' + (bestVal !== null ? '自己ベスト平均: ' + Math.round(bestVal) + 'ms' : '') + '</div>';
    document.getElementById('startBtn').addEventListener('click', function(){ startSession(); });
  }

  function startSession(){
    round = 0;
    results = [];
    nextRound();
  }

  function nextRound(){
    round++;
    if(round > TOTAL_ROUNDS){ finishSession(); return; }
    state = 'waiting';
    setStage('waiting');
    content.innerHTML =
      '<div class="round-info">ラウンド ' + round + ' / ' + TOTAL_ROUNDS + '</div>' +
      '<div class="msg">待って...</div>' +
      '<div class="desc">緑色になったらすぐにタップ</div>';
    var delay = MIN_DELAY + Math.random() * (MAX_DELAY - MIN_DELAY);
    clearDelayTimer();
    delayTimer = setTimeout(function(){
      state = 'go';
      goTime = performance.now();
      setStage('go');
      content.innerHTML =
        '<div class="round-info">ラウンド ' + round + ' / ' + TOTAL_ROUNDS + '</div>' +
        '<div class="msg">今だ！タップ！</div>';
    }, delay);
  }

  function showEarly(){
    state = 'early';
    clearDelayTimer();
    setStage('early');
    content.innerHTML =
      '<div class="msg">早すぎます！</div>' +
      '<div class="desc">緑色に変わるまで待ってからタップしてください</div>' +
      '<button id="retryBtn">もう一度</button>';
    document.getElementById('retryBtn').addEventListener('click', function(){ nextRound(); });
  }

  function showRoundResult(ms){
    state = 'roundResult';
    setStage('idle');
    results.push(ms);
    content.innerHTML =
      '<div class="round-info">ラウンド ' + round + ' / ' + TOTAL_ROUNDS + '</div>' +
      '<div class="big-number">' + Math.round(ms) + 'ms</div>' +
      '<button id="nextBtn">次へ</button>';
    document.getElementById('nextBtn').addEventListener('click', function(){ nextRound(); });
  }

  async function finishSession(){
    state = 'finished';
    clearDelayTimer();
    setStage('idle');
    var avg = results.reduce(function(a,b){return a+b;},0) / results.length;
    var best = await loadBest();
    var isNewBest = (best === null || avg < best);
    if(isNewBest){ await saveBest(avg); }
    haptic();
    notify('平均反応速度: ' + Math.round(avg) + 'ms', 'success');

    var chips = results.map(function(r, i){
      return '<div class="chip">#' + (i+1) + ' ' + Math.round(r) + 'ms</div>';
    }).join('');

    content.innerHTML =
      '<div class="msg">結果発表</div>' +
      '<div class="big-number">' + Math.round(avg) + 'ms</div>' +
      '<div class="desc" style="margin-bottom:4px;">平均反応速度</div>' +
      '<div class="result-list">' + chips + '</div>' +
      (isNewBest ? '<div class="best" style="color:#7fe0a0;">🎉 自己ベスト更新！</div>' :
        '<div class="best">自己ベスト平均: ' + Math.round(best) + 'ms</div>') +
      '<button id="retryBtn" style="margin-top:12px;">もう一度</button>';
    document.getElementById('retryBtn').addEventListener('click', function(){ startSession(); });
  }

  stage.addEventListener('click', function(e){
    if(state === 'waiting'){
      showEarly();
    } else if(state === 'go'){
      var ms = performance.now() - goTime;
      showRoundResult(ms);
    }
    // idle / early / roundResult / finished states: clicks on stage background
    // are ignored; the buttons inside `content` handle their own listeners.
  });

  window.addEventListener('beforeunload', function(){ clearDelayTimer(); });

  (async function init(){
    var best = await loadBest();
    renderIdle(best);
  })();
})();
</script>
</body>
</html>
