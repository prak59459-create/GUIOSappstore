<!--GUIOS-APP {"id":"savings-simulator","name":"積立シミュレーター","icon":"📈","color":"#1b5e63","version":"1.0.0","author":"Claude","description":"毎月の積立額と利回りから将来の資産額をシミュレーションするツール。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>積立シミュレーター</title>
<style>
  :root{
    --accent:#2fb5ad;
    --accent2:#e8b64a;
    --bg:#0d1717;
    --card:#122423;
    --card2:#0f1e1d;
    --text:#eaf5f3;
    --sub:#8fb3ae;
    --line:rgba(255,255,255,0.08);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; padding:16px; padding-bottom:48px;
  }
  h1{ font-size:19px; margin:4px 0 16px; display:flex; align-items:center; gap:8px; }
  .wrap{ max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:16px; }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px;
  }
  .field{ margin-bottom:12px; }
  .field:last-child{ margin-bottom:0; }
  label{ display:block; font-size:12px; color:var(--sub); margin-bottom:6px; }
  .input-row{ position:relative; }
  input[type="number"]{
    width:100%; background:var(--card2); border:1px solid var(--line); border-radius:10px;
    color:var(--text); font-size:16px; padding:12px 44px 12px 12px; height:48px;
    font-variant-numeric:tabular-nums;
  }
  input[type="number"]:focus{ outline:2px solid var(--accent); outline-offset:-1px; }
  .unit{
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    font-size:13px; color:var(--sub); pointer-events:none;
  }
  .result-grid{ display:grid; grid-template-columns:1fr; gap:10px; }
  .result-item{
    display:flex; justify-content:space-between; align-items:center; padding:12px 14px;
    background:var(--card2); border-radius:12px; border-left:4px solid var(--accent);
  }
  .result-item.principal{ border-left-color:var(--sub); }
  .result-item.profit{ border-left-color:var(--accent2); }
  .result-label{ font-size:13px; color:var(--sub); }
  .result-value{ font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; }
  .result-item.profit .result-value{ color:var(--accent2); }
  .section-title{ font-size:14px; font-weight:700; margin:0 0 10px; color:var(--sub); }
  canvas{ width:100%; height:180px; display:block; }
  .table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table{ width:100%; border-collapse:collapse; font-size:13px; min-width:420px; }
  th, td{ text-align:right; padding:8px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th:first-child, td:first-child{ text-align:left; }
  th{ color:var(--sub); font-weight:600; font-size:12px; }
  td.principal-col{ color:var(--sub); }
  td.profit-col{ color:var(--accent2); }
  .foot-note{ font-size:11px; color:var(--sub); text-align:center; margin-top:4px; line-height:1.6; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>📈 積立シミュレーター</h1>

    <div class="card">
      <div class="field">
        <label for="pmt">毎月の積立額</label>
        <div class="input-row">
          <input type="number" id="pmt" value="30000" min="0" step="1000" inputmode="numeric">
          <span class="unit">円</span>
        </div>
      </div>
      <div class="field">
        <label for="rate">想定年利回り</label>
        <div class="input-row">
          <input type="number" id="rate" value="5" min="0" max="50" step="0.1" inputmode="decimal">
          <span class="unit">%</span>
        </div>
      </div>
      <div class="field">
        <label for="years">積立期間</label>
        <div class="input-row">
          <input type="number" id="years" value="20" min="1" max="60" step="1" inputmode="numeric">
          <span class="unit">年</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="result-grid">
        <div class="result-item">
          <span class="result-label">最終積立残高</span>
          <span class="result-value" id="fvValue">¥0</span>
        </div>
        <div class="result-item principal">
          <span class="result-label">元本合計</span>
          <span class="result-value" id="principalValue">¥0</span>
        </div>
        <div class="result-item profit">
          <span class="result-label">運用益</span>
          <span class="result-value" id="profitValue">¥0</span>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="section-title">資産推移グラフ</div>
      <canvas id="chart" width="600" height="180"></canvas>
    </div>

    <div class="card">
      <div class="section-title">年次テーブル</div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr><th>年</th><th>元本累計</th><th>残高</th><th>運用益</th></tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    <div class="foot-note">
      月複利で計算しています。将来の運用成果を保証するものではありません。
    </div>
  </div>

<script>
  var hasSDK = !!(window.GUIOS && window.GUIOS.storage);
  var APP_ID = 'savings-simulator';
  var FALLBACK_KEY = 'guios-fallback-' + APP_ID + '-inputs';

  var pmtEl = document.getElementById('pmt');
  var rateEl = document.getElementById('rate');
  var yearsEl = document.getElementById('years');
  var fvValueEl = document.getElementById('fvValue');
  var principalValueEl = document.getElementById('principalValue');
  var profitValueEl = document.getElementById('profitValue');
  var tableBodyEl = document.getElementById('tableBody');
  var canvas = document.getElementById('chart');
  var ctx = canvas.getContext('2d');

  function yen(n){
    return '¥' + Math.round(n).toLocaleString('ja-JP');
  }

  // FV = PMT * (((1+r)^n - 1) / r), r = monthly rate, n = number of months
  function futureValue(pmt, annualRatePct, months){
    var r = (annualRatePct / 100) / 12;
    if (r === 0) return pmt * months;
    return pmt * ((Math.pow(1 + r, months) - 1) / r);
  }

  function buildSchedule(pmt, annualRatePct, years){
    var rows = [];
    for (var y = 1; y <= years; y++){
      var months = y * 12;
      var balance = futureValue(pmt, annualRatePct, months);
      var principal = pmt * months;
      rows.push({ year: y, principal: principal, balance: balance, profit: balance - principal });
    }
    return rows;
  }

  function drawChart(rows){
    var w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    if (!rows.length) return;
    var maxBalance = 0;
    rows.forEach(function(r){ if (r.balance > maxBalance) maxBalance = r.balance; });
    if (maxBalance <= 0) maxBalance = 1;

    var padL = 8, padR = 8, padT = 10, padB = 18;
    var plotW = w - padL - padR;
    var plotH = h - padT - padB;
    var n = rows.length;
    var barGap = 2;
    var barW = Math.max(1, (plotW / n) - barGap);

    // baseline
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padL, padT + plotH + 0.5);
    ctx.lineTo(padL + plotW, padT + plotH + 0.5);
    ctx.stroke();

    rows.forEach(function(r, i){
      var x = padL + i * (barW + barGap);
      var principalH = (r.principal / maxBalance) * plotH;
      var profitH = (r.profit / maxBalance) * plotH;
      var yBase = padT + plotH;

      ctx.fillStyle = '#5c7a76';
      ctx.fillRect(x, yBase - principalH, barW, principalH);

      ctx.fillStyle = '#e8b64a';
      ctx.fillRect(x, yBase - principalH - profitH, barW, profitH);
    });

    // x-axis labels: first, middle, last year
    ctx.fillStyle = '#8fb3ae';
    ctx.font = '10px -apple-system, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(String(rows[0].year) + '年', padL, h - 4);
    ctx.textAlign = 'right';
    ctx.fillText(String(rows[n-1].year) + '年', padL + plotW, h - 4);
  }

  function renderTable(rows){
    var html = '';
    rows.forEach(function(r){
      html += '<tr>' +
        '<td>' + r.year + '年目</td>' +
        '<td class="principal-col">' + yen(r.principal) + '</td>' +
        '<td>' + yen(r.balance) + '</td>' +
        '<td class="profit-col">' + yen(r.profit) + '</td>' +
        '</tr>';
    });
    tableBodyEl.innerHTML = html;
  }

  function recalc(){
    var pmt = parseFloat(pmtEl.value) || 0;
    var rate = parseFloat(rateEl.value) || 0;
    var years = Math.max(1, Math.min(60, parseInt(yearsEl.value, 10) || 1));

    if (pmt < 0) pmt = 0;
    if (rate < 0) rate = 0;

    var months = years * 12;
    var fv = futureValue(pmt, rate, months);
    var principal = pmt * months;
    var profit = fv - principal;

    fvValueEl.textContent = yen(fv);
    principalValueEl.textContent = yen(principal);
    profitValueEl.textContent = yen(profit);

    var rows = buildSchedule(pmt, rate, years);
    drawChart(rows);
    renderTable(rows);

    saveInputs({ pmt: pmt, rate: rate, years: years });
  }

  var saveTimer = null;
  function saveInputs(obj){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      if (hasSDK) {
        try { window.GUIOS.storage.set('inputs', obj); } catch(e){}
      } else {
        try { localStorage.setItem(FALLBACK_KEY, JSON.stringify(obj)); } catch(e){}
      }
    }, 300);
  }

  async function loadInputs(){
    if (hasSDK) {
      try {
        var v = await window.GUIOS.storage.get('inputs');
        return (v && typeof v === 'object') ? v : null;
      } catch(e){ return null; }
    } else {
      try {
        var raw = localStorage.getItem(FALLBACK_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch(e){ return null; }
    }
  }

  [pmtEl, rateEl, yearsEl].forEach(function(el){
    el.addEventListener('input', recalc);
  });

  (async function init(){
    var stored = await loadInputs();
    if (stored) {
      if (typeof stored.pmt === 'number') pmtEl.value = stored.pmt;
      if (typeof stored.rate === 'number') rateEl.value = stored.rate;
      if (typeof stored.years === 'number') yearsEl.value = stored.years;
    }
    if (window.GUIOS && window.GUIOS.setTitle) {
      try { window.GUIOS.setTitle('積立シミュレーター'); } catch(e){}
    }
    recalc();
  })();

  window.addEventListener('beforeunload', function(){
    clearTimeout(saveTimer);
  });
</script>
</body>
</html>
