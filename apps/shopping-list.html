<!--GUIOS-APP {"id":"shopping-list","name":"買い物リスト","icon":"🛒","color":"#f9a825","version":"1.0.0","author":"Claude","description":"買い物したい商品をチェックリスト形式で管理できるアプリ。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>買い物リスト</title>
<style>
  :root{
    --accent:#f9a825;
    --bg:#1c1607;
    --card:#271f0e;
    --card2:#302711;
    --text:#faf3e2;
    --sub:#d4c093;
    --line:#453a1c;
    --input:#150f05;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; padding:16px; padding-bottom:48px;
  }
  h1{ font-size:19px; margin:4px 0 4px; display:flex; align-items:center; gap:8px; }
  .wrap{ max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  .sub-tag{ font-size:12px; color:var(--sub); margin:0 0 2px; }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px;
  }
  .list-tabs{
    display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch;
  }
  .list-tabs::-webkit-scrollbar{ display:none; }
  .list-tab{
    flex:none; padding:10px 16px; border-radius:999px; background:var(--input);
    border:1px solid var(--line); color:var(--sub); font-size:13px; font-weight:600;
    cursor:pointer; white-space:nowrap; min-height:40px;
  }
  .list-tab.active{ background:var(--accent); color:#2a1c00; border-color:var(--accent); }
  .add-list-btn{
    flex:none; width:40px; height:40px; border-radius:999px; border:1px dashed var(--line);
    background:transparent; color:var(--sub); font-size:18px; cursor:pointer;
  }
  .section-title{ font-size:13px; color:var(--sub); margin:0 0 10px; font-weight:600; }
  .add-row{ display:flex; gap:8px; }
  .add-row input{
    flex:1; min-width:0; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--input); color:var(--text); font-size:15px; outline:none;
  }
  .add-row input:focus{ border-color:var(--accent); }
  .qty-input{ max-width:80px; flex:none !important; }
  .add-row-2{ display:flex; gap:8px; margin-top:8px; }
  .add-row-2 input{
    flex:1; min-width:0; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--input); color:var(--text); font-size:14px; outline:none;
  }
  button{
    padding:12px 18px; border-radius:10px; border:none; background:var(--accent);
    color:#2a1c00; font-weight:700; font-size:15px; cursor:pointer; min-height:44px;
  }
  button.icon-add{ flex:none; width:52px; padding:0; font-size:20px; }
  button.secondary{
    background:transparent; color:var(--sub); border:1px solid var(--line); font-weight:600;
    width:100%; margin-top:12px;
  }
  .item-list{ display:flex; flex-direction:column; gap:8px; }
  .item{
    display:flex; align-items:center; gap:12px; background:var(--input); border:1px solid var(--line);
    border-radius:12px; padding:12px 14px;
  }
  .item.checked{ opacity:0.55; }
  .item .chk{
    flex:none; width:26px; height:26px; border-radius:8px; border:2px solid var(--accent);
    display:flex; align-items:center; justify-content:center; font-size:15px; color:transparent;
    cursor:pointer; background:transparent;
  }
  .item.checked .chk{ background:var(--accent); color:#2a1c00; }
  .item .info{ flex:1; min-width:0; }
  .item .name{ font-size:15px; }
  .item.checked .name{ text-decoration:line-through; color:var(--sub); }
  .item .note{ font-size:12px; color:var(--sub); margin-top:2px; }
  .item .del{
    flex:none; width:36px; height:36px; min-height:36px; padding:0; border-radius:8px;
    background:transparent; border:1px solid var(--line); color:var(--sub); font-size:15px;
  }
  .group-label{ font-size:11px; color:var(--sub); margin:14px 0 8px; text-transform:uppercase; letter-spacing:.04em; }
  .empty{ color:var(--sub); text-align:center; padding:30px 10px; font-size:13px; }
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:var(--card2); color:var(--text); padding:10px 18px; border-radius:10px;
    font-size:13px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;
    max-width:90%; text-align:center; box-shadow:0 6px 18px rgba(0,0,0,.35); z-index:50;
    border:1px solid var(--line);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>🛒 買い物リスト</h1>
    <p class="sub-tag">買うものをチェックリストで管理できます</p>

    <div class="card">
      <div class="section-title">リスト</div>
      <div class="list-tabs" id="listTabs"></div>
    </div>

    <div class="card">
      <div class="section-title">商品を追加</div>
      <div class="add-row">
        <input type="text" id="itemNameInput" placeholder="商品名（例: 牛乳）" maxlength="60">
        <input type="text" id="itemQtyInput" class="qty-input" placeholder="数量" maxlength="20">
      </div>
      <div class="add-row-2">
        <input type="text" id="itemNoteInput" placeholder="メモ（任意）" maxlength="80">
        <button class="icon-add" id="addItemBtn">＋</button>
      </div>
    </div>

    <div class="card">
      <div class="section-title" style="display:flex; justify-content:space-between; align-items:center;">
        <span id="itemCountLabel">アイテム</span>
      </div>
      <div id="itemListWrap">
        <div class="empty">まだアイテムがありません</div>
      </div>
      <button class="secondary" id="clearCheckedBtn">チェック済みを削除</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  var APP_ID = 'shopping-list';
  var FALLBACK_KEY = 'guios-fallback-' + APP_ID + '-data';
  var hasSDK = !!(window.GUIOS && window.GUIOS.storage);

  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }
  function notify(msg, type){
    if (window.GUIOS && window.GUIOS.notify) {
      try { window.GUIOS.notify(msg, { type: type || 'info' }); return; } catch(e){}
    }
    showToast(msg);
  }
  function haptic(){
    if (window.GUIOS && window.GUIOS.haptic) {
      try { window.GUIOS.haptic(); } catch(e){}
    }
  }
  function uid(){ return Date.now() + '-' + Math.random().toString(36).slice(2,8); }

  /* data shape: { lists: [ { id, name, items: [ {id, name, qty, note, checked} ] } ], activeListId } */
  var DEFAULT_DATA = null;
  function makeDefaultData(){
    return {
      lists: [ { id: uid(), name: 'スーパー', items: [] } ],
      activeListId: null
    };
  }

  async function loadData(){
    if (hasSDK) {
      try {
        var v = await window.GUIOS.storage.get('data');
        if (v && Array.isArray(v.lists) && v.lists.length > 0) return v;
        return makeDefaultData();
      } catch(e){ return makeDefaultData(); }
    } else {
      try {
        var raw = localStorage.getItem(FALLBACK_KEY);
        var obj = raw ? JSON.parse(raw) : null;
        if (obj && Array.isArray(obj.lists) && obj.lists.length > 0) return obj;
        return makeDefaultData();
      } catch(e){ return makeDefaultData(); }
    }
  }
  async function saveData(){
    if (hasSDK) {
      try { await window.GUIOS.storage.set('data', data); } catch(e){}
    } else {
      try { localStorage.setItem(FALLBACK_KEY, JSON.stringify(data)); } catch(e){}
    }
  }

  var data = makeDefaultData();

  function getActiveList(){
    var list = data.lists.find(function(l){ return l.id === data.activeListId; });
    if (!list) {
      list = data.lists[0];
      data.activeListId = list ? list.id : null;
    }
    return list;
  }

  function renderTabs(){
    var wrap = document.getElementById('listTabs');
    wrap.innerHTML = '';
    data.lists.forEach(function(l){
      var tab = document.createElement('button');
      tab.className = 'list-tab' + (l.id === data.activeListId ? ' active' : '');
      tab.textContent = l.name;
      tab.addEventListener('click', function(){
        data.activeListId = l.id;
        saveData();
        renderAll();
      });
      tab.addEventListener('dblclick', function(){
        renameList(l.id);
      });
      wrap.appendChild(tab);
    });
    var addBtn = document.createElement('button');
    addBtn.className = 'add-list-btn';
    addBtn.textContent = '+';
    addBtn.title = '新しいリスト';
    addBtn.addEventListener('click', addNewList);
    wrap.appendChild(addBtn);
  }

  function addNewList(){
    var name = prompt('新しいリスト名を入力してください', '');
    if (name === null) return;
    name = name.trim();
    if (!name) { notify('リスト名を入力してください', 'error'); return; }
    var list = { id: uid(), name: name.slice(0,30), items: [] };
    data.lists.push(list);
    data.activeListId = list.id;
    saveData();
    renderAll();
    notify('リストを作成しました', 'success');
  }

  function renameList(id){
    var list = data.lists.find(function(l){ return l.id === id; });
    if (!list) return;
    var name = prompt('リスト名を変更', list.name);
    if (name === null) return;
    name = name.trim();
    if (!name) return;
    list.name = name.slice(0,30);
    saveData();
    renderAll();
  }

  function renderItems(){
    var list = getActiveList();
    var wrap = document.getElementById('itemListWrap');
    var countLabel = document.getElementById('itemCountLabel');
    if (!list) {
      wrap.innerHTML = '<div class="empty">リストがありません</div>';
      countLabel.textContent = 'アイテム';
      return;
    }
    var items = list.items || [];
    var uncheckedCount = items.filter(function(i){ return !i.checked; }).length;
    countLabel.textContent = list.name + '（' + uncheckedCount + '/' + items.length + '）';

    if (items.length === 0) {
      wrap.innerHTML = '<div class="empty">まだアイテムがありません</div>';
      return;
    }

    var unchecked = items.filter(function(i){ return !i.checked; });
    var checked = items.filter(function(i){ return i.checked; });

    wrap.innerHTML = '';
    var container = document.createElement('div');
    container.className = 'item-list';

    function buildRow(item){
      var row = document.createElement('div');
      row.className = 'item' + (item.checked ? ' checked' : '');
      var infoHtml = '<div class="name">' + escapeHtml(item.name) +
        (item.qty ? ' <span style="color:var(--sub); font-size:13px;">× ' + escapeHtml(item.qty) + '</span>' : '') +
        '</div>' + (item.note ? '<div class="note">' + escapeHtml(item.note) + '</div>' : '');
      row.innerHTML =
        '<button class="chk" data-id="' + item.id + '">✓</button>' +
        '<div class="info">' + infoHtml + '</div>' +
        '<button class="del" data-id="' + item.id + '">✕</button>';
      return row;
    }

    unchecked.forEach(function(item){ container.appendChild(buildRow(item)); });
    if (checked.length > 0) {
      var label = document.createElement('div');
      label.className = 'group-label';
      label.textContent = 'チェック済み（' + checked.length + '）';
      container.appendChild(label);
      checked.forEach(function(item){ container.appendChild(buildRow(item)); });
    }
    wrap.appendChild(container);
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function renderAll(){
    renderTabs();
    renderItems();
  }

  document.getElementById('itemListWrap').addEventListener('click', async function(e){
    var list = getActiveList();
    if (!list) return;
    var chk = e.target.closest('.chk');
    var del = e.target.closest('.del');
    if (chk) {
      var id = chk.dataset.id;
      var item = list.items.find(function(i){ return i.id === id; });
      if (item) {
        item.checked = !item.checked;
        await saveData();
        renderItems();
        haptic();
      }
      return;
    }
    if (del) {
      var did = del.dataset.id;
      list.items = list.items.filter(function(i){ return i.id !== did; });
      await saveData();
      renderItems();
      return;
    }
  });

  async function addItem(){
    var list = getActiveList();
    if (!list) return;
    var nameInput = document.getElementById('itemNameInput');
    var qtyInput = document.getElementById('itemQtyInput');
    var noteInput = document.getElementById('itemNoteInput');
    var name = nameInput.value.trim();
    if (!name) {
      notify('商品名を入力してください', 'error');
      return;
    }
    list.items.push({
      id: uid(),
      name: name,
      qty: qtyInput.value.trim(),
      note: noteInput.value.trim(),
      checked: false
    });
    await saveData();
    nameInput.value = '';
    qtyInput.value = '';
    noteInput.value = '';
    nameInput.focus();
    renderItems();
    notify('追加しました', 'success');
    haptic();
  }

  document.getElementById('addItemBtn').addEventListener('click', addItem);
  document.getElementById('itemNameInput').addEventListener('keydown', function(e){
    if (e.key === 'Enter') { e.preventDefault(); addItem(); }
  });
  document.getElementById('itemQtyInput').addEventListener('keydown', function(e){
    if (e.key === 'Enter') { e.preventDefault(); addItem(); }
  });

  document.getElementById('clearCheckedBtn').addEventListener('click', async function(){
    var list = getActiveList();
    if (!list) return;
    var hadChecked = list.items.some(function(i){ return i.checked; });
    if (!hadChecked) {
      notify('チェック済みのアイテムはありません', 'info');
      return;
    }
    if (!confirm('チェック済みのアイテムを削除しますか？')) return;
    list.items = list.items.filter(function(i){ return !i.checked; });
    await saveData();
    renderItems();
    notify('削除しました', 'success');
  });

  (async function init(){
    data = await loadData();
    if (!data.activeListId && data.lists.length > 0) {
      data.activeListId = data.lists[0].id;
    }
    renderAll();
  })();
</script>
</body>
</html>
