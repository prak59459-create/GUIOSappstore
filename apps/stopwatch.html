<!--GUIOS-APP {"id":"stopwatch","name":"ストップウォッチ","icon":"⏱️","color":"#375a7f","version":"1.0.0","author":"Claude","description":"計測とラップタイムの記録ができるストップウォッチアプリ。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ストップウォッチ</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:#0f1a24; color:#e8f1fb; min-height:100vh; padding:14px; padding-bottom:40px;
    display:flex; flex-direction:column; align-items:center;
  }
  h1{ font-size:18px; margin:8px 0 20px; text-align:center; }
  .display-wrap{
    background:#152537; border-radius:20px; padding:26px 14px; width:100%; max-width:360px;
    text-align:center; margin-bottom:20px; box-shadow:0 6px 18px rgba(0,0,0,.3);
  }
  .time{
    font-size:clamp(36px, 12vw, 52px); font-weight:700; font-variant-numeric:tabular-nums;
    font-family:'SF Mono','Menlo','Consolas',monospace; letter-spacing:.01em; color:#7fb3e8;
  }
  .time .cs{ font-size:0.55em; color:#5a86b3; }
  .controls{ display:flex; gap:10px; width:100%; max-width:360px; margin-bottom:18px; }
  .btn{
    flex:1; background:#375a7f; color:#eaf3ff; border:none; border-radius:14px; font-weight:700;
    font-size:15px; padding:14px 0; min-height:48px; cursor:pointer;
  }
  .btn:active{ filter:brightness(1.2); }
  .btn.start{ background:#2f8f5b; }
  .btn.stop{ background:#c14545; }
  .btn.secondary{ background:#1c3049; }
  .btn:disabled{ opacity:.35; cursor:default; }
  .laps-card{
    background:#152537; border-radius:16px; padding:14px; width:100%; max-width:360px;
    box-shadow:0 6px 18px rgba(0,0,0,.3);
  }
  .laps-card .title{ font-size:13px; color:#8ab0d9; margin-bottom:10px; font-weight:600; }
  .lap-row{
    display:flex; justify-content:space-between; padding:9px 4px; font-size:14px;
    border-bottom:1px solid #1c3049; font-variant-numeric:tabular-nums;
  }
  .lap-row:last-child{ border-bottom:none; }
  .lap-row .num{ color:#8ab0d9; }
  .lap-row .split{ color:#5a86b3; font-size:12px; margin-left:8px; }
  .empty{ text-align:center; color:#5a86b3; font-size:13px; padding:10px 0; }
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:#1c3049; color:#e8f1fb; padding:10px 18px; border-radius:10px;
    font-size:13px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;
    max-width:90%; text-align:center; box-shadow:0 6px 18px rgba(0,0,0,.35); z-index:50;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <h1>⏱️ ストップウォッチ</h1>

  <div class="display-wrap">
    <div class="time" id="timeDisplay">00:00<span class="cs">.00</span></div>
  </div>

  <div class="controls">
    <button class="btn start" id="startStopBtn">開始</button>
    <button class="btn secondary" id="lapBtn" disabled>ラップ</button>
    <button class="btn secondary" id="resetBtn">リセット</button>
  </div>

  <div class="laps-card">
    <div class="title">ラップタイム</div>
    <div id="lapList"><div class="empty">まだラップはありません</div></div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1500);
  }
  function notify(msg, type){
    if (window.GUIOS && window.GUIOS.notify) {
      try { window.GUIOS.notify(msg, { type: type || 'info' }); return; } catch(e){}
    }
    showToast(msg);
  }
  function haptic(){
    if (window.GUIOS && window.GUIOS.haptic) {
      try { window.GUIOS.haptic(); } catch(e){}
    }
  }

  var running = false;
  var startTime = 0;      // Date.now() at (re)start
  var accumulated = 0;    // ms accumulated from previous runs
  var displayTimer = null;
  var laps = [];          // {num, totalMs, splitMs} newest handled via unshift on render

  function elapsedMs(){
    return accumulated + (running ? (Date.now() - startTime) : 0);
  }

  function formatTime(ms){
    if (ms < 0) ms = 0;
    var totalCs = Math.floor(ms / 10);
    var cs = totalCs % 100;
    var totalSec = Math.floor(totalCs / 100);
    var s = totalSec % 60;
    var m = Math.floor(totalSec / 60);
    return {
      main: (m<10?'0':'')+m + ':' + (s<10?'0':'')+s,
      cs: (cs<10?'0':'')+cs
    };
  }

  function render(){
    var f = formatTime(elapsedMs());
    document.getElementById('timeDisplay').innerHTML = f.main + '<span class="cs">.' + f.cs + '</span>';
  }

  function renderLaps(){
    var el = document.getElementById('lapList');
    if (laps.length === 0) {
      el.innerHTML = '<div class="empty">まだラップはありません</div>';
      return;
    }
    el.innerHTML = '';
    for (var i = laps.length - 1; i >= 0; i--) {
      var lap = laps[i];
      var ft = formatTime(lap.totalMs);
      var fs = formatTime(lap.splitMs);
      var row = document.createElement('div');
      row.className = 'lap-row';
      row.innerHTML =
        '<span><span class="num">#' + lap.num + '</span> ' + ft.main + '.' + ft.cs + '</span>' +
        '<span class="split">+' + fs.main + '.' + fs.cs + '</span>';
      el.appendChild(row);
    }
  }

  function loopTick(){
    render();
    displayTimer = requestAnimationFrame(loopTick);
  }

  function start(){
    if (running) return;
    running = true;
    startTime = Date.now();
    document.getElementById('startStopBtn').textContent = '停止';
    document.getElementById('startStopBtn').classList.remove('start');
    document.getElementById('startStopBtn').classList.add('stop');
    document.getElementById('lapBtn').disabled = false;
    document.getElementById('resetBtn').disabled = true;
    if (displayTimer) cancelAnimationFrame(displayTimer);
    loopTick();
  }

  function stop(){
    if (!running) return;
    accumulated += Date.now() - startTime;
    running = false;
    if (displayTimer) { cancelAnimationFrame(displayTimer); displayTimer = null; }
    document.getElementById('startStopBtn').textContent = '開始';
    document.getElementById('startStopBtn').classList.remove('stop');
    document.getElementById('startStopBtn').classList.add('start');
    document.getElementById('lapBtn').disabled = true;
    document.getElementById('resetBtn').disabled = false;
    render();
  }

  function reset(){
    if (running) return; // must stop first (button disabled while running anyway)
    accumulated = 0;
    laps = [];
    render();
    renderLaps();
  }

  function lap(){
    if (!running) return;
    var total = elapsedMs();
    var prevTotal = laps.length > 0 ? laps[laps.length-1].totalMs : 0;
    laps.push({ num: laps.length + 1, totalMs: total, splitMs: total - prevTotal });
    renderLaps();
    haptic();
  }

  document.getElementById('startStopBtn').addEventListener('click', function(){
    if (running) stop(); else start();
  });
  document.getElementById('lapBtn').addEventListener('click', lap);
  document.getElementById('resetBtn').addEventListener('click', reset);

  render();
  renderLaps();
  document.getElementById('resetBtn').disabled = false;

  window.addEventListener('beforeunload', function(){
    if (displayTimer) cancelAnimationFrame(displayTimer);
  });

  if (window.GUIOS && window.GUIOS.setTitle) {
    try { window.GUIOS.setTitle('ストップウォッチ'); } catch(e){}
  }
</script>
</body>
</html>
