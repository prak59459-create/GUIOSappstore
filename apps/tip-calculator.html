<!--GUIOS-APP {"id":"tip-calculator","name":"割り勘計算機","icon":"💴","color":"#2f8f6f","version":"1.0.0","author":"Claude","description":"合計金額と人数、チップ率から割り勘の金額を計算するツール。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>割り勘計算機</title>
<style>
  :root{
    --accent:#2f8f6f;
    --bg:#0f1a16;
    --card:#16241f;
    --text:#eaf7f1;
    --sub:#a9c4bb;
    --line:#25382f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--text);
    padding:16px; padding-bottom:40px;
  }
  h1{font-size:20px; margin:4px 0 16px; display:flex; align-items:center; gap:8px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:16px; margin-bottom:16px;
  }
  label{display:block; font-size:13px; color:var(--sub); margin-bottom:6px;}
  .field{margin-bottom:14px;}
  input[type=number]{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background:#0b1310; color:var(--text); font-size:16px; outline:none;
  }
  input[type=number]:focus{border-color:var(--accent);}
  .quickrow{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
  .quickrow button{
    flex:1; min-width:64px; padding:10px 6px; border-radius:10px; border:1px solid var(--line);
    background:transparent; color:var(--sub); font-weight:700; font-size:14px; cursor:pointer; min-height:44px;
  }
  .quickrow button.active{background:var(--accent); color:#04241a; border-color:var(--accent);}
  .stepper{display:flex; align-items:center; gap:10px;}
  .stepper input{text-align:center;}
  .stepper button{
    width:44px; height:44px; border-radius:10px; border:1px solid var(--line);
    background:transparent; color:var(--text); font-size:20px; font-weight:700; cursor:pointer; flex:none;
  }
  .results{display:flex; flex-direction:column; gap:10px; margin-top:4px;}
  .result-row{
    display:flex; justify-content:space-between; align-items:center;
    background:#0b1310; border:1px solid var(--line); border-radius:10px; padding:12px 14px;
  }
  .result-row .rlabel{font-size:13px; color:var(--sub);}
  .result-row .rval{font-size:18px; font-weight:800;}
  .result-row.main{background:var(--accent); border-color:var(--accent);}
  .result-row.main .rlabel{color:#04241a;}
  .result-row.main .rval{color:#04241a; font-size:24px;}
</style>
</head>
<body>
  <h1>💴 割り勘計算機</h1>

  <div class="card">
    <div class="field">
      <label for="total">合計金額（円）</label>
      <input type="number" id="total" inputmode="numeric" placeholder="例: 10000" min="0" step="1">
    </div>

    <div class="field">
      <label for="people">人数</label>
      <div class="stepper">
        <button type="button" id="peopleMinus">−</button>
        <input type="number" id="people" inputmode="numeric" min="1" step="1" value="2">
        <button type="button" id="peoplePlus">＋</button>
      </div>
    </div>

    <div class="field">
      <label for="tip">チップ率（%）</label>
      <input type="number" id="tip" inputmode="numeric" min="0" step="1" value="10">
      <div class="quickrow" id="quickTips">
        <button type="button" data-tip="0">0%</button>
        <button type="button" data-tip="10">10%</button>
        <button type="button" data-tip="15">15%</button>
        <button type="button" data-tip="20">20%</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="results">
      <div class="result-row">
        <span class="rlabel">チップ額</span>
        <span class="rval" id="tipAmount">¥0</span>
      </div>
      <div class="result-row">
        <span class="rlabel">合計（チップ込み）</span>
        <span class="rval" id="grandTotal">¥0</span>
      </div>
      <div class="result-row main">
        <span class="rlabel">1人あたりの金額</span>
        <span class="rval" id="perPerson">¥0</span>
      </div>
    </div>
  </div>

<script>
  var hasSDK = !!(window.GUIOS && window.GUIOS.storage);
  var STORAGE_KEY = 'lastValues';
  var FALLBACK_KEY = 'guios-fallback-tip-calculator-lastValues';

  var totalEl = document.getElementById('total');
  var peopleEl = document.getElementById('people');
  var tipEl = document.getElementById('tip');
  var quickTips = document.getElementById('quickTips');

  function yen(n){
    if(!isFinite(n)) n = 0;
    return '¥' + Math.round(n).toLocaleString('ja-JP');
  }

  function recalc(){
    var total = parseFloat(totalEl.value) || 0;
    var people = parseInt(peopleEl.value, 10) || 1;
    if(people < 1) people = 1;
    var tipPct = parseFloat(tipEl.value) || 0;

    var tipAmount = total * (tipPct/100);
    var grand = total + tipAmount;
    var per = Math.ceil(grand / people);

    document.getElementById('tipAmount').textContent = yen(tipAmount);
    document.getElementById('grandTotal').textContent = yen(grand);
    document.getElementById('perPerson').textContent = yen(per);

    highlightActiveTip(tipPct);
    saveValues();
  }

  function highlightActiveTip(pct){
    var btns = quickTips.querySelectorAll('button');
    btns.forEach(function(b){
      b.classList.toggle('active', parseFloat(b.dataset.tip) === pct);
    });
  }

  var saveTimer = null;
  function saveValues(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async function(){
      var data = {
        total: totalEl.value,
        people: peopleEl.value,
        tip: tipEl.value
      };
      if(hasSDK){
        try{ await GUIOS.storage.set(STORAGE_KEY, data); }catch(e){}
      } else {
        try{ localStorage.setItem(FALLBACK_KEY, JSON.stringify(data)); }catch(e){}
      }
    }, 300);
  }

  async function restoreValues(){
    var data = null;
    if(hasSDK){
      try{ data = await GUIOS.storage.get(STORAGE_KEY); }catch(e){}
    } else {
      try{
        var raw = localStorage.getItem(FALLBACK_KEY);
        data = raw ? JSON.parse(raw) : null;
      }catch(e){}
    }
    if(data){
      if(data.total !== undefined && data.total !== '') totalEl.value = data.total;
      if(data.people !== undefined && data.people !== '') peopleEl.value = data.people;
      if(data.tip !== undefined && data.tip !== '') tipEl.value = data.tip;
    }
    recalc();
  }

  totalEl.addEventListener('input', recalc);
  peopleEl.addEventListener('input', recalc);
  tipEl.addEventListener('input', recalc);

  document.getElementById('peopleMinus').addEventListener('click', function(){
    var v = parseInt(peopleEl.value,10) || 1;
    if(v > 1) v--;
    peopleEl.value = v;
    recalc();
  });
  document.getElementById('peoplePlus').addEventListener('click', function(){
    var v = parseInt(peopleEl.value,10) || 1;
    v++;
    peopleEl.value = v;
    recalc();
  });

  quickTips.addEventListener('click', function(e){
    var btn = e.target.closest('button');
    if(!btn) return;
    tipEl.value = btn.dataset.tip;
    recalc();
  });

  restoreValues();
</script>
</body>
</html>
