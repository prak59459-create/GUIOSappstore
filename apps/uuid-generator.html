<!--GUIOS-APP {"id":"uuid-generator","name":"UUID生成","icon":"🆔","color":"#5e35b1","version":"1.0.0","author":"Claude","description":"ランダムなUUID(v4)を生成できるシンプルなツール。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>UUID生成</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:#141220; color:#ebe8f5; min-height:100vh; padding:16px 12px 60px;
  }
  h1{ font-size:18px; margin:0 0 14px; color:#b7a4e8; }
  .card{
    background:#1b1830; border:1px solid #322a4d; border-radius:14px; padding:14px; margin-bottom:14px;
  }
  .opt-row{ display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .opt{ display:flex; align-items:center; gap:8px; font-size:13px; color:#c8bfe8; }
  .opt input[type="number"]{
    width:66px; padding:9px 8px; border-radius:8px; border:1px solid #322a4d; background:#12101f;
    color:#ebe8f5; font-size:14px;
  }
  .seg{
    display:flex; border:2px solid #322a4d; border-radius:10px; overflow:hidden;
  }
  .seg button{
    flex:1; padding:9px 14px; border:none; background:#1b1830; color:#c8bfe8; font-size:12.5px;
    font-weight:700; cursor:pointer; min-height:38px;
  }
  .seg button.active{ background:#5e35b1; color:#fff; }
  .btn{
    width:100%; padding:13px; border-radius:12px; border:none; background:#5e35b1;
    color:#fff; font-weight:700; font-size:15px; cursor:pointer; min-height:46px; margin-top:4px;
  }
  .btn.secondary{ background:#2a2444; color:#d9d1f2; margin-top:10px; }
  .list{ display:flex; flex-direction:column; gap:8px; margin-top:14px; }
  .item{
    display:flex; align-items:center; gap:8px; background:#0f0d1c; border:1px solid #322a4d;
    border-radius:10px; padding:10px 12px;
  }
  .item .val{
    flex:1; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; word-break:break-all; color:#ebe8f5;
  }
  .item button{
    border:none; background:#2a2444; color:#d9d1f2; font-size:12px; padding:8px 10px; border-radius:8px;
    cursor:pointer; min-height:36px; flex-shrink:0;
  }
  .empty-hint{ font-size:13px; color:#6a6188; padding:10px 2px; text-align:center; }
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:#241f3d; color:#ebe8f5; padding:10px 18px; border-radius:10px;
    font-size:13px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;
    max-width:90%; text-align:center; box-shadow:0 6px 18px rgba(0,0,0,.35); z-index:100;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <h1>🆔 UUID生成</h1>

  <div class="card">
    <div class="opt-row">
      <div class="opt">
        <span>生成数</span>
        <input type="number" id="countInput" value="1" min="1" max="50">
      </div>
      <div class="seg" id="caseSeg">
        <button class="active" data-case="lower">小文字</button>
        <button data-case="upper">大文字</button>
      </div>
    </div>
    <button class="btn" id="generateBtn">生成する</button>
    <button class="btn secondary" id="copyAllBtn">すべてコピー</button>
  </div>

  <div class="list" id="list"></div>

  <div class="toast" id="toast"></div>

<script>
  var countInput = document.getElementById('countInput');
  var caseSeg = document.getElementById('caseSeg');
  var generateBtn = document.getElementById('generateBtn');
  var copyAllBtn = document.getElementById('copyAllBtn');
  var list = document.getElementById('list');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  var currentCase = 'lower';
  var currentUUIDs = [];

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }
  function notify(msg, type){
    if (window.GUIOS && window.GUIOS.notify) {
      try { window.GUIOS.notify(msg, { type: type || 'info' }); return; } catch(e){}
    }
    showToast(msg);
  }
  function copyText(text){
    if (window.GUIOS && window.GUIOS.clipboard && window.GUIOS.clipboard.writeText) {
      try { window.GUIOS.clipboard.writeText(text); return; } catch(e){}
    }
    try { navigator.clipboard.writeText(text); } catch(e){}
  }
  function haptic(){
    if (window.GUIOS && window.GUIOS.haptic) {
      try { window.GUIOS.haptic(); } catch(e){}
    }
  }

  function generateOneUUID(){
    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
      return window.crypto.randomUUID();
    }
    // manual fallback using crypto.getRandomValues, RFC 4122 v4
    var bytes = new Uint8Array(16);
    if (window.crypto && window.crypto.getRandomValues) {
      window.crypto.getRandomValues(bytes);
    } else {
      for (var i = 0; i < 16; i++) bytes[i] = Math.floor(Math.random() * 256);
    }
    bytes[6] = (bytes[6] & 0x0f) | 0x40; // version 4
    bytes[8] = (bytes[8] & 0x3f) | 0x80; // variant 10xx
    var hex = [];
    for (var j = 0; j < 16; j++) {
      var h = bytes[j].toString(16);
      hex.push(h.length === 1 ? '0' + h : h);
    }
    return (
      hex[0]+hex[1]+hex[2]+hex[3] + '-' +
      hex[4]+hex[5] + '-' +
      hex[6]+hex[7] + '-' +
      hex[8]+hex[9] + '-' +
      hex[10]+hex[11]+hex[12]+hex[13]+hex[14]+hex[15]
    );
  }

  function applyCase(uuid){
    return currentCase === 'upper' ? uuid.toUpperCase() : uuid.toLowerCase();
  }

  function render(){
    if (!currentUUIDs.length) {
      list.innerHTML = '<div class="empty-hint">「生成する」を押してUUIDを作成してください</div>';
      return;
    }
    var html = '';
    currentUUIDs.forEach(function(u, idx){
      html += '<div class="item"><div class="val">' + u + '</div>' +
        '<button data-idx="' + idx + '">📋</button></div>';
    });
    list.innerHTML = html;
    list.querySelectorAll('button[data-idx]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var idx = parseInt(btn.getAttribute('data-idx'), 10);
        copyText(currentUUIDs[idx]);
        notify('コピーしました', 'success');
      });
    });
  }

  function generate(){
    var count = parseInt(countInput.value, 10);
    if (!count || count < 1) count = 1;
    if (count > 50) count = 50;
    countInput.value = count;
    currentUUIDs = [];
    for (var i = 0; i < count; i++) {
      currentUUIDs.push(applyCase(generateOneUUID()));
    }
    render();
    haptic();
    notify(count + '個のUUIDを生成しました', 'success');
  }

  caseSeg.querySelectorAll('button').forEach(function(btn){
    btn.addEventListener('click', function(){
      caseSeg.querySelectorAll('button').forEach(function(b){ b.classList.remove('active'); });
      btn.classList.add('active');
      currentCase = btn.getAttribute('data-case');
      if (currentUUIDs.length) {
        currentUUIDs = currentUUIDs.map(function(u){ return applyCase(u); });
        render();
      }
    });
  });

  generateBtn.addEventListener('click', generate);
  copyAllBtn.addEventListener('click', function(){
    if (!currentUUIDs.length) {
      notify('コピーするUUIDがありません', 'error');
      return;
    }
    copyText(currentUUIDs.join('\n'));
    notify('すべてコピーしました', 'success');
  });

  render();
</script>
</body>
</html>
