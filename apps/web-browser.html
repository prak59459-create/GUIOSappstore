<!--GUIOS-APP {"id":"web-browser","name":"ウェブブラウザ","icon":"🌐","color":"#2f6fed","version":"1.0.0","author":"Claude","description":"タブ・拡張機能・ブックマークを備えた本格的なタブ型ウェブブラウザアプリ。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ウェブブラウザ</title>
<style>
:root{
  --chrome-bg:#1a1d24;
  --chrome-bg2:#20242e;
  --tab-bg:#262b36;
  --tab-active-bg:#323847;
  --text:#e9ecf3;
  --text-dim:#9aa3b8;
  --border:#363c4b;
  --accent:#2f6fed;
  --accent-soft:rgba(47,111,237,.18);
  --danger:#e5484d;
  --ok:#2fbf71;
  --page-bg:#ffffff;
  --page-text:#1c2028;
  --page-text-dim:#666f80;
  --page-border:#e3e6ec;
  --page-card:#f5f6f9;
  --page-accent:#2f6fed;
}
:root.ext-darkmode-on{
  --page-bg:#181b22;
  --page-text:#e7e9f0;
  --page-text-dim:#a2a9b8;
  --page-border:#333947;
  --page-card:#232733;
  --page-accent:#6fa2ff;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--chrome-bg);color:var(--text);font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif;font-size:14px;overflow:hidden;}
button{font-family:inherit;}
.browser-root{display:flex;flex-direction:column;height:100%;width:100%;}

/* ---- tab strip ---- */
.tabstrip-row{display:flex;align-items:stretch;background:var(--chrome-bg);border-bottom:1px solid var(--border);flex-shrink:0;}
.tabstrip{display:flex;flex:1;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;}
.tabstrip::-webkit-scrollbar{height:5px;}
.tabstrip::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.tab-item{display:flex;align-items:center;gap:6px;padding:8px 8px 8px 12px;background:var(--tab-bg);border-right:1px solid var(--border);cursor:pointer;min-width:110px;max-width:180px;flex-shrink:0;position:relative;top:1px;}
.tab-item.active{background:var(--tab-active-bg);border-bottom:2px solid var(--accent);}
.tab-icon{font-size:15px;flex-shrink:0;}
.tab-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px;color:var(--text);}
.tab-close{width:22px;height:22px;flex-shrink:0;border:none;background:transparent;color:var(--text-dim);border-radius:5px;cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;}
.tab-close:hover{background:rgba(255,255,255,.12);color:var(--text);}
.newtab-btn{width:42px;flex-shrink:0;border:none;background:transparent;color:var(--text-dim);font-size:19px;cursor:pointer;border-right:1px solid var(--border);}
.newtab-btn:hover{background:rgba(255,255,255,.06);color:var(--text);}
.newtab-menu-wrap{position:relative;flex-shrink:0;}
.newtab-menu{position:absolute;top:100%;left:0;background:var(--chrome-bg2);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.4);min-width:180px;z-index:60;padding:6px;}
.newtab-menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 10px;background:transparent;border:none;color:var(--text);border-radius:6px;cursor:pointer;font-size:13px;}
.newtab-menu button:hover{background:var(--accent-soft);}
.win-actions{display:flex;align-items:center;gap:2px;padding:0 6px;flex-shrink:0;}
.icon-btn{width:36px;height:36px;border:none;background:transparent;color:var(--text-dim);border-radius:7px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.icon-btn:hover{background:rgba(255,255,255,.08);color:var(--text);}
.icon-btn.active-state{color:var(--accent);background:var(--accent-soft);}

/* ---- nav bar ---- */
.navbar{display:flex;align-items:center;gap:4px;padding:7px 8px;background:var(--chrome-bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:nowrap;}
.nav-btn{width:34px;height:34px;border:none;background:transparent;color:var(--text-dim);border-radius:8px;cursor:pointer;font-size:15px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.nav-btn:hover:not(:disabled){background:rgba(255,255,255,.08);color:var(--text);}
.nav-btn:disabled{opacity:.3;cursor:default;}
.addressbar-wrap{flex:1;position:relative;min-width:0;}
.addressbar{width:100%;height:34px;border-radius:17px;border:1px solid var(--border);background:#12141a;color:var(--text);padding:0 40px 0 14px;font-size:13px;outline:none;}
.addressbar:focus{border-color:var(--accent);}
.star-btn{position:absolute;right:3px;top:3px;width:28px;height:28px;border:none;background:transparent;color:var(--text-dim);cursor:pointer;font-size:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.star-btn.starred{color:#f5b942;}
.suggest-list{position:absolute;top:38px;left:0;right:0;background:var(--chrome-bg2);border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.45);z-index:70;overflow:hidden;}
.suggest-item{display:flex;flex-direction:column;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border);}
.suggest-item:last-child{border-bottom:none;}
.suggest-item:hover{background:var(--accent-soft);}
.suggest-title{font-size:12.5px;color:var(--text);}
.suggest-url{font-size:11px;color:var(--text-dim);}
.ext-toolbar{display:flex;align-items:center;gap:2px;overflow-x:auto;max-width:38vw;flex-shrink:1;}
.ext-toolbar::-webkit-scrollbar{height:4px;}

/* ---- bookmarks bar ---- */
.bookmarks-bar{display:flex;align-items:center;gap:6px;padding:5px 10px;background:var(--chrome-bg2);border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0;}
.bookmarks-bar[hidden]{display:none;}
.bookmark-chip{display:flex;align-items:center;gap:5px;padding:4px 10px;background:var(--tab-bg);border:1px solid var(--border);border-radius:14px;font-size:11.5px;color:var(--text-dim);cursor:pointer;white-space:nowrap;flex-shrink:0;}
.bookmark-chip:hover{color:var(--text);border-color:var(--accent);}
.bookmarks-empty{font-size:11.5px;color:var(--text-dim);padding:2px 4px;}

/* ---- content area ---- */
.content-area{position:relative;flex:1;overflow:hidden;background:#0e1015;}
.tab-panel{position:absolute;inset:0;overflow-y:auto;display:none;background:var(--page-bg);}
.tab-panel.active{display:block;}
.page-inner{min-height:100%;background:var(--page-bg);color:var(--page-text);transform-origin:top left;}
.scrolltop-btn{position:fixed;right:18px;bottom:20px;z-index:55;padding:10px 14px;border-radius:22px;border:none;background:var(--accent);color:#fff;font-size:12.5px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .15s;}
.scrolltop-btn.show{opacity:1;pointer-events:auto;}

/* ---- generic page content styling ---- */
.pg{max-width:760px;margin:0 auto;padding:26px 22px 60px;}
.pg h1{font-size:22px;margin:0 0 6px;color:var(--page-text);}
.pg h2{font-size:17px;margin:24px 0 8px;color:var(--page-text);border-bottom:1px solid var(--page-border);padding-bottom:6px;}
.pg p{line-height:1.85;color:var(--page-text);margin:0 0 12px;font-size:14px;}
.pg .meta{color:var(--page-text-dim);font-size:12px;margin-bottom:14px;}
.url-chip{display:inline-block;font-size:11px;color:var(--page-text-dim);background:var(--page-card);border-radius:5px;padding:2px 7px;font-family:monospace;}
.link{background:none;border:none;color:var(--page-accent);text-decoration:underline;cursor:pointer;padding:0;font:inherit;font-size:inherit;}
.link:hover{opacity:.75;}
.inline-link{background:none;border:none;color:var(--page-accent);text-decoration:underline;cursor:pointer;padding:0;font:inherit;font-weight:600;}
.card{background:var(--page-card);border:1px solid var(--page-border);border-radius:10px;padding:14px 16px;margin-bottom:12px;}
.searchbox-row{display:flex;gap:8px;margin:18px 0;}
.searchbox-row input[type=text]{flex:1;height:42px;border-radius:22px;border:1px solid var(--page-border);padding:0 18px;font-size:14px;background:var(--page-bg);color:var(--page-text);outline:none;}
.searchbox-row input[type=text]:focus{border-color:var(--page-accent);}
.searchbox-row button{height:42px;padding:0 20px;border-radius:22px;border:none;background:var(--page-accent);color:#fff;font-size:13.5px;cursor:pointer;}
.quicklinks{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;margin-top:22px;}
.quicklink-tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;background:var(--page-card);border:1px solid var(--page-border);border-radius:12px;cursor:pointer;color:var(--page-text);font-size:12px;border:none;}
.quicklink-tile:hover{outline:2px solid var(--page-accent);}
.quicklink-tile .em{font-size:26px;}
.ad-block{margin:14px 0;padding:14px;background:repeating-linear-gradient(45deg,#fff3cd,#fff3cd 10px,#ffe9a8 10px,#ffe9a8 20px);border:1px dashed #d8a13a;border-radius:8px;color:#6b4d00;font-size:12.5px;text-align:center;}
.adblock-on .ad-block{display:none;}
.search-result{padding:10px 0;border-bottom:1px solid var(--page-border);}
.search-result:last-child{border-bottom:none;}
.search-result .r-title{font-size:15px;}
.search-result .r-url{font-size:11.5px;color:var(--page-accent);font-family:monospace;}
.search-result .r-snip{font-size:12.5px;color:var(--page-text-dim);margin-top:3px;}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px;}
.product-card{background:var(--page-card);border:1px solid var(--page-border);border-radius:10px;padding:12px;text-align:center;}
.product-card .em{font-size:34px;}
.product-card .pname{font-size:12.5px;margin:6px 0 2px;}
.product-card .pprice{color:var(--page-accent);font-weight:700;font-size:13px;}
.btn-mini{margin-top:8px;padding:6px 10px;border-radius:7px;border:none;background:var(--page-accent);color:#fff;font-size:11.5px;cursor:pointer;width:100%;}
.btn-outline{padding:6px 10px;border-radius:7px;border:1px solid var(--page-border);background:transparent;color:var(--page-text);font-size:11.5px;cursor:pointer;}
.cart-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--page-border);}
.thread-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--page-border);cursor:pointer;}
.thread-row:hover{color:var(--page-accent);}
.post{background:var(--page-card);border-radius:9px;padding:10px 13px;margin-bottom:9px;}
.post .pa{font-size:12px;font-weight:700;color:var(--page-accent);}
.post .pt{font-size:13px;margin-top:3px;white-space:pre-wrap;}
.reply-box textarea{width:100%;min-height:70px;border-radius:8px;border:1px solid var(--page-border);padding:9px;font-family:inherit;font-size:13px;background:var(--page-bg);color:var(--page-text);resize:vertical;}
.popup-blocked-note{margin-top:10px;padding:9px 12px;background:#e7f7ee;color:#1a7a45;border-radius:8px;font-size:12.5px;}
.popup-demo-banner{margin-top:10px;padding:9px 12px;background:#fdeeee;color:#a3242c;border-radius:8px;font-size:12.5px;}
.reader-mode .pg{max-width:600px;font-family:Georgia,"Hiragino Mincho ProN",serif;}
.reader-mode .pg h1{font-size:26px;text-align:center;}
.reader-mode .pg p{font-size:16px;line-height:2.1;}
.history-row,.bm-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--page-border);}
.history-row .hinfo,.bm-row .bminfo{min-width:0;flex:1;}
.history-row .htitle,.bm-row .bmtitle{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.history-row .hurl,.bm-row .bmurl{font-size:11px;color:var(--page-text-dim);font-family:monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.filter-input{width:100%;height:38px;border-radius:8px;border:1px solid var(--page-border);padding:0 12px;font-size:13px;margin-bottom:14px;background:var(--page-bg);color:var(--page-text);}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;}
.tag{font-size:11px;background:var(--page-card);border-radius:10px;padding:2px 9px;color:var(--page-text-dim);}
.settings-btn{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:10px;border-radius:9px;border:1px solid var(--page-border);background:var(--page-card);color:var(--page-text);cursor:pointer;font-size:13.5px;}
.settings-btn.danger{color:#c8353b;}

/* ---- code preview tab ---- */
.code-tab-wrap{display:flex;flex-direction:column;height:100%;}
.code-editor-tabs{display:flex;gap:4px;padding:8px 8px 0;background:var(--chrome-bg2);flex-shrink:0;}
.code-editor-tabs button{padding:7px 16px;border:none;background:var(--tab-bg);color:var(--text-dim);border-radius:8px 8px 0 0;cursor:pointer;font-size:12.5px;}
.code-editor-tabs button.active{background:#12141a;color:var(--text);}
.code-editor-body{flex:1;display:flex;min-height:0;background:var(--chrome-bg2);}
.code-editor-panes{flex:1;display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--border);}
.code-editor-panes textarea{flex:1;width:100%;border:none;background:#12141a;color:#d8dee9;font-family:"SFMono-Regular",Menlo,Consolas,monospace;font-size:12.5px;padding:12px;resize:none;outline:none;box-sizing:border-box;}
.code-editor-actions{display:flex;gap:8px;padding:8px;background:var(--chrome-bg2);flex-shrink:0;align-items:center;}
.run-btn{padding:8px 18px;border:none;background:var(--accent);color:#fff;border-radius:8px;cursor:pointer;font-size:13px;}
.code-note{font-size:11px;color:var(--text-dim);}
.code-preview-pane{flex:1;min-width:0;background:#fff;}
.code-preview-pane iframe{width:100%;height:100%;border:none;display:block;}
@media (max-width:760px){
  .code-editor-body{flex-direction:column;}
  .code-editor-panes{border-right:none;border-bottom:1px solid var(--border);height:45%;}
  .code-preview-pane{height:55%;}
}

/* ---- popovers ---- */
.popover-root{position:fixed;top:78px;right:14px;width:308px;max-width:92vw;max-height:78vh;overflow-y:auto;background:var(--chrome-bg2);border:1px solid var(--border);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.5);z-index:200;display:none;}
.popover-root.open{display:block;}
.popover-hd{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--border);}
.popover-hd b{font-size:13.5px;}
.popover-body{padding:14px;font-size:12.5px;color:var(--text);}
.popover-body label{display:block;margin:8px 0 4px;color:var(--text-dim);font-size:12px;}
.popover-body input[type=range]{width:100%;}
.popover-body input[type=text],.popover-body textarea{width:100%;border-radius:7px;border:1px solid var(--border);background:#12141a;color:var(--text);padding:7px 9px;font-size:12.5px;box-sizing:border-box;}
.popover-body textarea{min-height:80px;resize:vertical;font-family:monospace;}
.popover-body button.act{margin-top:8px;padding:8px 12px;border:none;background:var(--accent);color:#fff;border-radius:7px;cursor:pointer;font-size:12.5px;}
.popover-body button.act.secondary{background:var(--tab-bg);color:var(--text);border:1px solid var(--border);}
.pw-opts label{display:flex;align-items:center;gap:6px;color:var(--text);font-size:12px;margin:4px 0;}
.pw-result{display:flex;gap:6px;margin-top:8px;}
.pw-result input{flex:1;}
.chk-row{display:flex;align-items:center;justify-content:space-between;padding:8px 4px;}
.qr-canvas-wrap{display:flex;justify-content:center;padding:8px 0;background:#fff;border-radius:8px;}
.tab-search-item{padding:8px 6px;border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:12.5px;}
.tab-search-item:hover{background:var(--accent-soft);}
.ext-list{display:flex;flex-direction:column;gap:8px;}
.ext-card{display:flex;align-items:center;gap:10px;background:var(--tab-bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
.ext-card .eicon{font-size:20px;width:26px;text-align:center;}
.ext-card .einfo{flex:1;min-width:0;}
.ext-card .ename{font-size:13px;}
.ext-card .edesc{font-size:11px;color:var(--text-dim);margin-top:2px;}
.switch{position:relative;width:38px;height:22px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;position:absolute;}
.switch .slider{position:absolute;inset:0;background:#444b5c;border-radius:12px;cursor:pointer;transition:.15s;}
.switch .slider:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;}
.switch input:checked + .slider{background:var(--accent);}
.switch input:checked + .slider:before{transform:translateX(16px);}
.ext-panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;display:none;align-items:flex-start;justify-content:center;padding:40px 14px;overflow-y:auto;}
.ext-panel-overlay.open{display:flex;}
.ext-panel{width:420px;max-width:100%;background:var(--chrome-bg2);border:1px solid var(--border);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.ext-panel-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);}
.ext-panel-hd b{font-size:15px;}
.ext-panel-body{padding:14px 16px;max-height:70vh;overflow-y:auto;}

/* ---- notes side panel ---- */
.notes-panel{position:fixed;top:0;right:0;bottom:0;width:280px;max-width:88vw;background:var(--chrome-bg2);border-left:1px solid var(--border);z-index:250;transform:translateX(100%);transition:transform .18s;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.4);}
.notes-panel.open{transform:translateX(0);}
.notes-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);}
.notes-panel textarea{flex:1;border:none;background:#12141a;color:var(--text);padding:14px;font-size:13px;resize:none;outline:none;font-family:inherit;}
.notes-hint{font-size:10.5px;color:var(--text-dim);padding:0 16px 12px;}

/* ---- magnifier / translate tip / toast ---- */
.magnifier-lens{position:fixed;width:150px;height:150px;border-radius:50%;border:3px solid var(--accent);overflow:hidden;pointer-events:none;z-index:400;background:#fff;display:none;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.4);}
.magnifier-inner{transform:scale(2.1);transform-origin:center;max-width:96%;text-align:center;color:#111;}
.translate-tip{position:fixed;z-index:410;background:#1f2430;color:#fff;border:1px solid var(--accent);border-radius:8px;padding:8px 12px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:220px;}
.toast-stack{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:500;align-items:center;}
.toast{background:#242833;color:#fff;padding:10px 16px;border-radius:22px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.4);border:1px solid var(--border);}
.toast.success{border-color:var(--ok);}
.toast.error{border-color:var(--danger);}
.color-swatch{width:100%;height:44px;border-radius:8px;margin-bottom:8px;border:1px solid var(--border);}

/* ---- responsive ---- */
@media (max-width:480px){
  .ext-toolbar{max-width:26vw;}
  .navbar{flex-wrap:wrap;}
  .addressbar-wrap{order:3;flex:1 1 100%;margin-top:4px;}
  .pg{padding:18px 14px 50px;}
  .popover-root{right:6px;left:6px;width:auto;top:auto;bottom:8px;max-height:70vh;}
  .notes-panel{width:100%;}
}
[hidden]{display:none!important;}
</style>
</head>
<body>
<div class="browser-root" id="root">

  <div class="tabstrip-row">
    <div class="tabstrip" id="tabStrip"></div>
    <div class="newtab-menu-wrap" id="newtabMenuWrap">
      <button type="button" class="newtab-btn" id="newtabBtn" title="新しいタブ">＋</button>
      <div class="newtab-menu" id="newtabMenu" hidden>
        <button type="button" data-newtab-type="web">🌐 新しいタブ（ウェブ）</button>
        <button type="button" data-newtab-type="code">💻 コード実行タブ</button>
      </div>
    </div>
    <div class="win-actions">
      <button type="button" class="icon-btn" id="notesToggleTop" title="メモ帳" hidden>📝</button>
    </div>
  </div>

  <div class="navbar">
    <button type="button" class="nav-btn" id="backBtn" title="戻る">◀</button>
    <button type="button" class="nav-btn" id="fwdBtn" title="進む">▶</button>
    <button type="button" class="nav-btn" id="reloadBtn" title="再読み込み">⟳</button>
    <div class="addressbar-wrap">
      <input type="text" class="addressbar" id="addressBar" placeholder="検索ワードまたは内部URL（例: wiki://home）を入力" autocomplete="off">
      <button type="button" class="star-btn" id="starBtn" title="ブックマーク">☆</button>
      <div class="suggest-list" id="suggestList" hidden></div>
    </div>
    <div class="ext-toolbar" id="extToolbar"></div>
    <button type="button" class="icon-btn" id="extPanelBtn" title="拡張機能">🧩</button>

Object.keys(DICT).forEach(function(k){ DICT_REV[String(DICT[k]).toLowerCase()] = k; });
function lookupDict(word){
  if (!word) return null;
  var w = word.trim();
  if (!w || w.length>16) return null;
  if (DICT[w]) return {from:w, to:DICT[w]};
  var lw = w.toLowerCase();
  if (DICT_REV[lw]) return {from:w, to:DICT_REV[lw]};
  return null;
}

var SEARCH_INDEX = [];
function buildSearchIndex(){
  SEARCH_INDEX = [];
  WIKI.forEach(function(a){
    SEARCH_INDEX.push({url:"wiki://article/"+a.id, title:a.title+" - 百科事典", kw:a.kw.concat([a.title]), snip:a.p[0].slice(0,60)});
  });
  NEWS.forEach(function(a){
    SEARCH_INDEX.push({url:"news://article/"+a.id, title:a.title, kw:[a.cat], snip:a.p[0].slice(0,60)});
  });
  SHOP.forEach(function(a){
    SEARCH_INDEX.push({url:"shop://product/"+a.id, title:a.name+" - ショッピング", kw:[a.name], snip:a.desc.slice(0,60)});
  });
  BBS.forEach(function(a){
    SEARCH_INDEX.push({url:"bbs://thread/"+a.id, title:a.title+" - 掲示板", kw:[a.title], snip:(a.posts[0]?a.posts[0].t:"").slice(0,60)});
  });
}
function runSearch(query){
  query = (query||"").trim().toLowerCase();
  if (!query) return [];
  var tokens = query.split(/\s+/).filter(Boolean);
  var scored = SEARCH_INDEX.map(function(item){
    var score = 0;
    var titleL = item.title.toLowerCase();
    var snipL = item.snip.toLowerCase();
    tokens.forEach(function(t){
      if (titleL.indexOf(t)>=0) score += 5;
      item.kw.forEach(function(k){ if (k.toLowerCase().indexOf(t)>=0 || t.indexOf(k.toLowerCase())>=0) score += 3; });
      if (snipL.indexOf(t)>=0) score += 1;
    });
    return {item:item, score:score};
  }).filter(function(s){ return s.score>0; });
  scored.sort(function(a,b){ return b.score-a.score; });
  return scored.slice(0,20).map(function(s){ return s.item; });
}

/* =========================================================
   3. ルーター: URL解析 & ページレンダリング
   ========================================================= */
function parseUrl(url){
  var m = /^([a-zA-Z0-9]+):\/\/([^?]*)(?:\?(.*))?$/.exec(url||"");
  if (!m) return {scheme:"", path:"", query:{}, raw:url};
  var scheme = m[1].toLowerCase(), path = m[2]||"", qs = m[3]||"";
  var query = {};
  qs.split("&").forEach(function(pair){
    if (!pair) return;
    var kv = pair.split("=");
    try{ query[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1]||""); }catch(e){}
  });
  return {scheme:scheme, path:path.replace(/\/$/,""), query:query, raw:url};
}

function wikiIndexHtml(){
  var items = WIKI.map(function(a){
    return '<li style="margin-bottom:6px;"><button type="button" class="link" data-nav="wiki://article/'+a.id+'">'+esc(a.title)+'</button></li>';
  }).join("");
  return '<div class="pg"><h1>📖 百科事典</h1><p class="meta">全'+WIKI.length+'件の記事があります</p><ul style="padding-left:20px;">'+items+'</ul></div>';
}
function wikiArticleHtml(a){
  var relatedHtml = (a.related||[]).map(function(r){
    return '<button type="button" class="link" data-nav="wiki://article/'+r.id+'" style="margin-right:12px;">'+esc(r.label)+'</button>';
  }).join("");
  var paras = a.p.map(function(t,i){
    var map = {};
    (a.related||[]).forEach(function(r){ if (t.indexOf(r.label)>=0) map[r.label] = "wiki://article/"+r.id; });
    return '<p>'+linkify(t, map)+'</p>';
  }).join("");
  var html = '<div class="pg"><span class="url-chip">wiki://article/'+a.id+'</span>'+
    '<h1>'+esc(a.title)+'</h1>'+
    '<div class="tag-row">'+a.kw.map(function(k){ return '<span class="tag">'+esc(k)+'</span>'; }).join("")+'</div>'+
    paras+
    (relatedHtml ? '<h2>関連記事</h2><div>'+relatedHtml+'</div>' : '')+
    '<p style="margin-top:20px;"><button type="button" class="link" data-nav="wiki://home">← 百科事典トップへ戻る</button></p>'+
    '</div>';
  var readerHtml = '<div class="pg"><h1>'+esc(a.title)+'</h1>'+a.p.map(function(t){ return '<p>'+esc(t)+'</p>'; }).join("")+'</div>';
  return {title:a.title+" - 百科事典", html:html, readerHtml:readerHtml};
}
function renderWiki(u){
  if (!u.path || u.path==="home") return {title:"百科事典", html:wikiIndexHtml()};
  var m = /^article\/(.+)$/.exec(u.path);
  if (m){
    var a = WIKI.filter(function(x){ return x.id===m[1]; })[0];
    if (a) return wikiArticleHtml(a);
  }
  return null;
}

function shopCartHtml(){
  var rows = cart.map(function(c){
    var p = SHOP.filter(function(x){ return x.id===c.id; })[0];
    if (!p) return "";
    return '<div class="cart-row"><span>'+p.emoji+' '+esc(p.name)+' × '+c.qty+'</span>'+
      '<span>¥'+(p.price*c.qty).toLocaleString()+' <button type="button" class="btn-outline" data-action="remove-cart" data-product="'+p.id+'">削除</button></span></div>';
  }).join("");
  var total = cart.reduce(function(sum,c){
    var p = SHOP.filter(function(x){ return x.id===c.id; })[0];
    return sum + (p ? p.price*c.qty : 0);
  }, 0);
  var html = '<div class="pg"><h1>🛒 カート</h1>'+
    (cart.length ? rows+'<div style="text-align:right;margin-top:12px;font-size:15px;">合計: ¥'+total.toLocaleString()+'</div>' : '<p style="color:var(--page-text-dim);">カートは空です。</p>')+
    '<p style="margin-top:18px;"><button type="button" class="link" data-nav="shop://home">← 商品一覧へ戻る</button></p>'+
    '</div>';
  return {title:"カート", html:html};
}

  var m = /^product\/(\d+)$/.exec(u.path);
  if (m){
    var p = SHOP.filter(function(x){ return String(x.id)===m[1]; })[0];
    if (p) return shopProductHtml(p);

  return null;
}

function renderInternal(u){
  switch(u.path){
    case "bookmarks": return {title:"ブックマーク管理", html:renderBookmarksPage()};
    case "history": return {title:"履歴", html:renderHistoryPage()};
    case "settings": return {title:"設定", html:renderSettingsPage()};
    case "about": return {title:"このブラウザについて", html:renderAboutPage()};
    default: return null;
  }
}

function renderPageHtml(url){
  var u = parseUrl(url);
  var result = null;
  switch(u.scheme){
    case "newtab": result = renderNewTab(); break;
    case "search":
      if (!u.path || u.path==="home") result = renderSearchHome();
      else if (u.path==="results") result = renderSearchResults(u.query.q||"");
      break;
    case "wiki": result = renderWiki(u); break;
    case "news": result = renderNews(u); break;
    case "shop": result = renderShop(u); break;
    case "bbs": result = renderBbs(u); break;
    case "internal": result = renderInternal(u); break;
    case "http": case "https":
      return renderNotFound(url, true);
  }
  if (!result) return renderNotFound(url, false);
  return result;
}
function schemeIcon(url){
  var u = parseUrl(url);
  switch(u.scheme){
    case "newtab": return "🌐";
    case "search": return "🔍";
    case "wiki": return "📖";
    case "news": return "📰";
    case "shop": return "🛒";
    case "bbs": return "💬";
    case "internal": return "⚙️";
    default: return "🌐";
  }
}
function shouldLogHistory(url){
  var u = parseUrl(url);
  return ["wiki","news","shop","bbs","search"].indexOf(u.scheme)>=0;
}

var tabs = [];
var activeTabId = null;
var tabSeq = 0;
var MAX_TABS = 8;
var pickerArmed = false;

function getTab(id){ return tabs.filter(function(t){ return t.id===id; })[0] || null; }
function getActiveTab(){ return getTab(activeTabId); }

function createTab(type, url){
  if (tabs.length>=MAX_TABS){ notify("タブは最大"+MAX_TABS+"個までです", {type:"info"}); return null; }
  var id = "t"+(++tabSeq);
  var tab = {
    id:id, type:type, zoom:1, readerPages:{}, clockInterval:null, tipTimer:null, tipIndex:0
  };
  if (type==="code"){
    tab.title = "コード実行";
    tab.icon = "💻";
    tab.code = {html:"<h1>こんにちは</h1>\n<p>ここにHTMLを書いてプレビューできます。</p>", css:"h1{color:#2f6fed;font-family:sans-serif;}\np{font-family:sans-serif;}", js:"console.log('code preview ready');", active:"html"};
  } else {
    tab.history = [url||"newtab://home"];
    tab.historyIndex = 0;
    tab.title = "新しいタブ";
    tab.icon = "🌐";
  }
  tabs.push(tab);
  setActiveTab(id);
  renderTabStrip();
  return tab;
}

function ensurePanel(tab){
  if (tab.el) return tab.el;
  var el = document.createElement("div");
  el.className = "tab-panel";
  el.dataset.tabId = tab.id;
  document.getElementById("tabContentArea").appendChild(el);
  tab.el = el;
  if (tab.type==="web"){
    el.innerHTML = '<div class="page-inner"></div><button type="button" class="scrolltop-btn" data-action="scroll-top">▲ 上へ</button>';
    renderInto(tab);
  } else {
    buildCodeTabUI(tab);
  }
  return el;
}

function stopTabTimers(tab){
  if (tab.clockInterval){ clearInterval(tab.clockInterval); tab.clockInterval=null; }
}

function renderInto(tab){
  if (tab.type!=="web") return;
  stopTabTimers(tab);
  var url = tab.history[tab.historyIndex];
  var data = renderPageHtml(url);
  var inner = tab.el.querySelector(".page-inner");
  while (inner.firstChild) inner.removeChild(inner.firstChild);
  var useReader = tab.readerPages[url] && data.readerHtml;
  inner.innerHTML = useReader ? data.readerHtml : data.html;
  inner.classList.toggle("reader-mode", !!useReader);
  tab.title = data.title;
  tab.icon = schemeIcon(url);
  tab.el.scrollTop = 0;
  applyZoom(tab);
  if (parseUrl(url).scheme==="newtab" && extState.newtabwidgets) startNewTabWidgets(tab);
  if (shouldLogHistory(url) && !data._noLog){
    history.push({url:url, title:data.title, ts:Date.now()});
    Store.set("history", history);
  }
}

function startNewTabWidgets(tab){
  var clockEl = tab.el.querySelector(".clock-widget");
  var tipEl = tab.el.querySelector(".tip-widget");
  if (!clockEl) return;
  function tick(){
    var d = new Date();
    function p(n){ return (n<10?"0":"")+n; }
    clockEl.textContent = p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
    if (d.getSeconds()%8===0){
      tab.tipIndex = (tab.tipIndex+1)%NEWTAB_TIPS.length;
      if (tipEl) tipEl.textContent = "💡 " + NEWTAB_TIPS[tab.tipIndex];
    } else if (tipEl && tipEl.textContent==="読み込み中…"){
      tipEl.textContent = "💡 " + NEWTAB_TIPS[tab.tipIndex];
    }
  }
  tick();
  tab.clockInterval = setInterval(tick, 1000);
}

function navigateTab(tabId, url, opts){
  opts = opts || {};
  var tab = getTab(tabId);
  if (!tab || tab.type!=="web") return;
  ensurePanel(tab);
  if (!opts.fromHistory){
    tab.history = tab.history.slice(0, tab.historyIndex+1);
    tab.history.push(url);
    tab.historyIndex = tab.history.length-1;
  }
  renderInto(tab);
  if (tabId===activeTabId) refreshChrome();
  renderTabStrip();
}
function goBack(tabId){
  var tab = getTab(tabId);
  if (!tab || tab.type!=="web" || tab.historyIndex<=0) return;
  tab.historyIndex--;
  renderInto(tab);
  refreshChrome(); renderTabStrip();
}
function goForward(tabId){
  var tab = getTab(tabId);
  if (!tab || tab.type!=="web" || tab.historyIndex>=tab.history.length-1) return;
  tab.historyIndex++;
  renderInto(tab);
  refreshChrome(); renderTabStrip();
}
function reloadTab(tabId){
  var tab = getTab(tabId);
  if (!tab) return;
  if (tab.type==="web") renderInto(tab);
  else updateCodePreview(tab);
  refreshChrome();
}

function setActiveTab(id){
  var tab = getTab(id);
  if (!tab) return;
  activeTabId = id;
  ensurePanel(tab);
  tabs.forEach(function(t){
    if (t.el) t.el.classList.toggle("active", t.id===id);
  });
  refreshChrome();
  renderTabStrip();
  closePopover();
}

function closeTab(tabId){
  var idx = tabs.findIndex(function(t){ return t.id===tabId; });
  if (idx<0) return;
  var tab = tabs[idx];
  stopTabTimers(tab);
  if (tab.el && tab.el.parentNode) tab.el.parentNode.removeChild(tab.el);
  tabs.splice(idx,1);
  if (tabs.length===0){
    createTab("web","newtab://home");
    return;
  }
  if (activeTabId===tabId){
    var newActive = tabs[Math.max(0, idx-1)];
    setActiveTab(newActive.id);
  } else {
    renderTabStrip();
  }
}

function renderTabStrip(){
  var strip = document.getElementById("tabStrip");
  strip.innerHTML = tabs.map(function(t){
    var active = t.id===activeTabId ? " active" : "";
    return '<div class="tab-item'+active+'" data-tabid="'+t.id+'" data-tabact="switch">'+
      '<span class="tab-icon">'+t.icon+'</span><span class="tab-title">'+esc(truncate(t.title,16))+'</span>'+
      '<button type="button" class="tab-close" data-tabid="'+t.id+'" data-tabact="close">✕</button></div>';
  }).join("");
}

function refreshChrome(){
  var tab = getActiveTab();
  var backBtn = document.getElementById("backBtn");
  var fwdBtn = document.getElementById("fwdBtn");
  var addressBar = document.getElementById("addressBar");
  var starBtn = document.getElementById("starBtn");
  if (!tab){ return; }
  if (tab.type==="code"){
    backBtn.disabled = true; fwdBtn.disabled = true;
    addressBar.value = "コード実行タブ（アドレスバーは使用できません）";
    addressBar.disabled = true;
    starBtn.classList.remove("starred"); starBtn.textContent = "☆";
  } else {
    addressBar.disabled = false;
    backBtn.disabled = tab.historyIndex<=0;
    fwdBtn.disabled = tab.historyIndex>=tab.history.length-1;
    var url = tab.history[tab.historyIndex];
    addressBar.value = url;
    var isBm = bookmarks.some(function(b){ return b.url===url; });
    starBtn.classList.toggle("starred", isBm);
    starBtn.textContent = isBm ? "★" : "☆";
  }
  renderBookmarksBar();
}

function buildCodeTabUI(tab){
  tab.el.innerHTML =
    '<div class="code-tab-wrap">'+
      '<div class="code-editor-tabs">'+
        '<button type="button" data-editor="html" class="active">HTML</button>'+
        '<button type="button" data-editor="css">CSS</button>'+
        '<button type="button" data-editor="js">JS</button>'+
      '</div>'+
      '<div class="code-editor-body">'+
        '<div class="code-editor-panes"><textarea class="code-input"></textarea></div>'+
        '<div class="code-preview-pane"><iframe sandbox="allow-scripts"></iframe></div>'+
      '</div>'+
      '<div class="code-editor-actions"><button type="button" class="run-btn" data-action="code-run">更新</button>'+
      '<span class="code-note">このタブの内容は他のタブや拡張機能から独立しています</span></div>'+
    '</div>';
  var textarea = tab.el.querySelector(".code-input");
  textarea.value = tab.code.html;
  tab.el.querySelectorAll(".code-editor-tabs button").forEach(function(btn){
    btn.addEventListener("click", function(){
      tab.code[tab.code.active] = textarea.value;
      tab.code.active = btn.dataset.editor;
      tab.el.querySelectorAll(".code-editor-tabs button").forEach(function(b){ b.classList.toggle("active", b===btn); });
      textarea.value = tab.code[tab.code.active];
    });
  });

  updateCodePreview(tab);
}
function updateCodePreview(tab){
  var textarea = tab.el.querySelector(".code-input");
  if (textarea) tab.code[tab.code.active] = textarea.value;
  var iframe = tab.el.querySelector("iframe");
  var doc = "<!DOCTYPE html><html><head><meta charset=\"UTF-8\"><style>"+tab.code.css+"</style></head><body>"+tab.code.html+"<script>"+tab.code.js+"<\/script></body></html>";
  iframe.setAttribute("srcdoc", doc);
}
function refreshCodeEditorUI(tab){
  if (!tab.el) return;
  var textarea = tab.el.querySelector(".code-input");
  tab.code.active = "html";
  tab.el.querySelectorAll(".code-editor-tabs button").forEach(function(b){ b.classList.toggle("active", b.dataset.editor==="html"); });
  if (textarea) textarea.value = tab.code.html;
  updateCodePreview(tab);
}

/* =========================================================
   7. ブックマーク / 履歴 の操作
   ========================================================= */
function openBookmarkByIndex(i){
  var bm = bookmarks[i];
  if (!bm) return;
  openBookmarkObj(bm);
}
function openBookmarkByUrl(url){
  var bm = bookmarks.filter(function(b){ return b.url===url; })[0];
  if (bm){ openBookmarkObj(bm); return; }
  openPlainUrl(url);
}
function openBookmarkObj(bm){
  if (bm.type==="snippet"){
    var tab = createTab("code");
    tab.code.html = bm.html; tab.code.css = bm.css; tab.code.js = bm.js; tab.title = bm.title;
    refreshCodeEditorUI(tab);
    renderTabStrip();
  } else {
    openPlainUrl(bm.url);
  }
}
function openPlainUrl(url){
  var tab = getActiveTab();
  if (!tab || tab.type!=="web") tab = createTab("web", url);
  else navigateTab(tab.id, url);
}
function toggleBookmarkCurrent(){
  var tab = getActiveTab();
  if (!tab) return;
  if (tab.type==="code"){
    var name = prompt("スニペット名を入力してください", tab.title||"マイスニペット");
    if (!name) return;
    var textarea = tab.el.querySelector(".code-input");
    if (textarea) tab.code[tab.code.active] = textarea.value;
    bookmarks.push({url:"code://snippet/"+Date.now(), title:name, type:"snippet", html:tab.code.html, css:tab.code.css, js:tab.code.js, ts:Date.now()});
    Store.set("bookmarks", bookmarks);
    notify("スニペットを保存しました", {type:"success"});
    renderBookmarksBar();
    return;
  }
  var url = tab.history[tab.historyIndex];
  var idx = bookmarks.findIndex(function(b){ return b.url===url; });
  if (idx>=0){
    bookmarks.splice(idx,1);
    notify("ブックマークを削除しました", {type:"info"});
  } else {
    bookmarks.push({url:url, title:tab.title, type:"page", ts:Date.now()});
    notify("ブックマークに追加しました", {type:"success"});
  }
  Store.set("bookmarks", bookmarks);
  refreshChrome();
}
function renderBookmarksBar(){
  var bar = document.getElementById("bookmarksBar");
  bar.hidden = !prefs.showBookmarksBar;
  if (!prefs.showBookmarksBar) return;
  if (!bookmarks.length){
    bar.innerHTML = '<span class="bookmarks-empty">ブックマークはまだありません。☆ボタンで追加できます。</span>';
    return;
  }
  bar.innerHTML = bookmarks.map(function(b,i){
    var icon = b.type==="snippet" ? "💻" : "⭐";
    return '<div class="bookmark-chip" data-action="open-bookmark" data-idx="'+i+'">'+icon+' '+esc(truncate(b.title,16))+'</div>';
  }).join("");
}

}

}

function toggleReaderMode(){

  var url = tab.history[tab.historyIndex];

  if (!data.readerHtml){ notify("このページはリーダーモードに対応していません", {type:"info"}); return; }
  tab.readerPages[url] = !tab.readerPages[url];
  renderInto(tab);
  notify(tab.readerPages[url] ? "リーダーモードをオンにしました" : "リーダーモードをオフにしました", {type:"info"});
}
function toggleColorPickerArm(){

function openPwgenPopover(def){
  var body =
    '<label>長さ: <span id="pwLenVal">16</span>文字</label>'+
    '<input type="range" id="pwLen" min="4" max="64" value="16">'+
    '<div class="pw-opts">'+
    '<label><input type="checkbox" id="pwUpper" checked> 大文字 (A-Z)</label>'+
    '<label><input type="checkbox" id="pwLower" checked> 小文字 (a-z)</label>'+
    '<label><input type="checkbox" id="pwDigit" checked> 数字 (0-9)</label>'+
    '<label><input type="checkbox" id="pwSymbol"> 記号 (!@#$%)</label>'+
    '</div>'+
    '<button type="button" class="act" id="pwGenBtn">生成</button>'+
    '<div class="pw-result"><input type="text" id="pwOut" readonly><button type="button" class="act secondary" id="pwCopyBtn">コピー</button></div>';
  openPopover("pwgen", "🔑 パスワード生成", body);
  var lenInput = document.getElementById("pwLen");
  var lenVal = document.getElementById("pwLenVal");
  lenInput.addEventListener("input", function(){ lenVal.textContent = lenInput.value; });
  document.getElementById("pwGenBtn").addEventListener("click", function(){
    var sets = [];
    if (document.getElementById("pwUpper").checked) sets.push("ABCDEFGHIJKLMNOPQRSTUVWXYZ");
    if (document.getElementById("pwLower").checked) sets.push("abcdefghijklmnopqrstuvwxyz");
    if (document.getElementById("pwDigit").checked) sets.push("0123456789");
    if (document.getElementById("pwSymbol").checked) sets.push("!@#$%^&*()-_=+");
    if (!sets.length){ notify("少なくとも1つの文字種を選択してください", {type:"error"}); return; }
    var all = sets.join("");
    var len = parseInt(lenInput.value,10);
    var out = "";
    var randArr = null;
    try{
      if (window.crypto && crypto.getRandomValues) randArr = crypto.getRandomValues(new Uint32Array(len));
    }catch(e){}
    for (var i=0;i<len;i++){
      var r = randArr ? randArr[i] : Math.floor(Math.random()*4294967296);
      out += all[r % all.length];
    }
    document.getElementById("pwOut").value = out;
  });
  document.getElementById("pwCopyBtn").addEventListener("click", function(){
    var v = document.getElementById("pwOut").value;
    if (!v){ notify("先にパスワードを生成してください", {type:"info"}); return; }
    copyText(v);
  });
}

    list.innerHTML = tabs.filter(function(t){ return !f || t.title.toLowerCase().indexOf(f)>=0; }).map(function(t){
      return '<div class="tab-search-item" data-jump="'+t.id+'"><span>'+t.icon+'</span><span>'+esc(truncate(t.title,22))+'</span></div>';
    }).join("") || '<div style="color:var(--text-dim);padding:8px;">一致するタブがありません</div>';
    list.querySelectorAll("[data-jump]").forEach(function(el){
      el.addEventListener("click", function(){ setActiveTab(el.dataset.jump); closePopover(); });
    });
  }
  renderList("");
  document.getElementById("tabSearchInput").addEventListener("input", function(e){ renderList(e.target.value); });
}

function openBookmarkioPopover(def){
  var body = '<button type="button" class="act" id="bmExportBtn">エクスポート（.json）</button>'+
    '<label>インポートするJSONを貼り付け</label>'+
    '<textarea id="bmImportArea" placeholder=\'[{"url":"wiki://home","title":"例"}]\'></textarea>'+
    '<button type="button" class="act secondary" id="bmImportBtn">インポート</button>';
  openPopover("bookmarkio", "💾 ブックマークのエクスポート/インポート", body);
  document.getElementById("bmExportBtn").addEventListener("click", function(){
    try{
      var blob = new Blob([JSON.stringify(bookmarks, null, 2)], {type:"application/json"});
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "bookmarks.json";
      document.body.appendChild(a);
      a.click();
      setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(a.href); }, 1000);
      notify("ブックマークを書き出しました", {type:"success"});
    }catch(e){ notify("書き出しに失敗しました", {type:"error"}); }
  });
  document.getElementById("bmImportBtn").addEventListener("click", function(){
    var raw = document.getElementById("bmImportArea").value.trim();
    if (!raw){ notify("JSONを貼り付けてください", {type:"info"}); return; }
    try{
      var arr = JSON.parse(raw);
      if (!Array.isArray(arr)) throw new Error("not array");
      var added = 0;
      arr.forEach(function(item){
        if (item && typeof item.url==="string" && typeof item.title==="string"){
          if (!bookmarks.some(function(b){ return b.url===item.url; })){
            bookmarks.push({url:item.url, title:item.title, type:item.type||"page", ts:Date.now()});
            added++;
          }
        }
      });
      Store.set("bookmarks", bookmarks);
      renderBookmarksBar(); refreshChrome();
      notify(added+"件のブックマークをインポートしました", {type:"success"});
    }catch(e){ notify("正しいJSON配列ではありません", {type:"error"}); }
  });
}

/* =========================================================
   10. 拡張機能パネル
   ========================================================= */
function renderExtPanel(){
  var list = document.getElementById("extList");
  list.innerHTML = EXT_DEFS.map(function(e){
    return '<div class="ext-card"><div class="eicon">'+e.icon+'</div>'+
      '<div class="einfo"><div class="ename">'+esc(e.name)+'</div><div class="edesc">'+esc(e.desc)+'</div></div>'+
      '<label class="switch"><input type="checkbox" data-extToggle="'+e.id+'" '+(extState[e.id]?"checked":"")+'><span class="slider"></span></label>'+
      '</div>';
  }).join("");
}
function setExtEnabled(extId, enabled){
  extState[extId] = enabled;
  Store.set("extensions", extState);
  applyGlobalExtClasses();
  renderExtToolbar();
  if (extId==="notes" && !enabled) closeNotesPanel();
  if (extId==="colorpicker" && !enabled) pickerArmed = false;
  tabs.forEach(function(t){ if (t.type==="web" && t.el) renderInto(t); });
  if (activeTabId) refreshChrome();
}

/* =========================================================
   12. 拡大鏡・翻訳・ポップアップブロック・音声デモ 等
   ========================================================= */
var magnifierEl = null;
function ensureMagnifier(){
  if (magnifierEl) return magnifierEl;
  magnifierEl = document.createElement("div");
  magnifierEl.className = "magnifier-lens";
  magnifierEl.innerHTML = '<div class="magnifier-inner"></div>';
  document.body.appendChild(magnifierEl);
  return magnifierEl;
}
function hideMagnifier(){ if (magnifierEl) magnifierEl.style.display = "none"; }

function playDemoTone(){
  try{
    var ctx = new (window.AudioContext||window.webkitAudioContext)();
    var osc = ctx.createOscillator(); var gain = ctx.createGain();
    osc.frequency.value = 440;
    osc.connect(gain); gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    osc.start();
    osc.frequency.linearRampToValueAtTime(660, ctx.currentTime+0.4);
    gain.gain.linearRampToValueAtTime(0.0001, ctx.currentTime+0.8);
    osc.stop(ctx.currentTime+0.85);
  }catch(e){}
}

var translateTipEl = null;
function showTranslateTip(x, y, from, result){
  if (!translateTipEl){
    translateTipEl = document.createElement("div");
    translateTipEl.className = "translate-tip";
    document.body.appendChild(translateTipEl);
  }
  translateTipEl.textContent = result ? (from + " → " + result.to) : (from + " : 辞書に見つかりません");
  translateTipEl.style.left = Math.min(window.innerWidth-230, x+8) + "px";
  translateTipEl.style.top = Math.max(8, y-40) + "px";
  translateTipEl.style.display = "block";
  clearTimeout(translateTipEl._hideTimer);
  translateTipEl._hideTimer = setTimeout(function(){ if (translateTipEl) translateTipEl.style.display = "none"; }, 3800);
}

/* =========================================================
   13. イベント配線
   ========================================================= */
function bindGlobalEvents(){
  var contentArea = document.getElementById("tabContentArea");

  document.getElementById("backBtn").addEventListener("click", function(){ if (activeTabId) goBack(activeTabId); });
  document.getElementById("fwdBtn").addEventListener("click", function(){ if (activeTabId) goForward(activeTabId); });
  document.getElementById("reloadBtn").addEventListener("click", function(){ if (activeTabId) reloadTab(activeTabId); });
  document.getElementById("starBtn").addEventListener("click", toggleBookmarkCurrent);

  document.getElementById("newtabBtn").addEventListener("click", function(e){
    e.stopPropagation();
    document.getElementById("newtabMenu").hidden = !document.getElementById("newtabMenu").hidden;
  });
  document.getElementById("newtabMenu").addEventListener("click", function(e){
    var btn = e.target.closest("[data-newtab-type]");
    if (!btn) return;
    createTab(btn.dataset.newtabType, "newtab://home");
    document.getElementById("newtabMenu").hidden = true;
  });
  document.addEventListener("click", function(e){
    if (!e.target.closest("#newtabMenuWrap")) document.getElementById("newtabMenu").hidden = true;
  });

  document.getElementById("tabStrip").addEventListener("click", function(e){
    var closeBtn = e.target.closest('[data-tabact="close"]');
    if (closeBtn){ e.stopPropagation(); closeTab(closeBtn.dataset.tabid); return; }
    var item = e.target.closest('[data-tabact="switch"]');
    if (item) setActiveTab(item.dataset.tabid);
  });

  var addressBar = document.getElementById("addressBar");
  var suggestList = document.getElementById("suggestList");
  function submitAddress(val){
    suggestList.hidden = true;
    var tab = getActiveTab();
    if (!tab || tab.type==="code"){ notify("コード実行タブではアドレスバーは使用できません", {type:"info"}); return; }
    val = (val===undefined ? addressBar.value : val).trim();
    if (!val) return;
    var url;
    if (/^[a-zA-Z0-9]+:\/\//.test(val)) url = val;
    else url = "search://results?q=" + encodeURIComponent(val);
    navigateTab(tab.id, url);
  }
  addressBar.addEventListener("keydown", function(e){ if (e.key==="Enter") submitAddress(); });
  addressBar.addEventListener("input", function(){
    var q = addressBar.value.trim().toLowerCase();
    if (!q){ suggestList.hidden = true; return; }
    var seen = {};
    var matches = [];
    bookmarks.forEach(function(b){
      if (b.title.toLowerCase().indexOf(q)>=0 && !seen[b.url]){ matches.push({title:b.title, url:b.url}); seen[b.url]=1; }
    });
    history.slice().reverse().forEach(function(h){
      if (matches.length>=6) return;
      if ((h.title.toLowerCase().indexOf(q)>=0 || h.url.toLowerCase().indexOf(q)>=0) && !seen[h.url]){
        matches.push({title:h.title, url:h.url}); seen[h.url]=1;
      }
    });
    matches = matches.slice(0,6);
    if (!matches.length){ suggestList.hidden = true; return; }
    suggestList.innerHTML = matches.map(function(m){
      return '<div class="suggest-item" data-suggest-url="'+esc(m.url)+'"><div class="suggest-title">'+esc(m.title)+'</div><div class="suggest-url">'+esc(m.url)+'</div></div>';
    }).join("");
    suggestList.hidden = false;
  });
  suggestList.addEventListener("mousedown", function(e){
    var item = e.target.closest("[data-suggest-url]");
    if (item){ submitAddress(item.dataset.suggestUrl); }
  });
  document.addEventListener("click", function(e){
    if (!e.target.closest(".addressbar-wrap")) suggestList.hidden = true;
  });

  document.getElementById("bookmarksBarBtn").addEventListener("click", function(){
    prefs.showBookmarksBar = !prefs.showBookmarksBar;
    Store.set("prefs", prefs);
    renderBookmarksBar();
  });

  document.getElementById("extPanelBtn").addEventListener("click", function(){
    renderExtPanel();
    document.getElementById("extPanelOverlay").classList.add("open");
  });
  document.getElementById("extPanelClose").addEventListener("click", function(){
    document.getElementById("extPanelOverlay").classList.remove("open");
  });
  document.getElementById("extPanelOverlay").addEventListener("click", function(e){
    if (e.target.id==="extPanelOverlay") document.getElementById("extPanelOverlay").classList.remove("open");
  });
  document.getElementById("extList").addEventListener("change", function(e){
    var cb = e.target.closest("[data-extToggle]");
    if (cb) setExtEnabled(cb.dataset.exttoggle, cb.checked);
  });

  document.getElementById("extToolbar").addEventListener("click", function(e){
    var btn = e.target.closest(".ext-tool-btn");
    if (btn) onExtToolbarClick(btn.dataset.extid);
  });

  document.getElementById("popoverClose").addEventListener("click", closePopover);
  document.addEventListener("mousedown", function(e){
    var root = document.getElementById("popoverRoot");
    if (root.classList.contains("open") && !e.target.closest("#popoverRoot") && !e.target.closest(".ext-tool-btn")){
      closePopover();
    }
  });

  document.getElementById("notesToggleTop").addEventListener("click", toggleNotesPanel);
  document.getElementById("notesClose").addEventListener("click", closeNotesPanel);

  /* --- コンテンツエリアの委任イベント --- */
  contentArea.addEventListener("click", function(e){
    var panel = e.target.closest(".tab-panel");
    if (!panel) return;
    var tabId = panel.dataset.tabId;
    var tab = getTab(tabId);

    if (pickerArmed){
      e.preventDefault(); e.stopPropagation();
      pickerArmed = false;
      var b1 = document.querySelector('.ext-tool-btn[data-extid="colorpicker"]');
      if (b1) b1.classList.remove("active-state");
      var cs = window.getComputedStyle(e.target);
      var bg = cs.backgroundColor, col = cs.color;
      openPopover("colorpicker", "💧 カラーピッカー",
        '<div class="color-swatch" style="background:'+bg+';"></div>'+
        '<div style="font-size:12px;color:var(--text-dim);">背景色</div>'+
        '<div id="pickHex" style="font-family:monospace;margin-bottom:8px;">'+esc(bg)+'</div>'+
        '<div style="font-size:12px;color:var(--text-dim);">文字色</div>'+
        '<div style="font-family:monospace;margin-bottom:8px;">'+esc(col)+'</div>'+
        '<button type="button" class="act" id="pickCopyBtn">コピー</button>');
      document.getElementById("pickCopyBtn").addEventListener("click", function(){ copyText(bg); });
      return;
    }

    var navBtn = e.target.closest("[data-nav]");
    if (navBtn){ e.preventDefault(); if (tab) navigateTab(tab.id, navBtn.dataset.nav); return; }

    var actionBtn = e.target.closest("[data-action]");
    if (!actionBtn) return;
    var action = actionBtn.dataset.action;
    switch(action){
      case "scroll-top":
        panel.scrollTop = 0;
        break;
      case "newtab-search-btn": {
        var form = actionBtn.closest("form");
        var input = form ? form.querySelector('input[name="q"]') : null;
        if (input && input.value.trim() && tab) navigateTab(tab.id, "search://results?q="+encodeURIComponent(input.value.trim()));
        break;
      }
      case "add-cart": {
        var pid = parseInt(actionBtn.dataset.product,10);
        var existing = cart.filter(function(c){ return c.id===pid; })[0];
        if (existing) existing.qty++; else cart.push({id:pid, qty:1});
        Store.set("cart", cart);
        notify("カートに追加しました", {type:"success"});
        break;
      }
      case "remove-cart": {
        var pid2 = parseInt(actionBtn.dataset.product,10);
        cart = cart.filter(function(c){ return c.id!==pid2; });
        Store.set("cart", cart);
        if (tab) renderInto(tab);
        break;
      }
      case "popup-demo": {
        var resultEl = panel.querySelector(".popup-demo-result");
        if (!resultEl) break;
        if (extState.popupblock){
          resultEl.innerHTML = '<div class="popup-blocked-note">🛡️ 1件のポップアップをブロックしました</div>';
        } else {
          resultEl.innerHTML = '<div class="popup-demo-banner">📢 期間限定！今なら10%オフクーポン配布中！（デモ表示）</div>';
        }
        break;
      }
      case "bbs-reply": {
        var threadId = parseInt(actionBtn.dataset.thread,10);
        var box = actionBtn.closest(".reply-box");
        var nameInput = box.querySelector(".reply-name");
        var textInput = box.querySelector(".reply-text");
        var txt = textInput.value.trim();
        if (!txt){ notify("返信内容を入力してください", {type:"info"}); break; }
        var name = nameInput.value.trim() || "ゲスト";
        if (!userForumPosts[threadId]) userForumPosts[threadId] = [];
        userForumPosts[threadId].push({a:name, t:txt});
        Store.set("forumPosts", userForumPosts);
        notify("返信を投稿しました", {type:"success"});
        if (tab) renderInto(tab);
        break;
      }
      case "play-tone": {
        if (extState.mute){ notify("ミュート中です", {type:"info"}); break; }
        playDemoTone();
        break;
      }
      case "open-bookmark": {
        if (actionBtn.dataset.idx!==undefined) openBookmarkByIndex(parseInt(actionBtn.dataset.idx,10));
        else if (actionBtn.dataset.url) openBookmarkByUrl(actionBtn.dataset.url);
        break;
      }
      case "delete-bookmark": {
        var i = parseInt(actionBtn.dataset.idx,10);
        bookmarks.splice(i,1);
        Store.set("bookmarks", bookmarks);
        if (tab) renderInto(tab);
        renderBookmarksBar(); refreshChrome();
        notify("ブックマークを削除しました", {type:"info"});
        break;
      }
      case "delete-history": {
        var hi = parseInt(actionBtn.dataset.hidx,10);
        history.splice(hi,1);
        Store.set("history", history);
        if (tab) renderInto(tab);
        break;
      }
      case "clear-history": {
        if (confirm("履歴をすべて削除しますか？")){
          history = [];
          Store.set("history", history);
          if (tab) renderInto(tab);
          notify("履歴を削除しました", {type:"success"});
        }
        break;
      }
      case "reset-extensions": {
        if (confirm("拡張機能をすべて無効な初期状態に戻しますか？")){
          extState = defaultExtState();
          Store.set("extensions", extState);
          applyGlobalExtClasses();
          renderExtToolbar();
          tabs.forEach(function(t){ if (t.type==="web" && t.el) renderInto(t); });
          notify("拡張機能を初期状態に戻しました", {type:"success"});
        }
        break;
      }
      case "clear-all": {
        if (confirm("履歴とブックマークをすべて削除します。よろしいですか？")){
          history = []; bookmarks = [];
          Store.set("history", history); Store.set("bookmarks", bookmarks);
          if (tab) renderInto(tab);
          renderBookmarksBar(); refreshChrome();
          notify("履歴とブックマークを削除しました", {type:"success"});
        }
        break;
      }
    }
  });

  contentArea.addEventListener("submit", function(e){ e.preventDefault(); }, true);

  contentArea.addEventListener("mouseup", function(e){
    if (!extState.translate) return;
    var tab = getActiveTab();
    if (!tab || tab.type!=="web") return;
    var panel = e.target.closest(".tab-panel");
    if (!panel || panel!==tab.el) return;
    var sel = window.getSelection();
    var text = sel ? sel.toString().trim() : "";
    if (!text) return;
    var result = lookupDict(text);
    showTranslateTip(e.clientX, e.clientY, text, result);
  });

  contentArea.addEventListener("mousemove", function(e){
    if (!extState.magnifier){ hideMagnifier(); return; }
    var tab = getActiveTab();
    if (!tab || tab.type!=="web"){ hideMagnifier(); return; }
    if (!tab.el.contains(e.target)){ hideMagnifier(); return; }
    var lens = ensureMagnifier();
    lens.style.display = "flex";
    lens.style.left = (e.clientX+18) + "px";
    lens.style.top = (e.clientY+18) + "px";
    var target = document.elementFromPoint(e.clientX, e.clientY);
    if (target && target!==lens && !lens.contains(target)){
      var inner = lens.querySelector(".magnifier-inner");
      inner.innerHTML = "";
      try{ inner.appendChild(target.cloneNode(true)); }catch(err){}
    }
  });
  contentArea.addEventListener("mouseleave", hideMagnifier, true);

  contentArea.addEventListener("scroll", function(e){
    var panel = e.target;
    if (!panel.classList || !panel.classList.contains("tab-panel")) return;
    var btn = panel.querySelector(".scrolltop-btn");
    if (!btn) return;
    if (!extState.scrolltop){ btn.classList.remove("show"); return; }
    if (panel.scrollTop>300) btn.classList.add("show"); else btn.classList.remove("show");
  }, true);

  contentArea.addEventListener("input", function(e){
    if (e.target.matches(".history-filter")){
      var panel = e.target.closest(".tab-panel");
      var q = e.target.value.trim().toLowerCase();
      panel.querySelectorAll(".history-row").forEach(function(row){
        var text = row.dataset.search || "";
        row.style.display = (!q || text.indexOf(q)>=0) ? "" : "none";
      });
    }
  });

  contentArea.addEventListener("click", function(e){
    var runBtn = e.target.closest('[data-action="code-run"]');
    if (!runBtn) return;
    var panel = e.target.closest(".tab-panel");
    var tab = getTab(panel.dataset.tabId);
    if (tab) updateCodePreview(tab);
  });

  document.getElementById("notesTextarea").addEventListener("input", function(e){
    notesText = e.target.value;
    clearTimeout(notesSaveTimer);
    notesSaveTimer = setTimeout(function(){ Store.set("notes", notesText); }, 500);
  });

  window.addEventListener("resize", function(){});
}

/* =========================================================
   14. 初期化
   ========================================================= */
async function init(){
  extState = await Store.get("extensions", defaultExtState());
  EXT_DEFS.forEach(function(e){ if (extState[e.id]===undefined) extState[e.id]=false; });
  bookmarks = await Store.get("bookmarks", []);
  history = await Store.get("history", []);
  notesText = await Store.get("notes", "");
  cart = await Store.get("cart", []);
  userForumPosts = await Store.get("forumPosts", {});
  prefs = await Store.get("prefs", {showBookmarksBar:true});

  buildSearchIndex();
  applyGlobalExtClasses();
  renderExtToolbar();
  bindGlobalEvents();
  createTab("web", "newtab://home");
  renderBookmarksBar();
}

if (document.readyState==="loading") document.addEventListener("DOMContentLoaded", init);
else init();

})();
