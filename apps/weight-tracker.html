<!--GUIOS-APP {"id":"weight-tracker","name":"体重記録","icon":"⚖️","color":"#ad1457","version":"1.0.0","author":"Claude","description":"毎日の体重を記録してグラフで推移を確認できる健康管理アプリ。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>体重記録</title>
<style>
  :root{
    --accent:#e0568f;
    --accent-dark:#ad1457;
    --bg:#1c0d15;
    --card:#28131e;
    --card2:#301826;
    --text:#f9e9f0;
    --sub:#cf9db3;
    --line:#452336;
    --input:#160a10;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; padding:16px; padding-bottom:48px;
  }
  h1{ font-size:19px; margin:4px 0 4px; display:flex; align-items:center; gap:8px; }
  .wrap{ max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  .sub-tag{ font-size:12px; color:var(--sub); margin:0 0 2px; }
  .disclaimer{
    background:var(--card2); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; font-size:12px; color:var(--sub); line-height:1.6;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px;
  }
  .section-title{ font-size:13px; color:var(--sub); margin:0 0 10px; font-weight:600; }
  label{ display:block; font-size:12px; color:var(--sub); margin-bottom:6px; }
  .field{ margin-bottom:12px; }
  .row2{ display:flex; gap:10px; }
  .row2 > *{ flex:1; min-width:0; }
  input[type=number], input[type=date]{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
    background:var(--input); color:var(--text); font-size:16px; outline:none; color-scheme:dark;
  }
  input:focus{ border-color:var(--accent); }
  button{
    padding:12px 22px; border-radius:10px; border:none; background:var(--accent);
    color:#340019; font-weight:700; font-size:15px; cursor:pointer; min-height:46px; width:100%;
  }
  button.secondary{
    background:transparent; color:var(--sub); border:1px solid var(--line); font-weight:600;
  }
  .stat-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .stat-box{
    background:var(--input); border:1px solid var(--line); border-radius:12px;
    padding:12px; text-align:center;
  }
  .stat-box .v{ font-size:19px; font-weight:800; color:var(--accent); }
  .stat-box .v.up{ color:#ef9a9a; }
  .stat-box .v.down{ color:#8fd6a8; }
  .stat-box .l{ font-size:11px; color:var(--sub); margin-top:2px; }
  .chart-wrap{ width:100%; }
  #chartSvg{ width:100%; height:180px; display:block; }
  .empty{ color:var(--sub); text-align:center; padding:30px 10px; font-size:13px; }
  .entry-list{ display:flex; flex-direction:column; gap:8px; }
  .entry{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--input); border:1px solid var(--line); border-radius:12px; padding:10px 14px;
  }
  .entry .e-date{ font-size:12px; color:var(--sub); }
  .entry .e-val{ font-size:17px; font-weight:700; margin-top:2px; }
  .entry .e-actions{ display:flex; gap:6px; }
  .entry button.del-btn{
    width:36px; height:36px; min-height:36px; padding:0; border-radius:8px;
    background:transparent; border:1px solid var(--line); color:var(--sub); font-size:15px;
  }
  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px);
    background:var(--card2); color:var(--text); padding:10px 18px; border-radius:10px;
    font-size:13px; opacity:0; transition:opacity .25s, transform .25s; pointer-events:none;
    max-width:90%; text-align:center; box-shadow:0 6px 18px rgba(0,0,0,.35); z-index:50;
    border:1px solid var(--line);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>⚖️ 体重記録</h1>
    <p class="sub-tag">毎日の体重を記録して、推移をグラフで確認できます</p>
    <div class="disclaimer">
      ⚠️ この記録は個人の健康管理を目的とした参考情報であり、医学的な助言ではありません。体調に不安がある場合は医師にご相談ください。
    </div>

    <div class="card">
      <div class="section-title">記録する</div>
      <div class="row2">
        <div class="field">
          <label for="weightInput">体重（kg）</label>
          <input type="number" id="weightInput" inputmode="decimal" step="0.1" min="0" max="500" placeholder="例: 62.5">
        </div>
        <div class="field">
          <label for="dateInput">日付</label>
          <input type="date" id="dateInput">
        </div>
      </div>
      <button id="addBtn">記録する</button>
    </div>

    <div class="card" id="statsCard" style="display:none;">
      <div class="section-title">統計</div>
      <div class="stat-grid">
        <div class="stat-box"><div class="v" id="statCurrent">-</div><div class="l">現在</div></div>
        <div class="stat-box"><div class="v" id="stat7">-</div><div class="l">7日間の変化</div></div>
        <div class="stat-box"><div class="v" id="stat30">-</div><div class="l">30日間の変化</div></div>
        <div class="stat-box"><div class="v" id="statMinMax">-</div><div class="l">最小 / 最大</div></div>
      </div>
    </div>

    <div class="card" id="chartCard" style="display:none;">
      <div class="section-title">推移グラフ</div>
      <div class="chart-wrap">
        <svg id="chartSvg" viewBox="0 0 320 180" preserveAspectRatio="none"></svg>
      </div>
    </div>

    <div class="card">
      <div class="section-title" style="display:flex; justify-content:space-between; align-items:center;">
        <span>記録一覧</span>
      </div>
      <div id="listWrap">
        <div class="empty">まだ記録がありません</div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  var APP_ID = 'weight-tracker';
  var FALLBACK_KEY = 'guios-fallback-' + APP_ID + '-entries';
  var hasSDK = !!(window.GUIOS && window.GUIOS.storage);

  var toastEl = document.getElementById('toast');
  var toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1800);
  }
  function notify(msg, type){
    if (window.GUIOS && window.GUIOS.notify) {
      try { window.GUIOS.notify(msg, { type: type || 'info' }); return; } catch(e){}
    }
    showToast(msg);
  }
  function haptic(){
    if (window.GUIOS && window.GUIOS.haptic) {
      try { window.GUIOS.haptic(); } catch(e){}
    }
  }

  async function loadEntries(){
    if (hasSDK) {
      try {
        var v = await window.GUIOS.storage.get('entries');
        return Array.isArray(v) ? v : [];
      } catch(e){ return []; }
    } else {
      try {
        var raw = localStorage.getItem(FALLBACK_KEY);
        var arr = raw ? JSON.parse(raw) : [];
        return Array.isArray(arr) ? arr : [];
      } catch(e){ return []; }
    }
  }
  async function saveEntries(arr){
    if (hasSDK) {
      try { await window.GUIOS.storage.set('entries', arr); } catch(e){}
    } else {
      try { localStorage.setItem(FALLBACK_KEY, JSON.stringify(arr)); } catch(e){}
    }
  }

  var entries = []; // { date: 'YYYY-MM-DD', weight: number }

  function pad2(n){ return n < 10 ? '0'+n : ''+n; }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
  }
  function parseDateLocal(s){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
    if (!m) return null;
    return new Date(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10));
  }
  function daysBetween(a, b){
    var A = parseDateLocal(a), B = parseDateLocal(b);
    if (!A || !B) return null;
    return Math.round((B - A) / 86400000);
  }
  function fmtDate(s){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
    if (!m) return s;
    return m[1] + '/' + m[2] + '/' + m[3];
  }
  function fmtWeight(w){
    return (Math.round(w*10)/10).toFixed(1);
  }

  function sortedByDate(){
    return entries.slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
  }

  function renderStats(){
    var card = document.getElementById('statsCard');
    var chrono = sortedByDate();
    if (chrono.length === 0) {
      card.style.display = 'none';
      return;
    }
    card.style.display = 'block';

    var latest = chrono[chrono.length - 1];
    document.getElementById('statCurrent').textContent = fmtWeight(latest.weight) + ' kg';

    function changeVsDaysAgo(days){
      // find nearest entry at or before (today - days), within a small tolerance window
      var target = null;
      for (var i = chrono.length - 1; i >= 0; i--) {
        var diff = daysBetween(chrono[i].date, latest.date);
        if (diff !== null && diff >= days) {
          target = chrono[i];
        }
      }
      if (!target || target === latest) return null;
      return latest.weight - target.weight;
    }

    function setChangeBox(elId, days){
      var el = document.getElementById(elId);
      var diff = changeVsDaysAgo(days);
      if (diff === null) {
        el.textContent = '-';
        el.className = 'v';
        return;
      }
      var sign = diff > 0 ? '+' : '';
      el.textContent = sign + fmtWeight(diff) + ' kg';
      el.className = 'v' + (diff > 0.05 ? ' up' : (diff < -0.05 ? ' down' : ''));
    }
    setChangeBox('stat7', 7);
    setChangeBox('stat30', 30);

    var weights = chrono.map(function(e){ return e.weight; });
    var minV = Math.min.apply(null, weights);
    var maxV = Math.max.apply(null, weights);
    document.getElementById('statMinMax').textContent = fmtWeight(minV) + ' / ' + fmtWeight(maxV);
  }

  function renderChart(){
    var card = document.getElementById('chartCard');
    var svg = document.getElementById('chartSvg');
    var chrono = sortedByDate();
    if (chrono.length < 2) {
      card.style.display = 'none';
      return;
    }
    card.style.display = 'block';

    var W = 320, H = 180, padX = 12, padY = 16;
    var weights = chrono.map(function(e){ return e.weight; });
    var minV = Math.min.apply(null, weights);
    var maxV = Math.max.apply(null, weights);
    if (maxV - minV < 1) {
      var mid = (maxV + minV) / 2;
      minV = mid - 0.5;
      maxV = mid + 0.5;
    }
    var pad = (maxV - minV) * 0.1;
    minV -= pad; maxV += pad;

    function xFor(i){
      if (chrono.length === 1) return W/2;
      return padX + (i * (W - padX*2) / (chrono.length - 1));
    }
    function yFor(v){
      return H - padY - ((v - minV) / (maxV - minV)) * (H - padY*2);
    }

    var svgns = 'http://www.w3.org/2000/svg';
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    // gridlines
    for (var g = 0; g <= 2; g++) {
      var gy = padY + (g * (H - padY*2) / 2);
      var line = document.createElementNS(svgns, 'line');
      line.setAttribute('x1', padX); line.setAttribute('x2', W - padX);
      line.setAttribute('y1', gy); line.setAttribute('y2', gy);
      line.setAttribute('stroke', 'rgba(255,255,255,0.08)');
      line.setAttribute('stroke-width', '1');
      svg.appendChild(line);
    }

    var pts = chrono.map(function(e,i){ return xFor(i)+','+yFor(e.weight); }).join(' ');
    var poly = document.createElementNS(svgns, 'polyline');
    poly.setAttribute('points', pts);
    poly.setAttribute('fill', 'none');
    poly.setAttribute('stroke', '#e0568f');
    poly.setAttribute('stroke-width', '2.5');
    poly.setAttribute('stroke-linejoin', 'round');
    poly.setAttribute('stroke-linecap', 'round');
    svg.appendChild(poly);

    chrono.forEach(function(e, i){
      var c = document.createElementNS(svgns, 'circle');
      c.setAttribute('cx', xFor(i));
      c.setAttribute('cy', yFor(e.weight));
      c.setAttribute('r', '3');
      c.setAttribute('fill', '#f9a8c9');
      svg.appendChild(c);
    });
  }

  function render(){
    var wrap = document.getElementById('listWrap');
    var list = entries.slice().sort(function(a,b){ return b.date.localeCompare(a.date); });
    if (list.length === 0) {
      wrap.innerHTML = '<div class="empty">まだ記録がありません</div>';
    } else {
      wrap.innerHTML = '';
      var container = document.createElement('div');
      container.className = 'entry-list';
      list.forEach(function(e){
        var row = document.createElement('div');
        row.className = 'entry';
        row.innerHTML =
          '<div><div class="e-date">' + fmtDate(e.date) + '</div>' +
          '<div class="e-val">' + fmtWeight(e.weight) + ' kg</div></div>' +
          '<div class="e-actions"><button class="del-btn" data-date="' + e.date + '">✕</button></div>';
        container.appendChild(row);
      });
      wrap.appendChild(container);
    }
    renderStats();
    renderChart();
  }

  document.getElementById('listWrap').addEventListener('click', async function(e){
    var btn = e.target.closest('.del-btn');
    if (!btn) return;
    var date = btn.dataset.date;
    entries = entries.filter(function(x){ return x.date !== date; });
    await saveEntries(entries);
    render();
    notify('削除しました', 'success');
  });

  async function addEntry(){
    var wInput = document.getElementById('weightInput');
    var dInput = document.getElementById('dateInput');
    var weight = parseFloat(wInput.value);
    var date = dInput.value || todayStr();
    if (!Number.isFinite(weight) || weight <= 0 || weight > 500) {
      notify('体重を正しく入力してください', 'error');
      return;
    }
    var existingIdx = entries.findIndex(function(e){ return e.date === date; });
    if (existingIdx >= 0) {
      entries[existingIdx].weight = weight;
    } else {
      entries.push({ date: date, weight: weight });
    }
    await saveEntries(entries);
    wInput.value = '';
    dInput.value = todayStr();
    render();
    notify(existingIdx >= 0 ? 'この日の記録を更新しました' : '記録しました', 'success');
    haptic();
  }

  document.getElementById('addBtn').addEventListener('click', addEntry);
  document.getElementById('dateInput').value = todayStr();
  document.getElementById('dateInput').max = todayStr();

  (async function init(){
    entries = await loadEntries();
    render();
  })();
</script>
</body>
</html>
