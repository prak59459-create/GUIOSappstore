<!--GUIOS-APP {"id":"wiki-notes","name":"パーソナルWiki","icon":"🔗","color":"#5c8a3a","version":"1.0.0","author":"Claude","description":"ページ同士を [[リンク]] でつなげて自由に行き来できるメモ帳型Wikiアプリ。"}-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>パーソナルWiki</title>
<style>
  *{ box-sizing:border-box; }
  html,body{ overflow-x:hidden; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    background:#121a10; color:#e7f2df; min-height:100vh; padding-bottom:24px;
  }
  header{ padding:14px 14px 8px; position:sticky; top:0; background:#121a10; z-index:5; }
  h1{ font-size:17px; margin:0 0 10px; color:#9ed46a; display:flex; align-items:center; gap:8px; }
  .toolbar{ display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
  .navbtn{
    background:#1c2a17; color:#c3e0a8; border:1px solid #2d4321; border-radius:10px;
    padding:0 14px; min-height:40px; font-size:14px; font-weight:700; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .navbtn:disabled{ opacity:.4; cursor:default; }
  .navbtn.primary{ background:#3f6b26; color:#eafce0; border-color:#3f6b26; }
  select#pageSelect{
    flex:1; min-width:120px; background:#1c2a17; color:#e7f2df; border:1px solid #2d4321;
    border-radius:10px; padding:0 10px; min-height:40px; font-size:14px;
  }
  input#searchBox{
    flex:1; min-width:120px; background:#1c2a17; color:#e7f2df; border:1px solid #2d4321;
    border-radius:10px; padding:0 12px; min-height:40px; font-size:14px;
  }
  main{ padding:0 14px; }
  .page-card{ background:#182212; border-radius:16px; padding:16px; }
  .page-title-row{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .page-title{ font-size:19px; font-weight:800; color:#c3e0a8; flex:1; word-break:break-word; }
  input#titleInput{
    flex:1; font-size:17px; font-weight:800; color:#e7f2df; background:#0e1409; border:1px solid #2d4321;
    border-radius:10px; padding:8px 10px; min-height:40px;
  }
  .mode-badge{ font-size:11px; padding:3px 8px; border-radius:8px; background:#2d4321; color:#9ed46a; flex-shrink:0; }
  .view-body{ line-height:1.9; font-size:15px; white-space:pre-wrap; word-break:break-word; min-height:120px; }
  .view-body a.wikilink{ color:#9ed46a; text-decoration:underline; cursor:pointer; font-weight:700; }
  .view-body a.wikilink.missing{ color:#e0b96a; }
  textarea#bodyInput{
    width:100%; min-height:200px; background:#0e1409; color:#e7f2df; border:1px solid #2d4321;
    border-radius:10px; padding:12px; font-size:15px; line-height:1.7; resize:vertical;
    font-family:inherit;
  }
  .hint{ font-size:12px; color:#7a9863; margin-top:8px; line-height:1.5; }
  .actionrow{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .actionrow button{
    flex:1; min-width:90px; min-height:46px; border:none; border-radius:12px; font-weight:700;
    font-size:14px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .btn-edit{ background:#3f6b26; color:#eafce0; }
  .btn-new{ background:#1c2a17; color:#c3e0a8; border:1px solid #2d4321; }
  .btn-delete{ background:#5c2a2a; color:#ffc4c4; }
  .empty{ text-align:center; color:#7a9863; padding:40px 10px; font-size:14px; }
  .toast{
    position:fixed; left:50%; bottom:20px; transform:translateX(-50%) translateY(20px);
    background:#1c2a17; color:#e7f2df; padding:10px 18px; border-radius:10px;
    font-size:13px; opacity:0; transition:all .25s; pointer-events:none; max-width:90%; text-align:center;
    z-index:999; border:1px solid #2d4321;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <header>
    <h1>🔗 パーソナルWiki</h1>
    <div class="toolbar">
      <button class="navbtn" id="backBtn" disabled>← 戻る</button>
      <button class="navbtn" id="forwardBtn" disabled>進む →</button>
      <button class="navbtn primary" id="newBtn">＋ 新規ページ</button>
    </div>
    <div class="toolbar">
      <select id="pageSelect"></select>
      <input id="searchBox" placeholder="ページを検索...">
    </div>
  </header>

  <main>
    <div class="page-card" id="pageCard"></div>
  </main>

  <div class="toast" id="toast"></div>

<script>
  var hasSDK = !!(window.GUIOS && window.GUIOS.storage);
  var STORAGE_KEY = 'pages';
  var FALLBACK_KEY = 'guios-fallback-wiki-notes-pages';

  var pages = {};        // { title: body }
  var history = [];      // navigation stack of titles
  var histIndex = -1;    // current position in history
  var currentTitle = null;
  var editMode = false;

  var pageCard = document.getElementById('pageCard');
  var pageSelect = document.getElementById('pageSelect');
  var searchBox = document.getElementById('searchBox');
  var backBtn = document.getElementById('backBtn');
  var forwardBtn = document.getElementById('forwardBtn');
  var toastEl = document.getElementById('toast');

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toastEl.classList.remove('show'); }, 1600);
  }
  function notify(msg, type){
    if (window.GUIOS && window.GUIOS.notify) {
      try { window.GUIOS.notify(msg, { type: type || 'info' }); return; } catch(e){}
    }
    showToast(msg);
  }

  async function loadPages(){
    if (hasSDK) {
      try {
        var v = await GUIOS.storage.get(STORAGE_KEY);
        if (v && typeof v === 'object') return v;
      } catch(e){}
      return null;
    } else {
      try {
        var raw = localStorage.getItem(FALLBACK_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch(e){ return null; }
    }
  }
  async function savePages(){
    if (hasSDK) {
      try { await GUIOS.storage.set(STORAGE_KEY, pages); } catch(e){}
    } else {
      try { localStorage.setItem(FALLBACK_KEY, JSON.stringify(pages)); } catch(e){}
    }
  }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function renderBodyHtml(body){
    var escaped = escapeHtml(body || '');
    // [[Page Name]] -> clickable link, auto-creating target if missing
    return escaped.replace(/\[\[([^\[\]]+?)\]\]/g, function(m, title){
      var t = title.trim();
      var exists = Object.prototype.hasOwnProperty.call(pages, t);
      var cls = exists ? 'wikilink' : 'wikilink missing';
      return '<a class="' + cls + '" data-title="' + escapeHtml(t) + '">' + escapeHtml(t) + '</a>';
    });
  }

  function refreshPageSelect(){
    var titles = Object.keys(pages).sort(function(a,b){ return a.localeCompare(b, 'ja'); });
    var q = searchBox.value.trim().toLowerCase();
    pageSelect.innerHTML = '';
    titles.forEach(function(t){
      if (q && t.toLowerCase().indexOf(q) === -1) return;
      var opt = document.createElement('option');
      opt.value = t;
      opt.textContent = t;
      if (t === currentTitle) opt.selected = true;
      pageSelect.appendChild(opt);
    });
    if (titles.length === 0) {
      var opt2 = document.createElement('option');
      opt2.textContent = '(ページなし)';
      opt2.value = '';
      pageSelect.appendChild(opt2);
    }
  }

  function updateNavButtons(){
    backBtn.disabled = histIndex <= 0;
    forwardBtn.disabled = histIndex >= history.length - 1;
  }

  function pushHistory(title){
    // truncate forward history when navigating to a new page
    history = history.slice(0, histIndex + 1);
    history.push(title);
    histIndex = history.length - 1;
    updateNavButtons();
  }

  function goToPage(title, opts){
    opts = opts || {};
    if (!Object.prototype.hasOwnProperty.call(pages, title)) {
      pages[title] = '';
      savePages();
    }
    currentTitle = title;
    editMode = !!opts.edit;
    if (!opts.fromHistory) pushHistory(title);
    refreshPageSelect();
    renderCurrentPage();
  }

  function renderCurrentPage(){
    if (currentTitle === null || !Object.prototype.hasOwnProperty.call(pages, currentTitle)) {
      pageCard.innerHTML = '<div class="empty">ページがありません。「＋ 新規ページ」から作成してください。</div>';
      return;
    }
    var body = pages[currentTitle] || '';
    if (editMode) {
      pageCard.innerHTML =
        '<div class="page-title-row">' +
          '<input id="titleInput" value="' + escapeHtml(currentTitle) + '">' +
          '<span class="mode-badge">編集中</span>' +
        '</div>' +
        '<textarea id="bodyInput" placeholder="本文を入力... [[ページ名]] で他のページにリンクできます">' + escapeHtml(body) + '</textarea>' +
        '<p class="hint">ヒント: [[ページ名]] と書くと、そのページへのリンクになります(存在しなければ空ページが自動作成されます)。</p>' +
        '<div class="actionrow">' +
          '<button class="btn-edit" id="saveBtn">保存して表示</button>' +
          '<button class="btn-new" id="cancelBtn">キャンセル</button>' +
        '</div>';
      document.getElementById('saveBtn').addEventListener('click', onSaveEdit);
      document.getElementById('cancelBtn').addEventListener('click', function(){
        editMode = false;
        renderCurrentPage();
      });
    } else {
      pageCard.innerHTML =
        '<div class="page-title-row">' +
          '<span class="page-title">' + escapeHtml(currentTitle) + '</span>' +
          '<span class="mode-badge">閲覧</span>' +
        '</div>' +
        '<div class="view-body">' + (body ? renderBodyHtml(body) : '<span style="color:#7a9863;">(本文はまだありません)</span>') + '</div>' +
        '<div class="actionrow">' +
          '<button class="btn-edit" id="editBtn">✎ 編集</button>' +
          '<button class="btn-new" id="newFromHereBtn">＋ 新規ページ</button>' +
          '<button class="btn-delete" id="deleteBtn">削除</button>' +
        '</div>';
      document.getElementById('editBtn').addEventListener('click', function(){
        editMode = true;
        renderCurrentPage();
      });
      document.getElementById('newFromHereBtn').addEventListener('click', createNewPage);
      document.getElementById('deleteBtn').addEventListener('click', onDeletePage);
      pageCard.querySelectorAll('a.wikilink').forEach(function(a){
        a.addEventListener('click', function(){
          goToPage(a.getAttribute('data-title'));
        });
      });
    }
  }

  function onSaveEdit(){
    var newTitleRaw = document.getElementById('titleInput').value.trim();
    var newBody = document.getElementById('bodyInput').value;
    if (!newTitleRaw) {
      notify('タイトルを入力してください', 'error');
      return;
    }
    if (newTitleRaw !== currentTitle) {
      if (Object.prototype.hasOwnProperty.call(pages, newTitleRaw)) {
        notify('同じ名前のページが既にあります', 'error');
        return;
      }
      delete pages[currentTitle];
      currentTitle = newTitleRaw;
    }
    pages[currentTitle] = newBody;
    savePages();
    editMode = false;
    refreshPageSelect();
    renderCurrentPage();
    notify('保存しました', 'success');
  }

  function onDeletePage(){
    if (currentTitle === null) return;
    var ok = window.confirm ? window.confirm('「' + currentTitle + '」を削除しますか?') : true;
    if (!ok) return;
    delete pages[currentTitle];
    savePages();
    var remaining = Object.keys(pages);
    currentTitle = remaining.length ? remaining[0] : null;
    editMode = false;
    if (currentTitle) pushHistory(currentTitle);
    else { history = []; histIndex = -1; updateNavButtons(); }
    refreshPageSelect();
    renderCurrentPage();
    notify('削除しました', 'info');
  }

  function createNewPage(){
    var name = window.prompt ? window.prompt('新しいページ名を入力してください') : null;
    if (name === null) return;
    name = name.trim();
    if (!name) { notify('ページ名を入力してください', 'error'); return; }
    if (Object.prototype.hasOwnProperty.call(pages, name)) {
      notify('そのページは既にあります', 'error');
      goToPage(name);
      return;
    }
    pages[name] = '';
    savePages();
    goToPage(name, { edit: true });
  }

  document.getElementById('newBtn').addEventListener('click', createNewPage);

  backBtn.addEventListener('click', function(){
    if (histIndex > 0) {
      histIndex--;
      currentTitle = history[histIndex];
      editMode = false;
      updateNavButtons();
      refreshPageSelect();
      renderCurrentPage();
    }
  });
  forwardBtn.addEventListener('click', function(){
    if (histIndex < history.length - 1) {
      histIndex++;
      currentTitle = history[histIndex];
      editMode = false;
      updateNavButtons();
      refreshPageSelect();
      renderCurrentPage();
    }
  });

  pageSelect.addEventListener('change', function(){
    if (pageSelect.value) goToPage(pageSelect.value);
  });
  searchBox.addEventListener('input', refreshPageSelect);

  (async function init(){
    var loaded = await loadPages();
    if (loaded && typeof loaded === 'object' && Object.keys(loaded).length) {
      pages = loaded;
    } else {
      pages = {
        'ようこそ': 'これはパーソナルWikiアプリです。[[使い方]] を見てみましょう。自分だけのメモをリンクでつなげて整理できます。',
        '使い方': '本文中に [[ページ名]] と書くとリンクになります。存在しないページ名を書いてリンクをクリックすると、自動的に空のページが作られます。右上の「戻る/進む」でページ間を移動した履歴をたどれます。'
      };
      await savePages();
    }
    var titles = Object.keys(pages);
    currentTitle = titles.length ? titles[0] : null;
    if (currentTitle) { history = [currentTitle]; histIndex = 0; }
    updateNavButtons();
    refreshPageSelect();
    renderCurrentPage();
  })();
</script>
</body>
</html>
